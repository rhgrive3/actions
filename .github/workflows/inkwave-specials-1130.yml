name: INKWAVE 19-special source and runtime boundaries
on:
  pull_request:
    paths:
      - 'patches/splatoon3/tests/all-specials.test.mjs'
      - 'patches/splatoon3/tests/kit-ink-vac.test.mjs'
      - 'patches/splatoon3/tests/kit-big-bubbler.test.mjs'
      - 'patches/splatoon3/tests/storm-effects.test.mjs'
      - 'patches/splatoon3/tests/support-kit-recon-cooler.test.mjs'
      - 'patches/splatoon3/tests/issue-912-triple-slam-fists.test.mjs'
      - 'patches/splatoon3/tests/inkjet-paint-wire.test.mjs'
      - 'patches/splatoon3/runtime/all-specials.mjs'
      - 'patches/splatoon3/runtime/all-subs.mjs'
      - 'patches/splatoon3/runtime/kit-*.mjs'
      - 'patches/splatoon3/runtime/catalogue.mjs'
      - 'patches/splatoon3/runtime/special-*.mjs'
      - 'patches/splatoon3/runtime/area-special-vfx-clock.mjs'
      - 'patches/splatoon3/tests/area-special-vfx-clock.test.mjs'
      - 'patches/splatoon3/tests/booyah-orb-clock.test.mjs'
      - 'patches/splatoon3/tests/projectile-special-vfx-clock.test.mjs'
      - 'patches/splatoon3/tests/support-special-vfx-cadence.test.mjs'
      - 'patches/splatoon3/tests/zipcaster-trail-lifecycle.test.mjs'
      - 'patches/splatoon3/tests/ink-vac-shot-vfx.test.mjs'
      - 'patches/splatoon3/tests/screen-close-presentation.test.mjs'
      - 'patches/splatoon3/tests/super-chump-launch-direction.test.mjs'
      - 'patches/splatoon3/tests/ultra-stamp-jump-presentation.test.mjs'
      - 'patches/splatoon3/tests/trizooka-lobe-vfx.test.mjs'
      - 'patches/splatoon3/tests/ink-vac-model-muzzle.test.mjs'
      - 'patches/splatoon3/tests/reefslider-visual-lifecycle.test.mjs'
      - 'patches/splatoon3/tests/triple-splashdown-impact-vfx.test.mjs'
      - 'scripts/tests/inkwave-reef-splash-workflow-registration.test.mjs'
      - 'patches/network-replication/tests/robustness-fixture.mjs'
      - 'scripts/tests/inkwave-special-workflow-registration.test.mjs'
      - 'scripts/tests/inkwave-special-frame-emitted.test.mjs'
      - 'patches/loading-cache/vendor/acorn.mjs'
      - 'patches/splatoon3/runtime/inkjet-vfx-*.mjs'
      - 'patches/splatoon3/tests/inkjet-vfx-*.test.mjs'
      - 'patches/splatoon3/tests/inkjet-nozzle-owner.test.mjs'
      - 'scripts/check-inkwave-inkjet-presentation-browser.mjs'
      - 'scripts/tests/inkwave-inkjet-workflow-registration.test.mjs'
      - 'patches/splatoon3/tests/source-fixture.mjs'
      - 'patches/splatoon3/runtime/support-cooler.mjs'
      - 'patches/splatoon3/runtime/sub-special-fidelity.mjs'
      - 'patches/splatoon3/runtime/triple-slam-fists.mjs'
      - 'patches/splatoon3/runtime/trizooka-collision.mjs'
      - 'patches/splatoon3/runtime/respawn-lifecycle.mjs'
      - 'patches/splatoon3/runtime/tacticooler-gauge.mjs'
      - 'patches/splatoon3/runtime/zipcaster-armor.mjs'
      - 'patches/splatoon3/runtime/movement.mjs'
      - 'patches/splatoon3/runtime/storm-*.mjs'
      - 'patches/local-quality/tenacity.mjs'
      - 'patches/local-quality/tests/tenacity.test.mjs'
      - 'patches/splatoon3/tests/special-*.test.mjs'
      - 'patches/splatoon3/tests/kraken-*.test.mjs'
      - 'patches/splatoon3/tests/triple-splashdown-presentation.test.mjs'
      - 'patches/splatoon3/tests/sub-community-behavior.test.mjs'
      - 'patches/splatoon3/tests/curling-community-fidelity.test.mjs'
      - 'patches/splatoon3/tests/catalogue-integration.test.mjs'
      - 'patches/splatoon3/tests/catalogue-session-tick-admission.test.mjs'
      - 'patches/splatoon3/tests/catalogue-tick-admission.test.mjs'
      - 'patches/splatoon3/tests/tacticooler-gauge-lock.test.mjs'
      - 'patches/splatoon3/tests/kit-trizooka*.test.mjs'
      - 'patches/splatoon3/tests/trizooka-birth-swim.test.mjs'
      - 'patches/splatoon3/tests/deployed-special-gauge-lock.test.mjs'
      - 'patches/splatoon3/tests/burst-contact-phases.test.mjs'
      - 'scripts/check-inkwave-splashdown-browser.mjs'
      - 'scripts/tests/inkwave-splashdown-batch.test.mjs'
      - 'scripts/lib/inkjet-terminal-probe.mjs'
      - 'scripts/tests/inkjet-terminal-probe-lifecycle.test.mjs'
      - 'scripts/generate-inkwave-source-proof.py'
      - '.github/workflows/inkwave-specials-1130.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  special-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            inkwave-public
            patches
            scripts
            reports/ink-volume/source
      - name: Verify immutable checkout identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_source_sha="$(git rev-parse HEAD)"
          printf 'Expected source: %s\nActual checkout: %s\n' "$EXPECTED_SOURCE_SHA" "$actual_source_sha"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned special fixture transformer
        run: npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.28.2
      - name: Verify isolated browser batch contract
        run: node --test scripts/tests/inkwave-splashdown-batch.test.mjs
      - name: Verify special CI registration contracts
        run: node --test scripts/tests/inkwave-special-workflow-registration.test.mjs
      - name: Verify Reefslider and Splashdown CI registration
        run: node --test scripts/tests/inkwave-reef-splash-workflow-registration.test.mjs
      - name: Special source and transformed fixture regressions (not emitted-site coverage)
        run: |
          ESBUILD_MODULE="$(node -p "require.resolve('esbuild')")"
          export ESBUILD_MODULE
          export AREA_VFX_ESBUILD="$ESBUILD_MODULE" SPECIAL_VFX_ESBUILD="$ESBUILD_MODULE" SUPPORT_VFX_ESBUILD="$ESBUILD_MODULE"
          node --experimental-vm-modules --test --test-concurrency=2 \
            patches/splatoon3/tests/area-special-vfx-clock.test.mjs \
            patches/splatoon3/tests/booyah-orb-clock.test.mjs \
            patches/splatoon3/tests/projectile-special-vfx-clock.test.mjs \
            patches/splatoon3/tests/special-crab-ribbon-lifetime.test.mjs \
            patches/splatoon3/tests/support-special-vfx-cadence.test.mjs \
            patches/splatoon3/tests/zipcaster-trail-lifecycle.test.mjs \
            patches/splatoon3/tests/ink-vac-shot-vfx.test.mjs \
            patches/splatoon3/tests/kraken-jump-spin.test.mjs \
            patches/splatoon3/tests/screen-close-presentation.test.mjs
      - name: Reviewed Chump and Stamp source/transform regressions
        run: |
          ESBUILD_MODULE="$(node -p "require.resolve('esbuild')")"
          export ESBUILD_MODULE
          node --experimental-vm-modules --test --test-concurrency=1 \
            patches/splatoon3/tests/super-chump-launch-direction.test.mjs \
            patches/splatoon3/tests/ultra-stamp-jump-presentation.test.mjs
          STAMP_PRESENTATION_EMITTED=1 node --experimental-vm-modules --test --test-concurrency=1 \
            patches/splatoon3/tests/ultra-stamp-jump-presentation.test.mjs
      - name: Reviewed Trizooka glob source/transform regressions
        run: |
          ESBUILD_MODULE="$(node -p "require.resolve('esbuild')")"
          export ESBUILD_MODULE
          node --experimental-vm-modules --test --test-concurrency=1 \
            patches/splatoon3/tests/trizooka-lobe-vfx.test.mjs
          TRIZOOKA_VFX_ESBUILD="$ESBUILD_MODULE" node --experimental-vm-modules --test --test-concurrency=1 \
            patches/splatoon3/tests/trizooka-lobe-vfx.test.mjs
      - name: Reviewed Ink Vac nozzle source/transform regressions
        run: |
          ESBUILD_MODULE="$(node -p "require.resolve('esbuild')")"
          export ESBUILD_MODULE
          node --experimental-vm-modules --test --test-concurrency=1 \
            patches/splatoon3/tests/ink-vac-model-muzzle.test.mjs \
            patches/splatoon3/tests/ink-vac-shot-vfx.test.mjs
          SPECIAL_VFX_ESBUILD="$ESBUILD_MODULE" node --experimental-vm-modules --test --test-concurrency=1 \
            patches/splatoon3/tests/ink-vac-model-muzzle.test.mjs \
            patches/splatoon3/tests/ink-vac-shot-vfx.test.mjs
      - name: Verify Inkjet nozzle CI registration
        run: node --test scripts/tests/inkwave-inkjet-workflow-registration.test.mjs
      - name: Reviewed Inkjet nozzle owner source regressions
        run: node --experimental-vm-modules --test --test-concurrency=1 patches/splatoon3/tests/inkjet-nozzle-owner.test.mjs
      - name: Source-backed 19-special runtime and gameplay boundaries
        run: |
          node --experimental-vm-modules --test \
            patches/splatoon3/tests/kraken-movement-paint-1130.test.mjs \
            patches/splatoon3/tests/kraken-arm-motion.test.mjs \
            patches/splatoon3/tests/special-activation-scan-1130.test.mjs \
            patches/splatoon3/tests/special-wavebreaker-expiry-1130.test.mjs \
            patches/splatoon3/tests/special-crab-body-radius-1130.test.mjs \
            patches/splatoon3/tests/special-crab-kraken-source-1130.test.mjs \
            patches/splatoon3/tests/special-killer-wail-input-1130.test.mjs \
            patches/splatoon3/tests/special-zipcaster-input-1130.test.mjs \
            patches/splatoon3/tests/issue-1607-zipcaster-retry-boundary.test.mjs \
            patches/splatoon3/tests/special-ultra-stamp-timing-1130.test.mjs \
            patches/splatoon3/tests/special-reefslider-source-1130.test.mjs \
            patches/splatoon3/tests/special-triple-source-1130.test.mjs \
            patches/splatoon3/tests/all-specials.test.mjs \
            patches/splatoon3/tests/kit-ink-vac.test.mjs \
            patches/splatoon3/tests/kit-trizooka.test.mjs \
            patches/splatoon3/tests/kit-big-bubbler.test.mjs \
            patches/splatoon3/tests/storm-effects.test.mjs \
            patches/splatoon3/tests/support-kit-recon-cooler.test.mjs \
            patches/splatoon3/tests/issue-912-triple-slam-fists.test.mjs \
            patches/splatoon3/tests/inkjet-paint-wire.test.mjs \
            patches/splatoon3/tests/special-paint-envelope.test.mjs \
            patches/splatoon3/tests/special-projectile-paint-credit.test.mjs \
            patches/splatoon3/tests/special-presentation.test.mjs \
            patches/splatoon3/tests/special-projectile.test.mjs
      - name: Inkjet cadence, fair pool admission and production composition
        run: |
          node --experimental-vm-modules --test --test-concurrency=2 \
            patches/splatoon3/tests/inkjet-vfx-cadence.test.mjs \
            patches/splatoon3/tests/inkjet-vfx-pool-budget.test.mjs \
            patches/splatoon3/tests/inkjet-vfx-production.test.mjs \
            patches/splatoon3/tests/inkjet-vfx-terminal-impact.test.mjs \
            scripts/tests/inkjet-terminal-probe-lifecycle.test.mjs
      - name: Public sub and current catalogue lifecycle regressions
        run: |
          node --experimental-vm-modules --test --test-concurrency=2 \
            patches/splatoon3/tests/special-zipcaster-ink-screen-contact.test.mjs \
            patches/splatoon3/tests/special-missile-tracking-hook-range.test.mjs \
            patches/splatoon3/tests/sub-community-behavior.test.mjs \
            patches/splatoon3/tests/curling-community-fidelity.test.mjs \
            patches/splatoon3/tests/catalogue-integration.test.mjs \
            patches/splatoon3/tests/catalogue-session-tick-admission.test.mjs \
            patches/splatoon3/tests/catalogue-tick-admission.test.mjs \
            patches/splatoon3/tests/tacticooler-gauge-lock.test.mjs \
            patches/splatoon3/tests/kit-trizooka-geometry.test.mjs \
            patches/splatoon3/tests/kit-trizooka-native.test.mjs \
            patches/splatoon3/tests/trizooka-birth-swim.test.mjs \
            patches/splatoon3/tests/special-zipcaster-armor.test.mjs \
            patches/splatoon3/tests/deployed-special-gauge-lock.test.mjs \
            patches/splatoon3/tests/burst-contact-phases.test.mjs \
            patches/local-quality/tests/tenacity.test.mjs \
            patches/splatoon3/tests/triple-splashdown-presentation.test.mjs
  catalogue-browser:
    runs-on: ubuntu-latest
    # Keep all native grids and emitted cases when browser installation takes 6+ minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
          sparse-checkout: |
            inkwave-public
            patches
            scripts
            reports/ink-volume/source
      - name: Verify immutable checkout identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_source_sha="$(git rev-parse HEAD)"
          printf 'Expected source: %s\nActual checkout: %s\n' "$EXPECTED_SOURCE_SHA" "$actual_source_sha"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.28.2 playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Reviewed Reefslider and Splashdown source regressions
        run: |
          set -e
          node --experimental-vm-modules --experimental-global-webcrypto --test --test-concurrency=1 patches/splatoon3/tests/reefslider-visual-lifecycle.test.mjs
          node --experimental-vm-modules --experimental-global-webcrypto --test --test-concurrency=1 patches/splatoon3/tests/triple-splashdown-impact-vfx.test.mjs
      - name: Build actual production composition
        run: node scripts/build-inkwave.mjs inkwave-public _site
      - name: Reviewed Inkjet nozzle owner emitted-site regressions
        run: INKWAVE_BUILT_SITE=_site node --experimental-vm-modules --test --test-concurrency=1 patches/splatoon3/tests/inkjet-nozzle-owner.test.mjs
      - name: Inspect rendered Inkjet nozzle attachment and lifecycle
        run: |
          set -euo pipefail
          browser_executable="$(node --input-type=module -e 'import {chromium} from "playwright"; process.stdout.write(chromium.executablePath())')"
          node scripts/check-inkwave-inkjet-presentation-browser.mjs --site _site --browser-executable "$browser_executable" --evidence-dir .ci-scratch/splashdown-browser/inkjet-nozzles
      - name: Verify special frame corrections in actual emitted modules
        run: INKWAVE_BUILT_SITE=_site node --experimental-vm-modules --test scripts/tests/inkwave-special-frame-emitted.test.mjs
      - name: Reviewed Reefslider and Splashdown emitted-site regressions
        run: |
          set -e
          INKWAVE_BUILT_SITE=_site node --experimental-vm-modules --experimental-global-webcrypto --test --test-concurrency=1 --test-name-pattern='arming warning|death, interruption' patches/splatoon3/tests/reefslider-visual-lifecycle.test.mjs
          INKWAVE_BUILT_SITE=_site node --experimental-vm-modules --experimental-global-webcrypto --test --test-concurrency=1 patches/splatoon3/tests/triple-splashdown-impact-vfx.test.mjs
      - name: Run isolated special browser batch
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NODE_OPTIONS: --max-old-space-size=768
        run: |
          set -euo pipefail
          proof=.ci-scratch/splashdown-browser/inkjet-terminal-source-proof.json
          python3 scripts/generate-inkwave-source-proof.py --source-root . --git-head --expected-head "$EXPECTED_SOURCE_SHA" --output "$proof"
          proof_sha256="$(sha256sum "$proof" | cut -d' ' -f1)"
          node scripts/check-inkwave-splashdown-browser.mjs --site _site --batch --source-root . --source-proof "$proof" --expected-proof-sha256 "$proof_sha256" --evidence-dir .ci-scratch/splashdown-browser
      - name: Verify Inkjet production composition in emitted modules
        run: |
          INKWAVE_BUILT_SITE=_site node --experimental-vm-modules --test \
            patches/splatoon3/tests/inkjet-vfx-production.test.mjs
      - name: Verify new boundaries in emitted modules
        run: |
          INKWAVE_TENACITY_BUILT_SITE=_site INKWAVE_BUILT_SITE=_site node --experimental-vm-modules --test --test-concurrency=2 \
            patches/splatoon3/tests/kraken-movement-paint-1130.test.mjs \
            patches/splatoon3/tests/kraken-arm-motion.test.mjs \
            patches/splatoon3/tests/kraken-dash-occlusion.test.mjs \
            patches/splatoon3/tests/special-zipcaster-ink-screen-contact.test.mjs \
            patches/splatoon3/tests/special-missile-tracking-hook-range.test.mjs \
            patches/splatoon3/tests/sub-community-behavior.test.mjs \
            patches/splatoon3/tests/curling-community-fidelity.test.mjs \
            patches/splatoon3/tests/catalogue-integration.test.mjs \
            patches/splatoon3/tests/catalogue-session-tick-admission.test.mjs \
            patches/splatoon3/tests/catalogue-tick-admission.test.mjs \
            patches/splatoon3/tests/tacticooler-gauge-lock.test.mjs \
            patches/splatoon3/tests/kit-trizooka.test.mjs \
            patches/splatoon3/tests/kit-trizooka-geometry.test.mjs \
            patches/splatoon3/tests/kit-trizooka-native.test.mjs \
            patches/splatoon3/tests/trizooka-birth-swim.test.mjs \
            patches/splatoon3/tests/special-zipcaster-armor.test.mjs \
            patches/splatoon3/tests/deployed-special-gauge-lock.test.mjs \
            patches/splatoon3/tests/burst-contact-phases.test.mjs \
            patches/local-quality/tests/tenacity.test.mjs \
            patches/splatoon3/tests/kit-ink-vac.test.mjs \
            patches/splatoon3/tests/support-kit-recon-cooler.test.mjs \
            patches/splatoon3/tests/triple-splashdown-presentation.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inkwave-catalogue-splashdown-lifecycle
          path: .ci-scratch/splashdown-browser/
          if-no-files-found: error
