name: PR 9271 focused regression

on:
  pull_request:
    paths:
      - "diag/pr9271-core-trigger.txt"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact PR 9271 head
        uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: a716588c79ec02e4b78d0f9a963cfbdc141302a8
          path: hex-ida
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hex-ida/package-lock.json
      - name: Install
        working-directory: hex-ida
        run: npm ci --no-audit --no-fund
      - name: Structured control projection regression
        working-directory: hex-ida
        run: timeout 120s node tests/phase8/structuring/structured-control-projection.test.mjs
      - name: Decompiler DTO projection boundary
        working-directory: hex-ida
        run: |
          timeout 60s node --test tests/phase7/analysis-query/analysis-query-decompiler-dto.test.mjs
          timeout 60s node --test tests/phase7/analysis-query/analysis-query-decompiler-projection.test.mjs
