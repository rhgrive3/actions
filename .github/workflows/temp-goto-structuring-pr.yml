name: Temporary goto patch transfer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-goto-structuring-pr.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PATCH_B64: 
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish raw patch
        shell: bash
        run: |
          set -euo pipefail
          raw_b64="$(printf '%s' "$PATCH_B64" | base64 -d | gzip -d | base64 -w0)"
          jq -n --arg message "ci: stage goto patch transfer" --arg content "$raw_b64"             '{message:$message,content:$content,branch:"main"}' > /tmp/body.json
          curl -fsS -X PUT             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/rhgrive3/actions/contents/tmp/goto-structuring-pr.patch"             --data-binary @/tmp/body.json >/dev/null
