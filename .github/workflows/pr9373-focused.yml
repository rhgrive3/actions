name: PR9373 focused verification

on:
  push:
    paths:
      - ".github/workflows/pr9373-focused.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: perf/canonical-semantic-ir-reuse
          path: target
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Focused semantic tests
        shell: bash
        run: |
          set -euo pipefail
          cd target
          timeout 3m node --test             tests/semantic-v2/canonical-ir-producer-fast-path.test.mjs             tests/semantic-v2/contract-ir.test.mjs             tests/semantic-v2/ssa-build.test.mjs             tests/semantic-v2/compat-v1-core.test.mjs             tests/semantic-v2/compat-v1-ssa-integration.test.mjs
      - name: Measure test_array_types
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > evidence/measure.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { pathToFileURL } from 'node:url';
          const root=path.resolve('target');
          const manifest=JSON.parse(fs.readFileSync(path.join(root,'benchmarks/public/codefuse-arm64/manifest.json'),'utf8'));
          const entry=manifest.cases.find(x=>x.id==='2/2_gcc_O0_g');
          if(!entry) throw new Error('case-not-found');
          const binary=path.join(root,'benchmarks/public/codefuse-arm64',entry.binary);
          const {openProduct}=await import(pathToFileURL(path.join(root,'tools/validation/public-benchmark/product-host.mjs')));
          const product=await openProduct(binary);
          try {
            const snap=await product.query.snapshot();
            let offset=0,target=null;
            while(true){
              const page=await product.query.functions(snap,{}, {offset,limit:1000});
              target=(page.value??[]).find(x=>x.name==='test_array_types')??target;
              if(target||page.page?.next==null) break;
              offset=page.page.next;
            }
            if(!target) throw new Error('target-not-found');
            const t=performance.now();
            const response=await product.query.decompile(await product.query.snapshot(),target.address,{profile:'fast'});
            const elapsedMs=performance.now()-t;
            const code=response?.value?.pseudocode??'';
            const out={
              caseId:entry.id,
              function:'test_array_types',
              address:String(target.address),
              elapsedMs,
              completeness:response?.status?.completeness??null,
              pseudocodeChars:code.length,
              pseudocodeSha256:crypto.createHash('sha256').update(code).digest('hex'),
            };
            fs.writeFileSync('evidence/result.json',JSON.stringify(out,null,2)+'\n');
            console.log(JSON.stringify(out));
          } finally { await product.close(); }
          NODE
          timeout 3m node evidence/measure.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr9373-focused-evidence
          path: evidence/result.json
          if-no-files-found: warn
          retention-days: 2
