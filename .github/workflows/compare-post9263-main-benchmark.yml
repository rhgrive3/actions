name: Compare post-9263 main vs pre-9263 baseline

on:
  workflow_run:
    workflows: ["hex-ida main full fresh decompile benchmark 15m"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      BASELINE_RUN: "35420971593"
      CURRENT_RUN: ${{ github.event.workflow_run.id }}
      CURRENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Checkout comparison helper
        uses: actions/checkout@v4

      - name: Download baseline shard artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline current final
          gh run download "${BASELINE_RUN}" --repo rhgrive3/actions --pattern 'main-bench-*' --dir baseline

      - name: Download current shard artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh run download "${CURRENT_RUN}" --repo rhgrive3/actions --pattern 'main-bench-*' --dir current

      - name: Build paired comparison
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          function collect(root) {
            const out = new Map();
            const stack = [root];
            while (stack.length) {
              const dir = stack.pop();
              if (!fs.existsSync(dir)) continue;
              for (const e of fs.readdirSync(dir, { withFileTypes:true })) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) stack.push(p);
                else if (e.isFile() && e.name === 'result.json') {
                  let x;
                  try { x = JSON.parse(fs.readFileSync(p, 'utf8')); } catch { continue; }
                  if (!Array.isArray(x.results)) continue;
                  for (const r of x.results) out.set(r.id, {
                    id:r.id,
                    state:r.state,
                    reason:r.reason ?? null,
                    elapsedMs:Number(r.elapsedMs || 0),
                    functionCount:Number(r.functionCount || 0),
                    functionStates:r.functionStates || {},
                  });
                }
              }
            }
            return out;
          }

          function percentile(values, p) {
            const a=[...values].filter(Number.isFinite).sort((x,y)=>x-y);
            if (!a.length) return null;
            return a[Math.min(a.length-1, Math.max(0, Math.ceil(a.length*p/100)-1))];
          }

          function stats(rows, key) {
            const xs=rows.map(r=>r[key]).filter(Number.isFinite);
            const sum=xs.reduce((a,b)=>a+b,0);
            return {
              count:xs.length,
              sumMs:sum,
              meanMs:xs.length?sum/xs.length:null,
              p50Ms:percentile(xs,50),
              p90Ms:percentile(xs,90),
              p95Ms:percentile(xs,95),
              maxMs:xs.length?Math.max(...xs):null,
            };
          }

          const baseline=collect('baseline');
          const current=collect('current');
          const ids=[...new Set([...baseline.keys(), ...current.keys()])].sort();
          const rows=[];
          for (const id of ids) {
            const before=baseline.get(id), after=current.get(id);
            if (!before || !after) continue;
            const ratio=before.elapsedMs>0 ? after.elapsedMs/before.elapsedMs : null;
            rows.push({
              id,
              beforeMs:before.elapsedMs,
              afterMs:after.elapsedMs,
              deltaMs:after.elapsedMs-before.elapsedMs,
              afterVsBeforePct:ratio==null?null:(ratio-1)*100,
              beforeState:before.state,
              afterState:after.state,
              beforeReason:before.reason,
              afterReason:after.reason,
              functionCountBefore:before.functionCount,
              functionCountAfter:after.functionCount,
              functionStatesBefore:before.functionStates,
              functionStatesAfter:after.functionStates,
            });
          }

          const comparable=rows.filter(r=>r.beforeMs>0 && r.afterMs>0);
          const ratios=comparable.map(r=>r.afterMs/r.beforeMs).filter(x=>Number.isFinite(x)&&x>0);
          const geo=ratios.length ? Math.exp(ratios.reduce((s,x)=>s+Math.log(x),0)/ratios.length) : null;
          const semanticMismatches=rows.filter(r =>
            r.beforeState!==r.afterState ||
            r.beforeReason!==r.afterReason ||
            r.functionCountBefore!==r.functionCountAfter ||
            JSON.stringify(r.functionStatesBefore)!==JSON.stringify(r.functionStatesAfter)
          );

          const out={
            schema:'hex-main-post9263-vs-pre9263/v1',
            baselineRun:Number(process.env.BASELINE_RUN),
            currentRun:Number(process.env.CURRENT_RUN),
            currentWorkflowConclusion:process.env.CURRENT_CONCLUSION,
            baselineCases:baseline.size,
            currentCases:current.size,
            pairedCases:rows.length,
            baseline:stats(rows,'beforeMs'),
            current:stats(rows,'afterMs'),
            paired:{
              geometricMeanAfterOverBefore:geo,
              geometricMeanAfterVsBeforePct:geo==null?null:(geo-1)*100,
              fasterAfter:comparable.filter(r=>r.afterMs<r.beforeMs).length,
              fasterBefore:comparable.filter(r=>r.beforeMs<r.afterMs).length,
              equal:comparable.filter(r=>r.beforeMs===r.afterMs).length,
              medianAfterVsBeforePct:percentile(comparable.map(r=>r.afterVsBeforePct),50),
              p90AfterVsBeforePct:percentile(comparable.map(r=>r.afterVsBeforePct),90),
            },
            semanticMismatchCount:semanticMismatches.length,
            semanticMismatches,
            largestImprovements:[...comparable].sort((a,b)=>a.afterVsBeforePct-b.afterVsBeforePct).slice(0,20),
            largestRegressions:[...comparable].sort((a,b)=>b.afterVsBeforePct-a.afterVsBeforePct).slice(0,20),
            rows,
          };
          fs.writeFileSync('final/result.json', JSON.stringify(out,null,2)+'\n');
          fs.writeFileSync('final/summary.json', JSON.stringify({
            baselineCases:out.baselineCases,
            currentCases:out.currentCases,
            pairedCases:out.pairedCases,
            baseline:out.baseline,
            current:out.current,
            paired:out.paired,
            semanticMismatchCount:out.semanticMismatchCount,
            largestImprovements:out.largestImprovements.slice(0,10),
            largestRegressions:out.largestRegressions.slice(0,10),
          },null,2)+'\n');
          console.log(fs.readFileSync('final/summary.json','utf8'));
          NODE

      - name: Upload comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: post9263-vs-pre9263-main
          path: |
            final/result.json
            final/summary.json
          if-no-files-found: error
          retention-days: 7
