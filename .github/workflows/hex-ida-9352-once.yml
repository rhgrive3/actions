name: Hex IDA issue 9352 one-off

on:
  push:
    branches: [main]
    paths:
      - 'triggers/hex-ida-9352.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout worker repository
        uses: actions/checkout@v4

      - name: Clone target branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch fix/issue-9352-freebuff-stable-dir --single-branch https://github.com/rhgrive3/hex-ida.git target
          cd target
          git rev-parse HEAD > ../initial.txt

      - name: Apply fixed patch
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/issue9352.patch
          for i in 1 2 3 4 5; do
            base64 -d "../patches/hex-ida-9352-part${i}.b64" >> /tmp/issue9352.patch
          done
          patch -p2 < /tmp/issue9352.patch
          git diff --check

      - name: Focused validation
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/freebuff-setup.mjs
          node --test \
            tests/issue-9352-freebuff-ancestor-swap.test.mjs \
            tests/issue-9278-freebuff-ancestor-symlink.test.mjs \
            tests/issue-9305-freebuff-home-link-publication.test.mjs \
            tests/issue-9281-freebuff-atomic-binary-publication.test.mjs \
            tests/issue-9309-freebuff-repo-home-migration.test.mjs \
            tests/issue-9332-freebuff-postcommit-cleanup.test.mjs

      - name: Stage validated files in worker repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged/hex-ida-9352/scripts staged/hex-ida-9352/tests
          cp target/scripts/freebuff-setup.mjs staged/hex-ida-9352/scripts/freebuff-setup.mjs
          cp target/tests/issue-9305-freebuff-home-link-publication.test.mjs staged/hex-ida-9352/tests/issue-9305-freebuff-home-link-publication.test.mjs
          cp target/tests/issue-9352-freebuff-ancestor-swap.test.mjs staged/hex-ida-9352/tests/issue-9352-freebuff-ancestor-swap.test.mjs
          git config user.name actions-pr-worker
          git config user.email actions-pr-worker@users.noreply.github.com
          git add staged/hex-ida-9352
          git commit -m 'chore: stage validated issue 9352 files'
          git push origin HEAD:main
