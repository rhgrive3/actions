name: INKWAVE Premerge Validation
on:
  push:
    branches: [update/inkwave-upstream-20260928]
permissions:
  contents: write
jobs:
  validate:
    if: contains(github.event.head_commit.message, 'premerge validate INKWAVE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax and local references
        shell: bash
        run: |
          set -euo pipefail
          find inkwave-public/src inkwave-public/vendor -type f \( -name '*.js' -o -name '*.mjs' \) -print0 |
            while IFS= read -r -d '' p; do node --check "$p" >/dev/null; done
          python3 - <<'PY'
          import re, pathlib, sys
          root=pathlib.Path('inkwave-public')
          missing=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix not in {'.js','.mjs','.html','.css'}: continue
              try: s=p.read_text(encoding='utf-8')
              except Exception: continue
              refs=set()
              if p.suffix in {'.js','.mjs'}:
                  refs.update(re.findall(r'''(?:from\s*|import\s*\()\s*["']([^"']+)["']''',s))
                  refs.update(re.findall(r'''import\s*["']([^"']+)["']''',s))
              if p.suffix in {'.html','.css'}:
                  refs.update(re.findall(r'''(?:src|href)=["']([^"']+)["']''',s))
                  refs.update(re.findall(r'''@import\s+(?:url\()?["']?([^"'\)\s]+)''',s))
              for ref in refs:
                  if ref.startswith(('http:','https:','data:','blob:','#')) or ref == 'three' or ref.startswith('three/addons/'): continue
                  if not ref.startswith(('./','../','/')) and p.suffix in {'.js','.mjs'}: continue
                  q=(root/ref.lstrip('/')) if ref.startswith('/') else (p.parent/ref)
                  q=pathlib.Path(str(q).split('?',1)[0].split('#',1)[0])
                  if not q.exists(): missing.append((str(p),ref,str(q)))
          if missing:
              for x in missing: print('MISSING',*x)
              sys.exit(1)
          print('references OK')
          PY
      - name: Build Pages output
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.25.12
          rm -rf /tmp/inkwave-site
          node scripts/build-inkwave.mjs inkwave-public /tmp/inkwave-site
          test -s /tmp/inkwave-site/index.html
          test -s /tmp/inkwave-site/src/main.js
          test -s /tmp/inkwave-site/src/boss/boss.js
          test -s /tmp/inkwave-site/src/net/netmatch.js
          test -s /tmp/inkwave-site/assets/stages/cargo-day.webp
          grep -Fq "styles/mobile.css" /tmp/inkwave-site/index.html
      - name: Remove validation helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inkwave-premerge-validate.yml
          git commit -m "Remove temporary INKWAVE premerge validator"
          git push origin HEAD:update/inkwave-upstream-20260928
