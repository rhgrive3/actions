name: Temporary register_tm_clones regression probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-register-tm-clones-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            sha: a0ce8d6dcc863de7d92d90f039d50e8630518fb1
          - label: merged
            sha: 42fe059c05b115b3daf330ba79b45c62370d415c
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: ${{ matrix.sha }}
          path: target
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run one CodeFuse case
        env:
          TARGET_DIR: ${{ github.workspace }}/target
          OUTPUT_FILE: ${{ github.workspace }}/probe/result.json
          CASE_DIR: ${{ github.workspace }}/probe/cases
          TARGET_SHA: ${{ matrix.sha }}
          WORKERS: "1"
          CASE_TIMEOUT_MS: "300000"
          SOFT_DEADLINE_MS: "330000"
          START_INDEX: "0"
          LIMIT: "1"
        run: node scripts/pr9263-benchmark-local.mjs
      - name: Extract register_tm_clones
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='probe/cases';
          const file=fs.readdirSync(root).find(x=>x.endsWith('.json'));
          const d=JSON.parse(fs.readFileSync(path.join(root,file),'utf8'));
          const f=d.functions.find(x=>x.name==='register_tm_clones');
          if(!f) throw new Error('register_tm_clones missing');
          const gotos=(String(f.pseudocode||'').match(/\bgoto\b/g)||[]).length;
          fs.writeFileSync('probe/register_tm_clones.json',JSON.stringify({
            label:'${{ matrix.label }}',
            sha:'${{ matrix.sha }}',
            address:f.address,
            state:f.state,
            gotos,
            pseudocode:f.pseudocode
          },null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: register-tm-clones-${{ matrix.label }}
          path: probe/register_tm_clones.json
          retention-days: 1
