name: Assemble credited menu BGM (one-time)
on:
  push:
    branches:
      - feature/menu-bgm-aoi-kenban-20261031

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore original audio without transcoding
        shell: bash
        run: |
          set -euo pipefail
          base=inkwave-public/assets/audio/menu_the_ika_swing_aoi_kenban.mp3
          cat "${base}.part01" "${base}.part02" "${base}.part03" "${base}.part04" > "${base}"
          echo '2fe8eade61cb5627dd4c0a7241c1b272372c0581ed901fba88e8c80267bea241  inkwave-public/assets/audio/menu_the_ika_swing_aoi_kenban.mp3' | sha256sum -c -
      - name: Commit restored asset and remove temporary parts/workflow
        shell: bash
        run: |
          set -euo pipefail
          base=inkwave-public/assets/audio/menu_the_ika_swing_aoi_kenban.mp3
          git rm -- "${base}.part01" "${base}.part02" "${base}.part03" "${base}.part04" .github/workflows/menu-bgm-assemble-once.yml
          git add -- "${base}"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets: restore exact credited menu MP3'
          git push origin HEAD:refs/heads/feature/menu-bgm-aoi-kenban-20261031
