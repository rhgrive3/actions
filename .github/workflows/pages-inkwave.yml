name: Publish INKWAVE to Pages

on:
  push:
    branches: [main]
    paths:
      - "inkwave-public/**"
      - "scripts/build-inkwave.mjs"
      - "scripts/check-inkwave-patches.mjs"
      - "patches/splatoon3/**"
      - "patches/touch-layout/**"
      - "patches/reliability/**"
      - ".github/workflows/pages-inkwave.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-inkwave"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            inkwave-public
            patches
            scripts

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Minify every JS/CSS file in place (same module layout, same behaviour), tree-shake three.js to the symbols
      # the game uses and preload the module graph. Source of truth stays the readable inkwave-public/.
      - name: Cache esbuild
        id: esbuild-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/esbuild
            node_modules/@esbuild
          key: ${{ runner.os }}-${{ runner.arch }}-esbuild-0.28.2

      - name: Build optimized site
        run: |
          set -euo pipefail
          if [ "${{ steps.esbuild-cache.outputs.cache-hit }}" != "true" ]; then
            npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.28.2
          fi
          node scripts/check-inkwave-patches.mjs --quick
          node scripts/build-inkwave.mjs inkwave-public _site

      - name: Upload INKWAVE site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
