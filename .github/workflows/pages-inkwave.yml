name: Publish INKWAVE to Pages

on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-inkwave"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: 14f9f913a8438353d0e462a0e74e17d8af876230
          filter: blob:none
          sparse-checkout: |
            inkwave-public
            patches
            scripts
            reports/ink-volume/source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Minify every JS/CSS file in place (same module layout, same behaviour), tree-shake three.js to the symbols
      # the game uses and preload the module graph. Source of truth stays the readable inkwave-public/.
      - name: Cache esbuild
        id: esbuild-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/esbuild
            node_modules/@esbuild
          key: ${{ runner.os }}-${{ runner.arch }}-esbuild-0.28.2

      - name: Build optimized site
        run: |
          set -euo pipefail
          if [ "${{ steps.esbuild-cache.outputs.cache-hit }}" != "true" ]; then
            npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.28.2
          fi
          node scripts/check-inkwave-patches.mjs --quick
          node --experimental-vm-modules --test patches/local-quality/tests/*.test.mjs
          node --experimental-vm-modules --test patches/practice-range/tests/*.test.mjs
          node --experimental-vm-modules --test patches/loading-cache/tests/adapter.test.mjs patches/loading-cache/tests/worker.test.mjs
          python3 patches/loading-cache/tests/harness.test.py
          node scripts/build-inkwave.mjs inkwave-public _site
          node scripts/check-inkwave-startup-budget.mjs _site

      - name: Verify exact previously published build
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, pathlib
          p = pathlib.Path('_site/inkwave-build.json')
          b = p.read_bytes()
          m = json.loads(b)
          assert hashlib.sha256(b).hexdigest() == 'dc719417be7ea4d8e1d5f65a30f8bfcdf3d5f082b5ef7cbbc060fb487aeaee00'
          assert m['contentHash'] == 'bbb2d5efa3e1e9726fef85a241fa7ac00f02eda09b92ae83df0d3bcd5397d6fa'
          assert m['inputHash'] == '5002a74b9893b88cc8dbded872b47b3824be570d6d6e134ee35a400526b51454'
          for path, expected in m['artifacts'].items():
              assert hashlib.sha256((pathlib.Path('_site') / path).read_bytes()).hexdigest() == expected, path
          PYVERIFY

      - name: Upload INKWAVE site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
