name: Publish INKWAVE to Pages

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - "inkwave-public/**"
      - "scripts/build-inkwave.mjs"
      - "scripts/check-inkwave-patches.mjs"
      - "patches/splatoon3/**"
      - "patches/touch-layout/**"
      - "patches/reliability/**"
      - "patches/local-quality/**"
      - "patches/loading-cache/**"
      - "patches/practice-range/**"
      - "patches/native-stages/**"
      - "patches/network-replication/**"
      - "patches/movement-physics/**"
      - "scripts/lib/**"
      - "scripts/check-inkwave-startup-budget.mjs"
      - "scripts/check-inkwave-ranked-browser.mjs"
      - "scripts/run-logged-test-process.mjs"
      - "server/src/**"
      - "scripts/lib/inkwave-native-stages.mjs"
      - "scripts/inkwave-source-composition.mjs"
      - ".github/workflows/pages-inkwave.yml"
      - "scripts/tests/inkwave-ranked-pages-sequencing.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-inkwave-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            inkwave-public
            patches
            scripts
            tools/squid-heading-qa
            server/src
            reports/ink-volume/source
            native-prebuilt

      # Native stages: GPU-compressed colour textures (KTX2) for stages whose
      # browser conversion is otherwise uncompressed. Only stage.json records and
      # the colour packs they list are fetched (~315 MB); LFS objects are cached
      # by pointer content so an unchanged set is not downloaded again.
      - name: Restore native texture LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: native-textures-lfs-${{ hashFiles('native-prebuilt/*/stage.json', 'native-prebuilt/packs/*') }}
          restore-keys: native-textures-lfs-

      # Optional: a failed LFS fetch (quota, outage) must not block publication.
      # The build then admits no texture table and stages keep their PNG path.
      - name: Fetch native colour textures
        run: |
          set -uo pipefail
          warn() { echo "::warning::native colour textures unavailable ($1); stages keep their PNG path"; exit 0; }
          git lfs install --local || warn "git lfs install"
          git lfs pull --include="native-prebuilt/*/stage.json" || warn "stage records"
          packs=$(node -e "const fs=require('fs');const out=new Set();for(const id of fs.readdirSync('native-prebuilt')){const f='native-prebuilt/'+id+'/stage.json';if(!fs.existsSync(f))continue;const b=fs.readFileSync(f);if(b.subarray(0,40).toString().startsWith('version https://git-lfs'))continue;for(const p of JSON.parse(b).manifest.prebuiltTexturePacks||[])if(p.group==='color')out.add('native-prebuilt/'+p.file);}process.stdout.write([...out].join(','));")
          if [ -n "$packs" ]; then git lfs pull --include="$packs" || warn "colour packs"; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Minify every JS/CSS file in place (same module layout, same behaviour), tree-shake three.js to the symbols
      # the game uses and preload the module graph. Source of truth stays the readable inkwave-public/.
      - name: Build optimized site
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx --no-install playwright install --with-deps --no-shell chromium
          node --test scripts/tests/inkwave-pages-source-identity.test.mjs scripts/tests/inkwave-ranked-pages-sequencing.test.mjs
          node scripts/check-inkwave-patches.mjs --quick
          # Complete local-quality, practice-range and loading-cache tests still
          # run as mandatory Validate INKWAVE update regression shards. Keep the
          # Pages publication gate focused on source identity, provenance, a
          # real production build, startup budget and post-deploy ranked browser.
          node scripts/build-inkwave.mjs inkwave-public _site
          node scripts/check-inkwave-startup-budget.mjs _site

      - name: Upload INKWAVE site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Validate the artifact that this exact job has just deployed. A parallel
      # push-triggered ranked job cannot assume Pages has published its SHA.
      - name: Verify deployed ranked modes
        if: success() && steps.deployment.outcome == 'success' && github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/main'
        env:
          RANKED_PUBLIC_URL: https://rhgrive3.github.io/actions/
          RANKED_OFFLINE_ONLY: 1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/check-inkwave-ranked-browser.mjs _site reports/ranked-public-browser
      - uses: actions/upload-artifact@v4
        if: always() && steps.deployment.outcome == 'success' && github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/main'
        with:
          name: inkwave-ranked-public-browser
          path: reports/ranked-public-browser
          retention-days: 30
