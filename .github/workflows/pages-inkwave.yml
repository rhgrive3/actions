name: Publish INKWAVE to Pages

on:
  # Legacy branch-based Pages currently publishes main as a text site on every push.
  # Always rebuild INKWAVE too, regardless of which files changed.
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-inkwave"
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Minify every JS/CSS file in place (same module layout, same behaviour), tree-shake three.js to the symbols
      # the game uses and preload the module graph. Source of truth stays the readable inkwave-public/.
      - name: Build optimized site
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.28.2
          node --experimental-vm-modules scripts/check-inkwave-patches.mjs
          node scripts/build-inkwave.mjs inkwave-public _site

      - name: Upload INKWAVE site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Wait for legacy Pages build to finish
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          done_legacy=0
          for _ in $(seq 1 48); do
            runs="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/$REPO/actions/runs?head_sha=$SHA&per_page=100")"
            state="$(printf '%s' "$runs" | jq -r '
              [.workflow_runs[] | select(.name == "pages build and deployment" and .event == "dynamic")] as $p
              | if ($p|length)==0 then "missing"
                elif all($p[]; .status=="completed") then "completed"
                else "running" end
            ')"
            echo "legacy Pages state: $state"
            if [ "$state" = completed ]; then
              done_legacy=1
              break
            fi
            sleep 5
          done
          if [ "$done_legacy" -ne 1 ]; then
            echo "::warning::Legacy Pages run did not finish within 4 minutes; deploying INKWAVE anyway."
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
