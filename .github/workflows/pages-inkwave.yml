name: Publish INKWAVE to Pages

on:
  workflow_run:
    workflows: ['Validate INKWAVE update']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages-inkwave-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'rhgrive3/actions' && github.event.workflow_run.conclusion == 'success'))
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            inkwave-public
            patches
            scripts
            tools/squid-heading-qa
            server/src
            reports/ink-volume/source

      # The runner starts after Validate finishes. A manual run also fails
      # immediately unless this exact current-main push already passed.
      - name: Require completed Validate before build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/inkwave-pages-validation.mjs --once --sha "$SOURCE_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Minify every JS/CSS file in place (same module layout, same behaviour), tree-shake three.js to the symbols
      # the game uses and preload the module graph. Source of truth stays the readable inkwave-public/.
      - name: Build optimized site
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx --no-install playwright install --with-deps --no-shell chromium
          node --test scripts/tests/inkwave-pages-source-identity.test.mjs scripts/tests/inkwave-ranked-pages-sequencing.test.mjs
          node scripts/check-inkwave-patches.mjs --quick
          # Complete local-quality, practice-range and loading-cache tests still
          # run as mandatory Validate INKWAVE update regression shards. Keep the
          # Pages publication gate focused on source identity, provenance, a
          # real production build, startup budget and post-deploy ranked browser.
          node scripts/build-inkwave.mjs inkwave-public _site
          node scripts/check-inkwave-startup-budget.mjs _site

      - name: Require successful Validate for current main before upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/inkwave-pages-validation.mjs --once --sha "$SOURCE_SHA"

      - name: Upload INKWAVE site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Recheck Validate and current main before publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/inkwave-pages-validation.mjs --once --sha "$SOURCE_SHA"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Validate the artifact that this exact job has just deployed. A parallel
      # push-triggered ranked job cannot assume Pages has published its SHA.
      - name: Verify deployed ranked modes
        if: success() && steps.deployment.outcome == 'success' && github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/main'
        env:
          RANKED_PUBLIC_URL: https://rhgrive3.github.io/actions/
          RANKED_OFFLINE_ONLY: 1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node scripts/check-inkwave-ranked-browser.mjs _site reports/ranked-public-browser
      - uses: actions/upload-artifact@v4
        if: always() && steps.deployment.outcome == 'success' && github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/main'
        with:
          name: inkwave-ranked-public-browser
          path: reports/ranked-public-browser
          retention-days: 30
