name: Publish INKWAVE to Pages

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - "inkwave-public/**"
      - "scripts/build-inkwave.mjs"
      - "scripts/check-inkwave-patches.mjs"
      - "patches/splatoon3/**"
      - "patches/touch-layout/**"
      - "patches/reliability/**"
      - "patches/local-quality/**"
      - "patches/loading-cache/**"
      - "patches/practice-range/**"
      - "patches/native-stages/**"
      - "patches/network-replication/**"
      - "patches/movement-physics/**"
      - "scripts/lib/**"
      - "scripts/check-inkwave-startup-budget.mjs"
      - "scripts/check-inkwave-ranked-browser.mjs"
      - "scripts/run-logged-test-process.mjs"
      - "server/src/**"
      - "scripts/lib/inkwave-native-stages.mjs"
      - "scripts/inkwave-source-composition.mjs"
      - ".github/workflows/pages-inkwave.yml"
      - "scripts/tests/inkwave-ranked-pages-sequencing.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-inkwave-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            inkwave-public
            patches
            scripts
            tools/squid-heading-qa
            server/src
            reports/ink-volume/source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Minify every JS/CSS file in place (same module layout, same behaviour), tree-shake three.js to the symbols
      # the game uses and preload the module graph. Source of truth stays the readable inkwave-public/.
      - name: Build optimized site
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx --no-install playwright install --with-deps --no-shell chromium
          node --test scripts/tests/inkwave-pages-source-identity.test.mjs scripts/tests/inkwave-ranked-pages-sequencing.test.mjs
          node scripts/check-inkwave-patches.mjs --quick
          # Complete local-quality, practice-range and loading-cache tests still
          # run as mandatory Validate INKWAVE update regression shards. Keep the
          # Pages publication gate focused on source identity, provenance, a
          # real production build, startup budget and post-deploy ranked browser.
          node scripts/build-inkwave.mjs inkwave-public _site
          node scripts/check-inkwave-startup-budget.mjs _site

      - name: Upload INKWAVE site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Validate the artifact that this exact job has just deployed. A parallel
      # push-triggered ranked job cannot assume Pages has published its SHA.
      - name: Verify deployed ranked modes
        if: success() && steps.deployment.outcome == 'success' && github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/main'
        env:
          RANKED_PUBLIC_URL: https://rhgrive3.github.io/actions/
          RANKED_OFFLINE_ONLY: 1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/check-inkwave-ranked-browser.mjs _site reports/ranked-public-browser
      - uses: actions/upload-artifact@v4
        if: always() && steps.deployment.outcome == 'success' && github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/main'
        with:
          name: inkwave-ranked-public-browser
          path: reports/ranked-public-browser
          retention-days: 30
