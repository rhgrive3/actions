name: Publish INKWAVE to Pages

on:
  push:
    branches: [main]
    paths:
      - "inkwave-public/**"
      - "scripts/build-inkwave.mjs"
      - ".github/workflows/pages-inkwave.yml"
  workflow_run:
    workflows: ["Fetch INKWAVE public source"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-inkwave"
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Minify every JS/CSS file in place (same module layout, same behaviour), tree-shake three.js to the symbols
      # the game uses and preload the module graph. Source of truth stays the readable inkwave-public/.
      - name: Build optimized site
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.25.12
          node scripts/build-inkwave.mjs inkwave-public _site

      - name: Upload INKWAVE site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
