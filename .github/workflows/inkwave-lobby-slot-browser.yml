name: INKWAVE lobby slot native CSSOM regression
on:
  pull_request:
    paths:
      - patches/local-quality/adapter.mjs
      - patches/local-quality/lobby-slot-transform-adapter.mjs
      - patches/local-quality/tests/lobby-slot-transform.test.mjs
      - scripts/check-inkwave-lobby-slot-browser.mjs
      - .github/workflows/inkwave-lobby-slot-browser.yml
permissions:
  contents: read
concurrency:
  group: lobby-slot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-cssom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --silent esbuild@0.28.2 playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify native DOM lobby transform write equivalence
        run: |
          node --test patches/local-quality/tests/lobby-slot-transform.test.mjs
          node scripts/check-inkwave-lobby-slot-browser.mjs .ci-scratch/lobby-slot-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lobby-slot-native-cssom-${{ github.event.pull_request.head.sha }}
          path: .ci-scratch/lobby-slot-browser/
          if-no-files-found: warn
          retention-days: 14
