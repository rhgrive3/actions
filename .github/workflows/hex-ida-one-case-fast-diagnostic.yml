name: Hex IDA one-case fast bottleneck diagnostic

on:
  push:
    paths:
      - ".github/workflows/hex-ida-one-case-fast-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact hex-ida main
        uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: 3794a4fe0ddf9dd3452c4ba915c7e2cf1ce342fb
          path: target
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose one slow case
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          cat > diagnostic/diagnose.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const root = path.resolve('target');
          const manifest = JSON.parse(fs.readFileSync(path.join(root,'benchmarks/public/codefuse-arm64/manifest.json'),'utf8'));
          const entry = manifest.cases.find(x => x.id === '2/2_gcc_O0_g');
          if (!entry) throw new Error('case-not-found');
          const binary = path.join(root,'benchmarks/public/codefuse-arm64',entry.binary);

          const { openProduct } = await import(pathToFileURL(path.join(root,'tools/validation/public-benchmark/product-host.mjs')));
          const { analyzeFunctionCached, clearAnalysisCache } = await import(pathToFileURL(path.join(root,'js/analyze.js')));
          const { decompile } = await import(pathToFileURL(path.join(root,'js/decompile.js')));

          const product = await openProduct(binary);
          try {
            const snapshot = await product.query.snapshot();
            const discovered = [];
            let offset = 0;
            while (true) {
              const page = await product.query.functions(snapshot, {}, { offset, limit:1000 });
              discovered.push(...(page.value ?? []));
              if (page.page?.next == null) break;
              offset = page.page.next;
            }

            const backend = product.app.backend;
            const originalFetchChunk = backend.fetchChunk.bind(backend);
            const originalReadAt = backend.readAt.bind(backend);

            const rows = [];
            for (const fn of discovered) {
              const range = product.app.validatedFunctionRange(fn.address);
              if (!range?.ok) continue;
              const region = range.region;
              const startRow = Number((range.start - BigInt(region.vmAddr)) / 4n);
              const endRow = Math.min(
                Number((range.end - BigInt(region.vmAddr) + 3n) / 4n) - 1,
                Math.max(0, Number(BigInt(region.size) / 4n) - 1),
              );

              let chunkCalls = 0, chunkMs = 0, readCalls = 0, readMs = 0;
              backend.fetchChunk = async (...args) => {
                const t = performance.now();
                try { return await originalFetchChunk(...args); }
                finally { chunkCalls++; chunkMs += performance.now() - t; }
              };
              backend.readAt = async (...args) => {
                const t = performance.now();
                try { return await originalReadAt(...args); }
                finally { readCalls++; readMs += performance.now() - t; }
              };

              clearAnalysisCache();
              const common = { profile:'fast', architecture:'arm64' };

              let t = performance.now();
              const analyzed = await analyzeFunctionCached(backend, region, startRow, endRow, product.app.symbols, undefined, { ...common, texts:false });
              const analysisMs = performance.now() - t;

              t = performance.now();
              const withTexts = await analyzeFunctionCached(backend, region, startRow, endRow, product.app.symbols, undefined, { ...common, texts:true });
              const textResolutionMs = performance.now() - t;

              t = performance.now();
              const projection = decompile(withTexts.model, {
                profile:'fast',
                name:fn.name ?? product.app.symbols.nameAt?.(fn.address) ?? null,
                addr:fn.address,
              });
              const decompileMs = performance.now() - t;

              const pipeline = projection?.ctx?.decompilerPipeline ?? {};
              rows.push({
                address:String(fn.address),
                name:fn.name ?? null,
                size:fn.size == null ? null : String(fn.size),
                requestedRows:endRow-startRow+1,
                instructions:analyzed?.instructions ?? null,
                basicBlocks:withTexts?.model?.basicBlocks?.length ?? null,
                addressRefs:withTexts?.model?.addressRefs?.length ?? null,
                analysisMs,
                textResolutionMs,
                decompileMs,
                totalMeasuredMs:analysisMs+textResolutionMs+decompileMs,
                chunkCalls,
                chunkMs,
                readCalls,
                readMs,
                phase8ElapsedMs:pipeline.phase8ElapsedMs ?? null,
                rewriteElapsedMs:projection?.rewriteStats?.elapsedMs ?? null,
                rewriteBudgetExceeded:projection?.rewriteStats?.budgetExceeded ?? null,
                pseudocodeChars:projection?.pseudocode?.length ?? 0,
              });
            }
            backend.fetchChunk = originalFetchChunk;
            backend.readAt = originalReadAt;

            const sum = key => rows.reduce((n,r)=>n+Number(r[key]||0),0);
            const top = [...rows].sort((a,b)=>b.totalMeasuredMs-a.totalMeasuredMs).slice(0,15);
            const out = {
              schema:'hex-one-case-fast-diagnostic/v1',
              targetSha:'3794a4fe0ddf9dd3452c4ba915c7e2cf1ce342fb',
              caseId:entry.id,
              functionCount:rows.length,
              setup:product.profile,
              totals:{
                analysisMs:sum('analysisMs'),
                textResolutionMs:sum('textResolutionMs'),
                decompileMs:sum('decompileMs'),
                measuredFunctionMs:sum('totalMeasuredMs'),
                chunkCalls:sum('chunkCalls'),
                chunkMs:sum('chunkMs'),
                readCalls:sum('readCalls'),
                readMs:sum('readMs'),
              },
              topFunctions:top,
              functions:rows,
            };
            fs.writeFileSync('diagnostic/result.json', JSON.stringify(out,null,2)+'\n');
            const compact = {
              caseId:out.caseId, functionCount:out.functionCount, setup:out.setup, totals:out.totals,
              topFunctions:top.slice(0,8),
            };
            fs.writeFileSync('diagnostic/summary.json', JSON.stringify(compact,null,2)+'\n');
            console.log(JSON.stringify(compact));
          } finally {
            await product.close();
          }
          NODE
          timeout 10m node diagnostic/diagnose.mjs
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-case-fast-diagnostic
          path: |
            diagnostic/result.json
            diagnostic/summary.json
          if-no-files-found: warn
          retention-days: 2
