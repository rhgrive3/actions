name: Export hex-ida fix source

on:
  push:
    paths:
      - ".github/workflows/export-hex-ida-main-source.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact hex-ida main
        uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: a716588c79ec02e4b78d0f9a963cfbdc141302a8
          path: hex-ida
          fetch-depth: 1
      - name: Verify HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C hex-ida rev-parse HEAD)" = "a716588c79ec02e4b78d0f9a963cfbdc141302a8"
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: hex-ida-pr9271-a716588c
          path: hex-ida
          include-hidden-files: true
          retention-days: 1
