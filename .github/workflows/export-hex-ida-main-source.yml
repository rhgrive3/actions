name: Export hex-ida fix source

on:
  push:
    paths:
      - ".github/workflows/export-hex-ida-main-source.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact hex-ida main
        uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: ac7bb277dbc0b2c6527d2a08451636fd90262584
          path: hex-ida
          fetch-depth: 1
      - name: Verify HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C hex-ida rev-parse HEAD)" = "ac7bb277dbc0b2c6527d2a08451636fd90262584"
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: hex-ida-fix-ac7bb277
          path: hex-ida
          include-hidden-files: true
          retention-days: 1
