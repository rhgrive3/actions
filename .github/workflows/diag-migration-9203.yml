name: Diagnose migration 9203
# rerun after Ghidra trigger fix

on:
  push:
    branches:
      - diag/migration-9203

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: integration/arch-defects-progress-20260918
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies quietly
        shell: bash
        run: npm ci --no-audit --no-fund >/tmp/npm-ci.log 2>&1

      - name: Find first migration failure
        id: diagnose
        shell: bash
        run: |
          set +e
          : > diagnostic.txt
          run_one() {
            name="$1"
            shift
            out="/tmp/diag-$name.log"
            "$@" >"$out" 2>&1
            code=$?
            printf '%s: exit=%s\n' "$name" "$code" >> diagnostic.txt
            if [ "$code" -ne 0 ]; then
              {
                printf '\nFIRST_FAILURE=%s\n' "$name"
                printf '%s\n' '--- last 80 lines ---'
                tail -n 80 "$out"
              } >> diagnostic.txt
              return "$code"
            fi
            return 0
          }
          run_one circleci-checkout node tests/ci/circleci-checkout.test.mjs || exit $?
          run_one circleci-impact node tests/ci/circleci-impact.test.mjs || exit $?
          run_one migration-guardrails node tests/migration-guardrails.mjs || exit $?
          run_one reusable-release node tests/reusable-release-validation.mjs || exit $?
          run_one freebuff-wrappers node tests/freebuff-wrappers.mjs || exit $?
          run_one universal-binary-source node tests/universal-binary-source.mjs || exit $?
          run_one binary-platform node tests/binary-platform.mjs || exit $?
          printf '\nALL_FOCUSED_MIGRATION_CHECKS_PASS\n' >> diagnostic.txt
          run_one arch-invariants timeout 180s node --test tests/arch-invariants/*.test.mjs || exit $?
          run_one query-dto timeout 180s node --test tests/phase7/analysis-query/analysis-query-decompiler-dto.test.mjs tests/phase7/analysis-query/analysis-query-decompiler-projection.test.mjs || exit $?
          run_one ir-defuse timeout 180s node --test tests/semantic-v2/ir-def-use-ownership.test.mjs || exit $?
          run_one ir-reachability timeout 180s node tests/semantic-v2/ir-reachability-cache-ownership.test.mjs || exit $?
          run_one symbol-ranking timeout 180s node --test tests/phase4/platform/same-address-symbol-semantic-ranking.test.mjs tests/phase4/binary/issue-8255-aarch64-elf-mapping-symbols.test.mjs || exit $?
          run_one symbol-name-types timeout 120s node tests/phase4/platform/issue-4739-analysis-result-name-types.test.mjs || exit $?
          printf '\nALL_NON_F_FOCUSED_CHECKS_PASS\n' >> diagnostic.txt

      - name: Upload concise diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-9203-diagnostic
          path: diagnostic.txt
          if-no-files-found: error
          retention-days: 2
