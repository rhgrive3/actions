name: Hex Cloudflare credential presence
on:
  push:
    paths:
      - .github/workflows/hex-cf-credential-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check deploy credential presence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          set -euo pipefail
          : > credential-presence.txt
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_API_TOKEN CF_ACCOUNT_ID CLOUDFLARE_API_KEY CLOUDFLARE_EMAIL; do
            if [[ -n "${!name:-}" ]]; then
              echo "${name}=present" >> credential-presence.txt
            else
              echo "${name}=absent" >> credential-presence.txt
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hex-cf-credential-presence
          path: credential-presence.txt
          retention-days: 1
