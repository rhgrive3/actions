          DIAGNOSTIC_LANE: wiper-lifecycle-diagnostic
        run: node --test .diagnostic-route/head/tools/native-diagnostic-pr/route.test.mjs
      - uses: actions/checkout@v4
        with:
          ref: c0938a3f84768474df91713f7b372f9d7f8fe96a
          path: work/source
          fetch-depth: 0
          persist-credentials: false
      - name: Record independently verified Wiper runtime and reference identities
        run: |
          test "$(git -C work/source rev-parse HEAD)" = c0938a3f84768474df91713f7b372f9d7f8fe96a
          test "$(git -C work/source rev-parse HEAD^{tree})" = 97b9938391f156dc332f6a56ac6fe3d21d9f9dc7
          git -C work/source cat-file -e 7581ca9be8cf87d253918b8abb3b8ebe728c2093^{commit}
          printf 'runtime_source_sha=%s\nruntime_source_tree=%s\nreference_sha=%s\n' c0938a3f84768474df91713f7b372f9d7f8fe96a 97b9938391f156dc332f6a56ac6fe3d21d9f9dc7 7581ca9be8cf87d253918b8abb3b8ebe728c2093 >> .diagnostic-route/evidence/identity.txt
      - uses: actions/setup-node@v4
