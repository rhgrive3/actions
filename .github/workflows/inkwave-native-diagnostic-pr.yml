      - name: Build complete immutable production source exactly once
        working-directory: work/source
        run: node scripts/build-inkwave.mjs inkwave-public ../site
      - name: Derive and verify historical visual-only overlay from actual new build
        run: node scripts/prepare-inkwave-wiper-current-overlay.mjs work/source work/site work/overlay
      - name: Capture only the first live full-frame views before long capture
        run: |
          for variant in A B; do
            timeout 20m node scripts/check-inkwave-wiper-plane-native.mjs work/site work/source work/overlay work/visibility/$variant $variant s3-saber-heavy charged --visibility-probe
          done
          node scripts/check-inkwave-wiper-visibility-pair.mjs work/site work/source work/overlay work/visibility
      - name: Capture continuous Dental pilot only after strict visibility admission
