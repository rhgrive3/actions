      - name: Preserve fresh receipts and original full frames including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiper-current-c0938a3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/site/inkwave-build.json
            work/overlay/
            work/visibility/
            work/full/
            work/controls/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve route identity separately from native source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
