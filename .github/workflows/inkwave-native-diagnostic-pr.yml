          git rev-parse HEAD > .built-site/_site-source-sha.txt
          test "$(cat .built-site/_site-source-sha.txt)" = "$SOURCE_SHA"
      - name: Verify emitted wall production contract
        run: INKWAVE_BUILT_SITE=.built-site/_site node --experimental-vm-modules --test patches/splatoon3/tests/wall-render-production-contract.test.mjs
      - name: Verify full native wall rendering and GPU disposal
        run: node scripts/check-inkwave-wall-render.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/wall" --profile-dir "$CI_STORAGE/cache/wall" --exact-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
