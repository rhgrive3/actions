name: INKWAVE swim owner entry native QA
on:
  pull_request:
    paths:
      - 'inkwave-public/src/game/actor.js'
      - 'inkwave-public/src/game/character-geo.js'
      - 'inkwave-public/src/game/character-mats.js'
      - 'inkwave-public/src/game/character.js'
      - 'inkwave-public/src/game/motion/source-controller.js'
      - 'inkwave-public/src/game/motion/squid-rig.js'
      - 'inkwave-public/src/game/physics.js'
      - 'inkwave-public/src/game/player.js'
      - 'inkwave-public/src/world/level.js'
      - 'patches/loading-cache/vendor/acorn.mjs'
      - 'patches/local-quality/s3-squid-look-adapter.mjs'
      - 'patches/local-quality/squid-form-ease-adapter.mjs'
      - 'patches/local-quality/squid-motion-binding-adapter.mjs'
      - 'patches/splatoon3/runtime/install.mjs'
      - 'scripts/build-inkwave.mjs'
      - 'scripts/check-inkwave-startup-budget.mjs'
      - 'scripts/inkwave-source-composition.mjs'
      - 'scripts/tests/inkwave-workflow-inputs.test.mjs'
      - 'tools/squid-production-qa/lighting.mjs'
      - 'tools/swim-entry-qa/reference.mjs'
      - 'tools/swim-entry-qa/run.mjs'
      - 'tools/swim-entry-qa/three-contract.mjs'
      - 'patches/splatoon3/tests/source-loaded-actor-fixture.mjs'
      - patches/splatoon3/runtime/swim-motion.mjs
      - patches/splatoon3/tests/swim-motion.test.mjs
      - tools/swim-entry-qa/**
      - .github/workflows/inkwave-swim-entry-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swim-entry-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare-swim-entry:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify direct QA input trigger coverage
        run: node --test scripts/tests/inkwave-workflow-inputs.test.mjs
      - name: Install existing native QA tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps --only-shell chromium
      - name: Verify existing native swim contracts
        run: node --experimental-vm-modules --test patches/splatoon3/tests/swim-motion.test.mjs
      - name: Verify normal input and native QA contracts
        run: node --experimental-vm-modules --test --test-concurrency=1 tools/swim-entry-qa/probe.test.mjs tools/swim-entry-qa/compare.test.mjs tools/swim-entry-qa/workflow.test.mjs tools/swim-entry-qa/three-contract.test.mjs tools/swim-entry-qa/reference.test.mjs
      - name: Checkout same-head counterfactual reference without history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          path: _swim_entry_reference
      - name: Prepare, build and capture the named counterfactual
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C _swim_entry_reference rev-parse HEAD)" = "$SOURCE_SHA"
          node tools/swim-entry-qa/reference.mjs _swim_entry_reference "$SOURCE_SHA" .qa-evidence/swim-entry-reference.json
          cd _swim_entry_reference
          node scripts/build-inkwave.mjs inkwave-public _site
          node ../tools/swim-entry-qa/run.mjs --site _site --out ../.qa-evidence/swim-entry-baseline --expect baseline --reference-proof ../.qa-evidence/swim-entry-reference.json
      - name: Build and capture exact candidate
        run: |
          node scripts/build-inkwave.mjs inkwave-public _site
          node scripts/check-inkwave-startup-budget.mjs _site
          INKWAVE_BUILT_SITE="$PWD/_site" node --experimental-vm-modules --test --test-concurrency=1 tools/swim-entry-qa/probe.test.mjs tools/swim-entry-qa/compare.test.mjs tools/swim-entry-qa/workflow.test.mjs tools/swim-entry-qa/three-contract.test.mjs tools/swim-entry-qa/reference.test.mjs
          node tools/swim-entry-qa/run.mjs --site _site --out .qa-evidence/swim-entry-candidate --expect candidate
      - name: Verify matched camera, light, inputs, source phase and preserved shape
        run: node tools/swim-entry-qa/compare.mjs .qa-evidence/swim-entry-baseline/result.json .qa-evidence/swim-entry-candidate/result.json "$SOURCE_SHA" .qa-evidence/swim-entry-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swim-entry-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .qa-evidence/swim-entry-baseline/**
            .qa-evidence/swim-entry-candidate/**
            .qa-evidence/swim-entry-comparison.json
            .qa-evidence/swim-entry-reference.json
            _swim_entry_reference/_site/inkwave-build.json
            _site/inkwave-build.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
