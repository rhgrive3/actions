name: Fetch INKWAVE update CSS
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-inkwave-aah-css.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch updated CSS
        run: |
          set -euo pipefail
          mkdir -p inkwave-aah-fast/styles
          curl -fL --retry 2 --connect-timeout 10 https://inkwave-aah.pages.dev/styles/ui.css -o inkwave-aah-fast/styles/ui.css
          curl -fL --retry 2 --connect-timeout 10 https://inkwave-aah.pages.dev/styles/hud.css -o inkwave-aah-fast/styles/hud.css
          test -s inkwave-aah-fast/styles/ui.css
          test -s inkwave-aah-fast/styles/hud.css
          wc -c inkwave-aah-fast/styles/ui.css inkwave-aah-fast/styles/hud.css
      - name: Commit CSS snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inkwave-aah-fast/styles
          git commit -m "Snapshot updated INKWAVE styles" || exit 0
          git push
