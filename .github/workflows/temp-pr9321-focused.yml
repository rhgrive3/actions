name: Temporary PR9321 focused validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-pr9321-focused.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: 84cd5687b8555f4f71d7a67783928fcea264ea47
          path: target
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conditional region producer
        working-directory: target
        run: timeout 60s node --test tests/phase8/provenance/conditional-region-producer.test.mjs
      - name: Switch render
        working-directory: target
        run: timeout 60s node --test tests/phase8/provenance/switch-render.test.mjs
