name: INKWAVE isolated next reticle visual review

on:
  push:
    branches: ['improve/inkwave-weapon-reticles-20261025']
    paths: ['diagnostics/inkwave-reticle-next-visuals.trigger.json']

permissions:
  contents: read

concurrency:
  group: inkwave-reticle-next-visual-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reticle-browser-review:
    if: github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/improve/inkwave-weapon-reticles-20261025'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite: [next-shapes, next-dualies, next-bamboo, next-pencil]
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ github.sha }}
      BASELINE_SHA: e0072a749df0ec8c2d368e383bdf337baa7b44ad
      EVIDENCE: .qa-evidence/reticle-next-visual-review/${{ matrix.suite }}
      CAPTURE_SUITE: ${{ matrix.suite }}
      CAPTURE_RENDER_HZ: ${{ matrix.suite == 'next-dualies' && '60' || '30' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Pin and validate this isolated trigger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git show -s --format=fuller HEAD > "$EVIDENCE/candidate-commit.txt"
          cp diagnostics/inkwave-reticle-next-visuals.trigger.json "$EVIDENCE/trigger.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const trigger=JSON.parse(fs.readFileSync('diagnostics/inkwave-reticle-next-visuals.trigger.json'));
          assert.equal(trigger.schema,1);
          assert.equal(trigger.baselineSha,process.env.BASELINE_SHA);
          assert.equal(trigger.state,'run');
          assert.equal(trigger.scope,'reticle-next-visual-review');
          assert.equal(trigger.captureProtocol,'chromium-owned-next-native60-mixedrender-v1');
          assert.deepEqual(trigger.suites,['next-shapes','next-dualies','next-bamboo','next-pencil']);
          assert.equal(trigger.viewport,'desktop');assert.equal(trigger.renderPolicy,'native60-render30-dualies60');
          assert.equal(trigger.fullAcceptance,false);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned isolated browser toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1 2>&1 | tee "$EVIDENCE/install.log"
          sudo python3 scripts/prepare-inkwave-ci-apt.py
          npx playwright install --with-deps chromium 2>&1 | tee "$EVIDENCE/browser-install.log"
      - name: Verify runner and focused reticle contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/tests/inkwave-reticle-visual-review.test.mjs scripts/tests/inkwave-reticle-next-visual-review.test.mjs scripts/tests/reticle-next-charger-recipe.test.mjs scripts/tests/reticle-next-dualies-recipe.test.mjs scripts/tests/reticle-native-input-admission.test.mjs patches/local-quality/tests/next-reticle-owners.test.mjs patches/local-quality/tests/weapon-reticle-presentation.test.mjs patches/local-quality/tests/weapon-reticle-geometry.test.mjs patches/local-quality/tests/weapon-reticle-installer.test.mjs patches/local-quality/tests/weapon-reticle-composition.test.mjs patches/local-quality/tests/splatling-reticle-corners.test.mjs 2>&1 | tee "$EVIDENCE/focused-tests.log"
      - name: Check out immutable main comparison
        uses: actions/checkout@v4
        with:
          ref: e0072a749df0ec8c2d368e383bdf337baa7b44ad
          fetch-depth: 1
          path: .reticle-baseline
          persist-credentials: false
      - name: Verify full current-main reticle compiler and unchanged gameplay owners
        env:
          INKWAVE_RETICLE_BASELINE_ROOT: ${{ github.workspace }}/.reticle-baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .reticle-baseline rev-parse HEAD)" = "$BASELINE_SHA"
          node --test patches/local-quality/tests/weapon-reticle-composition-current-main.test.mjs 2>&1 | tee "$EVIDENCE/current-main-composition-tests.log"
      - name: Build exact production baseline and candidate
        id: production-build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C .reticle-baseline rev-parse HEAD)" = "$BASELINE_SHA"
          git -C .reticle-baseline show -s --format=fuller HEAD > "$EVIDENCE/baseline-commit.txt"
          ln -s "$GITHUB_WORKSPACE/node_modules" .reticle-baseline/node_modules
          (cd .reticle-baseline && node scripts/build-inkwave.mjs inkwave-public "$RUNNER_TEMP/reticle-baseline-site") 2>&1 | tee "$EVIDENCE/baseline-build.log"
          node scripts/build-inkwave.mjs inkwave-public "$RUNNER_TEMP/reticle-candidate-site" 2>&1 | tee "$EVIDENCE/candidate-build.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const expected={baseline:'83772a6fa910e158b9f1b139d6c187a840b73ec24cd7be043a7bf556530ed898',candidate:'d8c9728a31eaf5a01015527cec272e677557f1ff4a6a646fa4fbd5e6cfc22aaf'};
          const actual={};
          for(const head of ['baseline','candidate']){
            const build=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/reticle-'+head+'-site/inkwave-build.json'));
            actual[head]={contentHash:build.contentHash,inputHash:build.inputHash,revision:build.build?.revision};
            assert.equal(build.contentHash,expected[head],'harness-only retry must preserve production '+head+' bytes');
          }
          fs.writeFileSync(process.env.EVIDENCE+'/content-hash-preservation.json',JSON.stringify({priorRun:40251760390,expected,actual},null,2));
          NODE
      - name: Capture actual baseline game and production HUD
        id: baseline-capture
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          printf 'owned GNU-timeout child group; child TERM at700s; KILL after15s; outer step720s; suite=%s\n' "$CAPTURE_SUITE" > "$EVIDENCE/supervision.txt"
          SOURCE_SHA="$BASELINE_SHA" timeout --signal=TERM --kill-after=15s 700s node scripts/check-inkwave-reticle-visual-review.mjs "$RUNNER_TEMP/reticle-baseline-site" "$EVIDENCE/baseline" --before --suite="$CAPTURE_SUITE" --viewport=desktop --render-hz="$CAPTURE_RENDER_HZ" 2>&1 | tee "$EVIDENCE/baseline-capture.log"
      - name: Require owned baseline browser exit before candidate
        id: baseline-cleanup
        if: always() && steps.production-build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const c=JSON.parse(fs.readFileSync(process.env.EVIDENCE+'/baseline/cleanup.json'));
          assert.equal(c.status,'closed');assert.equal(c.exited,true);
          assert(c.browserPid>0&&c.ownerNodePid>0&&c.startedAt&&c.finishedAt);
          console.log('Owned baseline browser exit verified',JSON.stringify(c));
          NODE
      - name: Capture actual candidate game and assert installed DOM/state
        if: always() && steps.production-build.outcome == 'success' && steps.baseline-cleanup.outcome == 'success'
        id: candidate-capture
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          timeout --signal=TERM --kill-after=15s 700s node scripts/check-inkwave-reticle-visual-review.mjs "$RUNNER_TEMP/reticle-candidate-site" "$EVIDENCE/candidate" --suite="$CAPTURE_SUITE" --viewport=desktop --render-hz="$CAPTURE_RENDER_HZ" 2>&1 | tee "$EVIDENCE/candidate-capture.log"
      - name: Verify owned candidate browser exit
        if: always() && steps.candidate-capture.outcome != 'skipped' && steps.production-build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const c=JSON.parse(fs.readFileSync(process.env.EVIDENCE+'/candidate/cleanup.json'));
          assert.equal(c.status,'closed');assert.equal(c.exited,true);assert(c.finishedAt);
          console.log('Owned candidate browser exit verified',JSON.stringify(c));
          NODE
      - name: State narrow result, not full CI or retail equivalence
        if: always() && steps.baseline-capture.outcome == 'success' && steps.candidate-capture.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const root=process.env.EVIDENCE;
          const before=JSON.parse(fs.readFileSync(root+'/baseline/receipt.json'));
          const after=JSON.parse(fs.readFileSync(root+'/candidate/receipt.json'));
          assert.equal(before.status,'baseline-recorded');assert.equal(after.status,'passed');
          assert.equal(before.sourceSha,process.env.BASELINE_SHA);assert.equal(after.sourceSha,process.env.SOURCE_SHA);
          const {captureMatrix,expectedNextStates,assertMatchedProjection}=await import('./scripts/check-inkwave-reticle-visual-review.mjs');
          const matrix=captureMatrix(['--suite='+process.env.CAPTURE_SUITE,'--viewport=desktop','--render-hz='+process.env.CAPTURE_RENDER_HZ]);
          const expected=matrix.screenshotStateCount;
          assert(expected);assert.equal(after.coverage.suite,process.env.CAPTURE_SUITE);
          assert.equal(after.coverage.expectedScreenshotStates,expected);
          assert.deepEqual(before.coverage.actualWeapons,after.coverage.actualWeapons);
          assert.equal(before.scenarios.length,after.scenarios.length);
          assert.deepEqual(after.coverage.actualWeapons,matrix.cases.map(c=>c.id));
          assert.equal(after.captureProtocol.physicsHz,60);assert.equal(after.captureProtocol.baseRenderHz,Number(process.env.CAPTURE_RENDER_HZ));
          const pairs=after.scenarios.filter(s=>s.files).map(s=>{
            const other=before.scenarios.find(b=>b.viewportName===s.viewportName&&b.weaponId===s.weaponId&&b.phase===s.phase);
            assert(other?.files);assertMatchedProjection(other,s);return {viewport:s.viewportName,weaponId:s.weaponId,phase:s.phase,before:other.files,after:s.files};
          });
          assert.equal(pairs.length,expected);
          assert.deepEqual(after.coverage.actualCapturedWeapons,[...new Set(expectedNextStates(process.env.CAPTURE_SUITE).map(s=>s.weaponId))]);
          fs.writeFileSync(root+'/comparison-index.json',JSON.stringify({baselineSha:before.sourceSha,candidateSha:after.sourceSha,baselineContentHash:before.contentHash,candidateContentHash:after.contentHash,coverage:after.coverage,pairs,retailParity:'unverified',fullAcceptance:false},null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Narrow desktop suite ${process.env.CAPTURE_SUITE}: ${expected} paired states/head at1280×720 DPR1. Exact immutable baseline e0072a749df0ec8c2d368e383bdf337baa7b44ad; native input recipes and read-only observations with native60Hz physics and ${process.env.CAPTURE_RENDER_HZ}Hz rendering. No mobile acceptance, full CI, retail parity or independent image review is certified by this workflow. Original Brella/Nautilus/Ballpoint mixed-cadence protocol remains separate.\n`);
          NODE
      - name: Preserve screenshots, hidden diagnostics, logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reticle-next-visual-review-${{ github.sha }}-${{ matrix.suite }}
          path: .qa-evidence/reticle-next-visual-review/${{ matrix.suite }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

