name: INKWAVE Quad and Explosher model review
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - patches/splatoon3/runtime/weapon-models/dualies.mjs
      - patches/splatoon3/runtime/weapon-models/sloshers.mjs
      - patches/splatoon3/tests/weapon-models-quad-explosher.test.mjs
      - patches/splatoon3/tests/fixtures/quad-explosher-main-contracts.json
      - scripts/render-inkwave-quad-explosher-gallery.mjs
      - scripts/compare-inkwave-quad-explosher-gallery.py
      - scripts/snapshot-quad-explosher.mjs
      - .github/workflows/inkwave-quad-explosher-models.yml
permissions:
  contents: read
concurrency:
  group: quad-explosher-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.head_ref == 'feat/inkwave-quad-explosher-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ee9fbbab5883f20d1968e36a4b6b2faeb1f748fe
          path: .model-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fe242d9bf10154ad7d14aeac9bb9d1a245c91474
          path: .model-sixth-source
          sparse-checkout-cone-mode: false
          sparse-checkout: patches/splatoon3/runtime/weapon-models/sloshers.mjs
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 5ed08c6376696dd67391afed7c36463106959de8
          path: .model-prelod-source
          sparse-checkout-cone-mode: false
          sparse-checkout: /inkwave-public/src/game/character-lod.js
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
          npx playwright install --with-deps chromium
          python3 -m pip install Pillow
      - name: Build immutable baseline and candidate production compositions
        run: |
          git rev-parse HEAD
          export ESBUILD_MODULE="$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js"
          node .model-baseline/scripts/build-inkwave.mjs .model-baseline/inkwave-public .model-before-site
          node scripts/build-inkwave.mjs inkwave-public .model-after-site
      - name: Build fixed-main sixth-draft Explosher angle control
        run: |
          model=patches/splatoon3/runtime/weapon-models/sloshers.mjs
          original="$RUNNER_TEMP/quad-explosher-candidate-sloshers.mjs"
          cp "$model" "$original"
          original_sha=$(git hash-object "$model")
          trap 'cp "$original" "$model"' EXIT
          cp ".model-sixth-source/$model" "$model"
          test "$(git hash-object "$model")" = a56f3427b12f4048ec226b126dd014977d954209
          ESBUILD_MODULE="$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js" node scripts/build-inkwave.mjs inkwave-public .model-sixth-angle-site
          cp "$original" "$model"
          test "$(git hash-object "$model")" = "$original_sha"
          trap - EXIT
      - name: Snapshot exact before geometry on the same runtime
        env:
          INKWAVE_BUILT_SITE: .model-before-site
        run: |
          node --experimental-vm-modules scripts/snapshot-quad-explosher.mjs --out .quad-baseline-contracts.json
          MODEL_SNAPSHOT_REVERSE=1 node --experimental-vm-modules scripts/snapshot-quad-explosher.mjs --out .quad-baseline-reverse.json
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const a=JSON.parse(fs.readFileSync('.quad-baseline-contracts.json')),b=JSON.parse(fs.readFileSync('.quad-baseline-reverse.json'));
          for(const id of Object.keys(a))assert.equal(a[id].geometryHash,b[id].geometryHash,id+' independent generation order');
          console.log('QUAD_EXPLOSHER_BASELINE_ORDER_STABLE');
          JS
      - name: Verify emitted models, real Actors, and preserved gameplay contracts
        env:
          INKWAVE_BUILT_SITE: .model-after-site
          QUAD_EXPLOSHER_BASELINE: .quad-baseline-contracts.json
          WEAPON_IDS: s3-maneuver-stepper,s3-slosher-washtub
        run: node --experimental-vm-modules --test patches/splatoon3/tests/weapon-models-quad-explosher.test.mjs patches/splatoon3/tests/weapon-models-all.test.mjs
      - name: Verify all-65 material boundaries under the merged LOD implementation
        env:
          INKWAVE_BUILT_SITE: .model-after-site
        run: |
          cp .model-prelod-source/inkwave-public/src/game/character-lod.js .quad-pre-boundary-lod.js
          WEAPON_LOD_BASELINE="$GITHUB_WORKSPACE/.quad-pre-boundary-lod.js" WEAPON_LOD_CANDIDATE="$GITHUB_WORKSPACE/.model-after-site/src/game/character-lod.js" WEAPON_LOD_REPORT="$GITHUB_WORKSPACE/.quad-lod-boundaries.json" node --experimental-vm-modules --test patches/splatoon3/tests/weapon-lod-boundaries.test.mjs
      - name: Same-camera before and after, full source motion, actual Actors
        run: |
          node scripts/render-inkwave-quad-explosher-gallery.mjs --site .model-before-site --out .model-evidence/before --ids s3-maneuver-stepper,s3-slosher-washtub --size 500
          node scripts/render-inkwave-quad-explosher-gallery.mjs --site .model-after-site --out .model-evidence/after --ids s3-maneuver-stepper,s3-slosher-washtub --size 500
          python3 scripts/compare-inkwave-quad-explosher-gallery.py .model-evidence reports/inkwave-weapon-model-workspace/refs s3-maneuver-stepper s3-slosher-washtub
      - name: Native day IBL and Neutral tone mapping, paired reference cameras
        run: |
          for version in before after; do
            node scripts/render-inkwave-quad-explosher-gallery.mjs --site ".model-${version}-site" --out ".model-evidence/productionDay/${version}" --ids s3-maneuver-stepper,s3-slosher-washtub --size 500 --environment productionDay
          done
          python3 scripts/compare-inkwave-quad-explosher-gallery.py .model-evidence/productionDay reports/inkwave-weapon-model-workspace/refs s3-maneuver-stepper s3-slosher-washtub
      - name: Corrected-camera sixth-draft versus candidate Explosher four-view control
        run: |
          mkdir -p .model-angle-control/studio .model-angle-control/productionDay
          cp -al .model-evidence/after .model-angle-control/studio/after
          cp -al .model-evidence/productionDay/after .model-angle-control/productionDay/after
          node scripts/render-inkwave-quad-explosher-gallery.mjs --site .model-sixth-angle-site --out .model-angle-control/studio/before --ids s3-slosher-washtub --size 500
          node scripts/render-inkwave-quad-explosher-gallery.mjs --site .model-sixth-angle-site --out .model-angle-control/productionDay/before --ids s3-slosher-washtub --size 500 --environment productionDay
          # The source copy is hardlinked: replace JSON atomically, never mutate the original evidence inode.
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const ids=new Set(['s3-maneuver-stepper','s3-slosher-washtub']);
          for(const light of ['studio','productionDay']){
            const p=`.model-angle-control/${light}/after/gallery.json`,data=JSON.parse(fs.readFileSync(p));
            const actual=data.rows.map(r=>r.id);
            if(actual.length!==ids.size||new Set(actual).size!==ids.size||actual.some(id=>!ids.has(id)))throw Error('Unexpected source model ID set '+actual);
            data.rows=data.rows.filter(r=>r.id==='s3-slosher-washtub');
            fs.writeFileSync(p+'.tmp',JSON.stringify(data,null,2));fs.renameSync(p+'.tmp',p);
          }
          JS
          for light in studio productionDay; do
            python3 scripts/compare-inkwave-quad-explosher-gallery.py ".model-angle-control/$light" reports/inkwave-weapon-model-workspace/refs s3-slosher-washtub
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quad-explosher-visual-${{ github.event.pull_request.head.sha }}
          path: |
            .model-evidence
            .model-angle-control
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Eight-Actor mixed-model gameplay and far LOD ABBA on one runner
        run: |
          for pair in before-A after-B after-B2 before-A2; do
            version="${pair%%-*}"
            node scripts/render-inkwave-quad-explosher-gallery.mjs --site ".model-${version}-site" --out ".model-crowd/${pair}" --ids s3-maneuver-stepper --size 600 --crowd
          done
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const all={};for(const name of['before-A','after-B','after-B2','before-A2']){const data=JSON.parse(fs.readFileSync('.model-crowd/'+name+'/gallery.json'));if(data.errors.length)throw Error(data.errors.join('\n'));all[name]=data.rows[0].crowd;}
          for(const tier of['game','far'])for(const name of['after-B','after-B2']){
            if(all[name][tier].actors!==8||new Set(all[name][tier].ids).size!==4)throw Error('Incomplete mixed-model crowd');
            // Model reconstruction can batch six formerly separate material draws.
            // Enforce a nonempty real 8-Actor render and reject *more* draws, not fewer.
            const observed=all[name][tier], baseline=all['before-A'][tier], baseline2=all['before-A2'][tier];
            if(!Number.isSafeInteger(observed.drawCalls)||observed.drawCalls<1
              ||observed.drawCalls>Math.min(baseline.drawCalls,baseline2.drawCalls))throw Error('Draw-call increase '+tier);
            if(!Number.isFinite(observed.triangles)||observed.triangles<=0)throw Error('Empty crowd geometry '+tier);
            for(const key of ['animationMs','renderSubmitMs','renderCompleteMs']) {
              if(!Array.isArray(observed.rawSamples?.[key])||observed.rawSamples[key].length<2
                ||observed.rawSamples[key].some(v=>!Number.isFinite(v)))throw Error('Invalid crowd timings '+tier+':'+key);
            }
          }
          fs.writeFileSync('.model-crowd/comparison.json',JSON.stringify(all,null,2));console.log('QUAD_EXPLOSHER_ABBA '+JSON.stringify(all));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quad-explosher-review-${{ github.event.pull_request.head.sha }}
          path: |
            .model-evidence
            .model-crowd
            .model-angle-control
            .quad-baseline-contracts.json
            .quad-baseline-reverse.json
            .quad-lod-boundaries.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
