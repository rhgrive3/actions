name: INKWAVE Quad and Explosher model review
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - patches/splatoon3/runtime/weapon-models/dualies.mjs
      - patches/splatoon3/runtime/weapon-models/sloshers.mjs
      - patches/splatoon3/tests/weapon-models-quad-explosher.test.mjs
      - patches/splatoon3/tests/fixtures/quad-explosher-main-contracts.json
      - scripts/render-inkwave-quad-explosher-gallery.mjs
      - scripts/compare-inkwave-quad-explosher-gallery.py
      - .github/workflows/inkwave-quad-explosher-models.yml
permissions:
  contents: read
concurrency:
  group: quad-explosher-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.head_ref == 'feat/inkwave-quad-explosher-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b078c37907351f1bbc13d0e7d4b5cbeb0a330009
          path: .model-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
          npx playwright install --with-deps chromium
          python3 -m pip install Pillow
      - name: Build immutable baseline and candidate production compositions
        run: |
          git rev-parse HEAD
          export ESBUILD_MODULE="$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js"
          node .model-baseline/scripts/build-inkwave.mjs .model-baseline/inkwave-public .model-before-site
          node scripts/build-inkwave.mjs inkwave-public .model-after-site
      - name: Verify emitted models, real Actors, and preserved gameplay contracts
        env:
          INKWAVE_BUILT_SITE: .model-after-site
          WEAPON_IDS: s3-maneuver-stepper,s3-slosher-washtub
        run: node --experimental-vm-modules --test patches/splatoon3/tests/weapon-models-quad-explosher.test.mjs patches/splatoon3/tests/weapon-models-all.test.mjs
      - name: Same-camera before and after, full source motion, actual Actors
        run: |
          node scripts/render-inkwave-quad-explosher-gallery.mjs --site .model-before-site --out .model-evidence/before --ids s3-maneuver-stepper,s3-slosher-washtub --size 500
          node scripts/render-inkwave-quad-explosher-gallery.mjs --site .model-after-site --out .model-evidence/after --ids s3-maneuver-stepper,s3-slosher-washtub --size 500
          python3 scripts/compare-inkwave-quad-explosher-gallery.py .model-evidence reports/inkwave-weapon-model-workspace/refs s3-maneuver-stepper s3-slosher-washtub
      - name: Eight-Actor mixed-model gameplay and far LOD ABBA on one runner
        run: |
          for pair in before-A after-B after-B2 before-A2; do
            version="${pair%%-*}"
            node scripts/render-inkwave-quad-explosher-gallery.mjs --site ".model-${version}-site" --out ".model-crowd/${pair}" --ids s3-maneuver-stepper --size 600 --crowd
          done
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const all={};for(const name of['before-A','after-B','after-B2','before-A2']){const data=JSON.parse(fs.readFileSync('.model-crowd/'+name+'/gallery.json'));if(data.errors.length)throw Error(data.errors.join('\n'));all[name]=data.rows[0].crowd;}
          for(const tier of['game','far'])for(const name of['after-B','after-B2']){
            if(all[name][tier].actors!==8||new Set(all[name][tier].ids).size!==4)throw Error('Incomplete mixed-model crowd');
            if(all[name][tier].drawCalls!==all['before-A'][tier].drawCalls)throw Error('Draw-call regression '+tier);
          }
          fs.writeFileSync('.model-crowd/comparison.json',JSON.stringify(all,null,2));console.log('QUAD_EXPLOSHER_ABBA '+JSON.stringify(all));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quad-explosher-review-${{ github.event.pull_request.head.sha }}
          path: |
            .model-evidence
            .model-crowd
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
