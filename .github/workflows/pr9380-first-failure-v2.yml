name: PR9380 first-failure v2

on:
  push:
    paths:
      - ".github/workflows/pr9380-first-failure-v2.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: e3238d4fb7fe6a03427efaeeebba79ec118aa44b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture focused failure
        shell: bash
        run: |
          set +e
          mkdir -p evidence
          timeout 2m node --test tests/phase8/cxx-object-decompiler-projection.test.mjs > evidence/test.tap 2>&1
          printf '%s\n' "$?" > evidence/status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr9380-first-failure-v2
          path: evidence/*
          retention-days: 2
