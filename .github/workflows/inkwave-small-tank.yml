name: INKWAVE narrow HUD tank regression
on:
  pull_request:
    paths:
      - 'inkwave-public/src/ui/hud.js'
      - 'inkwave-public/styles/hud.css'
      - 'inkwave-public/styles/ui.css'
      - 'inkwave-public/styles/mobile.css'
      - 'scripts/inkwave-source-composition.mjs'
      - 'scripts/build-inkwave.mjs'
      - 'patches/local-quality/adapter.mjs'
      - 'patches/local-quality/s3-hud-look-adapter.mjs'
      - 'patches/local-quality/tests/hud-tank-small-viewport.test.mjs'
      - 'scripts/check-inkwave-small-tank.mjs'
      - '.github/workflows/inkwave-small-tank.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ink-small-tank-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Negative control, normal geometry parity and resize regression
        run: node --test patches/local-quality/tests/hud-tank-small-viewport.test.mjs patches/local-quality/tests/s3-hud-look.test.mjs
      - run: node scripts/build-inkwave.mjs inkwave-public .ci-scratch/small-tank-site
      - name: Real Chromium small startup and resize at DPR 1 and 2
        run: node scripts/check-inkwave-small-tank.mjs .ci-scratch/small-tank-site .ci-scratch/small-tank-chromium
      - name: Real WebKit touch small startup and resize at DPR 1 and 2
        run: node scripts/check-inkwave-small-tank.mjs .ci-scratch/small-tank-site .ci-scratch/small-tank-webkit --webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: small-tank-browser-evidence
          path: |
            .ci-scratch/small-tank-chromium
            .ci-scratch/small-tank-webkit
