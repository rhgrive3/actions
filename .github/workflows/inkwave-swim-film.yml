name: INKWAVE swim film regression
on:
  pull_request:
    paths:
      - 'patches/splatoon3/tests/fixture-cache.mjs'
      - 'patches/splatoon3/tests/source-fixture.mjs'
      - 'patches/splatoon3/tests/source-loaded-actor-fixture.mjs'
      - 'scripts/inkwave-source-composition.mjs'
      - 'scripts/tests/inkwave-workflow-inputs.test.mjs'
      - 'inkwave-public/src/fx/fx.js'
      - 'patches/local-quality/swim-surface.mjs'
      - 'patches/local-quality/swim-splash-adapter.mjs'
      - 'patches/local-quality/tests/swim-presentation.test.mjs'
      - 'patches/local-quality/tests/swim-surface-fps.test.mjs'
      - 'patches/local-quality/tests/swim-film-offscreen.test.mjs'
      - '.github/workflows/inkwave-swim-film.yml'
  workflow_dispatch:
    inputs:
      main91_blast_capture:
        description: Independent pinned main91 blast and native-roll comparison capture
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ink-swim-film-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tools/inkwave-modeler/blender/
            !/tools/inkwave-modeler/docs/
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify direct QA input trigger coverage
        run: node --test scripts/tests/inkwave-workflow-inputs.test.mjs
      - name: Film presentation, frame-rate parity and off-screen shape parity
        run: node --experimental-vm-modules --test patches/local-quality/tests/swim-presentation.test.mjs patches/local-quality/tests/swim-surface-fps.test.mjs patches/local-quality/tests/swim-film-offscreen.test.mjs

  main91_blast_reference:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.main91_blast_capture == true) || (github.event_name == 'pull_request' && github.repository == 'rhgrive3/actions' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/main91-blast-reference-20261030' && github.event.pull_request.base.ref == 'main') }}
    runs-on: ubuntu-22.04
    env:
      EXPECTED_QA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 30
    steps:
      - name: Checkout only the reviewed QA scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: qa
          persist-credentials: false
          sparse-checkout: tools/blast-main91-qa
      - name: Checkout immutable production baseline separately
        uses: actions/checkout@v4
        with:
          ref: 0cc5ce3712f93c275095d36c1f35ffdbd8565e2e
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked production QA dependencies
        working-directory: source
        run: npm ci
      - name: Install matching Playwright Chromium and supported system dependencies
        working-directory: source
        run: npx --no-install playwright install --with-deps chromium
      - name: Require unchanged standard sandbox launcher with no executable override
        working-directory: source
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {createRequire} from 'node:module';
          import {sandboxBrowserOptions,launchSandboxBrowser} from './scripts/lib/inkwave-sandbox-browser.mjs';
          assert.ok(!process.env.CHROMIUM_EXECUTABLE_PATH,'system Chrome/custom executable override is forbidden for this capture');
          const options=sandboxBrowserOptions(process.env);
          assert.equal(options.chromiumSandbox,true);
          assert.equal('executablePath' in options,false);
          assert.deepEqual(options.args,['--disable-dev-shm-usage','--use-angle=swiftshader','--enable-unsafe-swiftshader']);
          assert.ok(!options.args.some(a=>/^--(?:no-sandbox|disable-setuid-sandbox|disable-namespace-sandbox|disable-seccomp-filter-sandbox)/.test(a)));
          let attempts=0;
          await assert.rejects(launchSandboxBrowser({launch:async got=>{attempts++;assert.deepEqual(got,options);throw Error('sentinel sandbox launch failure');}}),/sentinel sandbox launch failure/);
          assert.equal(attempts,1,'failed launch must not retry insecurely');
          const require=createRequire(import.meta.url),{chromium}=require('playwright');
          const executable=chromium.executablePath();
          assert.ok(!executable.startsWith('/opt/google/chrome/'));
          const stat=fs.statSync(executable);
          fs.mkdirSync(process.env.RUNNER_TEMP+'/blast-artifacts',{recursive:true});
          fs.writeFileSync(process.env.RUNNER_TEMP+'/blast-artifacts/standard-launcher.json',JSON.stringify({checkedAt:new Date().toISOString(),options,advertisedBrowserExecutable:executable,executableObservationScope:'Playwright advertised full-browser executable; default headless launch may select its matching headless shell',mode:(stat.mode&0o7777).toString(8),playwrightVersion:require('playwright/package.json').version,launcherSHA256:createHash('sha256').update(fs.readFileSync('scripts/lib/inkwave-sandbox-browser.mjs')).digest('hex'),runnerImageOS:process.env.ImageOS,runnerImageVersion:process.env.ImageVersion,negativeTestAttempts:attempts,browserLaunchedByPreflight:false},null,2));
          JS
      - name: Record source and QA provenance
        run: |
          mkdir -p "$RUNNER_TEMP/blast-artifacts"
          node qa/tools/blast-main91-qa/verify-blast-artifacts.mjs provenance source qa "$RUNNER_TEMP/blast-artifacts"
      - name: Build clean pinned source and capture with existing sandbox-enabled launcher; wait for native PLAY readiness and retain bounded diagnostics
        run: |
          node qa/tools/blast-main91-qa/run-main91-blast.mjs "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/main91-blast-site" "$RUNNER_TEMP/blast-artifacts"
      - name: Require both complete eight-frame sequences and receipt hashes
        run: node qa/tools/blast-main91-qa/verify-blast-artifacts.mjs verify source qa "$RUNNER_TEMP/blast-artifacts"
      - name: Preserve incomplete receipts on failure; never claim capture success
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main91-blast-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blast-artifacts
          if-no-files-found: error
          retention-days: 7
