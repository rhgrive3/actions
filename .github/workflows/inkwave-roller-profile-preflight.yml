name: INKWAVE Roller stable global RNG numeric preflight
on:
  push:
    branches: ['qa/roller-global-rng-preflight-20261021']
    paths:
      - '.github/workflows/inkwave-roller-profile-preflight.yml'
      - 'scripts/check-inkwave-roller-holding-video.mjs'
      - 'scripts/lib/inkwave-roller-comparison-startup.mjs'
      - 'scripts/tests/inkwave-roller-comparison-startup.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roller-profile-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BEFORE_SHA: 225f1d3042f2bdf9e8cec7e634afa4b8efa4a800
      AFTER_SHA: 8bebf5cf288149d8ff9a16fa181a89ddf063b8a4
      QA_SHA: ${{ github.sha }}
      GRIP_SEED: '1715'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: 225f1d3042f2bdf9e8cec7e634afa4b8efa4a800
          path: work/before-source
      - uses: actions/checkout@v4
        with:
          ref: 8bebf5cf288149d8ff9a16fa181a89ddf063b8a4
          path: work/after-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify literal sources and install existing official tools
        run: |
          test "$(git rev-parse HEAD)" = "$QA_SHA"
          test "$(git -C work/before-source rev-parse HEAD)" = "$BEFORE_SHA"
          test "$(git -C work/after-source rev-parse HEAD)" = "$AFTER_SHA"
          npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_ENV"
          echo "ESBUILD_MODULE=$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js" >> "$GITHUB_ENV"
          mkdir -p work/roller-preflight
          node --check scripts/check-inkwave-roller-holding-video.mjs
          node --test scripts/tests/inkwave-roller-comparison-startup.test.mjs
      - name: Build the two unmodified historical sources
        shell: bash
        run: |
          set -o pipefail
          (cd work/before-source && node scripts/build-inkwave.mjs inkwave-public ../before-site) 2>&1 | tee work/roller-preflight/before-build.log
          (cd work/after-source && node scripts/build-inkwave.mjs inkwave-public ../after-site) 2>&1 | tee work/roller-preflight/after-build.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {verifyRuntimeBuild} from './scripts/lib/inkwave-runtime-evidence.mjs';
          const hash=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const identities={schema:1,qa:process.env.QA_SHA,createdAt:new Date().toISOString(),
            script:hash('scripts/check-inkwave-roller-holding-video.mjs'),
            entryHelper:hash('scripts/lib/inkwave-range-menu-entry.mjs'),
            startupHelper:hash('scripts/lib/inkwave-roller-comparison-startup.mjs'),
            workflow:hash('.github/workflows/inkwave-roller-profile-preflight.yml'),builds:{}};
          for(const side of ['before','after']){
            const sourceSha=process.env[side.toUpperCase()+'_SHA'];
            const manifest=verifyRuntimeBuild(path.resolve('work/'+side+'-site'),path.resolve('work/'+side+'-source'),sourceSha);
            identities.builds[side]={sourceSha,inputHash:manifest.inputHash,contentHash:manifest.contentHash,
              manifestSha256:hash('work/'+side+'-site/inkwave-build.json')};
            fs.copyFileSync('work/'+side+'-site/inkwave-build.json','work/roller-preflight/'+side+'-build.json');
          }
          fs.writeFileSync('work/roller-preflight/identities.json',JSON.stringify(identities,null,2)+'\n');
          NODE
      - name: Observe all native before ticks without image capture
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-inkwave-roller-holding-video.mjs work/before-site work/roller-preflight/before --numeric-only --grip-seed "$GRIP_SEED" 2>&1 | tee work/roller-preflight/before.log
      - name: Validate the original steady camera plan before diagnostic continuation
        id: diagnostic-plan
        if: ${{ !cancelled() && hashFiles('work/roller-preflight/before/grip-cameras.json') != '' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          // BEGIN DIAGNOSTIC CAMERA ADMISSION
          const root='work/roller-preflight',read=p=>JSON.parse(fs.readFileSync(root+'/'+p,'utf8'));
          const source=fs.readFileSync('scripts/check-inkwave-roller-holding-video.mjs','utf8');
          const start=source.indexOf('// BEGIN GRIP CAMERA CONTRACT'),end=source.indexOf('// END GRIP CAMERA CONTRACT');
          assert(start>=0&&end>start);const validate=new Function(source.slice(start,end)+';return validateGripCameras;')();
          const steady=read('before/steady-result.json'),plan=validate(read('before/grip-cameras.json')),ids=read('identities.json');
          assert.equal(steady.passed,true);assert.equal(steady.numericOnly,true);assert.equal(steady.measurement.debugFixedTicks,180);
          assert.equal(steady.build,ids.builds.before.contentHash);assert.deepEqual(plan,steady.measurement.cameraPlan);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'ready=true\n');
          // END DIAGNOSTIC CAMERA ADMISSION
          NODE
      - name: Observe all native after ticks using the same startup profile and camera plan
        if: ${{ !cancelled() && steps.diagnostic-plan.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-inkwave-roller-holding-video.mjs work/after-site work/roller-preflight/after --numeric-only --grip-seed "$GRIP_SEED" --grip-camera-reference work/roller-preflight/before/grip-cameras.json 2>&1 | tee work/roller-preflight/after.log
      - name: Verify all native clocks, startup style, Character RNG and physics
        if: ${{ !cancelled() && hashFiles('work/roller-preflight/identities.json') != '' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import crypto from 'node:crypto';
          const root='work/roller-preflight',hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const read=p=>JSON.parse(fs.readFileSync(path.join(root,p),'utf8')),ids=read('identities.json');
          assert.equal(ids.qa,process.env.QA_SHA);
          for(const [key,file]of [['workflow','.github/workflows/inkwave-roller-profile-preflight.yml'],
            ['script','scripts/check-inkwave-roller-holding-video.mjs'],['entryHelper','scripts/lib/inkwave-range-menu-entry.mjs'],
            ['startupHelper','scripts/lib/inkwave-roller-comparison-startup.mjs']])assert.equal(ids[key],hash(fs.readFileSync(file)));
          const receipts=[],reports=['before','after'].map(side=>{
            const r=read(side+'/result.json'),manifest=read(side+'-build.json'),v=r.video,o=r.characterObserver;
            assert.equal(ids.builds[side].sourceSha,process.env[side.toUpperCase()+'_SHA']);
            assert.equal(ids.builds[side].manifestSha256,hash(fs.readFileSync(path.join(root,side+'-build.json'))));
            assert.equal(manifest.inputHash,hash(JSON.stringify(manifest.files)));
            assert.equal(ids.builds[side].inputHash,manifest.inputHash);assert.equal(ids.builds[side].contentHash,manifest.contentHash);
            assert.notEqual(v.partial,true);assert(r.passed);assert(r.numericOnly);assert.equal(r.errors.length,0);assert.equal(r.build,manifest.contentHash);
            assert.equal(r.measurement.debugFixedTicks,180);assert.equal(v.frames.length,90);assert.equal(v.frameCount,90);
            assert.equal(v.nativeTicksPerSecond,60);assert(v.numericOnly);assert.equal(v.interpolation,false);
            assert.deepEqual(v.views,['right-rear','side']);assert.equal(v.initial.seed,1715);
            assert.equal(r.measurement.initialState.boundary.boot.boundary,'first-native-game-publication');
            assert.deepEqual(r.measurement.initialState.boundary.boot.clocks,r.measurement.initialState.boundary.entryClocks);
            assert.equal(r.measurement.initialState.gameTime,r.measurement.initialState.boundary.boot.clocks.game);
            assert.equal(r.measurement.renderSize.width,960);assert.equal(r.measurement.renderSize.height,630);
            assert(o.restored);assert.equal(o.frames.length,360);assert(o.draws.length>0);assert(o.draws.length<4096);
            assert.equal(o.performanceEvidence,false);assert(o.diagnosticOnly);
            assert.deepEqual(o.initial.style,{hair:0,skin:0,outfit:0,eyes:0,hat:0,brows:0});
            assert.deepEqual(o.initial.teamHex,['#ffd21a','#2a52ff']);assert.equal(o.initial.name,'プレイヤー');
            assert.equal(o.initial.seed,2444336694);assert(o.initial.hairStrands>0);
            for(let i=0;i<360;i++){assert.equal(o.frames[i].index,i);assert.equal(o.frames[i].dt,1/60);}
            const modules=Object.entries(r.servedModules);assert(modules.length>100);
            for(const [rel,actual]of modules){
              const matches=Object.keys(manifest.artifacts).filter(k=>rel===k||rel.endsWith('/'+k)).sort((a,b)=>b.length-a.length);
              assert(matches.length>0,'unbound served module '+rel);assert.equal(actual.sha256,manifest.artifacts[matches[0]],rel);
            }
            const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(dir,e.name)):[path.join(dir,e.name)]);
            assert.equal(walk(path.join(root,side)).filter(p=>/\.(?:png|mp4|webm)$/i.test(p)).length,0,'numeric preflight must not capture images');
            for(let i=0;i<90;i++){
              const f=v.frames[i];assert.equal(f.index,i);assert.equal(f.tick,2*(i+1));assert.equal(f.fire,i<60);
              assert(f.rngRestored);assert(Math.abs(f.state.time-v.initial.state.time-f.tick/60)<1e-8);
              assert.deepEqual(f.renderSize,r.measurement.renderSize);assert.equal(f.images.length,2);assert(f.lighting.lights.length>0);
              if(i<60)assert.equal(f.state.rolling,true);
              for(const image of f.images){assert(!('png' in image));assert(!('path' in image));assert(!('sha256' in image));}
            }
            assert.equal(v.frames[89].state.rolling,false);
            receipts.push({side,resultSha256:hash(fs.readFileSync(path.join(root,side,'result.json'))),
              nativeTicks:o.frames.length,characterDraws:o.draws.length,initial:o.initial,finalBreath:v.frames.at(-1).state.breathPhase});
            return r;
          });
          const [a,b]=reports;
          assert.deepEqual(a.characterObserver,b.characterObserver,'every observed native input, clock, Character RNG draw and physics state');
          for(const r of reports){
            assert(r.globalRandom.originalRestored);assert(r.globalRandom.stableFunctionRetained);
            assert.equal(r.globalRandom.seed,1715);assert.equal(r.globalRandom.performanceEvidence,false);
            assert.deepEqual(r.globalRandom.phases.map(p=>p.label),['startup','steady-180','inspection','movie-180']);
            assert(r.globalRandom.phases[0].nativeFxDrawIndices.length>0,'native FX alias must actually draw during startup');
            for(const p of r.globalRandom.phases){assert(p.draws>0&&p.draws<=200000);assert(p.nativeFxDrawIndices.every((n,i,all)=>Number.isInteger(n)&&n>=0&&n<p.draws&&(i===0||n>all[i-1])));}
          }
          assert.deepEqual(a.globalRandom,b.globalRandom,'startup, native FX caller indices and stable global RNG phases');
          for(const key of ['renderSize','cameraPlan'])assert.deepEqual(a.measurement[key],b.measurement[key],key);
          for(const key of ['sceneClocks','comparison'])assert.deepEqual(a.measurement.initialState[key],b.measurement.initialState[key],key);
          assert.deepEqual(a.measurement.initialState.boundary.boot.clocks,b.measurement.initialState.boundary.boot.clocks);
          for(const key of ['name','seed','time','phase','breathPhase','breathNumber','breathAmplitude','breathRate'])
            assert.deepEqual(a.measurement.initialState.character[key],b.measurement.initialState.character[key]);
          for(const key of ['time','phase','characterTime','breathPhase','sceneClocks','pos','yaw','rolling'])
            assert.deepEqual(a.video.initial.state[key],b.video.initial.state[key],'initial '+key);
          for(let i=0;i<90;i++){
            const x=a.video.frames[i],y=b.video.frames[i];
            for(const key of ['fire','tick','rngDraws','globalRandom','lighting','images','renderSize'])assert.deepEqual(x[key],y[key],i+':'+key);
            for(const key of ['time','phase','characterTime','breathPhase','sceneClocks','pos','yaw','rolling'])
              assert.deepEqual(x.state[key],y.state[key],i+':'+key);
          }
          const result={schema:1,passed:true,videoAccepted:false,performanceEvidence:false,highResolutionCapture:false,
            before:process.env.BEFORE_SHA,after:process.env.AFTER_SHA,qa:process.env.QA_SHA,
            nativeTicksPerLane:360,observedSampleFrames:90,clockReset:false,poseReset:false,globalRandom:reports.map(r=>r.globalRandom),receipts};
          fs.writeFileSync(path.join(root,'numeric-preflight.json'),JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify({passed:true,videoAccepted:false,nativeTicksPerLane:360,draws:receipts.map(r=>r.characterDraws),
            styles:receipts.map(r=>r.initial.style),finalBreath:receipts.map(r=>r.finalBreath)}));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roller-profile-preflight-${{ github.sha }}
          path: work/roller-preflight/
          if-no-files-found: error
          retention-days: 14
