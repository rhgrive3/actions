name: Hex runtime hotfix diff
on:
  push:
    paths:
      - .github/workflows/hex-runtime-hotfix-diff.yml
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: 217233649207ad9e0477f2bc113fbe9d72d70bf7
          path: old
      - name: Install old dependencies
        working-directory: old
        timeout-minutes: 4
        run: npm ci --silent --no-audit --no-fund >/tmp/old-install.log 2>&1
      - name: Capture old runtime
        working-directory: old
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/build-userscript.mjs')
          s=p.read_text()
          needle="const runtime = await bundle('js/userscript/protected-entry.js', { format: 'esm', rewriteImportMeta: true, inventory: 'standard-runtime', graph: 'standard' });"
          repl=needle+"\nawait writeFile('/tmp/runtime-old.js', runtime);"
          if needle not in s: raise SystemExit('old injection target missing')
          p.write_text(s.replace(needle,repl,1))
          PY
          timeout 120s npm run userscript:build >/tmp/old-build.log 2>&1
      - name: Extract old logicalPath candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          old=Path('/tmp/runtime-old.js').read_text()
          out=[]
          for m in re.finditer(r'origin', old):
              lo=max(0,m.start()-260)
              hi=min(len(old),m.start()+520)
              s=old[lo:hi]
              if 'pathname' in s and 'new URL' in s:
                  out.append(s)
          if not out:
              raise SystemExit('logicalPath candidate missing')
          Path('/tmp/old-logicalpath-candidates.txt').write_text('\n\n---CANDIDATE---\n\n'.join(out[:12]))
          Path('/tmp/runtime-size.txt').write_text(f'old_bytes={len(old)}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hex-runtime-hotfix-diff
          path: |
            /tmp/old-logicalpath-candidates.txt
            /tmp/runtime-size.txt
          retention-days: 1
