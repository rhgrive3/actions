name: PR9380 receiver gate diagnostic

on:
  push:
    paths:
      - ".github/workflows/pr9380-receiver-gate.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: 5bebf5d2c4f325b59fca45378f997373c58863e1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture receiver gate
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/diag.mjs <<'NODE'
          import fs from 'node:fs';
          import { buildIR } from '../js/ir-core.js';
          import { buildSemanticModel } from '../js/blocks.js';
          import { currentCppReceiver } from '../js/decompiler/cxx-evidence.js';
          import { createCppReceiverEvidence, isCanonicalCppReceiverEvidence } from '../js/analysis/cxx/object-evidence.js';

          const lines=['ldr w0, [x0, #0x38]','ret'];
          const rows=lines.map((text,row)=>{
            const split=text.indexOf(' ');
            return {row,address:0x100000000n+BigInt(row*4),mn:split<0?text:text.slice(0,split),ops:split<0?'':text.slice(split+1)};
          });
          const rowOfAddress=address=>rows.find(r=>r.address===BigInt(address))?.row??null;
          const model=buildSemanticModel(rows,{rowOfAddress,startRow:0,endRow:rows.length-1});
          const prototype={returnType:'uint64',returnBits:64,returnsValue:true,args:[{type:'uint64',bits:64}]};
          const ir=buildIR(model,{rowOfAddress,returnType:'uint64',callPrototypeFor:()=>prototype,semanticMigrationMode:'semantic-v2-compat'});
          const opts={ir,addr:rows[0].address,name:'test_func'};
          const rec=createCppReceiverEvidence({
            functionAddress:opts.addr,
            functionId:'func_player_read',
            canonicalValueId:ir.values[0].id,
            receiverRole:'this',
            nonStaticProof:{rule:'vtable-slot-entry'},
            abiBinding:{architecture:'arm64',register:'x0',argumentIndex:0},
            completeness:'complete',
            snapshotId:'snap',
          });
          const mapped=ir.args?.get?.('x0')??null;
          const out={
            optsAddr:String(opts.addr),
            irStartAddress:ir.startAddress==null?null:String(ir.startAddress),
            firstInstructionAddress:ir.instructions?.[0]?.address==null?null:String(ir.instructions[0].address),
            recFunctionAddress:rec.functionAddress==null?null:String(rec.functionAddress),
            recFunctionId:rec.functionId??null,
            irFunctionId:ir.functionId??null,
            recCanonicalValueId:String(rec.canonicalValueId),
            firstValue:{id:String(ir.values[0]?.id),reg:ir.values[0]?.reg??null,bits:ir.values[0]?.bits??null,kind:ir.values[0]?.kind??null},
            mappedX0:mapped?{id:String(mapped.id),reg:mapped.reg??null,bits:mapped.bits??null}:null,
            branded:isCanonicalCppReceiverEvidence(rec),
            accepted:Boolean(currentCppReceiver(opts,ir)),
          };
          fs.writeFileSync('evidence/gate.json',JSON.stringify(out,null,2)+'\n');
          NODE
          set +e
          timeout 60s node evidence/diag.mjs > evidence/stdout.txt 2> evidence/stderr.txt
          printf '%s\n' "$?" > evidence/status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr9380-receiver-gate
          path: evidence/*
          retention-days: 2
