name: hex real-game dispatch

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Target commit SHA on target repository"
        required: true
        type: string
      target_repo:
        description: "Target repository (e.g. rhgrive3/hex-ida)"
        required: false
        default: "rhgrive3/hex-ida"
        type: string
      games:
        description: "Comma-separated list of games to evaluate (e.g. openmw,openttd)"
        required: false
        default: "openmw,openttd"
        type: string

permissions:
  contents: read

jobs:
  plan:
    if: inputs.games != 'cxxholdout'
    name: plan-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Generate games matrix
        id: plan
        env:
          GAMES_INPUT: ${{ inputs.games }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = {
            openmw: {
              game: 'openmw',
              package: 'openmw',
              binary_glob: '*/usr/games/openmw',
            },
            openttd: {
              game: 'openttd',
              package: 'openttd',
              binary_glob: '*/usr/games/openttd',
            },
          };
          const raw = process.env.GAMES_INPUT || 'openmw,openttd';
          const selected = raw.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
          const include = [];
          for (const key of selected) {
            if (catalog[key]) {
              include.push(catalog[key]);
            } else {
              // fallback with sensible defaults if someone specifies another debian/ubuntu package name
              include.push({
                game: key,
                package: key,
                binary_glob: `*/usr/games/${key}`,
              });
            }
          }
          if (include.length === 0) {
            throw new Error(`No games matched input: ${raw}`);
          }
          const matrix = { include };
          console.log(`Matrix: ${JSON.stringify(matrix)}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          NODE

  realgame:
    if: inputs.games != 'cxxholdout'
    name: realgame-${{ matrix.game }}-arm64
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@v4

      - name: Checkout exact Hex
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.target_sha }}
          path: target
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Acquire stripped ARM64 game package
        id: acquire
        env:
          GAME: ${{ matrix.game }}
          PKG: ${{ matrix.package }}
          BINARY_GLOB: ${{ matrix.binary_glob }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/root evidence
          timeout 300s sudo apt-get update -qq >/dev/null
          (cd packages && timeout 300s apt download "$PKG" >/dev/null)
          deb="$(find packages -maxdepth 1 -name '*.deb' -type f | head -1)"
          test -n "$deb"
          dpkg-deb -x "$deb" packages/root
          bin="$(find packages/root -type f -path "$BINARY_GLOB" -print -quit)"
          test -n "$bin"
          file "$bin" | tee evidence/file.txt
          file "$bin" | grep -Eqi 'ARM aarch64|ARM64|aarch64'
          echo "binary=$bin" >> "$GITHUB_OUTPUT"
          sha256sum "$bin" > evidence/binary.sha256

      - name: Build binary-grounded RTTI oracle
        id: oracle
        env:
          PKG: ${{ matrix.package }}
          BIN: ${{ steps.acquire.outputs.binary }}
        shell: bash
        run: |
          set -euo pipefail
          readelf -Ws "$BIN" 2>/dev/null | c++filt > evidence/symbols.txt || true
          { sed -n 's/.*vtable for //p' evidence/symbols.txt; sed -n 's/.*typeinfo for //p' evidence/symbols.txt; } | sed 's/[[:space:]]*$//' | sort -u > evidence/oracle-classes.txt
          vtables="$(grep -c 'vtable for ' evidence/symbols.txt || true)"
          typeinfos="$(grep -c 'typeinfo for ' evidence/symbols.txt || true)"
          typenames="$(grep -c 'typeinfo name for ' evidence/symbols.txt || true)"
          buildid="$(readelf -n "$BIN" 2>/dev/null | awk '/Build ID:/{print $3; exit}')"
          debug_status=unavailable
          dwarf_classes=0
          dwarf_members=0
          mkdir -p packages/debugroot
          if timeout 90s sudo apt-get install -y ubuntu-dbgsym-keyring >/dev/null 2>&1; then
            codename="$(. /etc/os-release; printf '%s' "$VERSION_CODENAME")"
            printf 'deb http://ddebs.ubuntu.com %s main universe multiverse restricted\ndeb http://ddebs.ubuntu.com %s-updates main universe multiverse restricted\n' "$codename" "$codename" | sudo tee /etc/apt/sources.list.d/ddebs.list >/dev/null
            if timeout 240s sudo apt-get update -qq >/dev/null 2>&1; then
              (cd packages && timeout 180s apt download "${PKG}-dbgsym" >/dev/null 2>&1) || true
              dbgdeb="$(find packages -maxdepth 1 -name "${PKG}-dbgsym*.deb" -type f | head -1)"
              if [ -n "$dbgdeb" ]; then dpkg-deb -x "$dbgdeb" packages/debugroot || true; fi
            fi
          fi
          debugfile=""
          if [ -n "$buildid" ]; then debugfile="$(find packages/debugroot -type f -path "*/.build-id/${buildid:0:2}/${buildid:2}.debug" -print -quit 2>/dev/null || true)"; fi
          : > evidence/oracle-dwarf-classes.txt
          : > evidence/oracle-dwarf-members.txt
          if [ -n "$debugfile" ] && timeout 90s readelf --debug-dump=info "$debugfile" > /tmp/dwarf-info.txt 2>/dev/null; then
            debug_status=matched-dbgsym
            dwarf_classes="$(grep -Ec 'DW_TAG_(class|structure)_type' /tmp/dwarf-info.txt || true)"
            dwarf_members="$(grep -c 'DW_TAG_member' /tmp/dwarf-info.txt || true)"
            timeout 30s python3 - <<'PYDWARF' || true
          import re
          lines=open('/tmp/dwarf-info.txt',errors='replace')
          current=None
          classes=[]; members=[]
          for line in lines:
              if 'DW_TAG_class_type' in line or 'DW_TAG_structure_type' in line:
                  current='class'; continue
              if 'DW_TAG_member' in line:
                  current='member'; continue
              if 'DW_TAG_' in line:
                  current=None
              if current and 'DW_AT_name' in line:
                  value=re.sub(r'^.*DW_AT_name\s*:\s*','',line).strip()
                  if '): ' in value: value=value.split('): ',1)[1].strip()
                  if value and value not in ('<anonymous>','(anonymous namespace)'):
                      (classes if current=='class' else members).append(value)
                  current=None
          for path, rows in [('evidence/oracle-dwarf-classes.txt',classes),('evidence/oracle-dwarf-members.txt',members)]:
              with open(path,'w') as f:
                  for x in sorted(set(rows)): f.write(x+'\n')
          PYDWARF
          fi
          GAME='${{ matrix.game }}' BIN="$BIN" BUILDID="$buildid" DEBUG_STATUS="$debug_status" VTABLES="$vtables" TYPEINFOS="$typeinfos" TYPENAMES="$typenames" DWARF_CLASSES="$dwarf_classes" DWARF_MEMBERS="$dwarf_members" node --input-type=module <<'NODE'
          import fs from 'node:fs'; import crypto from 'node:crypto';
          const bytes=fs.readFileSync(process.env.BIN);
          const out={schema:'hex-realgame-oracle/v1',game:process.env.GAME,binary:process.env.BIN,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),buildId:process.env.BUILDID||null,dynamic:{vtables:Number(process.env.VTABLES),typeinfos:Number(process.env.TYPEINFOS),typeNames:Number(process.env.TYPENAMES)},debug:{status:process.env.DEBUG_STATUS,dwarfClasses:Number(process.env.DWARF_CLASSES),dwarfMembers:Number(process.env.DWARF_MEMBERS)}};
          fs.writeFileSync('evidence/oracle.json',JSON.stringify(out,null,2)+'\n');
          NODE

      - name: Analyze real game with Hex FAST
        env:
          BIN: ${{ steps.acquire.outputs.binary }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s node scripts/hex-realgame-holdout.mjs \
            --target-root target --binary "$BIN" --game '${{ matrix.game }}' \
            --target-sha "$TARGET_SHA" --out evidence/result.json

      - name: Publish compact summary
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const r=fs.existsSync('evidence/result.json')?JSON.parse(fs.readFileSync('evidence/result.json')):null;
          const o=fs.existsSync('evidence/oracle.json')?JSON.parse(fs.readFileSync('evidence/oracle.json')):null;
          console.log(`## ${{ matrix.game }} real-game holdout`);
          if(!r){console.log('- Hex result unavailable'); process.exit(0)}
          console.log(`- Hex classes: ${r.totals.classes}; vtables: ${r.totals.vtables}; RTTI: ${r.totals.typeinfos}`);
          console.log(`- Resolved/named vtable slots: ${r.totals.resolvedVtableSlots}/${r.totals.namedVtableSlots}`);
          console.log(`- FAST samples complete: ${r.totals.completeSampled}/${r.totals.decompileSampled}; virtual targets: ${r.totals.completeVirtualTargets}/${r.totals.virtualTargetsSampled}`);
          if(o) console.log(`- Oracle dynamic vtables/typeinfos: ${o.dynamic.vtables}/${o.dynamic.typeinfos}; DWARF: ${o.debug.status} (${o.debug.dwarfClasses} classes, ${o.debug.dwarfMembers} members)`);
          NODE

      - name: Upload real-game evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realgame-${{ matrix.game }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  realgame-aggregate:
    if: inputs.games != 'cxxholdout'
    name: aggregate-realgame
    needs: realgame
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download real-game evidence
        uses: actions/download-artifact@v4
        with:
          pattern: realgame-*
          path: games
      - name: Aggregate real-game evidence
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          mkdir -p final
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          const dirs=fs.existsSync('games')?fs.readdirSync('games').map(x=>path.join('games',x)).filter(x=>fs.statSync(x).isDirectory()):[];const rows=[];
          for(const d of dirs){
            const rp=path.join(d,'result.json'),op=path.join(d,'oracle.json'),cp=path.join(d,'oracle-classes.txt'),dcp=path.join(d,'oracle-dwarf-classes.txt'),dmp=path.join(d,'oracle-dwarf-members.txt');
            if(!fs.existsSync(rp))continue;
            const r=JSON.parse(fs.readFileSync(rp));const o=fs.existsSync(op)?JSON.parse(fs.readFileSync(op)):null;
            const setFrom=p=>new Set(fs.existsSync(p)?fs.readFileSync(p,'utf8').split(/\r?\n/).map(x=>x.trim()).filter(Boolean):[]);
            const oracleClasses=setFrom(cp), dwarfClasses=setFrom(dcp), dwarfMembers=setFrom(dmp), hexClasses=new Set((r.classes??[]).map(x=>x.name)), hexMembers=new Set(r.observed?.memberNames??[]);
            let overlap=0,dwarfClassOverlap=0,memberHits=0;for(const c of hexClasses){if(oracleClasses.has(c))overlap++;if(dwarfClasses.has(c))dwarfClassOverlap++;}for(const m of hexMembers)if(dwarfMembers.has(m))memberHits++;
            rows.push({game:r.game,sha256:r.sha256,bytes:r.bytes,hex:r.totals,oracle:o,oracleDynamicClasses:oracleClasses.size,classOverlap:overlap,dwarfNamedClasses:dwarfClasses.size,dwarfClassOverlap,dwarfNamedMembers:dwarfMembers.size,hexObservedMembers:hexMembers.size,sampledMemberOracleHits:memberHits});
          }
          const out={schema:'hex-realgame-cxx-holdout-aggregate/v1',targetSha:process.env.TARGET_SHA,games:rows};fs.writeFileSync('final/realgame.json',JSON.stringify(out,null,2)+'\n');
          console.log('## Real-game ARM64 holdout');for(const x of rows)console.log(`- ${x.game}: Hex ${x.hex.classes} classes / ${x.hex.vtables} vtables; dynamic-class overlap ${x.classOverlap}/${x.oracleDynamicClasses}; DWARF-class overlap ${x.dwarfClassOverlap}/${x.dwarfNamedClasses}; sampled member hits ${x.sampledMemberOracleHits}/${x.hexObservedMembers}; virtual FAST ${x.hex.completeVirtualTargets}/${x.hex.virtualTargetsSampled}; DWARF ${x.oracle?.debug?.status??'unavailable'}`);
          NODE
      - name: Append aggregate summary
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('final/realgame.json', 'utf8'));
          console.log('## Real-game ARM64 holdout');
          for (const x of r.games) {
            console.log(`- ${x.game}: dynamic classes ${x.classOverlap}/${x.oracleDynamicClasses}; DWARF classes ${x.dwarfClassOverlap}/${x.dwarfNamedClasses}; sampled member hits ${x.sampledMemberOracleHits}/${x.hexObservedMembers}; virtual FAST ${x.hex.completeVirtualTargets}/${x.hex.virtualTargetsSampled}; all FAST ${x.hex.completeSampled}/${x.hex.decompileSampled}; DWARF ${x.oracle?.debug?.status ?? 'unavailable'}`);
          }
          NODE
      - name: Upload real-game aggregate
        uses: actions/upload-artifact@v4
        with:
          name: realgame-final
          path: final/realgame.json
          retention-days: 7

  cxx-dwarf-holdout:
    if: inputs.games == 'cxxholdout'
    name: cxx-dwarf-holdout
    uses: ./.github/workflows/hex-cxx-debug-holdout.yml
    with:
      target_sha: ${{ inputs.target_sha }}
    permissions:
      contents: read
