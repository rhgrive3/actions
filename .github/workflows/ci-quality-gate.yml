name: INKWAVE A+ Quality & Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

concurrency:
  # Cancel obsolete PR-head checks; keep every main push and manually dispatched run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-aplus-suite:
    # Drafts use the exact-head fast preflight; ready PRs and main retain this full gate.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /.circleci/config.yml
            account
            /.gitattributes
            /.gitignore
            /README.md
            /AGENTS.md
            /CONTRIBUTING.md
            .github/workflows
            inkwave-public
            patches
            scripts
            server
            tests
            tools/backup
            tools/squid-heading-qa
            reports/ink-volume/source
      - name: Verify immutable checkout identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_source_sha="$(git rev-parse HEAD)"
          printf 'Expected source: %s\nActual checkout: %s\n' "$EXPECTED_SOURCE_SHA" "$actual_source_sha"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA"

      - name: Determine game quality scope
        id: scope
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/inkwave-quality-scope.mjs --fetch-base

      - if: steps.scope.outputs.relevant == 'true'
        name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - if: steps.scope.outputs.relevant == 'true'
        name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - if: steps.scope.outputs.relevant == 'true'
        name: Verify shared test suite runner
        run: npm run test:ci-config

      - if: steps.scope.outputs.relevant == 'true'
        name: Verify immutable CI source admission contracts
        run: node --test scripts/tests/inkwave-added-ci-contracts.test.mjs scripts/tests/inkwave-ci-source-admission.test.mjs scripts/tests/inkwave-main9fe-paint-admission.test.mjs scripts/tests/inkwave-maine1f-paint-admission.test.mjs scripts/tests/inkwave-selected-prop-pack-contracts.test.mjs

      - if: steps.scope.outputs.relevant == 'true'
        name: Verify Patch Composition & Upstream Locks
        run: node scripts/check-inkwave-patches.mjs --quick

      - if: steps.scope.outputs.relevant == 'true'
        name: Audit Direct-Source Ownership (14 Verified Modules)
        run: node scripts/inkwave-source-migration-audit.mjs

      - if: steps.scope.outputs.relevant == 'true'
        name: Run Direct-Source & Lossless Lightmap Regression Suite
        run: npm run test:direct-source

      - if: steps.scope.outputs.relevant == 'true'
        name: Run Local-Quality & Motion Regression Suite
        run: npm run test:quality

      - if: steps.scope.outputs.relevant == 'true'
        name: Run Relay Security & Hibernation Test Suite
        run: npm run test:relay

      - if: steps.scope.outputs.relevant == 'true'
        name: Run Backup, Restore & Transactional Patch Applier Tests
        run: npm run test:backup

      - if: steps.scope.outputs.relevant == 'true' && steps.scope.outputs.build_required != 'false'
        name: Run Production Diagnostic Build & Startup Budget Gate
        run: |
          INKWAVE_BUILD_UNMINIFIED=1 node scripts/build-inkwave.mjs inkwave-public _site
          node scripts/check-inkwave-startup-budget.mjs _site

      - if: steps.scope.outputs.relevant == 'true' && steps.scope.outputs.build_required != 'false'
        name: Execute A+ Same-Condition Performance & Parity Benchmark
        run: node scripts/benchmark-aplus-verification.mjs
