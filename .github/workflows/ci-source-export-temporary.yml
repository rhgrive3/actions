name: Temporary local verification source export
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/ci-source-export-temporary.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify and export exact tracked source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git archive --format=tar HEAD | gzip -1 > source.tar.gz
          test "$(stat -c %s source.tar.gz)" -gt 1000000
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-source-export
          path: source.tar.gz
          retention-days: 1
