name: Temporary local verification source export
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/ci-source-export-temporary.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify and export exact tracked verification source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git archive --format=tar HEAD .github/workflows inkwave-public patches scripts tests package.json package-lock.json | gzip -1 > source.tar.gz
          test "$(stat -c %s source.tar.gz)" -gt 1000000
          mkdir source-parts
          split -b 300m -d -a 2 source.tar.gz source-parts/part-
          sha256sum source.tar.gz > source-parts/SHA256SUM
          ls -lh source-parts
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-source-part-00
          path: source-parts/part-00
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-source-part-01
          path: source-parts/part-01
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('source-parts/part-02') != ''
        with:
          name: temporary-source-part-02
          path: source-parts/part-02
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('source-parts/part-03') != ''
        with:
          name: temporary-source-part-03
          path: source-parts/part-03
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('source-parts/part-04') != ''
        with:
          name: temporary-source-part-04
          path: source-parts/part-04
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-source-checksum
          path: source-parts/SHA256SUM
          retention-days: 1
