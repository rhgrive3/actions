name: INKWAVE combined-source IndexedDB acceptance
on:
  push:
    branches: [review/native-combined-cache-20261015]
permissions:
  contents: read
concurrency:
  group: native-combined-idb-${{ github.ref }}
  cancel-in-progress: false
jobs:
  indexeddb:
    if: github.event_name == 'push' && github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/review/native-combined-cache-20261015'
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CACHE_ENGINE: ${{ matrix.engine }}
      IDB_BASELINE_SHA256: 31a47aeb648147683589e6483831ab5f03c1d9e401cec42f84c5edf3a7633de1
      IDB_CANDIDATE_SHA256: 8561727ceee23794958ca74e6861b5215de7651ac22594d688f6a1f6ee978bfc
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Verify frozen payloads
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('scripts/native-cache-idb');m=json.loads((p/'publication.json').read_text())
          actual={f.name for f in p.iterdir() if f.is_file() and f.name!='publication.json'}
          assert actual|{'native-cache-idb.yml'}==set(m['files'])
          for name,pin in m['files'].items():
              f=pathlib.Path('.github/workflows/native-cache-idb.yml') if name=='native-cache-idb.yml' else p/name
              b=f.read_bytes();assert len(b)==pin['bytes'] and hashlib.sha256(b).hexdigest()==pin['sha256'],name
          assert hashlib.sha256((p/'harness-package.json').read_bytes()).hexdigest()=='73a62e69a453a2a24d7d3da4ae4ead6267f381f1ac2ba356ee620c9edea4dfff'
          h=json.loads((p/'harness-package.json').read_text())
          for name,pin in h['files'].items():
              b=(p/name).read_bytes();assert len(b)==pin['bytes'] and hashlib.sha256(b).hexdigest()==pin['sha256'],name
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==m['candidateHead']
          actual=subprocess.check_output(['git','show',m['candidateHead']+':patches/native-stages/runtime/source-cache.mjs'])
          assert actual==(p/'candidate.mjs').read_bytes()
          PY
      - name: Install pinned browser
        working-directory: scripts/native-cache-idb
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run bounded synthetic IndexedDB acceptance
        run: |
          export PACKAGE="$GITHUB_WORKSPACE/scripts/native-cache-idb"
          export IDB_EVIDENCE="$GITHUB_WORKSPACE/evidence"
          python "$PACKAGE/supervise.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-combined-idb-${{ matrix.engine }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            evidence/*.json
            evidence/*.log
