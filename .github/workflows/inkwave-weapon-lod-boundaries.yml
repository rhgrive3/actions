name: INKWAVE weapon LOD boundary review
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - inkwave-public/src/game/character-lod.js
      - patches/splatoon3/tests/weapon-lod-boundaries.test.mjs
      - scripts/render-inkwave-weapon-lod-boundaries.mjs
      - scripts/compare-inkwave-weapon-lod-boundaries.py
      - .github/workflows/inkwave-weapon-lod-boundaries.yml
permissions:
  contents: read
concurrency:
  group: weapon-lod-boundaries-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.head_ref == 'fix/inkwave-weapon-lod-boundaries'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        model-source: [main, quad-explosher-205d]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 5ed08c6376696dd67391afed7c36463106959de8
          path: .lod-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.model-source == 'quad-explosher-205d'
        with:
          ref: 205d4e4e96864dda2e2c9e6a9194e9f7b47fa231
          path: .lod-models
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /patches/splatoon3/runtime/weapon-models/dualies.mjs
            /patches/splatoon3/runtime/weapon-models/sloshers.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
          npx playwright install --with-deps chromium
          python3 -m pip install Pillow
      - name: Record immutable inputs and isolate the LOD-only comparison
        env:
          MODEL_SOURCE: ${{ matrix.model-source }}
        run: |
          mkdir -p .lod-evidence
          cp .lod-baseline/inkwave-public/src/game/character-lod.js .lod-before.js
          if [ "$MODEL_SOURCE" = quad-explosher-205d ]; then
            for family in dualies sloshers; do
              cp ".lod-models/patches/splatoon3/runtime/weapon-models/$family.mjs" "patches/splatoon3/runtime/weapon-models/$family.mjs"
              cp ".lod-models/patches/splatoon3/runtime/weapon-models/$family.mjs" ".lod-baseline/patches/splatoon3/runtime/weapon-models/$family.mjs"
            done
          fi
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';import{execFileSync}from'node:child_process';
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const report={candidateCommit:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),baselineCommit:'5ed08c6376696dd67391afed7c36463106959de8',modelSource:process.env.MODEL_SOURCE,modelCommit:process.env.MODEL_SOURCE==='main'?'5ed08c6376696dd67391afed7c36463106959de8':'205d4e4e96864dda2e2c9e6a9194e9f7b47fa231',files:{}};
          for(const f of['dualies','sloshers']){const p='patches/splatoon3/runtime/weapon-models/'+f+'.mjs';if(sha(p)!==sha('.lod-baseline/'+p))throw Error('mismatched A/B model');report.files[p]=sha(p);}
          fs.writeFileSync('.lod-evidence/composition.json',JSON.stringify(report,null,2));console.log(report);
          JS
      - name: Verify all 65 models and authored face-corner attributes on the same Node runtime
        env:
          WEAPON_LOD_BASELINE: .lod-before.js
          WEAPON_LOD_REPORT: .lod-evidence/structural.json
        run: node --experimental-vm-modules --test patches/splatoon3/tests/weapon-lod-boundaries.test.mjs
      - name: Build both full production compositions
        run: |
          export ESBUILD_MODULE="$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js"
          node .lod-baseline/scripts/build-inkwave.mjs .lod-baseline/inkwave-public .lod-before-site
          node scripts/build-inkwave.mjs inkwave-public .lod-after-site
      - name: All 65 models, two team colours and four identical cameras
        run: |
          for version in before after; do
            node scripts/render-inkwave-weapon-lod-boundaries.mjs --site ".lod-${version}-site" --out ".lod-evidence/${version}" --size 320
          done
          python3 scripts/compare-inkwave-weapon-lod-boundaries.py .lod-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weapon-lod-visual-${{ matrix.model-source }}-${{ github.event.pull_request.head.sha }}
          path: .lod-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Eight real Actors, near and far ABBA on one runner
        run: |
          for pair in before-A after-B after-B2 before-A2; do
            version="${pair%%-*}"
            node scripts/render-inkwave-weapon-lod-boundaries.mjs --site ".lod-${version}-site" --out ".lod-evidence/crowd/${pair}" --size 600 --crowd
          done
          python3 scripts/compare-inkwave-weapon-lod-boundaries.py .lod-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weapon-lod-review-${{ matrix.model-source }}-${{ github.event.pull_request.head.sha }}
          path: .lod-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
