      - name: Verify and record source bytes before dependency setup
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git -C source hash-object scripts/check-inkwave-reticle-viewport.mjs)" = b3f8574a60879813be2d6d5b613f5886546e3c7e
          git -C source diff --exit-code
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('source')
          tracked = subprocess.check_output(['git', '-C', str(root), 'ls-tree', '-r', '-z', 'HEAD']).split(b'\0')
          records = []
          for entry in tracked:
              if not entry:
                  continue
              meta, raw_path = entry.split(b'\t', 1)
              path = raw_path.decode(); disk = root / path
              if not disk.is_file():
                  continue
              data = disk.read_bytes(); expected = meta.decode().split()[2]
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected, path
              records.append({'path': path, 'blob': actual, 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)})
          assert len(records) == 349, len(records)
          result = {'source_sha': os.environ['SOURCE_SHA'], 'source_tree': os.environ['SOURCE_TREE'], 'files': records}
          pathlib.Path(os.environ['EVIDENCE_DIR'], 'source-inputs.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps({'verified_source_inputs': len(records), 'source_bytes': sum(r['bytes'] for r in records)}))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the pinned tools outside the source checkout
        run: |
          mkdir -p "$RUNNER_TEMP/reticle-tools"
          printf '{"private":true,"type":"module"}\n' > "$RUNNER_TEMP/reticle-tools/package.json"
          npm install --prefix "$RUNNER_TEMP/reticle-tools" --no-save --no-package-lock --no-audit --no-fund esbuild@0.28.2 playwright@1.62.1
          ln -s "$RUNNER_TEMP/reticle-tools/node_modules" source/node_modules
          "$RUNNER_TEMP/reticle-tools/node_modules/.bin/playwright" install --with-deps chromium

      - name: Record actual hosted tool and browser versions
        working-directory: source
        run: |
          node --version > "$EVIDENCE_DIR/node-version.txt"
          "$RUNNER_TEMP/reticle-tools/node_modules/.bin/playwright" --version > "$EVIDENCE_DIR/playwright-version.txt"
          node --input-type=module - <<'JS' > "$EVIDENCE_DIR/browser-path.txt"
          import { chromium } from 'playwright';
          console.log(chromium.executablePath());
          JS
          "$(cat "$EVIDENCE_DIR/browser-path.txt")" --version > "$EVIDENCE_DIR/browser-version.txt"
          cat "$EVIDENCE_DIR/node-version.txt" "$EVIDENCE_DIR/playwright-version.txt" "$EVIDENCE_DIR/browser-version.txt"

      - name: Run unchanged current-head viewport checker only
        working-directory: source
        run: |
          printf 'running\n' > "$EVIDENCE_DIR/checker-status.txt"
          set +e
          node scripts/check-inkwave-reticle-viewport.mjs "$EVIDENCE_DIR/dom" > "$EVIDENCE_DIR/stdout.log" 2> "$EVIDENCE_DIR/stderr.log"
          checker_status=$?
          set -e
          printf '%s\n' "$checker_status" > "$EVIDENCE_DIR/checker-exit-code.txt"
          if [ "$checker_status" -eq 0 ]; then
            printf 'passed\n' > "$EVIDENCE_DIR/checker-status.txt"
          else
            printf 'failed\n' > "$EVIDENCE_DIR/checker-status.txt"
          fi
          cat "$EVIDENCE_DIR/stdout.log"
          cat "$EVIDENCE_DIR/stderr.log" >&2
          if [ -f "$EVIDENCE_DIR/dom/results.json" ]; then
            cat "$EVIDENCE_DIR/dom/results.json"
          fi
          exit "$checker_status"

      - name: Verify artifact completeness without changing geometry assertions
        run: |
          test -s "$EVIDENCE_DIR/dom/results.json"
          for size in 1280x720 1024x600 844x390 390x844; do
            test -s "$EVIDENCE_DIR/dom/reticles-$size.png"
          done
          python3 - <<'PY'
          import json, os, pathlib, struct
          root = pathlib.Path(os.environ['EVIDENCE_DIR'], 'dom')
          report = json.loads((root / 'results.json').read_text())
          assert report['kind'] == 'composed HUD component browser QA'
          assert len(report['rows']) == 4
          assert sum(len(row['result']) for row in report['rows']) == 28
          screenshots = []
          for file in sorted(root.glob('reticles-*.png')):
              header = file.read_bytes()[:24]
              assert header[:8] == b'\x89PNG\r\n\x1a\n', file
              screenshots.append({'file': file.name, 'pixel_size': list(struct.unpack('>II', header[16:24]))})
          print(json.dumps({'screenshot_inventory': screenshots}))
          PY

      - name: Preserve final source identity and evidence hashes
        if: always()
        run: |
          if [ -d source/.git ]; then
            git -C source diff --exit-code > "$EVIDENCE_DIR/source-diff-after.txt"
            git -C source hash-object scripts/check-inkwave-reticle-viewport.mjs > "$EVIDENCE_DIR/checker-blob-after.txt"
            test "$(cat "$EVIDENCE_DIR/checker-blob-after.txt")" = b3f8574a60879813be2d6d5b613f5886546e3c7e
          fi
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['EVIDENCE_DIR'])
          files = [{'path': str(p.relative_to(root)), 'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file() and p.name != 'artifact-files.json']
          (root / 'artifact-files.json').write_text(json.dumps(files, indent=2) + '\n')
          PY

      - name: Upload only this diagnostic's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reticle-viewport-fe98-${{ github.run_id }}-${{ github.run_attempt }}
          path: reticle-viewport-evidence/
          if-no-files-found: error
          retention-days: 14
