name: INKWAVE reticle viewport fe98 isolated DOM diagnostic

on:
  push:
    branches:
      - fix/inkwave-ci-journal-stage-20261024
    paths:
      - .github/workflows/inkwave-reticle-viewport-fe98-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: reticle-viewport-fe98-isolated-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  reticle-dom:
    if: >-
      github.repository == 'rhgrive3/actions' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/fix/inkwave-ci-journal-stage-20261024' &&
      github.event.deleted != true &&
      github.event.created == false &&
      github.event.before == '8ecbdf011c6f13a47b561ff64b8ce792c0e3d4a0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: fe98b0a1b115e6709dae66e83876ddbdc5dcd33a
      SOURCE_TREE: a61b4055071360a72cd5dd7eecc9a86b2bef07bf
      CONTROL_BASE_SHA: 8ecbdf011c6f13a47b561ff64b8ce792c0e3d4a0
      CONTROL_BASE_TREE: a28ce27f4a8bca0b26a584e6d1a2df4399f09f14
      PUSH_BEFORE: ${{ github.event.before }}
      PUSH_AFTER: ${{ github.event.after }}
      WORKFLOW_DEFINITION_SHA: ${{ github.workflow_sha }}
      WORKFLOW_PATH: .github/workflows/inkwave-reticle-viewport-fe98-diagnostic.yml
      WORKFLOW_SHA: ${{ github.sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      EVIDENCE_DIR: ${{ github.workspace }}/reticle-viewport-evidence
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/reticle-fe98-browsers
    steps:
      - name: Initialize diagnostic evidence
        run: |
          mkdir -p "$EVIDENCE_DIR"
          printf 'not_started\n' > "$EVIDENCE_DIR/checker-status.txt"
          printf 'Source: %s\nWorkflow: %s\n' "$SOURCE_SHA" "$WORKFLOW_SHA"

      - name: Checkout only the diagnostic workflow and its immediate parent
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: diagnostic-control
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/inkwave-reticle-viewport-fe98-diagnostic.yml

      - name: Verify isolated workflow commit
        run: |
          test "$(git -C diagnostic-control rev-parse HEAD)" = "$WORKFLOW_SHA"
          test "$PUSH_BEFORE" = "$CONTROL_BASE_SHA"
          test "$PUSH_AFTER" = "$WORKFLOW_SHA"
          test "$WORKFLOW_DEFINITION_SHA" = "$WORKFLOW_SHA"
          test "$(git -C diagnostic-control rev-parse HEAD^)" = "$CONTROL_BASE_SHA"
          test "$(git -C diagnostic-control rev-parse HEAD^1^{tree})" = "$CONTROL_BASE_TREE"
          test "$(git -C diagnostic-control rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          git -C diagnostic-control diff-tree --no-commit-id --name-status -r HEAD > "$EVIDENCE_DIR/workflow-diff.txt"
          printf 'A\t%s\n' "$WORKFLOW_PATH" > "$RUNNER_TEMP/reticle-expected-workflow-diff.txt"
          cmp "$RUNNER_TEMP/reticle-expected-workflow-diff.txt" "$EVIDENCE_DIR/workflow-diff.txt"
          cp "diagnostic-control/$WORKFLOW_PATH" "$EVIDENCE_DIR/workflow.yml"
          WORKFLOW_TREE="$(git -C diagnostic-control rev-parse HEAD^{tree})" \
          WORKFLOW_BLOB="$(git -C diagnostic-control rev-parse HEAD:"$WORKFLOW_PATH")" \
          python3 - <<'PY'
          import json, os, pathlib
          result = {k: os.environ[k] for k in ('SOURCE_SHA', 'SOURCE_TREE', 'CONTROL_BASE_SHA', 'CONTROL_BASE_TREE', 'PUSH_BEFORE', 'PUSH_AFTER', 'WORKFLOW_DEFINITION_SHA', 'WORKFLOW_SHA', 'WORKFLOW_TREE', 'WORKFLOW_BLOB', 'WORKFLOW_REF', 'WORKFLOW_PATH')}
          result.update(run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], repository=os.environ['GITHUB_REPOSITORY'])
          pathlib.Path(os.environ['EVIDENCE_DIR'], 'identity.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Checkout immutable current HUD composition inputs only
        uses: actions/checkout@v4
        with:
          ref: fe98b0a1b115e6709dae66e83876ddbdc5dcd33a
          path: source
