name: Hex userscript engine diagnostic
on:
  push:
    paths:
      - .github/workflows/hex-userscript-engine-diagnostic.yml
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout diagnostic repo
        uses: actions/checkout@v4
      - name: Checkout hex-ida
        uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: main
          path: hex-ida
      - name: Install Node deps
        working-directory: hex-ida
        timeout-minutes: 4
        run: npm ci --silent > /tmp/npm-ci.log 2>&1
      - name: Install Playwright browsers
        working-directory: hex-ida
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium webkit > /tmp/playwright-install.log 2>&1
      - name: Build userscript
        working-directory: hex-ida
        timeout-minutes: 3
        run: npm run userscript:build > /tmp/userscript-build.log 2>&1
      - name: Run focused browser engine diagnostic
        id: diag
        working-directory: hex-ida
        timeout-minutes: 4
        shell: bash
        run: |
          set +e
          node tests/userscript-sandbox-browser-e2e.mjs > /tmp/e2e.log 2>&1
          code=$?
          python3 - <<'PY'
          import json, pathlib, os
          p=pathlib.Path('/tmp/e2e.log')
          lines=p.read_text(errors='replace').splitlines() if p.exists() else []
          out={
            "exit_code": int(os.environ.get("DIAG_EXIT","0")),
            "tail": lines[-120:],
          }
          pathlib.Path('engine-diagnostic.json').write_text(json.dumps(out, ensure_ascii=False, indent=2))
          PY
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          DIAG_EXIT: ${{ steps.diag.outputs.exit_code }}
      - name: Rewrite result with actual exit code
        working-directory: hex-ida
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, os
          p=pathlib.Path('engine-diagnostic.json')
          data=json.loads(p.read_text())
          data['exit_code']=int(os.environ['CODE'])
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2))
          PY
        env:
          CODE: ${{ steps.diag.outputs.exit_code }}
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: hex-userscript-engine-diagnostic
          path: hex-ida/engine-diagnostic.json
          retention-days: 1
