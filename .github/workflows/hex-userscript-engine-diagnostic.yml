name: Hex userscript generated push
on:
  push:
    paths:
      - .github/workflows/hex-userscript-engine-diagnostic.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Clone target branch
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GH_PAT:-}" ]]; then
            git clone --depth 1 --branch fix/userscript-protected-worker-sentinel-origin               "https://x-access-token:${GH_PAT}@github.com/rhgrive3/hex-ida.git" hex-ida
          else
            git clone --depth 1 --branch fix/userscript-protected-worker-sentinel-origin               "https://github.com/rhgrive3/hex-ida.git" hex-ida
          fi
      - name: Install Node deps
        working-directory: hex-ida
        timeout-minutes: 4
        run: npm ci --silent > /tmp/npm-ci.log 2>&1
      - name: Build userscript
        working-directory: hex-ida
        timeout-minutes: 3
        run: npm run userscript:build > /tmp/userscript-build.log 2>&1
      - name: Commit and push generated files
        working-directory: hex-ida
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- userscript/hex.user.template.js userscript/release-version.json; then
            echo "generated files already synchronized"
            exit 0
          fi
          test -n "${GH_PAT:-}"
          git config user.name "actions-userscript-sync"
          git config user.email "actions-userscript-sync@users.noreply.github.com"
          git add userscript/hex.user.template.js userscript/release-version.json
          git commit -m "build(userscript): sync protected worker fix"
          git config remote.origin.url "https://x-access-token:${GH_PAT}@github.com/rhgrive3/hex-ida.git"
          git push --no-verify origin HEAD:refs/heads/fix/userscript-protected-worker-sentinel-origin
