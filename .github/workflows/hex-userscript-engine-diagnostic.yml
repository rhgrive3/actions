name: Hex userscript stage generated files
on:
  push:
    paths:
      - .github/workflows/hex-userscript-engine-diagnostic.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout actions repo
        uses: actions/checkout@v4
        with:
          path: actions-repo
      - name: Checkout hex-ida fix branch
        uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: fix/userscript-protected-worker-sentinel-origin
          path: hex-ida
      - name: Install Node deps
        working-directory: hex-ida
        timeout-minutes: 4
        run: npm ci --silent > /tmp/npm-ci.log 2>&1
      - name: Build userscript
        working-directory: hex-ida
        timeout-minutes: 3
        run: npm run userscript:build > /tmp/userscript-build.log 2>&1
      - name: Stage generated files in actions repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p actions-repo/tmp/hex-userscript-sync
          cp hex-ida/userscript/hex.user.template.js actions-repo/tmp/hex-userscript-sync/hex.user.template.js
          cp hex-ida/userscript/release-version.json actions-repo/tmp/hex-userscript-sync/release-version.json
          cd actions-repo
          git config user.name "actions-userscript-stage"
          git config user.email "actions-userscript-stage@users.noreply.github.com"
          git add tmp/hex-userscript-sync/hex.user.template.js tmp/hex-userscript-sync/release-version.json
          if git diff --cached --quiet; then
            echo "staged files already current"
            exit 0
          fi
          git commit -m "diag: stage hex userscript generated files"
          git push --no-verify origin HEAD:main
