name: Hex userscript engine diagnostic
on:
  push:
    paths:
      - .github/workflows/hex-userscript-engine-diagnostic.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout diagnostic repo
        uses: actions/checkout@v4
      - name: Checkout hex-ida
        uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: main
          path: hex-ida
      - name: Install Node deps
        working-directory: hex-ida
        timeout-minutes: 4
        run: npm ci --silent > /tmp/npm-ci.log 2>&1
      - name: Install Playwright browsers
        working-directory: hex-ida
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium webkit > /tmp/playwright-install.log 2>&1
      - name: Build userscript
        working-directory: hex-ida
        timeout-minutes: 3
        run: npm run userscript:build > /tmp/userscript-build.log 2>&1
      - name: Inject legacy ARM64 worker probe
        working-directory: hex-ida
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/userscript-sandbox-browser-e2e.mjs')
          s = p.read_text()
          marker = "    const x86WorkerState = await child.evaluate(async () => {"
          insert_lines = [
              "    const legacyArm64Probe = await child.evaluate(async () => {",
              "      const worker = new Worker(new URL('https://hex.invalid/js/worker.js'));",
              "      try {",
              "        return await new Promise((resolve) => {",
              "          const timer = setTimeout(() => resolve({ ok: false, error: 'legacy probe timeout' }), 20000);",
              "          worker.onmessage = (event) => {",
              "            const data = event.data;",
              "            if (!data || data.id !== 991) return;",
              "            clearTimeout(timer);",
              "            resolve(data.t === 'ok' ? { ok: data.result?.ok === true, result: data.result || null } : { ok: false, error: data.error || data.t || 'legacy probe failed' });",
              "          };",
              "          worker.onerror = (event) => { clearTimeout(timer); resolve({ ok: false, error: event.message || event.error?.message || 'legacy worker error' }); };",
              "          worker.onmessageerror = () => { clearTimeout(timer); resolve({ ok: false, error: 'legacy worker message error' }); };",
              "          worker.postMessage({ t: 'probe', id: 991, epoch: 0 });",
              "        });",
              "      } finally { worker.terminate(); }",
              "    });",
              "    console.log('legacy-arm64-probe ' + name + ': ' + JSON.stringify(legacyArm64Probe));",
              "    assert.equal(legacyArm64Probe.ok, true, name + ': protected legacy ARM64 worker probe failed: ' + JSON.stringify(legacyArm64Probe));",
              "",
          ]
          insert = "\n".join(insert_lines) + "\n"
          if marker not in s:
              raise SystemExit('insertion marker not found')
          p.write_text(s.replace(marker, insert + marker, 1))
          PY
      - name: Run legacy ARM64 browser probe
        id: diag
        working-directory: hex-ida
        timeout-minutes: 4
        shell: bash
        run: |
          set +e
          node tests/userscript-sandbox-browser-e2e.mjs > /tmp/e2e.log 2>&1
          code=$?
          {
            echo "exit_code=$code"
            echo "--- focused output tail ---"
            tail -n 120 /tmp/e2e.log
          } > engine-diagnostic.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hex-userscript-engine-diagnostic
          path: hex-ida/engine-diagnostic.txt
          retention-days: 1
