name: Hex userscript generated sync
on:
  push:
    paths:
      - .github/workflows/hex-userscript-engine-diagnostic.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout diagnostic repo
        uses: actions/checkout@v4
      - name: Checkout hex-ida fix branch
        uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: fix/userscript-protected-worker-sentinel-origin
          path: hex-ida
      - name: Install Node deps
        working-directory: hex-ida
        timeout-minutes: 4
        run: npm ci --silent > /tmp/npm-ci.log 2>&1
      - name: Build userscript
        working-directory: hex-ida
        timeout-minutes: 3
        run: npm run userscript:build > /tmp/userscript-build.log 2>&1
      - name: Record generated diff
        working-directory: hex-ida
        run: |
          git diff -- userscript/hex.user.template.js userscript/release-version.json > userscript-generated.patch
          git status --short -- userscript/hex.user.template.js userscript/release-version.json > userscript-generated.status
      - name: Upload generated userscript files
        uses: actions/upload-artifact@v4
        with:
          name: hex-userscript-generated
          path: |
            hex-ida/userscript/hex.user.template.js
            hex-ida/userscript/release-version.json
            hex-ida/userscript-generated.patch
            hex-ida/userscript-generated.status
          retention-days: 1
