name: INKWAVE Integration Finalize
on:
  push:
    branches: [update/inkwave-upstream-20260928]
permissions:
  contents: write
jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'finalize INKWAVE integration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replay mobile optimizations and resolve upstream overlaps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Reapply the user's final mobile/iOS/lightweight work over the uploaded/upstream snapshot.
          # On overlapping hunks, keep upstream first; explicit integration patches below restore the
          # performance/input hooks that must coexist with the new Boss/Online/Cargo code.
          for c in \
            cbe8f01b84c2df5ab84c7020075ece36663af619 \
            87a221dbf6ec4b4f1cda5810ccde146f163545a3 \
            217fa61d5e0f43ee9253014a52a62717dfccd106 \
            c7d6349f273f655981a712f2879e1bd347e5f0f7 \
            ea1a7185d6b8014d43ebea81f47e6f8d0e144020
          do
            git cherry-pick -n -Xours "$c"
          done

          # Scope replay to the runtime mirror only.
          git diff --name-only HEAD | grep -v '^inkwave-public/' | while IFS= read -r p; do
            [ -z "$p" ] || git restore --staged --worktree --source=HEAD -- "$p"
          done

          python3 <<'PY'
          from pathlib import Path
          import re

          # index.html: keep the new upstream boot/import-map structure, restore mobile viewport/PWA-safe CSS hooks.
          p = Path("inkwave-public/index.html")
          s = p.read_text()
          s = s.replace('<html lang="en">', '<html lang="ja">')
          s = s.replace(
              '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">',
              '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">'
          )
          vp = '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">'
          mobile_meta = '\n'.join([
              vp,
              '<meta name="apple-mobile-web-app-capable" content="yes">',
              '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">'
          ])
          if 'apple-mobile-web-app-capable' not in s:
              s = s.replace(vp, mobile_meta)
          s = re.sub(r'<title>.*?</title>', '<title>INKWAVE — ナワバリバトル</title>', s, count=1)
          s = re.sub(
              r'<meta name="description" content="[^"]*">',
              '<meta name="description" content="INKWAVE：4対4のナワバリ系インクシューター。ステージを塗って、インクを泳いで、相手チームをたおそう。スマホ・タブレット（ジャイロ対応）でも遊べます。">',
              s, count=1
          )
          if 'name="theme-color"' not in s:
              s = s.replace('</title>', '</title>\n<meta name="theme-color" content="#0d1020">\n<meta name="format-detection" content="telephone=no">', 1)
          if 'styles/mobile.css' not in s:
              s = s.replace('<link rel="stylesheet" href="styles/ui.css">', '<link rel="stylesheet" href="styles/ui.css">\n<link rel="stylesheet" href="styles/mobile.css">', 1)
          s = s.replace(
              'html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1020; user-select: none; -webkit-user-select: none; }',
              'html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1020; user-select: none; -webkit-user-select: none; overscroll-behavior: none; touch-action: none; -webkit-touch-callout: none; }'
          )
          p.write_text(s)

          # input.js: restore unified touch input while preserving upstream keyboard/gamepad behavior.
          p = Path("inkwave-public/src/core/input.js")
          s = p.read_text()
          if "import { MobileInput } from './mobile.js';" not in s:
              s = s.replace("import { G } from './ctx.js';", "import { G } from './ctx.js';\nimport { MobileInput } from './mobile.js';", 1)
          if "this.mobile = new MobileInput(canvas, this);" not in s:
              marker = "    });\n  }\n\n  get lastDevice()"
              if marker not in s:
                  raise SystemExit("input integration marker not found")
              s = s.replace(marker, "    });\n    this.mobile = new MobileInput(canvas, this);\n  }\n\n  get lastDevice()", 1)
          p.write_text(s)

          # renderer.js: retain upstream image-quality updates, but preserve the mobile cost caps and FXAA path.
          p = Path("inkwave-public/src/core/renderer.js")
          s = p.read_text()
          if "import { deviceProfile } from './device.js';" not in s:
              s = s.replace("import { G } from './ctx.js';", "import { G } from './ctx.js';\nimport { deviceProfile } from './device.js';", 1)
          if "this.mobile = G.mobile || deviceProfile();" not in s:
              s = s.replace("    this.settings = settings;\n", "    this.settings = settings;\n    this.mobile = G.mobile || deviceProfile();\n", 1)
          s = s.replace(
              "    const pr = Math.min(window.devicePixelRatio || 1, q.pixelRatio) * this.dynScale;",
              "    const mobileCap = this.mobile.touch ? (this.mobile.ios ? 1.2 : 1.35) : Infinity;\n    const pr = Math.min(window.devicePixelRatio || 1, q.pixelRatio, mobileCap) * this.dynScale;",
              1
          )
          s = s.replace(
              "    const rt = new THREE.WebGLRenderTarget(w * pr, h * pr, { type: THREE.HalfFloatType, samples: q.msaa || 0 });",
              "    const samples = this.mobile.touch ? 0 : (q.msaa || 0);\n    const rt = new THREE.WebGLRenderTarget(w * pr, h * pr, { type: THREE.HalfFloatType, samples });",
              1
          )
          s = s.replace("    if (q.ao) {", "    if (q.ao && !this.mobile.touch) {", 1)
          s = s.replace(
              "this.bloom.enabled = !!(q.bloom && this.settings.bloom);",
              "this.bloom.enabled = !!(q.bloom && this.settings.bloom && !this.mobile.ios);"
          )
          s = s.replace(
              "this.bloom.enabled = !!(this.q.bloom && settings.bloom);",
              "this.bloom.enabled = !!(this.q.bloom && settings.bloom && !this.mobile.ios);"
          )
          s = s.replace(
              "    s = Math.max(0.75, Math.min(1, s));",
              "    s = Math.max(this.mobile.touch ? 0.6 : 0.75, Math.min(1, s));",
              1
          )
          s = s.replace(
              "    const pr = Math.min(window.devicePixelRatio || 1, this.q.pixelRatio) * s;",
              "    const mobileCap = this.mobile.touch ? (this.mobile.ios ? 1.2 : 1.35) : Infinity;\n    const pr = Math.min(window.devicePixelRatio || 1, this.q.pixelRatio, mobileCap) * s;",
              1
          )
          p.write_text(s)
          PY

          echo "=== REQUIRED MOBILE + UPSTREAM FEATURES ==="
          files=(
            inkwave-public/src/core/device.js
            inkwave-public/src/core/gyro.js
            inkwave-public/src/core/mobile.js
            inkwave-public/src/core/shadowcache.js
            inkwave-public/src/i18n.js
            inkwave-public/styles/mobile.css
            inkwave-public/src/boss/boss.js
            inkwave-public/src/net/netmatch.js
            inkwave-public/src/game/lobbySet.js
            inkwave-public/src/world/stages/cargo/layout.js
            inkwave-public/assets/stages/cargo-day.webp
          )
          for p in "${files[@]}"; do test -s "$p" && echo "OK $p" || { echo "MISSING $p"; exit 1; }; done

          checks=(
            "inkwave-public/src/core/input.js|MobileInput"
            "inkwave-public/src/core/input.js|touchPrimary"
            "inkwave-public/src/core/input.js|new MobileInput"
            "inkwave-public/src/core/renderer.js|deviceProfile"
            "inkwave-public/src/core/renderer.js|FXAAShader"
            "inkwave-public/src/core/renderer.js|mobileCap"
            "inkwave-public/src/core/renderer.js|!this.mobile.touch"
            "inkwave-public/src/game/player.js|touch.gyro"
            "inkwave-public/src/main.js|ShadowCache"
            "inkwave-public/src/main.js|_startGyro"
            "inkwave-public/src/main.js|BOSS_MODE"
            "inkwave-public/src/main.js|G.net"
            "inkwave-public/src/ui/menus.js|TOUCH_TAB"
            "inkwave-public/src/ui/menus.js|online"
            "inkwave-public/src/ui/hud.js|isJa"
            "inkwave-public/index.html|styles/mobile.css"
          )
          for c in "${checks[@]}"; do
            p="${c%%|*}"; q="${c#*|}"
            grep -Fq "$q" "$p" && echo "OK $p :: $q" || { echo "MISSING $p :: $q"; exit 1; }
          done

          echo "=== JS SYNTAX + DIFF CHECK ==="
          while IFS= read -r p; do node --check "$p" >/dev/null; done < <(find inkwave-public/src -type f -name '*.js' | sort)
          git diff --check

          # The probe/finalizer must not remain in the resulting branch tree.
          git rm .github/workflows/inkwave-merge-probe.yml
          git add inkwave-public
          git diff --cached --check
          git commit -m "Integrate latest INKWAVE with preserved mobile optimizations"
          git push origin HEAD:update/inkwave-upstream-20260928
