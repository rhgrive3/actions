name: INKWAVE d78 native weapon observation diagnostic
on:
  push:
    branches: [diagnostic/inkwave-d78-native-acceptance-20261028]
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.event_name == 'push' && github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/diagnostic/inkwave-d78-native-acceptance-20261028'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        role: [bow, pencil, dualies]
    steps:
      - name: Checkout exact isolated harness and its source parent
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source parent, changed paths and harness blobs
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.workflow_sha }}" = "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD^)" = d78ae75565f40bdad9ab2cb863389bd457ddb69f
          test "$(git rev-parse HEAD^^{tree})" = 5a501e48c1c5bee04b32e9658fa35d98c04b4883
          expected=$(printf '%s\n' '.circleci/config.yml' '.github/workflows/bootstrap-hex-worker-repos.yml' '.github/workflows/hex-fast-tail-known.yml' '.github/workflows/inkwave-three-weapon-native-diagnostic.yml' 'scripts/check-inkwave-bow-flow.mjs' 'scripts/check-inkwave-bow-native.mjs' 'scripts/check-inkwave-bow-observer.mjs' 'scripts/check-inkwave-charge-observation-probe.mjs' 'scripts/check-inkwave-charger-selection-probe.mjs' 'scripts/check-inkwave-dualies-live-native.mjs' 'scripts/check-inkwave-dualies-live-probe.mjs' 'scripts/check-inkwave-lock-outcome-observer.mjs' 'scripts/check-inkwave-lock-resume-probe.mjs' 'scripts/check-inkwave-pencil-native.mjs' 'scripts/check-inkwave-pencil-probe.mjs' 'scripts/check-inkwave-safe-pause-probe.mjs' 'scripts/check-inkwave-safe-resume-probe.mjs' 'scripts/lib/inkwave-offline-range-gate.mjs' 'scripts/tests/inkwave-bow-native.test.mjs' 'scripts/tests/inkwave-dualies-live-native.test.mjs' 'scripts/tests/inkwave-dualies-live-probe.test.mjs' 'scripts/tests/inkwave-offline-range-gate.test.mjs' 'scripts/tests/inkwave-pencil-native.test.mjs' 'scripts/tests/inkwave-pencil-probe.test.mjs' | sort)
          actual=$(git diff --no-renames --name-only HEAD^ HEAD | sort)
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:.circleci/config.yml)" = 01514a2c30d9cac2420d2f18cc6d51b7a38af55a
          test "$(git rev-parse HEAD:.github/workflows/bootstrap-hex-worker-repos.yml)" = ac413b3985a850bd73a2551d405eaae5a48a66b7
          test "$(git rev-parse HEAD:.github/workflows/hex-fast-tail-known.yml)" = 57a36cebf1f9a56d6eaec5a4580f92d5f2788a86
          test "$(git rev-parse HEAD:scripts/check-inkwave-bow-flow.mjs)" = c05c38e10ac95f6a4bfd6a274897c8ecf255d3a5
          test "$(git rev-parse HEAD:scripts/check-inkwave-bow-native.mjs)" = 48e544daeb4fdc5296643ca4edf5772084a7c86f
          test "$(git rev-parse HEAD:scripts/check-inkwave-bow-observer.mjs)" = 5ca72d2f5eb716e92cc51142a0b51fbeb306d7aa
          test "$(git rev-parse HEAD:scripts/check-inkwave-charge-observation-probe.mjs)" = f8f80772de5b55f320fd86056f8ee18c52da1df7
          test "$(git rev-parse HEAD:scripts/check-inkwave-charger-selection-probe.mjs)" = a5ccd695248b8932beab6c565a783cd109cd25a3
          test "$(git rev-parse HEAD:scripts/check-inkwave-dualies-live-native.mjs)" = 7a594c6a44120569015d5d00d3b00c11b872e8d6
          test "$(git rev-parse HEAD:scripts/check-inkwave-dualies-live-probe.mjs)" = ec4a60db9c8ff619637897a51ba0798242171987
          test "$(git rev-parse HEAD:scripts/check-inkwave-lock-outcome-observer.mjs)" = fe2473487261e479d4f8b93e4193908aa643a350
          test "$(git rev-parse HEAD:scripts/check-inkwave-lock-resume-probe.mjs)" = 5900a8d6c0ccaa9260b550865f4220dda7b4a963
          test "$(git rev-parse HEAD:scripts/check-inkwave-pencil-native.mjs)" = f256c081bbf942680e4c3920191901a56848ae73
          test "$(git rev-parse HEAD:scripts/check-inkwave-pencil-probe.mjs)" = 8f3062925b1a5ebd4360a70a2b786fe0c2f26132
          test "$(git rev-parse HEAD:scripts/check-inkwave-safe-pause-probe.mjs)" = 200ed8dd1959ea1282765bc7b15270cbac0f14dc
          test "$(git rev-parse HEAD:scripts/check-inkwave-safe-resume-probe.mjs)" = a35b1eeffb34f4156b6ec244813b58350c05658e
          test "$(git rev-parse HEAD:scripts/lib/inkwave-offline-range-gate.mjs)" = 5267336fef8afd2a6f7f273cd0104f8e0c7d2902
          test "$(git rev-parse HEAD:scripts/lib/inkwave-range-menu-entry.mjs)" = ad12a3987e17540b7a15f61745100acd601c1af2
          test "$(git rev-parse HEAD:scripts/lib/inkwave-runtime-evidence.mjs)" = eda5bf0f09dd87a34cffa20833ca228373c8453f
          test "$(git rev-parse HEAD:scripts/tests/inkwave-bow-native.test.mjs)" = 079bef004c525948c232952dc4aad774d529331f
          test "$(git rev-parse HEAD:scripts/tests/inkwave-dualies-live-native.test.mjs)" = 7a9d355874ef836e69d2e7019b5f46cfdbdb1f72
          test "$(git rev-parse HEAD:scripts/tests/inkwave-dualies-live-probe.test.mjs)" = 1349042c805ebf6de8cd7772738c6944256a0c84
          test "$(git rev-parse HEAD:scripts/tests/inkwave-offline-range-gate.test.mjs)" = 4be9ae757912e5679ff6c70ffebe57b1b743cef6
          test "$(git rev-parse HEAD:scripts/tests/inkwave-pencil-native.test.mjs)" = 29c746f77ea90f183466a830bded3e6c1fef46d5
          test "$(git rev-parse HEAD:scripts/tests/inkwave-pencil-probe.test.mjs)" = d3209db8a5bd2c8e607073c187025af890fcbaa8
      - name: Download exact d78 build from verified run
        uses: actions/download-artifact@v4
        with:
          name: inkwave-patched-site-d78ae75565f40bdad9ab2cb863389bd457ddb69f
          path: diagnostic-build
          github-token: ${{ github.token }}
          repository: rhgrive3/actions
          run-id: 40710586397
      - name: Verify fixed artifact and source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c %s diagnostic-build/immutable-site.tar)" = 122501120
          echo 'b6f03c30234a3128d03c6eb3a595c9a9d06ac0d2b900fe069e99bfde7f166eee  diagnostic-build/immutable-site.tar' | sha256sum -c -
          tar -xf diagnostic-build/immutable-site.tar
          test "$(cat _site-source-sha.txt)" = d78ae75565f40bdad9ab2cb863389bd457ddb69f
          echo '77162c8e458f798171bdb8bd244ab4e97296eeab2d9bb0280b206d8f1c73afe3  _site/inkwave-build.json' | sha256sum -c -
          echo '334f1a679bfaa2f9af6494596749aa9de3f8c6f559e88bcda457cc7727d16f7d  _site/sw.js' | sha256sum -c -
      - name: Install pinned tools and secure Chromium
        run: |
          npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1 ws@8
          npx playwright install --with-deps chromium
      - name: Run all observer and offline gate contracts
        run: node --test scripts/tests/inkwave-bow-native.test.mjs scripts/tests/inkwave-pencil-native.test.mjs scripts/tests/inkwave-pencil-probe.test.mjs scripts/tests/inkwave-dualies-live-native.test.mjs scripts/tests/inkwave-dualies-live-probe.test.mjs scripts/tests/inkwave-offline-range-gate.test.mjs
      - name: Observe native Range for selected role
        shell: bash
        env:
          ROLE: ${{ matrix.role }}
        run: |
          set +e
          mkdir -p evidence
          case "$ROLE" in
            bow) driver=scripts/check-inkwave-bow-native.mjs ;;
            pencil) driver=scripts/check-inkwave-pencil-native.mjs ;;
            dualies) driver=scripts/check-inkwave-dualies-live-native.mjs ;;
            *) exit 1 ;;
          esac
          timeout --signal=TERM --kill-after=10s 1140s node "$driver" --root "$GITHUB_WORKSPACE" --site "$GITHUB_WORKSPACE/_site" --out "$GITHUB_WORKSPACE/evidence/outcome"
          code=$?
          printf 'exit=%s\n' "$code" > evidence/exit-code.txt
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            CODE="$code" node -e 'const fs=require("fs"),p="evidence/outcome/"+(process.env.ROLE==="dualies"?"dualies-live-result.json":"lock-outcome-result.json");fs.mkdirSync("evidence/outcome",{recursive:true});let r={schema:1};try{r=JSON.parse(fs.readFileSync(p))}catch{}r.status="failed";r.observedExitCode=Number(process.env.CODE);r.terminationReason="unverified: timeout wrapper or process may produce the same exit code";r.cleanupOutcome="unknown after exit 124 or 137";r.error ||= "Process returned exit 124 or 137; reason unknown";fs.writeFileSync(p,JSON.stringify(r,null,2)+"\n")'
          fi
          exit "$code"
      - name: Preserve diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d78-native-${{ matrix.role }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
