name: Diagnose frozen INKWAVE controlled launch
on:
  push:
    branches: [review/stage-controlled-4318-20261014]
permissions:
  contents: read
concurrency:
  group: inkwave-controlled-launch-4318-${{ github.sha }}
  cancel-in-progress: false
jobs:
  paired-game:
    if: github.event_name == 'push' && github.ref == 'refs/heads/review/stage-controlled-4318-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STAGE_PHASE_TRACE_ONLY: '1'
      BASELINE_SHA: 55b4750aea5e45136a588fbd7242c106aff2323a
      CANDIDATE_SHA: 4318dca34dfb68443d7c962cacd905aa65d8202e
      DIAGNOSTIC_HARNESS_SHA: ${{ github.sha }}
      CANDIDATE_TREE: 52cdad1449199dd7d7a2b89ccbdb0b71afe302e3
    steps:
      - name: Validate immutable inputs
        shell: bash
        run: |
          test "$CANDIDATE_SHA" = 4318dca34dfb68443d7c962cacd905aa65d8202e
          test "$CANDIDATE_TREE" = 52cdad1449199dd7d7a2b89ccbdb0b71afe302e3
          [[ "$DIAGNOSTIC_HARNESS_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DIAGNOSTIC_HARNESS_SHA }}
          persist-credentials: false
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          persist-credentials: false
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          path: candidate
      - name: Bind frozen candidate and separate immutable diagnostic harness
        shell: bash
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C harness rev-parse HEAD)" = "$DIAGNOSTIC_HARNESS_SHA"
          test "$(git -C harness hash-object scripts/check-inkwave-stage-game-pair.mjs)" = 0b8dc294ffecc396235da137beb9b84dd4e74082
          test "$(git -C harness hash-object scripts/lib/inkwave-projectile-visibility-probe.mjs)" = b7f6b40f690126de10a90e1a4131c9da973d44ae
          tree=$(git -C candidate rev-parse HEAD^{tree})
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
          test "$tree" = "$CANDIDATE_TREE"
          echo "CANDIDATE_TREE=$tree" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install fixed browser/build dependencies
        working-directory: harness
        run: |
          npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify only the isolated diagnostic contracts
        working-directory: harness
        run: node --test scripts/test-inkwave-lighting-controls.mjs scripts/test-stage-capture-controls.mjs scripts/test-stage-controlled-host.mjs scripts/test-stage-spawn-trace.mjs
      - name: Build both immutable public sites without model payload
        id: builds
        shell: bash
        run: |
          mkdir -p evidence
          echo "BASELINE_ROOT=$GITHUB_WORKSPACE/baseline" >> "$GITHUB_ENV"
          echo "CANDIDATE_ROOT=$GITHUB_WORKSPACE/candidate" >> "$GITHUB_ENV"
          echo "BASELINE_SITE=$GITHUB_WORKSPACE/baseline-site" >> "$GITHUB_ENV"
          echo "CANDIDATE_SITE=$GITHUB_WORKSPACE/candidate-site" >> "$GITHUB_ENV"
          echo "STAGE_PAIR_BINDINGS=$GITHUB_WORKSPACE/evidence/build-bindings.json" >> "$GITHUB_ENV"
          test "$(git -C baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          export ESBUILD_MODULE="$GITHUB_WORKSPACE/harness/node_modules/esbuild/lib/main.js"
          (cd baseline && node scripts/build-inkwave.mjs inkwave-public ../baseline-site) > evidence/baseline-build.log 2>&1
          (cd candidate && node scripts/build-inkwave.mjs inkwave-public ../candidate-site) > evidence/candidate-build.log 2>&1
      - name: Verify immutable build bindings
        id: bindings
        working-directory: harness
        run: node scripts/bind-inkwave-stage-pair.mjs
      - name: Preserve original natural Game pair verdict
        id: natural
        # Phase-only diagnostic preserves prior natural evidence; no repeated PNG capture.
        if: env.STAGE_PHASE_TRACE_ONLY != '1'
        working-directory: harness
        run: node scripts/check-inkwave-stage-game-pair.mjs "$CANDIDATE_SITE" "$GITHUB_WORKSPACE/evidence/game-pair" "$BASELINE_SITE"
      - name: Collect separate bounded spawn phase diagnostic
        # A failed natural verdict is preserved, not turned into success.
        if: ${{ !cancelled() && steps.builds.outcome == 'success' && steps.bindings.outcome == 'success' }}
        working-directory: harness
        run: |
          printf '%s\n' "$DIAGNOSTIC_HARNESS_SHA" > "$GITHUB_WORKSPACE/evidence/diagnostic-harness-sha.txt"
          node scripts/run-inkwave-controlled-launch-pair.mjs "$CANDIDATE_SITE" "$GITHUB_WORKSPACE/evidence/controlled-diagnostic" "$BASELINE_SITE"
      - name: Verify candidate catalogue Game admission and real relay paint
        # Explicit hold: real-relay verification awaits confirmation of its allowed scope.
        # Do not remove this hold or report this gate passed based on offline results.
        if: ${{ false }}
        working-directory: harness
        env:
          NATIVE_STAGE_IDS: inkblot
          NATIVE_ONLINE_MODES: turf
          NATIVE_HOST_WEAPON: s3-blaster-short
        run: |
          test -f "$CANDIDATE_SITE/inkwave-build.json"
          export NATIVE_ONLINE_SOURCE_ROOT="$CANDIDATE_ROOT"
          export CHROMIUM_PATH="$(node --input-type=module -e "import {chromium} from 'playwright';console.log(chromium.executablePath())")"
          cp "$CANDIDATE_ROOT/scripts/check-inkwave-native-catalogue-online.mjs" scripts/stage-candidate-online-runtime.mjs
          sha256sum scripts/stage-candidate-online-runtime.mjs > "$GITHUB_WORKSPACE/evidence/online-checker-sha256.txt"
          node scripts/stage-candidate-online-runtime.mjs "$CANDIDATE_SITE" "$GITHUB_WORKSPACE/evidence/catalogue-online"
      - name: Record outstanding real-relay verification hold
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          printf '%s\n' '{"gate":"candidate catalogue Game admission and real relay paint","status":"held-not-run","reason":"Real-relay scope clarification pending; offline Game and lighting results do not satisfy this gate"}' > evidence/catalogue-online-held.json
      - name: Preserve bounded receipts and captures (no source models or grids)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-controlled-diagnostic-${{ env.CANDIDATE_SHA }}-${{ env.DIAGNOSTIC_HARNESS_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
