name: INKWAVE reopened-six focused regressions
on:
  pull_request:
    paths:
      - 'patches/splatoon3/**'
      - 'patches/local-quality/**'
      - 'scripts/run-inkwave-turf-finish-isolated.mjs'
      - 'scripts/tests/run-inkwave-turf-finish-*.test.mjs'
      - '.github/workflows/inkwave-reopened-six.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  reopened-six:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify immutable checkout identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_source_sha="$(git rev-parse HEAD)"
          printf 'Expected source: %s\nActual checkout: %s\n' "$EXPECTED_SOURCE_SHA" "$actual_source_sha"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test reopened gameplay issues against production source
        run: |
          node --experimental-vm-modules --test \
            patches/splatoon3/tests/superjump-gameplay.test.mjs \
            patches/splatoon3/tests/support-kit-recon-cooler.test.mjs \
            patches/splatoon3/tests/support-kit-two-peer.test.mjs \
            patches/splatoon3/tests/issue-835-cooler-punisher.test.mjs \
            patches/splatoon3/tests/issue-514-sourced-partial-range.test.mjs \
            patches/splatoon3/tests/issue-1108-roller-wall-idle.test.mjs \
            patches/splatoon3/tests/map-reveal.test.mjs \
            patches/local-quality/tests/bot-paint-device-profile.test.mjs \
            patches/local-quality/tests/bot-paint-observation.test.mjs \
            patches/loading-cache/tests/cargo-offline-precache.test.mjs
      - name: Verify all Turf finish cases on source
        run: node scripts/run-inkwave-turf-finish-isolated.mjs . source .ci-scratch/turf-finish-source
      - name: Retain bounded Turf source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkwave-turf-finish-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: .ci-scratch/turf-finish-source/
          if-no-files-found: error
          retention-days: 14
