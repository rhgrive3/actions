name: Hex Cloudflare publication check
on:
  push:
    paths:
      - .github/workflows/hex-cf-publication-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch published userscript metadata
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 20             https://ida.rhgrive.workers.dev/hex.meta.js             -o /tmp/hex.meta.js
          {
            grep -E '^// @(version|updateURL|downloadURL)' /tmp/hex.meta.js || true
            echo "---"
            curl -fsS --connect-timeout 10 --max-time 20               https://ida.rhgrive.workers.dev/health || true
          } > cf-check.txt
      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: hex-cf-publication-check
          path: cf-check.txt
          retention-days: 1
