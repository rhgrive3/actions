name: INKWAVE Wiper native plane pilot
on:
  push:
    branches: ['diagnostic/wiper-plane-native-20261021']
    paths: ['.github/workflows/inkwave-wiper-plane-pilot.yml']
permissions:
  contents: read
jobs:
  build-once:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 0430673b09a5009628fc87baa414b3560090fc1d
          path: work/wiper-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.28.2 playwright@1.62.1
      - name: Verify video tools before capture work
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffprobe -version
          ffmpeg -hide_banner -encoders | grep libx264
          ffmpeg -hide_banner -filters | grep drawtext
      - name: Verify source, compiler, QA and readiness negatives
        run: |
          test "$(git -C work/wiper-source rev-parse HEAD)" = 0430673b09a5009628fc87baa414b3560090fc1d
          diff -qr patches work/wiper-source/patches
          diff -qr inkwave-public work/wiper-source/inkwave-public
          for file in scripts/inkwave-source-composition.mjs scripts/lib/inkwave-source-compaction.mjs scripts/build-inkwave.mjs scripts/lib/inkwave-runtime-evidence.mjs scripts/lib/inkwave-range-menu-entry.mjs; do
            cmp "$file" "work/wiper-source/$file"
          done
          node --check scripts/check-inkwave-wiper-plane-native.mjs
          node --check scripts/check-inkwave-wiper-plane-paired.mjs
          node --test scripts/tests/inkwave-wiper-scene-readiness.test.mjs
      - name: Build and bind one immutable emitted workload
        run: |
          export ESBUILD_MODULE="$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js"
          (cd work/wiper-source && node scripts/build-inkwave.mjs inkwave-public ../wiper-site)
          node scripts/prepare-inkwave-wiper-plane-baseline.mjs work/wiper-source work/wiper-site work/wiper-overlay
          node -e "const m=require('./work/wiper-site/inkwave-build.json'); if(m.contentHash!=='8e350111a0469095d2872093322809f70da7d31237e520226946cbb0740c4c16')throw new Error('Exact prior emitted workload required before capture jobs');"
      - uses: actions/upload-artifact@v4
        with:
          name: wiper-one-build
          include-hidden-files: true
          path: |
            work/wiper-site/
            work/wiper-overlay/
          if-no-files-found: error
  capture:
    needs: build-once
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 0430673b09a5009628fc87baa414b3560090fc1d
          path: work/wiper-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: wiper-one-build
          path: work
      - name: Native Dental case, bounded 30 minutes including final GPU drain
        run: timeout 30m node scripts/check-inkwave-wiper-plane-native.mjs work/wiper-site work/wiper-source work/wiper-overlay work/wiper-native/s3-saber-heavy-charged-${{ matrix.variant }} ${{ matrix.variant }} s3-saber-heavy charged --dental-pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiper-dental-${{ matrix.variant }}
          path: work/wiper-native/
          if-no-files-found: error
  compare:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - uses: actions/download-artifact@v4
        with:
          pattern: wiper-dental-*
          path: work/wiper-native
          merge-multiple: true
      - name: Compare all 161 numerical frames and captured actual pixels
        run: node scripts/check-inkwave-wiper-plane-paired.mjs work/wiper-site work/wiper-source work/wiper-overlay work/wiper-native --compare-dental-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiper-dental-comparison
          path: |
            work/wiper-native/paired-result.json
            work/wiper-native/*.mp4
            work/wiper-native/*.ffprobe.json
            work/wiper-native/*.framemd5
          if-no-files-found: error
