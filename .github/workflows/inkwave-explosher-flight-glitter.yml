name: INKWAVE Explosher regressions and reviewed-build diagnostic
on:
  pull_request:
    paths:
      - 'patches/splatoon3/runtime/s3-projectile-shapes.mjs'
      - 'patches/splatoon3/tests/explosher-flight-glitter.test.mjs'
      - 'scripts/check-inkwave-explosher-flight-glitter.mjs'
      - 'scripts/lib/inkwave-explosher-scene-census.mjs'
      - 'scripts/lib/inkwave-explosher-startup.mjs'
      - 'scripts/lib/inkwave-explosher-capture-surface.mjs'
      - 'patches/splatoon3/tests/explosher-capture-surface.test.mjs'
      - 'patches/splatoon3/tests/explosher-capture-guards.test.mjs'
      - 'patches/splatoon3/tests/explosher-rng-trace.test.mjs'
      - '.github/workflows/inkwave-explosher-flight-glitter.yml'
permissions:
  contents: read
concurrency:
  group: explosher-glitter-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-pair:
    # Current-head source/emitted checks. The reviewed historical capture below
    # has a separate identity and cannot certify this PR's rendered output.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock esbuild@0.28.2
      - name: Native production-composition regressions
        run: node --experimental-vm-modules --test patches/splatoon3/tests/s3-projectile-shapes.test.mjs patches/splatoon3/tests/explosher-flight-glitter.test.mjs patches/splatoon3/tests/explosher-capture-guards.test.mjs patches/splatoon3/tests/explosher-rng-trace.test.mjs patches/splatoon3/tests/explosher-capture-surface.test.mjs scripts/tests/inkwave-projectile-character-reset.test.mjs patches/splatoon3/tests/projectile-visuals.test.mjs
      - name: Build exact PR head and check emitted native muzzle
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node scripts/build-inkwave.mjs inkwave-public .built-site/explosher-current
          node scripts/check-inkwave-startup-budget.mjs .built-site/explosher-current
          INKWAVE_BUILT_SITE=.built-site/explosher-current node --experimental-vm-modules --test patches/splatoon3/tests/issue-1431-explosher-authored-muzzle.test.mjs

  reviewed-common-build-diagnostic:
    # The capture wrapper admits exactly the reviewed descriptor; arbitrary
    # PR base/head checkouts are not valid inputs to this historical A/A probe.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 364dd0a7fad9508652b4b4c6ec3d82eb124e9c5c
          path: .ci-explosher-common
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1 ws@8
      - run: npx playwright install --with-deps chromium
      - name: Build immutable reviewed subject
        run: |
          test "$(git -C .ci-explosher-common rev-parse HEAD)" = "364dd0a7fad9508652b4b4c6ec3d82eb124e9c5c"
          node .ci-explosher-common/scripts/build-inkwave.mjs .ci-explosher-common/inkwave-public .built-site/explosher-common
      - name: Repeat strict preflight on the same reviewed build
        run: |
          EXPLOSHER_PREFLIGHT=1 node scripts/check-inkwave-explosher-flight-glitter.mjs .built-site/explosher-common .ci-scratch/explosher/preflight-before "364dd0a7fad9508652b4b4c6ec3d82eb124e9c5c" .ci-explosher-common
          EXPLOSHER_PREFLIGHT=1 node scripts/check-inkwave-explosher-flight-glitter.mjs .built-site/explosher-common .ci-scratch/explosher/preflight-after "364dd0a7fad9508652b4b4c6ec3d82eb124e9c5c" .ci-explosher-common
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const read=s=>JSON.parse(fs.readFileSync('.ci-scratch/explosher/preflight-'+s+'/manifest.json'));
          const a=read('before'),b=read('after');assert.equal(a.length,1);assert.equal(b.length,1);
          const mismatches=[],check=(key,b,a)=>{try{assert.deepEqual(b,a,key);}catch{mismatches.push(key);}};
          for(const k of ['rng','effects','style','sceneClocks','startup','aimTrace','nativeReset','physical','camera','palette','inkHex','time','sparkles','lighting','viewport'])check(k,b[0].measurement[k],a[0].measurement[k]);
          for(const k of ['aimPoint','aimDir','aimYaw','aimPitch','characterTime'])check('preShot '+k,b[0].measurement.preShot[k],a[0].measurement.preShot[k]);
          const effectiveRig=r=>({...r,blend:r.blend?.active?r.blend:null,superJumpLandTime:r.superJumpLandTime<.45?r.superJumpLandTime:null});
          check('effective preShot rig',effectiveRig(b[0].measurement.preShot.rig),effectiveRig(a[0].measurement.preShot.rig));
          const diagnostic={diagnosticOnly:true,fullPairAccepted:false,mismatches,before:a[0].measurement.rngDiagnostic,after:b[0].measurement.rngDiagnostic};
          fs.writeFileSync('.ci-scratch/explosher/preflight-diagnostic.json',JSON.stringify(diagnostic,null,2));
          console.log('EXPLOSHER_PREFLIGHT_DIAGNOSTIC '+JSON.stringify(diagnostic));
          assert.equal(mismatches.length,0,'Every preflight state must agree');
          // Raw values stay in receipts; only branches the native rig does not consume are normalized.
          console.log('EXPLOSHER_PREFLIGHT_STRICT_PARITY passed');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explosher-reviewed-common-AA-${{ github.event.pull_request.head.sha }}
          path: .ci-scratch/explosher/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
