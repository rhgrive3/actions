name: INKWAVE Explosher flight glitter
on:
  pull_request:
    paths:
      - 'patches/splatoon3/tests/s3-projectile-shapes.test.mjs'
      - 'scripts/tests/inkwave-projectile-character-reset.test.mjs'
      - 'patches/splatoon3/tests/projectile-visuals.test.mjs'
      - 'patches/splatoon3/runtime/s3-projectile-shapes.mjs'
      - 'patches/splatoon3/tests/explosher-flight-glitter.test.mjs'
      - 'scripts/check-inkwave-explosher-flight-glitter.mjs'
      - 'scripts/lib/inkwave-explosher-secure-launch.mjs'
      - 'scripts/tests/inkwave-explosher-secure-launch.test.mjs'
      - 'scripts/lib/inkwave-explosher-geometry-lifetime.mjs'
      - 'scripts/tests/inkwave-explosher-geometry-lifetime.test.mjs'
      - 'scripts/prepare-inkwave-ci-video-tools.mjs'
      - 'scripts/prepare-inkwave-ci-apt.py'
      - 'scripts/tests/inkwave-ci-video-tools.test.mjs'
      - 'scripts/check-inkwave-current-explosher-native.mjs'
      - 'scripts/lib/inkwave-explosher-runtime-ui-preflight.mjs'
      - 'scripts/tests/inkwave-explosher-runtime-ui-preflight.test.mjs'
      - 'scripts/lib/inkwave-explosher-scene-census.mjs'
      - 'scripts/lib/inkwave-explosher-startup.mjs'
      - 'scripts/lib/inkwave-explosher-capture-surface.mjs'
      - 'patches/splatoon3/tests/explosher-capture-surface.test.mjs'
      - 'patches/splatoon3/tests/explosher-capture-guards.test.mjs'
      - 'patches/splatoon3/tests/explosher-rng-trace.test.mjs'
      - '.github/workflows/inkwave-explosher-flight-glitter.yml'
      - 'scripts/lib/inkwave-explosher-common-build.mjs'
      - 'scripts/lib/inkwave-explosher-inverse-contract.mjs'
      - 'scripts/lib/inkwave-explosher-volume-barrier.mjs'
      - 'scripts/lib/inkwave-explosher-video-gate.mjs'
      - 'scripts/lib/inkwave-explosher-stage-admission.mjs'
      - 'scripts/check-inkwave-explosher-absolute-geometries.mjs'
      - 'scripts/tests/inkwave-explosher-absolute-geometries.test.mjs'
      - 'scripts/tests/inkwave-explosher-full-pair-workflow.test.mjs'
      - 'scripts/ci/inkwave-test-suites.json'
      - 'scripts/lib/inkwave-projectile-capture-ui.mjs'
      - 'scripts/lib/inkwave-range-menu-entry.mjs'
      - 'scripts/render-inkwave-projectile-shapes.mjs'
      - 'scripts/check-inkwave-projectile-visuals.mjs'
      - 'scripts/compile-inkwave-explosher-inverse-pair.mjs'
      - 'scripts/compile-inkwave-explosher-controlled-main.mjs'
      - 'scripts/fixtures/explosher-inverse-baseline.mjs'
permissions:
  contents: read
concurrency:
  group: explosher-glitter-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          # Specialized QA admits only this independently pinned common build.
          ref: 364dd0a7fad9508652b4b4c6ec3d82eb124e9c5c
          path: .ci-explosher-base
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1 ws@8
      - name: Strict runtime/UI preflight protocol contracts
        run: node --test scripts/tests/inkwave-explosher-runtime-ui-preflight.test.mjs scripts/tests/inkwave-explosher-geometry-lifetime.test.mjs scripts/tests/inkwave-ci-video-tools.test.mjs scripts/tests/inkwave-explosher-absolute-geometries.test.mjs scripts/tests/inkwave-explosher-full-pair-workflow.test.mjs scripts/tests/inkwave-explosher-secure-launch.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Install required PNG decoder
        run: node scripts/prepare-inkwave-ci-video-tools.mjs --receipt .ci-scratch/explosher/video-tool-provision.json
      - name: Native production-composition regressions
        run: node --experimental-vm-modules --test patches/splatoon3/tests/s3-projectile-shapes.test.mjs patches/splatoon3/tests/explosher-flight-glitter.test.mjs patches/splatoon3/tests/explosher-capture-guards.test.mjs patches/splatoon3/tests/explosher-rng-trace.test.mjs patches/splatoon3/tests/explosher-capture-surface.test.mjs scripts/tests/inkwave-explosher-workflow-admission.test.mjs scripts/tests/inkwave-projectile-character-reset.test.mjs patches/splatoon3/tests/projectile-visuals.test.mjs
      - name: Build exact candidate and admitted immutable common source
        run: |
          node scripts/build-inkwave.mjs inkwave-public .built-site/explosher-current
          node scripts/check-inkwave-startup-budget.mjs .built-site/explosher-current
          node .ci-explosher-base/scripts/build-inkwave.mjs .ci-explosher-base/inkwave-public .built-site/explosher-common
          node --input-type=module -e "import {requireApprovedCommonBuild} from './scripts/lib/inkwave-explosher-common-build.mjs'; console.log(JSON.stringify(requireApprovedCommonBuild('.ci-explosher-base','.built-site/explosher-common')));"
      - name: Require latest-head native Explosher input and rendering
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-inkwave-current-explosher-native.mjs .built-site/explosher-current .ci-scratch/explosher/current-native "$EXPECTED_HEAD"
      - name: Compile reviewed inverse pair without changing production artifacts
        run: |
          node scripts/compile-inkwave-explosher-inverse-pair.mjs .ci-explosher-base .built-site/explosher-common scripts/fixtures/explosher-inverse-baseline.mjs .ci-scratch/explosher/shape
          node scripts/compile-inkwave-explosher-controlled-main.mjs .ci-explosher-base .built-site/explosher-common .ci-scratch/explosher/main
      - name: Short admitted same-build native preflight before long capture
        env:
          EXPLOSHER_PREFLIGHT: '1'
          EXPLOSHER_CONTROLLED_MAIN: .ci-scratch/explosher/main/controlled-main-receipt.json
        run: |
          # Historical common-build QA; no latest-gameplay parity claim.
          # Latest-head production composition is tested and built above.
          for lane in before after; do
            EXPLOSHER_SHAPE_OVERLAY=".ci-scratch/explosher/shape/${lane}-shape-receipt.json" node scripts/check-inkwave-explosher-flight-glitter.mjs .built-site/explosher-common ".ci-scratch/explosher/preflight-${lane}" 364dd0a7fad9508652b4b4c6ec3d82eb124e9c5c .ci-explosher-base
          done
          node --input-type=module -e "import fs from 'node:fs'; import {readExplosherStagePair} from './scripts/lib/inkwave-explosher-stage-admission.mjs'; fs.writeFileSync('.ci-scratch/explosher/preflight-diagnostic.json',JSON.stringify(readExplosherStagePair('preflight','.ci-scratch/explosher/preflight-before','.ci-scratch/explosher/preflight-after'),null,2));"
      - name: Enforce original absolute Explosher geometry guard
        run: node scripts/check-inkwave-explosher-absolute-geometries.mjs preflight .ci-scratch/explosher/preflight-before .ci-scratch/explosher/preflight-after .ci-scratch/explosher/preflight-diagnostic.json .ci-scratch/explosher/absolute-geometry-admission.json
      # Historical same-build inverse only: not current-head two-build acceptance.
      # Every following step uses normal success semantics, after both strict
      # same-run preflight and the original absolute geometry admission pass.
      - name: Capture admitted inverse baseline stills
        env:
          EXPLOSHER_PREFLIGHT: '0'
          EXPLOSHER_VIDEO: '0'
          EXPLOSHER_CONTROLLED_MAIN: .ci-scratch/explosher/main/controlled-main-receipt.json
          EXPLOSHER_SHAPE_OVERLAY: .ci-scratch/explosher/shape/before-shape-receipt.json
          EXPLOSHER_ADMIT_BEFORE: .ci-scratch/explosher/preflight-before
          EXPLOSHER_ADMIT_AFTER: .ci-scratch/explosher/preflight-after
          EXPLOSHER_EXPECT_PREFLIGHT: .ci-scratch/explosher/preflight-before/manifest.json
        run: node scripts/check-inkwave-explosher-flight-glitter.mjs .built-site/explosher-common .ci-scratch/explosher/stills-before 364dd0a7fad9508652b4b4c6ec3d82eb124e9c5c .ci-explosher-base
      - name: Capture admitted inverse candidate stills
        env:
          EXPLOSHER_PREFLIGHT: '0'
          EXPLOSHER_VIDEO: '0'
          EXPLOSHER_CONTROLLED_MAIN: .ci-scratch/explosher/main/controlled-main-receipt.json
          EXPLOSHER_SHAPE_OVERLAY: .ci-scratch/explosher/shape/after-shape-receipt.json
          EXPLOSHER_ADMIT_BEFORE: .ci-scratch/explosher/preflight-before
          EXPLOSHER_ADMIT_AFTER: .ci-scratch/explosher/preflight-after
          EXPLOSHER_EXPECT_PREFLIGHT: .ci-scratch/explosher/preflight-after/manifest.json
        run: node scripts/check-inkwave-explosher-flight-glitter.mjs .built-site/explosher-common .ci-scratch/explosher/stills-after 364dd0a7fad9508652b4b4c6ec3d82eb124e9c5c .ci-explosher-base
      - name: Require all-frame same-build inverse acceptance
        run: |
          set -euo pipefail
          node --input-type=module -e "import fs from 'node:fs'; import {readExplosherStagePair} from './scripts/lib/inkwave-explosher-stage-admission.mjs'; fs.writeFileSync('.ci-scratch/explosher/stills-admission.json',JSON.stringify(readExplosherStagePair('stills','.ci-scratch/explosher/stills-before','.ci-scratch/explosher/stills-after'),null,2),{flag:'wx'});"
          node scripts/check-inkwave-explosher-absolute-geometries.mjs stills .ci-scratch/explosher/stills-before .ci-scratch/explosher/stills-after .ci-scratch/explosher/stills-admission.json .ci-scratch/explosher/stills-absolute-geometry-admission.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explosher-native-pair-${{ github.event.pull_request.head.sha }}
          path: .ci-scratch/explosher/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
          include-hidden-files: true

