name: INKWAVE isolated bitmap ownership acceptance
on:
  push:
    branches: [review/native-bitmap-ownership-20261015]
permissions:
  contents: read
concurrency:
  group: native-bitmap-ownership-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bitmap:
    if: github.event_name == 'push' && github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/review/native-bitmap-ownership-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Verify frozen payloads
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('scripts/native-bitmap');m=json.loads((p/'publication.json').read_text())
          actual={f.name for f in p.iterdir() if f.is_file() and f.name!='publication.json'}
          assert actual|{'native-bitmap.yml'}==set(m['files'])
          for name,pin in m['files'].items():
              f=pathlib.Path('.github/workflows/native-bitmap.yml') if name=='native-bitmap.yml' else p/name
              b=f.read_bytes();assert len(b)==pin['bytes'] and hashlib.sha256(b).hexdigest()==pin['sha256'],name
          assert hashlib.sha256((p/'harness-package.json').read_bytes()).hexdigest()=='f70f8d5198c670b35c5ec7f6b60ccc58a7bb16ba70b8d932bc72788d0cef5865'
          h=json.loads((p/'harness-package.json').read_text())
          for name,pin in h['files'].items():
              b=(p/name).read_bytes();assert len(b)==pin['bytes'] and hashlib.sha256(b).hexdigest()==pin['sha256'],name
          PY
      - name: Install pinned browser
        working-directory: scripts/native-bitmap
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run bounded synthetic bitmap acceptance
        run: |
          export PACKAGE="$GITHUB_WORKSPACE/scripts/native-bitmap"
          export BITMAP_EVIDENCE="$GITHUB_WORKSPACE/evidence"
          python "$PACKAGE/supervise.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-bitmap-ownership-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            evidence/*.json
            evidence/*.log
