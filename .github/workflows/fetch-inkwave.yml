name: Fetch INKWAVE public source
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-inkwave.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public site assets
        shell: bash
        run: |
          set -euo pipefail
          candidate="${RUNNER_TEMP}/inkwave-upstream-candidate"
          rm -rf "$candidate"
          mkdir -p "$candidate"
          cd "$candidate"
          python3 - <<'PY2'
          import os, re, json, urllib.parse, urllib.request, hashlib
          from pathlib import Path

          BASE='https://inkwave-six.vercel.app/'
          seen=set(); queue=[BASE]; manifest=[]

          def fetch(url):
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 source-mirror/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read(), r.headers.get('content-type',''), r.geturl(), dict(r.headers)

          def save_url(url, data):
              u=urllib.parse.urlparse(url)
              path=u.path or '/index.html'
              if path.endswith('/'): path += 'index.html'
              if u.query:
                  q=hashlib.sha1(u.query.encode()).hexdigest()[:10]
                  stem, ext=os.path.splitext(path)
                  path=f'{stem}.q-{q}{ext}'
              rel=Path(path.lstrip('/'))
              rel.parent.mkdir(parents=True, exist_ok=True)
              rel.write_bytes(data)
              return str(rel)

          while queue:
              url=queue.pop(0)
              if url in seen: continue
              seen.add(url)
              try:
                  data, ctype, final, headers = fetch(url)
              except Exception as e:
                  manifest.append({'url':url,'error':repr(e)})
                  continue
              rel=save_url(final,data)
              manifest.append({'url':url,'final_url':final,'path':rel,'content_type':ctype,'bytes':len(data),'headers':headers})
              text=None
              if any(x in ctype for x in ('text/','javascript','json','xml')) or rel.endswith(('.html','.js','.css','.json','.xml','.txt')):
                  text=data.decode('utf-8','replace')
              if text:
                  refs=set()
                  refs.update(re.findall(r'''(?:src|href)=["\']([^"\']+)["\']''', text, flags=re.I))
                  refs.update(re.findall(r'''url\((?:["\']?)([^)"\']+)(?:["\']?)\)''', text, flags=re.I))
                  refs.update(re.findall(r'''["\'](/(?:assets|_next|static|fonts|images|img|audio|models|textures)/[^"\']+)["\']''', text))
                  # ES modules, dynamic imports, workers, import-map values and other relative assets.
                  refs.update(re.findall(r'''(?:from\s*|import\s*\()\s*["\']([^"\']+)["\']''', text))
                  refs.update(re.findall(r'''import\s*["\']([^"\']+)["\']''', text))
                  refs.update(re.findall(r'''["\']((?:\./|\.\./)[^"\']+\.(?:js|mjs|css|json|svg|png|jpg|jpeg|webp|glb|gltf|bin|wasm|wav|mp3|ogg|woff2?))["\']''', text, flags=re.I))
                  for ref in refs:
                      ref=ref.strip()
                      if not ref or ref.startswith(('data:','blob:','javascript:','#','mailto:','tel:')): continue
                      if ref == 'three':
                          ref = '/vendor/three/build/three.module.js'
                      elif ref.startswith('three/addons/'):
                          ref = '/vendor/three/jsm/' + ref[len('three/addons/'):]
                      elif not (ref.startswith(('./','../','/','http://','https://'))):
                          continue
                      absu=urllib.parse.urljoin(final, ref)
                      pu=urllib.parse.urlparse(absu)
                      if pu.scheme in ('http','https') and pu.netloc=='inkwave-six.vercel.app': queue.append(absu)
                  for m in re.findall(r'//# sourceMappingURL=([^\s]+)|/\*# sourceMappingURL=([^*]+)\*/', text):
                      ref=(m[0] or m[1]).strip(); queue.append(urllib.parse.urljoin(final, ref))
                  if rel.endswith(('.js','.css')): queue.append(final + '.map')

          Path('FETCH_MANIFEST.json').write_text(json.dumps(manifest, indent=2, ensure_ascii=False))
          Path('README_FETCH.txt').write_text(
              'Publicly served assets mirrored from '+BASE+'\n'
              'This is not guaranteed to be the original repository source.\n'
              'Public source maps are included when discoverable.\n'
          )
          print('fetched', sum('path' in x for x in manifest), 'resources')
          print('errors', sum('error' in x for x in manifest))
          PY2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Review fetched candidate without touching committed source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/review-inkwave-upstream.mjs "$RUNNER_TEMP/inkwave-upstream-candidate" > "$RUNNER_TEMP/inkwave-upstream-review.json" || review_status=$?
          if [ "${review_status:-0}" -ne 0 ]; then
            echo "Upstream candidate requires manual review; committed game source was not changed."
          fi
          test -s "$RUNNER_TEMP/inkwave-upstream-review.json"
      - name: Package upstream candidate and review
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/inkwave-upstream-candidate.tar.gz" inkwave-upstream-candidate
      - name: Upload upstream candidate for manual integration
        uses: actions/upload-artifact@v4
        with:
          name: inkwave-upstream-candidate-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/inkwave-upstream-candidate.tar.gz
            ${{ runner.temp }}/inkwave-upstream-review.json
