name: Fetch INKWAVE public source
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-inkwave.yml
      - scripts/fetch-inkwave-source.py
      - scripts/lib/inkwave_source_mirror.py
      - scripts/tests/test_inkwave_source_mirror.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /patches/splatoon3/*.mjs
            /patches/splatoon3/upstream-lock.json
            /patches/splatoon3/runtime/paint-ownership.mjs
            /patches/splatoon3/runtime/scoring.mjs
            /package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify sparse adapter dependencies
        run: node --input-type=module -e "await import('./patches/splatoon3/adapter.mjs')"
      - name: Verify mirror origin, byte, count and deadline controls
        run: python3 -m unittest discover -s scripts/tests -p test_inkwave_source_mirror.py -v
      - name: Fetch public site assets
        id: fetch_candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="${RUNNER_TEMP}/inkwave-upstream-candidate"
          rm -rf "$candidate"
          python3 scripts/fetch-inkwave-source.py "$candidate"
      - name: Review fetched candidate without touching committed source
        if: ${{ always() && steps.fetch_candidate.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/review-inkwave-upstream.mjs "$RUNNER_TEMP/inkwave-upstream-candidate" > "$RUNNER_TEMP/inkwave-upstream-review.json" || review_status=$?
          if [ "${review_status:-0}" -ne 0 ]; then
            echo "Upstream candidate requires manual review; committed game source was not changed."
          fi
          test -s "$RUNNER_TEMP/inkwave-upstream-review.json"
      - name: Package upstream candidate and review
        if: ${{ always() && steps.fetch_candidate.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/inkwave-upstream-candidate.tar.gz" inkwave-upstream-candidate
      - name: Upload upstream candidate for manual integration
        if: ${{ always() && steps.fetch_candidate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: inkwave-upstream-candidate-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/inkwave-upstream-candidate.tar.gz
            ${{ runner.temp }}/inkwave-upstream-review.json
