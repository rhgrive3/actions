name: INKWAVE Charger video waveform evidence (research only)
on:
  # Research evidence depends on third-party media access and cannot act as a PR gate.
  # Explicit runs still fail closed if no real source audio can be measured.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/inkwave-charger-video-waveform.yml
            /tools/audio/compare-charger-video-waveform.py
            /patches/splatoon3/runtime/audio/s3-real/
      - name: Prepare downloader with readable diagnostics
        shell: bash
        run: |
          mkdir -p charger-research
          echo "Python $(python3 --version)" | tee charger-research/setup.log
          echo "ffmpeg $(ffmpeg -version | head -1)" | tee -a charger-research/setup.log
          python3 -m venv "$RUNNER_TEMP/charger-venv" >> charger-research/setup.log 2>&1
          if "$RUNNER_TEMP/charger-venv/bin/python" -m pip install --disable-pip-version-check --retries 2 --timeout 20 yt-dlp >>charger-research/setup.log 2>&1; then
            echo "yt-dlp install succeeded" | tee -a charger-research/setup.log
          else
            echo "PyPI installation failed; trying GitHub standalone binary" | tee -a charger-research/setup.log
            curl -fLSs --connect-timeout 12 --max-time 80 --retry 1 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o "$RUNNER_TEMP/charger-venv/bin/yt-dlp" >>charger-research/setup.log 2>&1 || true
            chmod +x "$RUNNER_TEMP/charger-venv/bin/yt-dlp" 2>/dev/null || true
          fi
          "$RUNNER_TEMP/charger-venv/bin/yt-dlp" --version >>charger-research/setup.log 2>&1 || true
          "$RUNNER_TEMP/charger-venv/bin/python" -m pip install --disable-pip-version-check --retries 1 --timeout 20 numpy >>charger-research/setup.log 2>&1 || echo "Numpy unavailable; record RMS envelope only" >>charger-research/setup.log
          cat charger-research/setup.log
      - name: Fetch gameplay reference and extract measurement images
        shell: bash
        run: |
          mkdir -p charger-research/raw
          cd charger-research
          cat > sources.tsv <<'SOURCES'
          s3-wiki-gootuber|https://splatoonwiki.org/wiki/Special:Redirect/file/S3_Goo_Tuber_charge_10.0.0.mp4|direct
          s3-no-commentary|https://www.youtube.com/watch?v=Q0gbI1D4hEs|*00:00:00-00:01:30
          s3-no-commentary-demo|https://www.youtube.com/watch?v=FR10kogkwY8|*00:00:00-00:01:15
          s3-official-demo|https://x.com/SplatoonNA/status/1523648989144489986|*00:00:00-00:00:30
          s1-official-demo|https://www.youtube.com/watch?v=5i25MOeRny8|*00:00:00-00:00:35
          SOURCES
          : > fetch.log
          tool="$RUNNER_TEMP/charger-venv/bin/yt-dlp"
          if "$tool" --version >>fetch.log 2>&1; then
            downloader_ready=1
          else
            downloader_ready=0
            echo "yt-dlp missing; direct community footage fetch will still run." >>fetch.log
          fi
          while IFS='|' read -r slug source section; do
            echo "=== ${slug} ${source} ${section} ===" | tee -a fetch.log
            download_exit=0
            if [ "$section" = "direct" ]; then
              # Verified Inkipedia 10.0.0 Goo Tuber charging-animation
              # capture. Direct file media access is independent of yt-dlp.
              curl --fail --location --show-error --silent \
                --connect-timeout 12 --max-time 80 --retry 1 \
                -A "Mozilla/5.0 (game audio evidence research)" \
                "$source" -o "raw/${slug}.mp4" >>fetch.log 2>&1 || download_exit=$?
              if [ "$download_exit" = 0 ]; then
                ffprobe -v error -show_entries stream=codec_type,duration \
                  -of default=noprint_wrappers=1 "raw/${slug}.mp4" >>fetch.log 2>&1 || true
                ffmpeg -hide_banner -loglevel error -y -i "raw/${slug}.mp4" \
                  -map 0:a:0 -vn -ar 48000 -ac 1 "raw/${slug}.wav" >>fetch.log 2>&1 || download_exit=$?
              fi
            elif [ "$downloader_ready" = 1 ]; then
              timeout 140 "$tool" --no-playlist --no-warnings --no-progress \
                --socket-timeout 12 --retries 1 --fragment-retries 1 \
                --download-sections "${section}" \
                -f 'bestaudio/best' -x --audio-format wav \
                --remote-components ejs:github --js-runtimes node \
                -o "raw/${slug}.%(ext)s" "${source}" >>fetch.log 2>&1 || download_exit=$?
            else
              download_exit=127
            fi
            echo "download_exit=${download_exit}" >>fetch.log
            file=$(find raw -maxdepth 1 -type f -name "${slug}*.wav" | head -1)
            if [ -z "$file" ]; then echo "No decodable audio for ${slug}" >>fetch.log; continue; fi
            echo "Audio ${slug}: $(du -h "$file" | cut -f1)" >> fetch.log
            refs=( )
            for name in Wp_Charger_HoldNoise_00 Wp_Charger_HoldNoise_Heavy_00 Wp_Charger_HoldNoise_Bamboo_00 Wp_Charger_HoldNoise_Pump_00 Wp_ChargeKeepReady_00; do
              ref="${GITHUB_WORKSPACE}/patches/splatoon3/runtime/audio/s3-real/${name}.mp3"
              if [ -f "$ref" ]; then refs+=( --reference "$ref" ); fi
            done
            if [ "${#refs[@]}" -gt 0 ]; then
              "$RUNNER_TEMP/charger-venv/bin/python" "${GITHUB_WORKSPACE}/tools/audio/compare-charger-video-waveform.py" \
                --video "$file" --source-url "$source" --label "$slug" \
                --max-seconds 45 --output-dir "comparison-${slug}" "${refs[@]}" \
                >"comparison-${slug}-summary.json" 2>>fetch.log || echo "Comparison script failed for ${slug}" >>fetch.log
            fi
            ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$file" >>fetch.log 2>&1 || true
            # Derived plots and measured RMS only; never upload footage.
            ffmpeg -hide_banner -loglevel error -y -i "$file" \
              -filter_complex 'showwavespic=s=1600x360:scale=sqrt:colors=white' \
              -frames:v 1 "${slug}-wave.png" >>fetch.log 2>&1 || true
            ffmpeg -hide_banner -loglevel error -y -i "$file" \
              -filter_complex 'showspectrumpic=s=1600x600:legend=1:scale=log' \
              -frames:v 1 "${slug}-spectrum.png" >>fetch.log 2>&1 || true
            ffmpeg -hide_banner -loglevel error -y -i "$file" -ac 1 -ar 8000 -sample_fmt s16 \
              -f wav - 2>>fetch.log | python3 -c 'import sys,wave,struct,math; f=wave.open(sys.stdin.buffer);sr=f.getframerate(); n=sr//50; print("time_seconds,rms,peak"); t=0
          while True:
              raw=f.readframes(n)
              if not raw: break
              xs=struct.unpack("<"+str(len(raw)//2)+"h",raw); m=max(abs(z) for z in xs)/32768; rms=math.sqrt(sum(z*z for z in xs)/len(xs))/32768
              print(f"{t:.3f},{rms:.8f},{m:.8f}");t+=len(xs)/sr' >"${slug}-rms.csv" || true
          done < sources.tsv
          echo "Files:" >>fetch.log
          ls -lah *.png *.csv 2>/dev/null >>fetch.log || :
          # A completed downloader run is NOT evidence of captured game audio.
          # Fail closed when all providers blocked the request. The always()
          # artifact upload still publishes diagnosis; no false green run.
          valid_waves=$(find . -maxdepth 1 -type f -name '*-wave.png' | wc -l)
          valid_comparisons=$(find . -maxdepth 2 -type f -name 'comparison.json' | wc -l)
          printf 'valid_waveforms=%s valid_comparisons=%s\n' "$valid_waves" "$valid_comparisons" >>fetch.log
          rm -rf raw
          tail -100 fetch.log
          if [ "$valid_waves" -eq 0 ] || [ "$valid_comparisons" -eq 0 ]; then
            echo "::error::No genuine Charger gameplay audio extracted or source comparisons generated. This run is NOT a waveform success."
            exit 2
          fi
      - name: Upload derived waveforms, metadata and diagnostic logs (no video or audio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charger-reference-video-waveforms
          path: |
            charger-research/*.png
            charger-research/*.csv
            charger-research/comparison-*/*.json
            charger-research/comparison-*/*.csv
            charger-research/comparison-*-summary.json
            charger-research/sources.tsv
            charger-research/setup.log
            charger-research/fetch.log
          retention-days: 2
          if-no-files-found: warn
