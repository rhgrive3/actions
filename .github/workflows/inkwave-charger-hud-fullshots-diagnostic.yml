name: INKWAVE native Charger HUD recovery candidate diagnostic
on:
  push:
    branches: [diagnostic/charger-hud-fullshots-20261028]
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.event_name == 'push' && github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/diagnostic/charger-hud-fullshots-20261028'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact diagnostic harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify diagnostic parent, exact tree, allowlisted paths and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.workflow_sha }}" = "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD^)" = 29af312e9100c7d8759c5f7f819a12aaf7f544c3
          test "$(git rev-parse HEAD^^{tree})" = 2e2ad64e4672ade3e4fa6b2bb430b62161ce9cb4
          expected=$(printf '%s\n' '.circleci/config.yml' '.github/workflows/bootstrap-hex-worker-repos.yml' '.github/workflows/hex-fast-tail-known.yml' '.github/workflows/inkwave-charger-hud-fullshots-diagnostic.yml' 'scripts/check-inkwave-lock-outcome-native.mjs' 'scripts/check-inkwave-lock-outcome-observer.mjs' 'scripts/check-inkwave-lock-resume-probe.mjs' 'scripts/check-inkwave-charge-observation-probe.mjs' 'scripts/check-inkwave-charger-selection-probe.mjs' 'scripts/check-inkwave-charger-flow.mjs' 'scripts/tests/inkwave-lock-outcome-native.test.mjs' 'scripts/tests/inkwave-lock-outcome-observer.test.mjs' 'scripts/tests/inkwave-lock-resume-probe.test.mjs' 'scripts/tests/inkwave-charge-observation-probe.test.mjs' 'scripts/tests/inkwave-charger-selection-probe.test.mjs' 'scripts/tests/inkwave-charger-flow.test.mjs' | sort)
          actual=$(git diff --no-renames --name-only HEAD^ HEAD | sort)
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:.circleci/config.yml)" = b0d06933dc572ff3f10f5c4cf1c94394751a7e1e
          test "$(git rev-parse HEAD:.github/workflows/bootstrap-hex-worker-repos.yml)" = 21441adced3f96eb7bb6b447d649d4ddf83688cf
          test "$(git rev-parse HEAD:.github/workflows/hex-fast-tail-known.yml)" = 21c8567dd713d77c3202bbbfc6cd2dd917699a80
          test "$(git rev-parse HEAD:scripts/check-inkwave-lock-outcome-native.mjs)" = 204c524317599863d30bbabd46f16dad99450e59
          test "$(git rev-parse HEAD:scripts/check-inkwave-lock-outcome-observer.mjs)" = fe2473487261e479d4f8b93e4193908aa643a350
          test "$(git rev-parse HEAD:scripts/check-inkwave-lock-resume-probe.mjs)" = 5900a8d6c0ccaa9260b550865f4220dda7b4a963
          test "$(git rev-parse HEAD:scripts/check-inkwave-charge-observation-probe.mjs)" = 9ecdfc3aaa8c2e9738d441250baf1aa4671b9b87
          test "$(git rev-parse HEAD:scripts/check-inkwave-charger-selection-probe.mjs)" = a5ccd695248b8932beab6c565a783cd109cd25a3
          test "$(git rev-parse HEAD:scripts/check-inkwave-charger-flow.mjs)" = bdfce37a18f7d7cf05ae5eb716cb3939512a9982
          test "$(git rev-parse HEAD:scripts/tests/inkwave-lock-outcome-native.test.mjs)" = 81c21654d2cab194d71702864488bb85f0101dc4
          test "$(git rev-parse HEAD:scripts/tests/inkwave-lock-outcome-observer.test.mjs)" = 0e0bbfd7a8433ca8e1f316e6cbca04883ddb2f89
          test "$(git rev-parse HEAD:scripts/tests/inkwave-lock-resume-probe.test.mjs)" = 9661fa7822b9075102af2559f563fe8e9b45399b
          test "$(git rev-parse HEAD:scripts/tests/inkwave-charge-observation-probe.test.mjs)" = 0bd4aaedbff78867c7bed73f348188653e2e4de5
          test "$(git rev-parse HEAD:scripts/tests/inkwave-charger-selection-probe.test.mjs)" = 723fc9b5054048f857f1dca1ed5fcfeb9b83a9f6
          test "$(git rev-parse HEAD:scripts/tests/inkwave-charger-flow.test.mjs)" = b33f5801175f5389ebc41276976fc72fd28f6e68
      - name: Checkout exact source under test
        uses: actions/checkout@v4
        with:
          ref: 29af312e9100c7d8759c5f7f819a12aaf7f544c3
          path: game-source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify clean exact source
        run: |
          set -euo pipefail
          test "$(git -C game-source rev-parse HEAD)" = 29af312e9100c7d8759c5f7f819a12aaf7f544c3
          test "$(git -C game-source rev-parse HEAD^{tree})" = 2e2ad64e4672ade3e4fa6b2bb430b62161ce9cb4
          test -z "$(git -C game-source status --porcelain)"
      - name: Install pinned tools and secure Chromium
        run: |
          npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1 ws@8
          npx playwright install --with-deps chromium
      - name: Run observer and safety contracts
        run: node --test scripts/tests/inkwave-lock-outcome-observer.test.mjs scripts/tests/inkwave-lock-outcome-native.test.mjs scripts/tests/inkwave-lock-resume-probe.test.mjs scripts/tests/inkwave-charge-observation-probe.test.mjs scripts/tests/inkwave-charger-selection-probe.test.mjs scripts/tests/inkwave-charger-flow.test.mjs
      - name: Build exact source once
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/node_modules" game-source/node_modules
          (cd game-source && node scripts/build-inkwave.mjs inkwave-public _site)
      - name: Native Range, one supported Pause Resume, normal and scoped HUD observations
        shell: bash
        run: |
          set +e
          mkdir -p evidence
          timeout --signal=TERM --kill-after=10s 1140s node scripts/check-inkwave-lock-outcome-native.mjs --root "$GITHUB_WORKSPACE/game-source" --site "$GITHUB_WORKSPACE/game-source/_site" --out "$GITHUB_WORKSPACE/evidence/outcome"
          code=$?
          printf 'exit=%s\n' "$code" > evidence/exit-code.txt
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            CODE="$code" node --input-type=module - <<'MARK'
          import fs from 'node:fs';
          const dir='evidence/outcome',file=dir+'/lock-outcome-result.json';fs.mkdirSync(dir,{recursive:true});
          const r=fs.existsSync(file)?JSON.parse(fs.readFileSync(file)):{schema:1};
          r.status='failed';r.externalTimeout=process.env.CODE==='124';r.externalKill=process.env.CODE==='137';r.error ||= 'External timeout or kill; cleanup outcome unknown';
          fs.writeFileSync(file,JSON.stringify(r,null,2)+'\n');
          MARK
          fi
          exit "$code"
      - name: Preserve diagnostic receipt and internal screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charger-hud-fullshots-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
