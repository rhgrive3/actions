name: Temporary goto regression patch transfer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-goto-regression-transfer.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publish raw patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tmp/goto-regression-indirect-terminal.patch.gz.b64 | gzip -d > /tmp/regression.patch
          test "$(wc -c < /tmp/regression.patch)" -eq 9903
          raw_b64="$(base64 -w0 /tmp/regression.patch)"
          jq -n --arg message "ci: stage raw goto regression patch" --arg content "$raw_b64"             '{message:$message,content:$content,branch:"main"}' >/tmp/body.json
          curl -fsS -X PUT             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/rhgrive3/actions/contents/tmp/goto-regression-indirect-terminal.patch"             --data-binary @/tmp/body.json >/dev/null
