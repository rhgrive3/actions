name: INKWAVE relay admission and security
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/ci/run-inkwave-test-suite.mjs"
      - "scripts/ci/inkwave-test-suites.json"
      - "server/**"
      - "scripts/lib/inkwave-local-relay-fixture.mjs"
      - "patches/reliability/tests/relay-compatibility.test.mjs"
      - "inkwave-public/src/net/transport.js"
      - "inkwave-public/src/net/session.js"
      - "inkwave-public/src/net/mock.js"
      - "patches/splatoon3/tests/source-fixture.mjs"
      - "patches/reliability/net-adapter.mjs"
      - ".github/workflows/inkwave-relay-security.yml"
      - 'scripts/inkwave-source-composition.mjs'
      - 'patches/splatoon3/adapter.mjs'
      - 'patches/reliability/adapter.mjs'
      - 'patches/network-replication/adapter.mjs'
  push:
    branches: [main]
    paths:
      - "scripts/ci/run-inkwave-test-suite.mjs"
      - "scripts/ci/inkwave-test-suites.json"
      - "server/**"
      - "scripts/lib/inkwave-local-relay-fixture.mjs"
      - "patches/reliability/tests/relay-compatibility.test.mjs"
      - "inkwave-public/src/net/transport.js"
      - "inkwave-public/src/net/session.js"
      - "inkwave-public/src/net/mock.js"
      - "patches/splatoon3/tests/source-fixture.mjs"
      - "patches/reliability/net-adapter.mjs"
      - ".github/workflows/inkwave-relay-security.yml"
      - 'scripts/inkwave-source-composition.mjs'
      - 'patches/splatoon3/adapter.mjs'
      - 'patches/reliability/adapter.mjs'
      - 'patches/network-replication/adapter.mjs'
concurrency:
  # Cancel obsolete PR-head checks; keep every main push and manually dispatched run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  relay-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify immutable checkout identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_source_sha="$(git rev-parse HEAD)"
          printf 'Expected source: %s\nActual checkout: %s\n' "$EXPECTED_SOURCE_SHA" "$actual_source_sha"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA"
          printf 'Source tree: %s\n' "$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server syntax
        run: node --check server/src/index.js
      - name: Relay security and existing hit NACK regressions
        run: node scripts/ci/run-inkwave-test-suite.mjs relay
      - name: Production-composed client compatibility and legacy rejection
        run: node --experimental-vm-modules --test patches/reliability/tests/relay-compatibility.test.mjs
