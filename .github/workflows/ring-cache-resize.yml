name: Verify responsive focus scroll cache
on:
  push:
    branches: [review/ring-cache-resize-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract controls
        run: node --test controls.test.mjs
      - name: Install browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Exact old and fixed functions in real responsive DOM
        run: node browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ring-cache-resize-${{ github.sha }}
          path: |
            browser-result.json
            old-wide.png
            fixed-wide.png
          if-no-files-found: warn
