name: INKWAVE eight headgear production candidate QA
on:
  push:
    branches: ['main']
    paths: ['tools/headgear-production-qa/**', 'tools/headgear-production-multiview/**', 'tools/headgear-production-ibl/**', 'patches/local-quality/headgear/**', 'patches/local-quality/headgear-adapter.mjs', 'patches/local-quality/adapter.mjs', 'patches/local-quality/tests/headgear-*', 'scripts/lib/inkwave-build-only-modules.mjs', '.github/workflows/inkwave-headgear-visual-qa.yml', 'inkwave-public/src/game/character.js', 'inkwave-public/src/game/character-geo.js', 'inkwave-public/src/game/character-mats.js', 'inkwave-public/src/game/character-hair.js', 'inkwave-public/src/game/character-lod.js', 'inkwave-public/src/game/character-style.js', 'inkwave-public/src/game/character-outfit.js', 'inkwave-public/src/game/character-face.js', 'scripts/tests/inkwave-queue-ci-20261031.test.mjs', 'inkwave-public/src/core/ctx.js', 'inkwave-public/src/world/environment.js', 'scripts/build-inkwave.mjs', 'scripts/inkwave-source-composition.mjs', 'scripts/tests/inkwave-headgear-shared-build.test.mjs', 'patches/splatoon3/runtime/install.mjs']
  pull_request:
    paths: ['tools/headgear-production-qa/**', 'tools/headgear-production-multiview/**', 'tools/headgear-production-ibl/**', 'patches/local-quality/headgear/**', 'patches/local-quality/headgear-adapter.mjs', 'patches/local-quality/adapter.mjs', 'patches/local-quality/tests/headgear-*', 'scripts/lib/inkwave-build-only-modules.mjs', '.github/workflows/inkwave-headgear-visual-qa.yml', 'inkwave-public/src/game/character.js', 'inkwave-public/src/game/character-geo.js', 'inkwave-public/src/game/character-mats.js', 'inkwave-public/src/game/character-hair.js', 'inkwave-public/src/game/character-lod.js', 'inkwave-public/src/game/character-style.js', 'inkwave-public/src/game/character-outfit.js', 'inkwave-public/src/game/character-face.js', 'scripts/tests/inkwave-queue-ci-20261031.test.mjs', 'inkwave-public/src/core/ctx.js', 'inkwave-public/src/world/environment.js', 'scripts/build-inkwave.mjs', 'scripts/inkwave-source-composition.mjs', 'scripts/tests/inkwave-headgear-shared-build.test.mjs', 'patches/splatoon3/runtime/install.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Cancel obsolete PR-head checks; keep every main push and manually dispatched run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-headgear:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tools/inkwave-modeler/blender/
            !/tools/inkwave-modeler/docs/
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and check normal production candidate
        run: |
          node scripts/build-inkwave.mjs inkwave-public _site
          node scripts/check-inkwave-startup-budget.mjs _site
          node --test patches/local-quality/tests/headgear-source.test.mjs
          INKWAVE_HEADGEAR_SITE="$PWD/_site" node --experimental-loader ./patches/local-quality/tests/headgear-production-loader.mjs --test patches/local-quality/tests/headgear-*.fixture.mjs
      - name: Seal the exact candidate site for all six render shards
        id: archive
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > _site-source-sha.txt
          tar -cf headgear-site.tar _site _site-source-sha.txt
          printf 'sha256=%s\n' "$(sha256sum headgear-site.tar | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: headgear-site-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: headgear-site.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  render-headgear:
    needs: build-headgear
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: multi-4-5
            kind: multiview
            gears: '4,5'
          - key: multi-6-7
            kind: multiview
            gears: '6,7'
          - key: multi-8-9
            kind: multiview
            gears: '8,9'
          - key: multi-10-11
            kind: multiview
            gears: '10,11'
          - key: production-ibl
            kind: production-ibl
            gears: ''
          - key: production
            kind: production
            gears: ''
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tools/headgear-production-qa/
            /tools/headgear-production-multiview/
            /tools/headgear-production-ibl/
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact official build and browser tools
        run: npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
      - name: Install CI browser
        run: npx playwright install --with-deps --only-shell chromium
      - uses: actions/download-artifact@v4
        with:
          name: headgear-site-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: .headgear-site
      - name: Verify and restore the exact prepared candidate
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.build-headgear.outputs.archive_sha256 }}
        run: |
          [[ "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_ARCHIVE_SHA256" '.headgear-site/headgear-site.tar' | sha256sum --check --strict
          tar -xf .headgear-site/headgear-site.tar --no-same-owner
          test "$(cat _site-source-sha.txt)" = "$SOURCE_SHA"
      - name: Render bounded multiview shard
        if: matrix.kind == 'multiview'
        timeout-minutes: 18
        run: node tools/headgear-production-multiview/run.mjs --site _site --out .qa-evidence/${{ matrix.key }} --gear-ids '${{ matrix.gears }}'
      - name: Render bounded signal and LOD suite
        if: matrix.kind == 'production'
        timeout-minutes: 18
        run: node tools/headgear-production-qa/run.mjs --site _site --out .qa-evidence/${{ matrix.key }}
      - name: Render actual production Environment illumination
        if: matrix.kind == 'production-ibl'
        timeout-minutes: 18
        run: node tools/headgear-production-ibl/run.mjs --site _site --out .qa-evidence/${{ matrix.key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headgear-shard-${{ matrix.key }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .qa-evidence/${{ matrix.key }}/**
            _site/inkwave-build.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  verify-combined:
    if: always()
    needs: render-headgear
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/headgear-production-qa/verify-shards.mjs
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: headgear-shard-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: _headgear-shards
          merge-multiple: false
      - name: Verify 518 controlled and 64 production-IBL PNG readbacks
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/headgear-production-qa/verify-shards.mjs _headgear-shards .qa-evidence/headgear-combined.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headgear-combined-${{ github.event.pull_request.head.sha || github.sha }}
          path: .qa-evidence/headgear-combined.json
          include-hidden-files: true
          if-no-files-found: warn

