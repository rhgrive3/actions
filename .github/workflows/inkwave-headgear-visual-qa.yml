name: INKWAVE headgear shape preview QA
on:
  push:
    branches: ['review/inkwave-headgear-shape-20261017']
    paths: ['patches/local-quality/headgear/**', '.github/workflows/inkwave-headgear-visual-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: headgear-visual-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render-headgear:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Assert pinned native source remains unchanged
        run: |
          git diff --exit-code d5265f73d9dad69f1afd9690e374caee45195f11 HEAD -- inkwave-public
          node tools/headgear-production-qa/assert-scope.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact official build and browser tools
        run: npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
      - name: Syntax checks
        run: find tools/headgear-production-qa tools/headgear-production-multiview patches/local-quality/headgear -type f \( -name '*.js' -o -name '*.mjs' \) -exec node --check '{}' \;
      - name: Install CI browser
        run: npx playwright install --with-deps chromium
      - name: Build normal production candidate
        run: |
          node scripts/build-inkwave.mjs inkwave-public _site
          node scripts/check-inkwave-startup-budget.mjs _site
      - name: Native lifecycle regressions
        run: INKWAVE_HEADGEAR_SITE="$PWD/_site" node --experimental-loader ./patches/local-quality/tests/headgear-production-loader.mjs --test patches/local-quality/tests/headgear-lifecycle.fixture.mjs
      - name: Render all four fitted production headgear from multiple views
        run: node tools/headgear-production-multiview/run.mjs --site _site --out .qa-evidence/headgear
      - name: Verify production shader signals, LOD, quality and resource lifecycle
        if: always()
        run: node tools/headgear-production-qa/run.mjs --site _site --out .qa-evidence/headgear-production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headgear-shape-preview-${{ github.sha }}
          path: |
            .qa-evidence/headgear/**
            .qa-evidence/headgear-production/**
            .qa-evidence/headgear-scope.json
            _site/inkwave-build.json
          if-no-files-found: warn
          retention-days: 14
