name: INKWAVE sharded headgear diagnostic QA
on:
  push:
    branches: ['review/new-headgear-diagnostic-20261018']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: headgear-sharded-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render-headgear:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: multi-4-5
            kind: multiview
            gears: '4,5'
          - key: multi-6-7
            kind: multiview
            gears: '6,7'
          - key: multi-8-9
            kind: multiview
            gears: '8,9'
          - key: multi-10-11
            kind: multiview
            gears: '10,11'
          - key: production
            kind: production
            gears: ''
    env:
      SOURCE_SHA: ${{ github.sha }}
      CANDIDATE_BASE_SHA: cabe8359fae040275910d6d2ff3739122304c36a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify exact checkout and protected native geometry
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_BASE_SHA" "$SOURCE_SHA"
          git diff --exit-code "$CANDIDATE_BASE_SHA" "$SOURCE_SHA" -- inkwave-public scripts patches/local-quality/s3-face-look-adapter.mjs patches/local-quality/headgear/armor-helmet.js patches/local-quality/headgear/two-line-mesh.js patches/local-quality/headgear/camo-headphones.js patches/local-quality/headgear/character-headgear-ink-black-flap-cap.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact official build and browser tools
        run: npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
      - name: Install CI browser
        run: npx playwright install --with-deps chromium
      - name: Build and check normal production candidate
        run: |
          node scripts/build-inkwave.mjs inkwave-public _site
          node scripts/check-inkwave-startup-budget.mjs _site
          node --test patches/local-quality/tests/headgear-source.test.mjs
          INKWAVE_HEADGEAR_SITE="$PWD/_site" node --experimental-loader ./patches/local-quality/tests/headgear-production-loader.mjs --test patches/local-quality/tests/headgear-*.fixture.mjs
      - name: Render bounded multiview shard
        if: matrix.kind == 'multiview'
        timeout-minutes: 18
        run: node tools/headgear-production-multiview/run.mjs --site _site --out .qa-evidence/${{ matrix.key }} --gear-ids '${{ matrix.gears }}'
      - name: Render bounded signal and LOD suite
        if: matrix.kind == 'production'
        timeout-minutes: 18
        run: node tools/headgear-production-qa/run.mjs --site _site --out .qa-evidence/${{ matrix.key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headgear-shard-${{ matrix.key }}-${{ github.sha }}
          path: |
            .qa-evidence/${{ matrix.key }}/**
            _site/inkwave-build.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  verify-combined:
    if: always()
    needs: render-headgear
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: headgear-shard-*-${{ github.sha }}
          path: _headgear-shards
          merge-multiple: false
      - name: Verify all 480 PNG readbacks and five complete suites
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node tools/headgear-production-qa/verify-shards.mjs _headgear-shards .qa-evidence/headgear-combined.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headgear-combined-${{ github.sha }}
          path: .qa-evidence/headgear-combined.json
          include-hidden-files: true
          if-no-files-found: warn
