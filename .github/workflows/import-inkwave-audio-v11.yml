name: Stage INKWAVE v11 audio source and MP3 assets
on:
  push:
    branches: [integrate/inkwave-audio-v11-real-assets-20261012]
    paths: ['.github/workflows/import-inkwave-audio-v11.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TRANSFER_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-9700-8209-b7da-d4e0c6d5eeb4/raw?se=2026-10-12T13%3A32%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=a7ceda28-e5a0-5af3-a0c6-5ec75da2ab54&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T01%3A22%3A26Z&ske=2026-10-13T01%3A22%3A26Z&sks=b&skv=2026-02-06&sig=EvOW%2Bsx07f156NvKkQI%2BGJWPLIZjHLQUsHv8vIgxkXc%3D"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch v11 staging snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error "$TRANSFER_URL" -o /tmp/iw-audio-stage.zip
          printf '%s  %s\n' 21ce72866f8694897f82ed3071ff02b97857016fc9fe4440ced99057aab657fd /tmp/iw-audio-stage.zip | sha256sum --check
          mkdir -p /tmp/iw-audio-v11
          unzip -q /tmp/iw-audio-stage.zip -d /tmp/iw-audio-v11
          python3 /tmp/iw-audio-v11/import_audio_v11.py .
      - name: Install pinned build compiler
        run: npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.28.2
      - name: Validate real-only audio behavior
        run: |
          node --experimental-vm-modules --test patches/splatoon3/tests/audio-v11-real-only.test.mjs patches/splatoon3/tests/real-s3-loader-v7.test.mjs patches/splatoon3/tests/weapon-audio.test.mjs patches/splatoon3/tests/audio-refinement.test.mjs
          node scripts/check-inkwave-patches.mjs --quick
      - name: Verify production site build before staging
        run: |
          node scripts/build-inkwave.mjs inkwave-public /tmp/inkwave-audio-v11-site
          node scripts/check-inkwave-startup-budget.mjs /tmp/inkwave-audio-v11-site
          python3 tools/audio/verify-s3-real-files.py
      - name: Persist verified audio integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches/splatoon3/audio-adapter.mjs patches/splatoon3/runtime/audio patches/splatoon3/tests/audio-v11-real-only.test.mjs patches/splatoon3/tests/real-s3-loader-v7.test.mjs patches/splatoon3/tests/weapon-audio.test.mjs patches/splatoon3/tests/audio-refinement.test.mjs patches/splatoon3/tests/audio-provenance.test.mjs patches/splatoon3/bootstrap.mjs patches/loading-cache/adapter.mjs scripts/inkwave-source-composition.mjs docs/audio-rebuild/README-v11.ja.md tools/audio
          git rm .github/workflows/import-inkwave-audio-v11.yml
          git diff --cached --check
          git diff --cached --stat | tail -20
          git commit -m 'feat(inkwave): integrate v11 real-only audio and 381 MP3 events'
          git push origin HEAD:integrate/inkwave-audio-v11-real-assets-20261012
