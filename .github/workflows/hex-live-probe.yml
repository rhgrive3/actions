name: Hex live publication probe
on:
  push:
    paths:
      - .github/workflows/hex-live-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe bootstrap build identity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/probe.mjs <<'NODE'
          import { webcrypto, randomUUID } from 'node:crypto';
          const subtle=webcrypto.subtle;
          const key=await subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']);
          const jwk=await subtle.exportKey('jwk',key.publicKey);
          const builds=[
            ['live-loader-2213','7f189ed72b8ac0801da206ca'],
            ['main-2259','842f2f6aba22b96b9564d6c1'],
          ];
          for(const [label,buildId] of builds){
            const bytes=webcrypto.getRandomValues(new Uint8Array(18));
            const b64=v=>Buffer.from(v).toString('base64url');
            const body={
              nonce:b64(webcrypto.getRandomValues(new Uint8Array(24))),
              loaderVersion:label==='live-loader-2213'?'2.0.2322242213':'2.0.2322242259',
              buildId,
              requestId:b64(bytes),
              sessionIdentity:b64(webcrypto.getRandomValues(new Uint8Array(18))),
              clientPublicKey:jwk,
            };
            const r=await fetch('https://ida.rhgrive.workers.dev/runtime/bootstrap',{
              method:'POST',
              headers:{'content-type':'application/json','origin':'https://chatgpt.com'},
              body:JSON.stringify(body),
            });
            const text=await r.text();
            console.log(JSON.stringify({
              label,buildId,status:r.status,
              allowOrigin:r.headers.get('access-control-allow-origin'),
              body:text.slice(0,300)
            }));
          }
          NODE
          node /tmp/probe.mjs > bootstrap-build-probe.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: hex-live-probe
          path: bootstrap-build-probe.jsonl
          retention-days: 1
