name: Hex live publication probe
on:
  push:
    paths:
      - .github/workflows/hex-live-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe live worker asset routes
        shell: bash
        run: |
          set -euo pipefail
          base=https://ida.rhgrive.workers.dev
          : > live-probe.txt
          for p in             /hex.meta.js             /hex.user.js             /js/worker.js             /js/platform/worker.js             /js/platform/capstone-probe-worker.js             /js/platform/capstone-disasm-worker.js             /capstone.wasm             /userscript-assets/js/worker.js             /userscript-assets/capstone.wasm; do
            code=$(curl -sS -L --connect-timeout 8 --max-time 15 -o /tmp/body -w '%{http_code}' "$base$p" || true)
            bytes=$(wc -c </tmp/body 2>/dev/null || echo 0)
            printf '%s %s %s\n' "$code" "$bytes" "$p" >> live-probe.txt
          done
          curl -fsS --connect-timeout 8 --max-time 15 "$base/hex.meta.js" | grep -E '^// @(version|updateURL|downloadURL)' >> live-probe.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: hex-live-probe
          path: live-probe.txt
          retention-days: 1
