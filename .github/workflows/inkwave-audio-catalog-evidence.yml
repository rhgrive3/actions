name: Verify INKWAVE audio catalog evidence
on:
  pull_request:
    paths:
      - .github/workflows/inkwave-audio-catalog-evidence.yml
      - patches/splatoon3/runtime/audio/**
      - scripts/check-inkwave-motion-catalog.mjs
      - scripts/lib/inkwave-catalog-audio.mjs
      - scripts/tests/inkwave-catalog-audio.test.mjs
permissions:
  contents: read
concurrency:
  group: audio-catalog-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  # Supplemental PR executes the already published audio repair, not its own head.
  SOURCE_SHA: dc4a15e9648de1f46cd1cb9192f86d611b9f05eb
  INKWAVE_GATE_TEST_EVIDENCE: /mnt/workspace/.dev-state/agent-work/evidence/audio-catalog-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  audio_catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TMPDIR: ${{ github.workspace }}/.ci-scratch
      TMP: ${{ github.workspace }}/.ci-scratch
      TEMP: ${{ github.workspace }}/.ci-scratch
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browser-cache
      CI_STORAGE: /mnt/workspace/inkwave-audio-catalog-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare exact-source workspace and browser
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p .ci-scratch .built-site
          test "$(realpath -m "$CI_STORAGE")" = "$CI_STORAGE"
          sudo mkdir -p "$CI_STORAGE" "$INKWAVE_GATE_TEST_EVIDENCE" /mnt/workspace/.dev-state/agent-work/cache/iwrui
          sudo chown "$(id -u):$(id -g)" "$CI_STORAGE" "$INKWAVE_GATE_TEST_EVIDENCE" /mnt/workspace/.dev-state/agent-work/cache/iwrui
          mkdir -p "$CI_STORAGE/evidence" "$CI_STORAGE/cache"
          npm install --no-save --no-package-lock --silent esbuild@0.28.2 playwright@1.62.1 ws@8
          npx playwright install --with-deps chromium
      - name: Verify charge and catalog contracts without reducing assertions
        run: |
          node tools/audio/build-worker.mjs --check
          node --test patches/splatoon3/tests/seven-charge-swim-falloff.test.mjs patches/splatoon3/tests/motion-catalog-gates.test.mjs scripts/tests/inkwave-catalog-audio.test.mjs
      - name: Build exact source with production minification
        run: |
          node scripts/build-inkwave.mjs inkwave-public .built-site/_site
          git rev-parse HEAD > .built-site/_site-source-sha.txt
      - name: Verify full installed catalog and actual browser Worker
        run: node scripts/check-inkwave-motion-catalog.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/catalog" --profile-dir "$CI_STORAGE/cache/catalog"
      - name: Bind supplemental evidence to exact source
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['CI_STORAGE'])/'evidence'
          report=json.loads((root/'catalog/motion-catalog-result.json').read_text())
          build=json.loads(pathlib.Path('.built-site/_site/inkwave-build.json').read_text())
          assert pathlib.Path('.built-site/_site-source-sha.txt').read_text().strip()==os.environ['SOURCE_SHA']
          assert report['status']=='passed' and not report.get('errors',[]) and not report.get('failures',[])
          assert report['sourceHead']==os.environ['SOURCE_SHA']
          assert report['inputHash']==build['inputHash']
          assert report['contentHash']==build['contentHash']
          graph=report['audioGraph']
          assert graph['source']=='production-entry-imports-and-generated-worker'
          assert graph['deviceInitialized'] is False and graph['workerTerminated'] is True
          assert graph['workerProtocol']=='invalid-id-rejected'
          worker=graph['workerPath'].lstrip('/')
          assert worker.endswith('/patches/splatoon3/runtime/audio/render-worker.js')
          assert any(row['file']==worker and row['sha256']==build['artifacts'][worker] and row['bytes']>0 for row in report['loaded'])
          receipt={'status':'passed','sourceSha':os.environ['SOURCE_SHA'],'contentHash':build['contentHash'],'suite':'audio-catalog-supplemental','fullAcceptance':False,'runId':os.environ['GITHUB_RUN_ID'],'checks':['catalog/motion-catalog-result.json']}
          (root/'ci-result.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inkwave-audio-catalog-${{ env.SOURCE_SHA }}
          include-hidden-files: true
          if-no-files-found: warn
          path: ${{ env.CI_STORAGE }}/evidence/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: inkwave-audio-catalog-site-${{ env.SOURCE_SHA }}
          include-hidden-files: true
          if-no-files-found: error
          path: .built-site/
          retention-days: 14
