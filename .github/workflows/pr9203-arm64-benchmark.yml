name: PR 9203 ARM64 benchmark

on:
  push:
    paths:
      - ".github/workflows/pr9203-arm64-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR HEAD
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TARGET_SHA: 1122837fd0644ff2c0996b3dbfc9fa021303d2c8
          TARGET_BRANCH: integration/arch-defects-progress-20260918
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GH_PAT:-}" ]]; then
            git clone --depth=1 --branch "${TARGET_BRANCH}" "https://x-access-token:${GH_PAT}@github.com/rhgrive3/hex-ida.git" target >/dev/null 2>&1
          else
            git clone --depth=1 --branch "${TARGET_BRANCH}" "https://github.com/rhgrive3/hex-ida.git" target >/dev/null 2>&1
          fi
          cd target
          actual="$(git rev-parse HEAD)"
          printf '%s\n' "${actual}" > ../actual-head.txt
          if [[ "${actual}" != "${TARGET_SHA}" ]]; then
            echo "HEAD mismatch: expected=${TARGET_SHA} actual=${actual}" >&2
            exit 10
          fi

      - name: Run frozen 160-case benchmark
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          cp reports/public-benchmark/summary.json /tmp/old-summary.json

          manifest_sha="$(sha256sum benchmarks/public/codefuse-arm64/manifest.json | awk '{print $1}')"
          manifest_cases="$(node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('benchmarks/public/codefuse-arm64/manifest.json','utf8')); process.stdout.write(String(m.cases.length));")"
          printf 'head=%s\nmanifest_sha256=%s\nmanifest_cases=%s\n' "$(git rev-parse HEAD)" "${manifest_sha}" "${manifest_cases}" > ../evidence/run-meta.txt
          test "${manifest_cases}" = "160"

          rm -rf reports/public-benchmark-pr9203
          set +e
          timeout 1800s npm run benchmark:public -- \
            --manifest benchmarks/public/codefuse-arm64/manifest.json \
            --output reports/public-benchmark-pr9203 \
            --timeout-ms 120000 > /tmp/benchmark.log 2>&1
          bench_rc=$?
          set -e
          printf 'benchmark_exit=%s\n' "${bench_rc}" >> ../evidence/run-meta.txt

          if [[ ! -f reports/public-benchmark-pr9203/summary.json ]]; then
            {
              echo "summary-missing"
              echo "benchmark_exit=${bench_rc}"
              tail -n 50 /tmp/benchmark.log || true
            } > ../evidence/failure.txt
            exit "${bench_rc:-1}"
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const OLD = JSON.parse(fs.readFileSync('/tmp/old-summary.json','utf8'));
          const NEW = JSON.parse(fs.readFileSync('reports/public-benchmark-pr9203/summary.json','utf8'));
          const manifestBytes = fs.readFileSync('benchmarks/public/codefuse-arm64/manifest.json');
          const manifest = JSON.parse(manifestBytes);
          const expected = {
            denominator:11124,
            caseCRASH:66,
            casePASS:94,
            functionCRASH:340,
            functionPARTIAL:692,
            functionPASS:9600,
            functionUNSUPPORTED:320,
            matched:10804,
            idaOnly:172,
            hexOnly:148,
            hexPseudo:10292,
          };

          const order = ['PASS','PARTIAL','CRASH','UNSUPPORTED'];
          const state4 = obj => Object.fromEntries(order.map(k => [k, Number(obj?.[k] || 0)]));
          const metrics = s => {
            const a = s.comparison?.aggregate || {};
            return {
              denominator:Number(a.denominator || 0),
              caseState:state4(s.states),
              functionState:state4(s.functionStates),
              matched:Number(a.matched || 0),
              idaOnly:Number(a.ida || 0) - Number(a.matched || 0),
              hexOnly:Number(a.hex || 0) - Number(a.matched || 0),
              hexPseudocode:Number(a.hexPseudo || 0),
              hexPseudocodeCoverage:Number(a.hexCoverage || 0),
              idaFunctions:Number(a.ida || 0),
              hexFunctions:Number(a.hex || 0),
            };
          };
          const oldM = metrics(OLD);
          const newM = metrics(NEW);

          const baselineChecks = {
            denominator:oldM.denominator === expected.denominator,
            caseCRASH:oldM.caseState.CRASH === expected.caseCRASH,
            casePASS:oldM.caseState.PASS === expected.casePASS,
            functionCRASH:oldM.functionState.CRASH === expected.functionCRASH,
            functionPARTIAL:oldM.functionState.PARTIAL === expected.functionPARTIAL,
            functionPASS:oldM.functionState.PASS === expected.functionPASS,
            functionUNSUPPORTED:oldM.functionState.UNSUPPORTED === expected.functionUNSUPPORTED,
            matched:oldM.matched === expected.matched,
            idaOnly:oldM.idaOnly === expected.idaOnly,
            hexOnly:oldM.hexOnly === expected.hexOnly,
            hexPseudo:oldM.hexPseudocode === expected.hexPseudo,
          };
          if (Object.values(baselineChecks).some(v => !v)) {
            fs.writeFileSync('../evidence/failure.txt', JSON.stringify({error:'baseline-mismatch',oldM,expected,baselineChecks},null,2)+'\n');
            process.exit(20);
          }
          if (manifest.cases.length !== 160 || manifest.denominatorFrozen !== true) {
            fs.writeFileSync('../evidence/failure.txt', JSON.stringify({error:'manifest-not-frozen-160',cases:manifest.cases.length,denominatorFrozen:manifest.denominatorFrozen},null,2)+'\n');
            process.exit(21);
          }

          const deltaNum = (a,b) => b-a;
          const delta = {
            denominator:deltaNum(oldM.denominator,newM.denominator),
            caseState:Object.fromEntries(order.map(k=>[k,deltaNum(oldM.caseState[k],newM.caseState[k])])),
            functionState:Object.fromEntries(order.map(k=>[k,deltaNum(oldM.functionState[k],newM.functionState[k])])),
            matched:deltaNum(oldM.matched,newM.matched),
            idaOnly:deltaNum(oldM.idaOnly,newM.idaOnly),
            hexOnly:deltaNum(oldM.hexOnly,newM.hexOnly),
            hexPseudocode:deltaNum(oldM.hexPseudocode,newM.hexPseudocode),
            hexPseudocodeCoverage:newM.hexPseudocodeCoverage-oldM.hexPseudocodeCoverage,
          };

          const caseMap = s => new Map((s.results||[]).map(r=>[r.id,r.state]));
          const oldCases=caseMap(OLD), newCases=caseMap(NEW);
          const caseTransitions={};
          for (const [id,from] of oldCases) {
            const to=newCases.get(id) ?? 'MISSING';
            const k=`${from}->${to}`;
            caseTransitions[k]=(caseTransitions[k]||0)+1;
          }

          const rowMap = s => {
            const m=new Map();
            for (const c of s.comparison?.cases || []) {
              for (const r of c.rows || []) m.set(`${c.caseId}\0${r.address}`, r);
            }
            return m;
          };
          const oldRows=rowMap(OLD), newRows=rowMap(NEW);
          const functionTransitions={};
          let oldCrashToPass=0, oldCrashToPartial=0, oldCrashStillCrash=0, oldCrashOther=0;
          let oldUnsupportedToPass=0, oldUnsupportedToPartial=0, oldUnsupportedStillUnsupported=0, oldUnsupportedOther=0;
          let oldIdaOnlyRecovered=0, oldIdaOnlyStill=0;
          let rowKeyMissing=0;
          for (const [key,o] of oldRows) {
            const n=newRows.get(key);
            if (!n) { rowKeyMissing++; continue; }
            const from=o.hexPresent ? (o.hexState || 'PRESENT_UNKNOWN') : 'ABSENT';
            const to=n.hexPresent ? (n.hexState || 'PRESENT_UNKNOWN') : 'ABSENT';
            const tk=`${from}->${to}`;
            functionTransitions[tk]=(functionTransitions[tk]||0)+1;
            if (from==='CRASH') {
              if (to==='PASS') oldCrashToPass++;
              else if (to==='PARTIAL') oldCrashToPartial++;
              else if (to==='CRASH') oldCrashStillCrash++;
              else oldCrashOther++;
            }
            if (from==='UNSUPPORTED') {
              if (to==='PASS') oldUnsupportedToPass++;
              else if (to==='PARTIAL') oldUnsupportedToPartial++;
              else if (to==='UNSUPPORTED') oldUnsupportedStillUnsupported++;
              else oldUnsupportedOther++;
            }
            if (o.idaPresent && !o.hexPresent) {
              if (n.hexPresent) oldIdaOnlyRecovered++;
              else oldIdaOnlyStill++;
            }
          }

          const manifestSha256=crypto.createHash('sha256').update(manifestBytes).digest('hex');
          const out={
            schema:'pr9203-arm64-benchmark-comparison/v1',
            targetHead:NEW.provenance?.git?.sha,
            targetDirty:NEW.provenance?.git?.dirty,
            manifest:{sha256:manifestSha256,cases:manifest.cases.length,denominatorFrozen:manifest.denominatorFrozen,frozenAt:manifest.frozenAt},
            baselineProvenance:OLD.provenance,
            newProvenance:NEW.provenance,
            baselineChecks,
            old:oldM,
            current:newM,
            delta,
            caseTransitions,
            functionTransitions,
            crashRecovery:{
              oldCrashFunctions:oldM.functionState.CRASH,
              toPass:oldCrashToPass,
              toPartial:oldCrashToPartial,
              recoveredToPassOrPartial:oldCrashToPass+oldCrashToPartial,
              stillCrash:oldCrashStillCrash,
              other:oldCrashOther
            },
            unsupported320:{
              oldUnsupportedFunctions:oldM.functionState.UNSUPPORTED,
              toPass:oldUnsupportedToPass,
              toPartial:oldUnsupportedToPartial,
              stillUnsupported:oldUnsupportedStillUnsupported,
              other:oldUnsupportedOther
            },
            idaOnly172:{
              oldIdaOnly:oldM.idaOnly,
              recoveredHexPresence:oldIdaOnlyRecovered,
              stillIdaOnly:oldIdaOnlyStill
            },
            integrity:{
              oldRows:oldRows.size,
              newRows:newRows.size,
              rowKeyMissing,
              totalCasesOld:OLD.total,
              totalCasesNew:NEW.total
            }
          };
          fs.writeFileSync('../evidence/result.json', JSON.stringify(out,null,2)+'\n');
          NODE

          # Preserve only bounded failure evidence, never the full benchmark log.
          if [[ "${bench_rc}" -ne 0 ]]; then
            tail -n 50 /tmp/benchmark.log > ../evidence/failure-tail.txt || true
          fi

      - name: Upload compact benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr9203-arm64-benchmark-1122837
          path: evidence/
          if-no-files-found: error
          retention-days: 7
