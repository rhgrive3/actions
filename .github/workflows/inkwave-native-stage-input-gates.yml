name: INKWAVE native-stage input identity gates
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/check-inkwave-motion-catalog.mjs
      - scripts/check-inkwave-network-browser.mjs
      - scripts/check-inkwave-touch-layout-identity.mjs
      - scripts/check-inkwave-flow-render.mjs
      - scripts/check-inkwave-wall-render.mjs
      - scripts/check-inkwave-paint-mask.mjs
      - scripts/lib/inkwave-runtime-evidence.mjs
      - scripts/tests/inkwave-native-stage-inputs.test.mjs
      - scripts/tests/inkwave-build-packaging.test.mjs
      - scripts/tests/inkwave-runtime-evidence.test.mjs
      - patches/splatoon3/tests/motion-catalog-gates.test.mjs
      - patches/reliability/tests/start.test.mjs
      - patches/splatoon3/tests/issue-1039-host-ready.test.mjs
      - patches/splatoon3/tests/paint-mask-browser-fixture.mjs
      - patches/splatoon3/tests/paint-mask-probe-level.test.mjs
      - .github/workflows/inkwave-native-stage-input-gates.yml
permissions:
  contents: read
jobs:
  identity:
    if: github.head_ref == 'fix/native-stage-input-identities'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ac1159b76b42a10ff02fe58add74a8285cc08d32
          path: .baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact baseline rejection and candidate receipt acceptance
        run: |
          set -euo pipefail
          mkdir -p input-gate-evidence
          if bash --noprofile --norc -e -o pipefail -c 'node -e "process.exit(23)" | tee input-gate-evidence/pipeline-negative.log'; then
            echo 'Pipeline negative control unexpectedly passed'; exit 1
          else
            status=$?
            test "$status" -eq 23
            printf 'Expected pipeline failure exit=%s\n' "$status" | tee input-gate-evidence/pipeline-negative-status.log
          fi
          for source in inkwave-public patches/native-stages scripts/build-inkwave.mjs scripts/inkwave-source-composition.mjs; do
            git diff --no-index --exit-code ".baseline/$source" "$source"
          done
          if NATIVE_INPUT_ROOT="$GITHUB_WORKSPACE/.baseline" node --test scripts/tests/inkwave-native-stage-inputs.test.mjs > input-gate-evidence/before.log 2>&1; then
            echo 'Negative control unexpectedly passed'; exit 1
          fi
          grep -q 'Catalog input namespace/path native-stages/' input-gate-evidence/before.log
          node --experimental-vm-modules --test scripts/tests/inkwave-native-stage-inputs.test.mjs patches/splatoon3/tests/motion-catalog-gates.test.mjs patches/reliability/tests/start.test.mjs patches/splatoon3/tests/issue-1039-host-ready.test.mjs patches/splatoon3/tests/paint-mask-probe-level.test.mjs | tee input-gate-evidence/after.log
      - name: Unchanged production build and all emitted input identities
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock esbuild@0.28.2
          export ESBUILD_MODULE="$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js"
          node .baseline/scripts/build-inkwave.mjs .baseline/inkwave-public .baseline-site | tee input-gate-evidence/build-baseline.log
          node scripts/build-inkwave.mjs inkwave-public .gate-site | tee input-gate-evidence/build.log
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('.baseline-site/inkwave-build.json'));
          const after=JSON.parse(fs.readFileSync('.gate-site/inkwave-build.json'));
          for(const key of ['contentHash','inputHash']) assert.equal(after[key],before[key],key+' differs from same-base main');
          assert.equal(after.build.revision,before.build.revision,'runtime revision differs from same-base main');
          const proof={baseline:'ac1159b76b42a10ff02fe58add74a8285cc08d32',contentHash:after.contentHash,inputHash:after.inputHash,revision:after.build.revision};
          fs.writeFileSync('input-gate-evidence/unchanged-production.json',JSON.stringify(proof,null,2)+'\n');
          console.log(JSON.stringify(proof));
          JS
          INKWAVE_BUILT_SITE=.gate-site node --experimental-vm-modules --test scripts/tests/inkwave-build-packaging.test.mjs patches/splatoon3/tests/paint-mask-probe-level.test.mjs | tee input-gate-evidence/packaging.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-input-gates-${{ github.event.pull_request.head.sha }}
          path: input-gate-evidence
          if-no-files-found: error
          retention-days: 14
