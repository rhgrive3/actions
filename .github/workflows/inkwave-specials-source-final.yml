name: Verify Splatoon 3 special source boundaries
on:
  pull_request:
    paths:
      - 'patches/splatoon3/runtime/all-specials.mjs'
      - 'patches/splatoon3/tests/specials-source-final-1130.test.mjs'
      - '.github/workflows/inkwave-specials-source-final.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source-bound movement, Kraken capsule and tornado lifecycle
        run: |
          node --experimental-vm-modules --test patches/splatoon3/tests/specials-source-final-1130.test.mjs
          node --experimental-vm-modules --test patches/splatoon3/tests/all-specials.test.mjs
