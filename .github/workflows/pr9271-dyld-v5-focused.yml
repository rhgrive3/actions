name: PR9271 dyld v5 focused
on:
  pull_request:
    paths:
      - '.github/pr9271-dyld-v5-trigger'
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: f1ad43c825180118599a0945f33680e9ed523e21
          path: hex-ida
      - name: dyld slide v5 focused test
        shell: bash
        run: |
          set -o pipefail
          cd hex-ida
          timeout 90s node --test tests/scpa/x02-dyld-slide-info5.test.mjs > ../focused.txt 2>&1 || {
            code=$?
            tail -120 ../focused.txt > ../failure.txt
            cat ../failure.txt >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          }
      - name: Upload focused failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr9271-dyld-v5-failure
          path: failure.txt
