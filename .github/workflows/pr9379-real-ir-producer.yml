name: PR9379 real IR producer diagnostic

on:
  push:
    paths:
      - ".github/workflows/pr9379-real-ir-producer.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: 3fc429c714f15e1a8caaa06fa5c672987e51a881
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose real compatibility IR receiver extraction
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/diag.mjs <<'NODE'
          import fs from 'node:fs';
          import { buildIR } from '../js/ir-core.js';
          import { buildSemanticModel } from '../js/blocks.js';
          import { extractCppObjectEvidence } from '../js/analysis/cxx/object-evidence.js';
          const lines=['ldr w0, [x0, #0x38]','ret'];
          const rows=lines.map((text,row)=>{const split=text.indexOf(' ');return {row,address:0x100000000n+BigInt(row*4),mn:split<0?text:text.slice(0,split),ops:split<0?'':text.slice(split+1)};});
          const rowOfAddress=address=>rows.find(r=>r.address===BigInt(address))?.row??null;
          const model=buildSemanticModel(rows,{rowOfAddress,startRow:0,endRow:rows.length-1});
          const ir=buildIR(model,{rowOfAddress,returnType:'uint64',semanticMigrationMode:'semantic-v2-compat'});
          const report=extractCppObjectEvidence({
            functionId:'function-real-ir',
            functionAddress:rows[0].address,
            functionName:'_ZN6PlayerC1Ev',
            ir,
            snapshotId:'snap-real-ir',
            architecture:'arm64',
          });
          const x0=ir.args?.get?.('x0')??null;
          const out={
            x0:x0?{id:String(x0.id),kind:x0.kind??null,reg:x0.reg??null}:null,
            argKindValues:(ir.values||[]).filter(v=>v?.kind==='arg').map(v=>({id:String(v.id),reg:v.reg??null,index:v.index??null})),
            reportStatus:report.status,
            completeness:report.completeness,
            receiver:report.receiver?{canonicalValueId:String(report.receiver.canonicalValueId),functionAddress:String(report.receiver.functionAddress)}:null,
          };
          fs.writeFileSync('evidence/result.json',JSON.stringify(out,null,2)+'\n');
          NODE
          set +e
          timeout 60s node evidence/diag.mjs > evidence/stdout.txt 2> evidence/stderr.txt
          printf '%s\n' "$?" > evidence/status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr9379-real-ir-producer
          path: evidence/*
          retention-days: 2
