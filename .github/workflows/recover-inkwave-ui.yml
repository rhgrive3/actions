name: Recover INKWAVE UI CSS
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-inkwave-ui.yml"
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover missing stylesheet
        run: |
          set -euo pipefail
          mkdir -p inkwave-public/styles
          curl -fL --retry 3 --connect-timeout 15 \
            https://inkwave-six.vercel.app/styles/ui.css \
            -o inkwave-public/styles/ui.css
          test -s inkwave-public/styles/ui.css
          echo "ui.css bytes: $(wc -c < inkwave-public/styles/ui.css)"
      - name: Commit stylesheet
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inkwave-public/styles/ui.css
          git commit -m "Restore INKWAVE UI stylesheet"
          git push
