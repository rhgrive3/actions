name: INKWAVE native face diagnostic (no production edits)
on:
  push:
    branches: ['diagnostic/inkwave-face-front-20261018']
    paths: ['tools/face-production-diagnostic/**', '.github/workflows/inkwave-face-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: face-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render-face:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.sha }}
      BASE_SHA: 60cc6bf569561113b263e39cb094a05d45e491f9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify exact head and diagnostic-only diff
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --name-only "$BASE_SHA" HEAD > /tmp/face-diagnostic-changes.txt
          test -s /tmp/face-diagnostic-changes.txt
          if grep -Ev '^(tools/face-production-diagnostic/(browser|run)\.mjs|\.github/workflows/inkwave-face-diagnostic\.yml)$' /tmp/face-diagnostic-changes.txt; then
            echo 'Unexpected non-diagnostic change'; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact build and browser tools
        run: npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
      - name: Syntax check diagnostic harness
        run: find tools/face-production-diagnostic -name '*.mjs' -exec node --check '{}' \;
      - name: Install CI browser
        run: npx playwright install --with-deps chromium
      - name: Build unchanged production sources
        run: |
          node scripts/build-inkwave.mjs inkwave-public _site
          node scripts/check-inkwave-startup-budget.mjs _site
      - name: Render native face with head-aligned camera
        run: node tools/face-production-diagnostic/run.mjs --site _site --out .qa-evidence/face-diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: face-diagnostic-${{ github.sha }}
          path: |
            .qa-evidence/face-diagnostic/**
            _site/inkwave-build.json
          if-no-files-found: warn
          retention-days: 14
