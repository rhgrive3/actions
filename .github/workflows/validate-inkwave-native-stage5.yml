name: Validate INKWAVE native stage integration
on:
  pull_request:
    paths:
      - 'patches/splatoon3/tests/scorch-gorge-stage.test.mjs'
      - 'patches/splatoon3/tests/ranked-world.test.mjs'
      - 'scripts/tests/inkwave-stage-assets.test.mjs'
      - 'patches/native-stages/**'
      - 'scripts/inkwave-source-composition.mjs'
      - 'scripts/build-inkwave.mjs'
      - 'scripts/lib/inkwave-native-stages.mjs'
      - 'scripts/check-inkwave-source-placement-browser.mjs'
      - 'scripts/check-inkwave-terrain.mjs'
      - 'scripts/prepare-urchin-physics-fixture.mjs'
      - 'scripts/lib/inkwave-terrain-receipt.mjs'
      - 'scripts/tests/inkwave-terrain-receipt.test.mjs'
      - 'scripts/check-inkwave-terrain-browser.mjs'
      - 'scripts/check-inkwave-terrain-game.mjs'
      - 'scripts/fetch-inkwave-terrain-sources.py'
      - 'scripts/tests/test_fetch_inkwave_terrain_sources.py'
      - '.github/workflows/validate-inkwave-native-stage5.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tools/inkwave-modeler/blender/
            !/tools/inkwave-modeler/docs/
            !/reports/*
            /reports/native-stages/
            !/reports/native-stages/*
            /reports/native-stages/humpback-verification.json
            /reports/ink-volume/
            !/reports/ink-volume/*
            /reports/ink-volume/source/
            *.js
            *.mjs
            *.cjs
      - name: Verify immutable checkout identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_source_sha="$(git rev-parse HEAD)"
          printf 'Expected source: %s\nActual checkout: %s\n' "$EXPECTED_SOURCE_SHA" "$actual_source_sha"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock esbuild@0.28.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned synthetic Python source-mask contract dependencies
        run: python -m pip install --disable-pip-version-check -r patches/native-stages/tools/requirements-ci.txt
      - name: Verify source-fetch integrity and numeric failure receipts without originals
        run: python3 -m unittest discover -s scripts/tests -p 'test_fetch_inkwave_terrain_sources.py' -v
      - name: Geometry, paint and existing stage/rule contracts (no third-party assets)
        run: node --experimental-vm-modules --test --test-concurrency=1 patches/native-stages/tests/*.test.mjs patches/splatoon3/tests/scorch-gorge-stage.test.mjs patches/splatoon3/tests/ranked-world.test.mjs
      - name: Build public composition without reference models
        run: node scripts/build-inkwave.mjs inkwave-public _site
      - name: Verify emitted Boolean-ground hit and damage parity
        run: INKWAVE_BUILT_SITE="$PWD/_site" node --experimental-vm-modules --test patches/native-stages/tests/boolean-ground-parity.test.mjs patches/native-stages/tests/sphere-triangle-small-world.test.mjs
      - name: Verify emitted vertical-slab hit and damage parity
        run: INKWAVE_BUILT_SITE="$PWD/_site" node --experimental-vm-modules --test patches/native-stages/tests/vertical-slab-parity.test.mjs
      - name: Assert reference model payload remains excluded
        run: test ! -e _site/_native-reference-assets && node --test scripts/tests/inkwave-stage-assets.test.mjs
  placement-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tools/inkwave-modeler/blender/
            !/tools/inkwave-modeler/docs/
            !/reports/*
            /reports/ink-volume/
            !/reports/ink-volume/*
            /reports/ink-volume/source/
            *.js
            *.mjs
            *.cjs
      - name: Verify immutable checkout identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_source_sha="$(git rev-parse HEAD)"
          printf 'Expected source: %s\nActual checkout: %s\n' "$EXPECTED_SOURCE_SHA" "$actual_source_sha"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Build without original stage payloads
        run: node scripts/build-inkwave.mjs inkwave-public work/site
      - name: Verify diagnostic placement conversion in a real Worker
        run: node scripts/check-inkwave-source-placement-browser.mjs work/site work/placement-evidence/worker.json
      - name: Verify terrain render/collision coverage and reload in real WebGL
        run: node scripts/check-inkwave-terrain-browser.mjs work/site --synthetic work/terrain-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inkwave-diagnostic-placement-worker
          path: work/placement-evidence/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inkwave-terrain-geometry
          path: work/terrain-evidence/
          if-no-files-found: ignore
  source-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tools/inkwave-modeler/blender/
            !/tools/inkwave-modeler/docs/
            !/reports/*
            /reports/ink-volume/
            !/reports/ink-volume/*
            /reports/ink-volume/source/
            *.js
            *.mjs
            *.cjs
      - name: Verify immutable checkout identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_source_sha="$(git rev-parse HEAD)"
          printf 'Expected source: %s\nActual checkout: %s\n' "$EXPECTED_SOURCE_SHA" "$actual_source_sha"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Verify audit-to-fixture byte binding
        run: node --test scripts/tests/inkwave-terrain-receipt.test.mjs
      - name: Fetch all pinned original OBJ and MTL inputs privately
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch-inkwave-terrain-sources.py .codex-stage-sources/terrain-ci
      - name: Audit every playable source mesh, collision BVH and paint chart
        run: node scripts/check-inkwave-terrain.mjs .codex-stage-sources/terrain-ci work/terrain-source-evidence/audit.json .codex-stage-sources/terrain-ci-derived
      - name: Prepare private physics-only Urchin fixture and run unchanged arena baseline
        id: urchin
        continue-on-error: true
        env:
          INKWAVE_NATIVE_STAGE_ASSETS: ${{ github.workspace }}/.codex-stage-sources/urchin-physics-only
        run: |
          set -o pipefail
          node scripts/prepare-urchin-physics-fixture.mjs .codex-stage-sources/terrain-ci .codex-stage-sources/terrain-ci-derived work/terrain-source-evidence/audit.json "$INKWAVE_NATIVE_STAGE_ASSETS" 2>&1 | tee work/terrain-source-evidence/urchin-prepare.log
          # NativeLevel + NativePhysics + CPU PaintSystem: no texture loader or rendering.
          # Preserve the test body and all 60 configured cases; a first failure can stop its loop.
          set +e
          node --experimental-vm-modules --test --test-reporter=tap patches/native-stages/tests/native-arena-basis.test.mjs 2>&1 | tee work/terrain-source-evidence/urchin-arena.tap
          statuses=("${PIPESTATUS[@]}")
          status=${statuses[0]}
          if [ "${statuses[1]}" -ne 0 ]; then status=1; fi
          set -e
          if grep -q ' # SKIP' work/terrain-source-evidence/urchin-arena.tap; then exit 1; fi
          exit "$status"
      - name: Verify original Bluefin central walking and paint at 30/60/120 Hz
        env:
          INKWAVE_TERRAIN_ASSETS: ${{ github.workspace }}/.codex-stage-sources/terrain-ci-derived
        run: node --experimental-vm-modules --test patches/native-stages/tests/bluefin-terrain-source.test.mjs
      - run: node scripts/build-inkwave.mjs inkwave-public work/site
      - name: Compare real source render and collision coverage in WebGL
        run: node scripts/check-inkwave-terrain-browser.mjs work/site .codex-stage-sources/terrain-ci-derived work/terrain-source-evidence/browser
      - name: Enforce unchanged Urchin arena baseline result
        if: always() && steps.urchin.outcome == 'failure'
        run: exit 1
      - name: Publish numeric receipts only; exclude third-party payloads
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inkwave-all-stage-terrain-source-summary
          path: |
            work/terrain-source-evidence/fetch.json
            work/terrain-source-evidence/audit.json
            work/terrain-source-evidence/urchin-prepare.log
            work/terrain-source-evidence/urchin-arena.tap
            work/terrain-source-evidence/browser/terrain-browser.json
          if-no-files-found: error

