name: INKWAVE isolated character asset QA
on:
  pull_request:
    paths:
      - 'tools/character-asset-qa/**'
      - '.github/workflows/inkwave-character-asset-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: character-asset-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  neutral-loader-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact official QA and build dependencies
        run: npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1 three@0.186.0
      - name: Validate binary, case denominators and lifetime gates
        run: node --test tools/character-asset-qa/test.mjs
      - name: Install CI browser
        run: npx playwright install --with-deps chromium
      - name: Build unchanged production runtime for the fixture
        run: |
          node scripts/build-inkwave.mjs inkwave-public _site
          node scripts/check-inkwave-startup-budget.mjs _site
      - name: Test neutral synthetic GLB against actual built r186 and Character
        run: node tools/character-asset-qa/run.mjs --site _site --out .qa-evidence/character-asset --synthetic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neutral-character-asset-qa-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .qa-evidence/character-asset/*.json
            .qa-evidence/character-asset/*.png
          if-no-files-found: warn
          retention-days: 14
