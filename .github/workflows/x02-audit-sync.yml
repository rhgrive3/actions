name: Temporary X-02 Audit Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x02-audit-sync.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_REPO: rhgrive3/hex-ida
      TARGET_REF: feat/analysis-roadmap-v8-current-main-20260907
      EXPECTED_HEAD: 1e015841e2a0d02243b623d304908e90c0233211
    steps:
      - name: Checkout target at expected head
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_PAT:-}" || { echo 'GH_PAT is required'; exit 2; }
          git config --global user.name 'actions-x02-audit-sync'
          git config --global user.email 'actions-x02-audit-sync@users.noreply.github.com'
          git init target >/dev/null
          cd target
          git remote add origin "https://x-access-token:${GH_PAT}@github.com/${TARGET_REPO}.git"
          git fetch --depth=1 origin "refs/heads/${TARGET_REF}:refs/remotes/origin/${TARGET_REF}" >/dev/null
          actual="$(git rev-parse "refs/remotes/origin/${TARGET_REF}")"
          if [[ "${actual}" != "${EXPECTED_HEAD}" ]]; then
            echo "ABORT: target moved before checkout: expected=${EXPECTED_HEAD} actual=${actual}"
            exit 4
          fi
          git checkout --detach "${actual}" >/dev/null
          printf '%s\n' "${actual}" > ../initial_head.txt

      - name: Update only current X-02 audit state
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/analysis-local-acceptance-audit.json')
          data = json.loads(path.read_text())

          assert data['schemaVersion'] == 'hex-analysis-local-acceptance/v1'
          assert data['originalFindingCount'] == 23
          assert data['originalTaskCount'] == 21
          assert data['overallStatus'] == 'CHECKPOINT-LOCKED'
          assert data['fullRoadmapComplete'] is False
          assert data['transformAuthorization'] is False

          findings = [x for x in data['findings'] if x.get('id') == 'HEX-X-02']
          tasks = [x for x in data['tasks'] if x.get('id') == 'FR-X-02A']
          assert len(findings) == 1, len(findings)
          assert len(tasks) == 1, len(tasks)

          findings[0]['localStatus'] = 'partial-local-matrix'
          findings[0]['assessment'] = (
              '元120行と既存59機能case+2manifestを保持。current finite overlayはX02-F-48の'
              'compiler-produced arm64e Mach-O/PAC evidenceをpassとして、pinned LLVM 18.1.3 oracleが'
              '利用できない通常環境で115 pass/0 product-gap/3 evidence-gap/2 environment-excluded。'
              'X02-H-02のindependent reparseがexecutable digest/version/format/architectureを含めて成功する'
              '環境のみ116/0/3/1。残る3 evidence-gapはversioned Apple OS/toolchain/runtime corpus、real dyld '
              'shared cache + OS-derived slide/rebase provenance、genuine signed Mach-O + trusted signing validation。'
              'X02-F-47の実PAC authenticationはreal Apple arm64e runtime依存。全X-02・実機・release受入は未完了。'
          )
          findings[0]['source'] = 'docs/analysis-x02-acceptance.md'
          findings[0]['verificationSuite'] = 'scpa-test'
          findings[0]['originalRequirementAcceptedHere'] = False

          tasks[0]['localStatus'] = 'partial-local-matrix'
          tasks[0]['currentAssessment'] = (
              '元120行をcanonical統合し製品不足6行を修正済み。X02-F-48を実compiler生成arm64e/PAC evidenceで'
              'current passへ進め、通常current分類は115/0/3/2。exact pinned LLVM 18.1.3でX02-H-02の独立reparseが'
              '成功した環境のみ116/0/3/1。unknown versionはpartialのまま保持し、残る実Apple runtime corpus、'
              'real dyld cache/slide provenance、genuine signed Mach-O/signing validation、実arm64e PAC runtimeは未完了。'
          )
          tasks[0]['originalRequirementAcceptedHere'] = False

          follow = data['integrationFollowup']
          assert follow['x02HistoricalClassification'] == {
              'pass': 108,
              'product-gap': 6,
              'evidence-gap': 4,
              'environment-excluded': 2,
          }
          follow['x02CurrentFiniteClassification'] = {
              'pass': 115,
              'product-gap': 0,
              'evidence-gap': 3,
              'environment-excluded': 2,
          }
          follow['x02AcceptanceReconciliation20260916'] = {
              'status': 'PARTIAL-LOCAL-MATRIX',
              'denominator': 120,
              'frozenMatrixSha256': follow['x02FrozenMatrixSha256'],
              'historicalClassification': {
                  'pass': 108,
                  'product-gap': 6,
                  'evidence-gap': 4,
                  'environment-excluded': 2,
              },
              'currentWithoutPinnedLlvmOracle': {
                  'pass': 115,
                  'product-gap': 0,
                  'evidence-gap': 3,
                  'environment-excluded': 2,
              },
              'conditionalWithPinnedLlvmOracle': {
                  'pass': 116,
                  'product-gap': 0,
                  'evidence-gap': 3,
                  'environment-excluded': 1,
                  'condition': 'X02-H-02 exact independent reparse succeeds with pinned LLVM 18.1.3 executable digest/version/format/architecture checks',
              },
              'currentPassAdded': 'X02-F-48 compiler-produced arm64e Mach-O/PAC evidence',
              'remainingEvidenceGaps': [
                  'versioned Apple OS/toolchain/runtime corpus with provenance',
                  'real dyld shared cache plus OS-derived slide/rebase provenance',
                  'genuine signed Mach-O plus trusted signing validation',
              ],
              'remainingEnvironmentExcluded': [
                  'X02-F-47 real PAC authentication on Apple arm64e runtime',
                  'X02-H-02 exact pinned LLVM oracle when unavailable',
              ],
              'sourceOfTruth': 'docs/analysis-x02-acceptance.md',
              'fullRoadmapComplete': False,
              'transformAuthorization': False,
          }

          limitations = data.get('localIntegrationLimitations', [])
          stale = 'remote X02 reviewed matrix not locally available'
          replacement = 'X02 prior120 matrix is integrated; real Apple runtime/cache/signing/device evidence remains absent'
          data['localIntegrationLimitations'] = [replacement if x == stale else x for x in limitations]

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Validate JSON and X-02 invariants
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool docs/analysis-local-acceptance-audit.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/analysis-local-acceptance-audit.json').read_text())
          f=next(x for x in d['findings'] if x['id']=='HEX-X-02')
          t=next(x for x in d['tasks'] if x['id']=='FR-X-02A')
          r=d['integrationFollowup']['x02AcceptanceReconciliation20260916']
          assert f['localStatus']=='partial-local-matrix'
          assert '115 pass/0 product-gap/3 evidence-gap/2 environment-excluded' in f['assessment']
          assert '116/0/3/1' in t['currentAssessment']
          assert d['integrationFollowup']['x02CurrentFiniteClassification']=={'pass':115,'product-gap':0,'evidence-gap':3,'environment-excluded':2}
          assert r['currentWithoutPinnedLlvmOracle']=={'pass':115,'product-gap':0,'evidence-gap':3,'environment-excluded':2}
          assert r['conditionalWithPinnedLlvmOracle']['pass']==116
          assert d['originalFindingCount']==23 and d['originalTaskCount']==21
          assert d['overallStatus']=='CHECKPOINT-LOCKED' and d['fullRoadmapComplete'] is False and d['transformAuthorization'] is False
          print('X-02 audit validation PASS')
          PY
          git diff --check
          git diff -- docs/analysis-local-acceptance-audit.json > ../audit.diff
          git diff --stat -- docs/analysis-local-acceptance-audit.json

      - name: Recheck branch and push audit sync
        working-directory: target
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          remote_now="$(git ls-remote "https://x-access-token:${GH_PAT}@github.com/${TARGET_REPO}.git" "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          if [[ "${remote_now}" != "${EXPECTED_HEAD}" ]]; then
            echo "ABORT: target moved before push: expected=${EXPECTED_HEAD} actual=${remote_now}"
            exit 4
          fi
          git add docs/analysis-local-acceptance-audit.json
          git commit -m 'docs(analysis): sync X-02 audit acceptance'
          new_head="$(git rev-parse HEAD)"
          git push --no-verify origin "HEAD:refs/heads/${TARGET_REF}"
          pushed="$(git ls-remote "https://x-access-token:${GH_PAT}@github.com/${TARGET_REPO}.git" "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          test "${pushed}" = "${new_head}"
          printf '%s\n' "${new_head}" > ../new_head.txt
          python3 - <<PY > ../summary.json
          import json
          print(json.dumps({'oldHead':'${EXPECTED_HEAD}','newHead':'${new_head}','target':'${TARGET_REPO}:${TARGET_REF}','result':'pushed-and-verified'}, indent=2))
          PY

      - name: Upload minimal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x02-audit-sync-evidence
          path: |
            initial_head.txt
            new_head.txt
            summary.json
            audit.diff
          if-no-files-found: ignore
          retention-days: 3
