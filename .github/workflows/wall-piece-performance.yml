name: Single-piece paint sample performance (diagnostic only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/wall-piece-performance.yml
      - scripts/measure-paint-piece-workload.mjs
      - scripts/fixtures/paint-piece-workload.mjs
      - scripts/tests/wall-piece-performance-contract.test.mjs
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'ci/wall-paint-performance-probe' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        profile: [aggregate, single_continuous]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASELINE_SHA: b078c37907351f1bbc13d0e7d4b5cbeb0a330009
      CANDIDATE_SHA: 79bb26a988f28d42dfa0c3f9a4c43330895f6bc0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable inputs
        run: |
          node --input-type=module - <<'JS'
          for (const key of ['BASELINE_SHA','CANDIDATE_SHA']) if (!/^[a-f0-9]{40}$/.test(process.env[key]||'')) throw Error('Full SHA required: '+key);
          if (process.env.BASELINE_SHA===process.env.CANDIDATE_SHA) throw Error('Baseline and candidate must differ');
          JS
      - uses: actions/checkout@v4
        with:
          ref: b078c37907351f1bbc13d0e7d4b5cbeb0a330009
          path: .paint-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 79bb26a988f28d42dfa0c3f9a4c43330895f6bc0
          path: .paint-candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned build and browser tools
        run: |
          npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Build immutable production artifacts
        run: |
          test "$(git -C .paint-baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C .paint-candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          export ESBUILD_MODULE="$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js"
          node .paint-baseline/scripts/build-inkwave.mjs .paint-baseline/inkwave-public .paint-before-site
          node .paint-candidate/scripts/build-inkwave.mjs .paint-candidate/inkwave-public .paint-after-site
          mkdir -p .paint-performance-evidence
          cp .paint-before-site/inkwave-build.json .paint-performance-evidence/baseline-manifest.json
          cp .paint-after-site/inkwave-build.json .paint-performance-evidence/candidate-manifest.json
          git rev-parse HEAD > .paint-performance-evidence/probe-sha.txt
      - name: Measure direct-piece predicates with unchanged masks and wire
        run: |
          node scripts/measure-paint-piece-workload.mjs \
            --baseline-sha "$BASELINE_SHA" --candidate-sha "$CANDIDATE_SHA" \
            --baseline-root .paint-baseline --candidate-root .paint-candidate \
            --baseline-site .paint-before-site --candidate-site .paint-after-site \
            --playwright "$GITHUB_WORKSPACE/node_modules/playwright/index.mjs" \
            --profile "${{ matrix.profile }}" --require-equivalent-work --minimal-timing \
            --evidence-dir ".paint-performance-evidence/${{ matrix.profile }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-piece-minimal-${{ matrix.profile }}-79bb26a9
          path: .paint-performance-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
