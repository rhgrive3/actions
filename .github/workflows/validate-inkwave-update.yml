name: Validate INKWAVE update
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-inkwave-update.yml
      - "inkwave-public/**"
      - "patches/splatoon3/**"
      - "patches/touch-layout/**"
      - "patches/reliability/**"
      - "patches/local-quality/**"
      - "scripts/*inkwave*.mjs"
      - "scripts/tests/inkwave-*.mjs"
  pull_request:
    paths:
      - .github/workflows/validate-inkwave-update.yml
      - "inkwave-public/**"
      - "patches/splatoon3/**"
      - "patches/touch-layout/**"
      - "patches/reliability/**"
      - "patches/local-quality/**"
      - "scripts/*inkwave*.mjs"
      - "scripts/tests/inkwave-*.mjs"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full immutable commit SHA to verify
        required: true
        type: string
permissions:
  contents: read
env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Verify immutable checkout identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify gameplay patch contracts and regressions
        run: node --experimental-vm-modules scripts/check-inkwave-patches.mjs
      - name: Verify local quality regressions
        run: node --experimental-vm-modules --test patches/local-quality/tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: failure() && hashFiles('.ci-scratch/inkwave-patches/patch-tests.log') != ''
        with:
          name: inkwave-patch-failure-diagnostics-${{ inputs.source_sha || github.sha }}
          if-no-files-found: error
          path: .ci-scratch/inkwave-patches/
          retention-days: 14
      - name: Verify motion verifier regressions
        run: node --test scripts/tests/inkwave-motion-gates.test.mjs scripts/tests/inkwave-integration-workflow.test.mjs scripts/tests/inkwave-runtime-evidence.test.mjs
      - name: Verify pinned primary numerical sources
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request
          reference=json.loads(pathlib.Path('patches/splatoon3/reference/curated-numbers.json').read_text())
          for source in reference['sources']:
            target=pathlib.Path('.reference-data')/source['id']
            target.parent.mkdir(parents=True,exist_ok=True)
            with urllib.request.urlopen(source['url'],timeout=30) as response: target.write_bytes(response.read())
          PY
          node scripts/verify-inkwave-reference.mjs .reference-data
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find inkwave-public/src inkwave-public/vendor patches/local-quality -type f \( -name '*.js' -o -name '*.mjs' \) -print0 |
            while IFS= read -r -d '' f; do node --check "$f"; done
      - name: Check local module and stylesheet references
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          root=pathlib.Path('inkwave-public')
          missing=[]
          for p in root.rglob('*'):
            if not p.is_file() or p.suffix not in {'.js','.mjs','.html','.css'}: continue
            try: s=p.read_text(encoding='utf-8')
            except: continue
            refs=set()
            if p.suffix in {'.js','.mjs'}:
              refs.update(re.findall(r'''(?:from\s*|import\s*\()\s*["']([^"']+)["']''',s))
              refs.update(re.findall(r'''import\s*["']([^"']+)["']''',s))
            if p.suffix in {'.html','.css'}:
              refs.update(re.findall(r'''(?:src|href)=["']([^"']+)["']''',s))
              refs.update(re.findall(r'''@import\s+(?:url\()?["']?([^"'\)\s]+)''',s))
            for ref in refs:
              if ref.startswith(('http:','https:','data:','blob:','#')) or ref in {'three'} or ref.startswith('three/addons/'): continue
              if not ref.startswith(('./','../','/')) and p.suffix in {'.js','.mjs'}: continue
              q=(root/ref.lstrip('/')) if ref.startswith('/') else (p.parent/ref)
              q=pathlib.Path(str(q).split('?',1)[0].split('#',1)[0])
              if not q.exists(): missing.append((str(p),ref,str(q)))
          if missing:
            for x in missing: print('MISSING',*x)
            sys.exit(1)
          print('references OK')
          PY
      - name: Build patched site at the checkout commit
        run: |
          npm install --no-save --no-package-lock --silent esbuild@0.28.2
          node scripts/build-inkwave.mjs inkwave-public _site
          git rev-parse HEAD > _site-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: inkwave-patched-site-${{ inputs.source_sha || github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            _site/
            _site-source-sha.txt
          retention-days: 14
  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite: [active, catalog, ui]
    env:
      TMPDIR: ${{ github.workspace }}/.ci-scratch
      TMP: ${{ github.workspace }}/.ci-scratch
      TEMP: ${{ github.workspace }}/.ci-scratch
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browser-cache
      BROWSER_SUITE: ${{ matrix.suite }}
      CI_STORAGE: /mnt/workspace/inkwave-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: inkwave-patched-site-${{ inputs.source_sha || github.sha }}
          path: .built-site
      - name: Prepare workspace storage and browser
        run: |
          mkdir -p .ci-scratch
          sudo mkdir -p "$CI_STORAGE"
          sudo chown "$(id -u):$(id -g)" "$CI_STORAGE"
          test "$(realpath "$CI_STORAGE")" = "$CI_STORAGE"
          mkdir -p "$CI_STORAGE/evidence" "$CI_STORAGE/cache"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat .built-site/_site-source-sha.txt)" = "$SOURCE_SHA"
          npm install --no-save --no-package-lock --silent playwright@1.62.1
          npx playwright install --with-deps chromium webkit
      - name: Verify active browser behavior and loaded artifact bytes
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-browser.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/game" --profile-dir "$CI_STORAGE/cache/game" --exact-source
      - name: Verify rendered walking contacts and transitions
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-motion.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/motion" --profile-dir "$CI_STORAGE/cache/motion"
      - name: Verify rendered sub, Flow and weapon detail transitions
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-motion-detail.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/motion-detail" --profile-dir "$CI_STORAGE/cache/motion-detail"
      - name: Verify Flow geometry through actual GTAO and GPU disposal
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-flow-render.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/flow" --profile-dir "$CI_STORAGE/cache/flow" --exact-source
      - name: Verify wall geometry through actual GTAO and GPU disposal
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-wall-render.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/wall" --profile-dir "$CI_STORAGE/cache/wall" --exact-source
      - name: Compare runtime at immutable baseline and candidate
        if: matrix.suite == 'active'
        run: |
          npm install --no-save --no-package-lock --silent esbuild@0.28.2 playwright@1.62.1
          baseline_sha=5e28dbd16f7829aebd88052ff5f7fdf71f39fdad
          baseline_checkout=/mnt/workspace/.dev-state/agent-work/checkouts/inkwave-runtime-performance-ui-ci-${{ github.run_id }}-${{ github.run_attempt }}/baseline
          mkdir -p "$(dirname "$baseline_checkout")"
          test "$(realpath "$(dirname "$baseline_checkout")")" = "$(dirname "$baseline_checkout")"
          git fetch origin "$baseline_sha"
          git worktree add --detach "$baseline_checkout" "$baseline_sha"
          ESBUILD_MODULE="$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js" node "$baseline_checkout/scripts/build-inkwave.mjs" "$baseline_checkout/inkwave-public" "$CI_STORAGE/cache/runtime-baseline-site"
          node scripts/check-inkwave-runtime-performance.mjs --site "$CI_STORAGE/cache/runtime-baseline-site" --evidence-dir "$CI_STORAGE/evidence/runtime-before" --playwright "$GITHUB_WORKSPACE/node_modules/playwright/index.mjs" --source-sha "$baseline_sha" --fixed-only --quality medium
          node scripts/check-inkwave-runtime-performance.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/runtime-after" --playwright "$GITHUB_WORKSPACE/node_modules/playwright/index.mjs" --source-sha "$SOURCE_SHA" --fixed-only --quality medium --verify-render
          node scripts/compare-inkwave-runtime-performance.mjs --before "$CI_STORAGE/evidence/runtime-before/runtime-result.json" --after "$CI_STORAGE/evidence/runtime-after/runtime-result.json" --out "$CI_STORAGE/evidence/runtime-comparison.json"
      - name: Verify the complete installed motion catalog
        if: matrix.suite == 'catalog'
        run: node scripts/check-inkwave-motion-catalog.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/catalog" --profile-dir "$CI_STORAGE/cache/catalog"
      - name: Verify touch layout in Chromium and WebKit
        if: matrix.suite == 'ui'
        run: node scripts/check-inkwave-touch-layout.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/layout" --profile-dir "$CI_STORAGE/cache/layout"
      - name: Verify built input and lifecycle modules in Chromium and WebKit
        if: matrix.suite == 'ui'
        run: node scripts/check-inkwave-reliability.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/reliability" --profile-dir "$CI_STORAGE/cache/reliability"
      - name: Reject forged touch and reliability source identities
        if: matrix.suite == 'ui'
        run: |
          node scripts/check-inkwave-touch-layout-identity.mjs --site .built-site/_site --source inkwave-public --checkout-dir "$CI_STORAGE/identity-touch" --evidence-dir "$CI_STORAGE/evidence/identity-touch"
          node scripts/check-inkwave-touch-layout-identity.mjs --reliability --site .built-site/_site --source inkwave-public --checkout-dir "$CI_STORAGE/identity-reliability" --evidence-dir "$CI_STORAGE/evidence/identity-reliability"
      - name: Verify responsive menus in Chromium and WebKit
        if: matrix.suite == 'ui'
        run: node scripts/check-inkwave-responsive.mjs --source .built-site/_site --section all --evidence-dir "$CI_STORAGE/evidence/responsive" --profile-dir "$CI_STORAGE/cache/responsive"
      - name: Bind passing browser evidence to the tested commit
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['CI_STORAGE'])/'evidence'
          suite=os.environ['BROWSER_SUITE']
          checks={
            'active':['game/browser-result.json','motion/motion-result.json','motion-detail/motion-detail-result.json','flow/flow-render-result.json','wall/wall-render-result.json','runtime-before/runtime-result.json','runtime-after/runtime-result.json','runtime-comparison.json'],
            'catalog':['catalog/motion-catalog-result.json'],
            'ui':['layout/touch-layout-result.json','reliability/reliability-browser-result.json','identity-touch/touch-layout-identity-result.json','identity-reliability/reliability-identity-result.json','responsive/responsive-result.json'],
          }[suite]
          reports={name:json.loads((root/name).read_text()) for name in checks}
          build=json.loads(pathlib.Path('.built-site/_site/inkwave-build.json').read_text())
          assert pathlib.Path('.built-site/_site-source-sha.txt').read_text().strip()==os.environ['SOURCE_SHA']
          for name,report in reports.items():
            if name=='motion/motion-result.json': assert not report['errors'] and report['fixture']['scenarios']==10
            else: assert report['status']=='passed', name
            if 'contentHash' in report and name!='runtime-before/runtime-result.json': assert report['contentHash']==build['contentHash'], name
          if suite=='active':
            assert reports['game/browser-result.json']['sourceSha']==os.environ['SOURCE_SHA']
            assert reports['runtime-after/runtime-result.json']['sourceSha']==os.environ['SOURCE_SHA']
          receipt={'status':'passed','sourceSha':os.environ['SOURCE_SHA'],'contentHash':build['contentHash'],'suite':suite,'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'event':os.environ['GITHUB_EVENT_NAME'],'checks':checks}
          pending=root/'ci-result.json.pending'; pending.write_text(json.dumps(receipt,indent=2)+'\n'); pending.replace(root/'ci-result.json')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: inkwave-browser-failure-${{ matrix.suite }}-${{ inputs.source_sha || github.sha }}
          include-hidden-files: true
          if-no-files-found: warn
          path: ${{ env.CI_STORAGE }}/evidence/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: inkwave-browser-${{ matrix.suite }}-${{ inputs.source_sha || github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: ${{ env.CI_STORAGE }}/evidence/
          retention-days: 14
