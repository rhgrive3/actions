name: Validate INKWAVE update
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-inkwave-update.yml
      - "inkwave-public/**"
      - "patches/splatoon3/**"
      - "patches/touch-layout/**"
      - "patches/reliability/**"
      - "patches/local-quality/**"
      - "patches/movement-physics/**"
      - "patches/network-replication/**"
      - "patches/loading-cache/**"
      - "patches/practice-range/**"
      - "scripts/*inkwave*.mjs"
      - "scripts/tests/inkwave-*.mjs"
      - "scripts/lib/inkwave-*.mjs"
  pull_request:
    paths:
      - .github/workflows/validate-inkwave-update.yml
      - "inkwave-public/**"
      - "patches/splatoon3/**"
      - "patches/touch-layout/**"
      - "patches/reliability/**"
      - "patches/local-quality/**"
      - "patches/movement-physics/**"
      - "patches/network-replication/**"
      - "patches/loading-cache/**"
      - "patches/practice-range/**"
      - "scripts/*inkwave*.mjs"
      - "scripts/tests/inkwave-*.mjs"
      - "scripts/lib/inkwave-*.mjs"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full immutable commit SHA to verify
        required: true
        type: string
      focused_tests:
        description: Optional JSON list of INKWAVE test files; supplements the unchanged full gate
        type: string
        default: ''
      focused_baselines:
        description: Optional JSON list of immutable baseline SHAs required by focused tests
        type: string
        default: '[]'
      runtime_performance:
        description: Run the pinned runtime workstream baseline and candidate comparison
        type: boolean
        default: false
      diagnostic_only:
        description: Run isolated render repeatability diagnosis (never full acceptance)
        type: boolean
        default: false
      deep_lifecycle:
        description: Run the full 10-cycle rematch lifecycle instead of the fast 3-cycle gate
        type: boolean
        default: false
concurrency:
  group: validate-inkwave-${{ github.event.pull_request.number || inputs.source_sha || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
  FOCUSED_EVIDENCE_DIR: /mnt/workspace/.dev-state/agent-work/evidence/inkwave-focused-${{ github.run_id }}-${{ github.run_attempt }}
  INKWAVE_TEST_SCRATCH: /mnt/workspace/.dev-state/agent-work/scratch/inkwave-worker-${{ github.run_id }}-${{ github.run_attempt }}
  RUNTIME_PERFORMANCE: ${{ inputs.runtime_performance == true || (github.event_name == 'pull_request' && (github.head_ref == 'inkwave/runtime-performance-ui' || github.head_ref == 'inkwave/final-nine-way-integration')) }}
  REMATCH_CYCLES: ${{ inputs.deep_lifecycle == true && '10' || '3' }}
jobs:
  validate:
    if: inputs.diagnostic_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify immutable checkout identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned source regression and build tool
        run: npm install --no-save --no-package-lock --silent esbuild@0.28.2
      - name: Prepare persistent worker regression fixtures
        run: |
          test "$(realpath -m "$INKWAVE_TEST_SCRATCH")" = "$INKWAVE_TEST_SCRATCH"
          sudo mkdir -p "$INKWAVE_TEST_SCRATCH"
          sudo chown "$(id -u):$(id -g)" "$INKWAVE_TEST_SCRATCH"
          test "$(realpath "$INKWAVE_TEST_SCRATCH")" = "$INKWAVE_TEST_SCRATCH"
          test -w "$INKWAVE_TEST_SCRATCH"
      - name: Prepare persistent focused test evidence
        if: inputs.focused_tests != ''
        run: |
          test "$(realpath -m "$FOCUSED_EVIDENCE_DIR")" = "$FOCUSED_EVIDENCE_DIR"
          sudo mkdir -p "$FOCUSED_EVIDENCE_DIR"
          sudo chown "$(id -u):$(id -g)" "$FOCUSED_EVIDENCE_DIR"
          test "$(realpath "$FOCUSED_EVIDENCE_DIR")" = "$FOCUSED_EVIDENCE_DIR"
          test -w "$FOCUSED_EVIDENCE_DIR"
      - name: Run requested focused source regressions
        if: inputs.focused_tests != ''
        id: focused_native
        env:
          FOCUSED_TESTS: ${{ inputs.focused_tests }}
          FOCUSED_BASELINES: ${{ inputs.focused_baselines }}
        run: node scripts/run-inkwave-focused-tests.mjs
      - uses: actions/upload-artifact@v4
        if: inputs.focused_tests != '' && steps.focused_native.outcome == 'success'
        with:
          name: inkwave-focused-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          path: ${{ env.FOCUSED_EVIDENCE_DIR }}/
          retention-days: 14
      - name: Verify claimed room startup and gyro health regressions
        run: |
          node --experimental-vm-modules --test patches/reliability/tests/net.test.mjs patches/reliability/tests/next-seven-room.test.mjs patches/local-quality/tests/gyro-stale.test.mjs patches/local-quality/tests/gyro-viability.test.mjs patches/local-quality/tests/gyro-focus.test.mjs
          node --experimental-vm-modules --test --test-name-pattern='^(online |offline |ordinary online|ordinary offline|synchronous |a stale NetMatch|direct attract)' patches/reliability/tests/start.test.mjs
      - name: Verify PR1172 Slosher and Ink Vac regressions
        run: node --experimental-vm-modules --test patches/network-replication/tests/slosher-birth-sampling.test.mjs patches/splatoon3/tests/issue-1150-volley-wire.test.mjs patches/splatoon3/tests/slosher-wire-group-forwarding.test.mjs patches/splatoon3/tests/issue-1149-vortex-contact.test.mjs patches/splatoon3/tests/issue-1090-ink-vac-damage-credit.test.mjs patches/splatoon3/tests/kit-ink-vac.test.mjs patches/splatoon3/tests/batch-b-final-damage.test.mjs
      - name: Verify PR1172 updated wire contracts
        run: |
          node --experimental-vm-modules --test --test-name-pattern='Slosher|slosher: true-birth|forwards the existing damage' patches/network-replication/tests/robustness-timing.test.mjs patches/network-replication/tests/comparison.test.mjs patches/network-replication/tests/composed-hit-unit-packet.test.mjs
      - name: Verify PR1171 seven-issue and composition regressions
        run: node --experimental-vm-modules --test patches/splatoon3/tests/issue-1098-stored-muzzle.test.mjs patches/splatoon3/tests/issue-982-charger-rumble.test.mjs patches/splatoon3/tests/issue-batch-1171.test.mjs patches/splatoon3/tests/issue-979-slide-paint.test.mjs patches/splatoon3/tests/issue-570-paint-ownership-visibility.test.mjs patches/splatoon3/tests/results-presentation.test.mjs patches/local-quality/tests/idle-attract-budget.test.mjs patches/local-quality/tests/idle-resources.test.mjs patches/reliability/tests/net.test.mjs scripts/tests/inkwave-integration-workflow.test.mjs
      - name: Verify six follow-up INKWAVE regressions
        run: node --experimental-vm-modules --test patches/splatoon3/tests/issue-six-followup-network-paint.test.mjs patches/splatoon3/tests/issue-1032-background-guest.test.mjs
      - name: Verify eight additional INKWAVE regressions
        run: node --experimental-vm-modules --test patches/splatoon3/tests/issue-eight-followup.test.mjs
      - name: Verify finish authority, adoption and portrait regressions
        run: node --experimental-vm-modules --test patches/splatoon3/tests/issues-1092-1114-finish-mobile-adoption.test.mjs patches/network-replication/tests/issue-1101-adoption-cooldown.test.mjs
      - name: Verify source-sampled direction-aware humanoid gait
        run: node --experimental-vm-modules --test patches/splatoon3/tests/legacy-walk-reference.test.mjs
      - name: Verify PR1077 additional seven regressions
        run: node --experimental-vm-modules --test patches/splatoon3/tests/kit-ink-vac.test.mjs patches/splatoon3/tests/kit-subs.test.mjs patches/splatoon3/tests/issue-1008-1020-1037-1053.test.mjs
      - name: Diagnose nine-way walk contact regression
        run: node --experimental-vm-modules --test patches/splatoon3/tests/walk-special-contact.test.mjs
      - name: Verify gameplay patch contracts and regressions
        run: node --experimental-vm-modules scripts/check-inkwave-patches.mjs
      - name: Verify source-guided ink flight model
        run: node --test tests/ink-flight/model.test.mjs
      - name: Verify deterministic network replication
        run: node --experimental-vm-modules --test patches/network-replication/tests/*.test.mjs
      - name: Compare authoritative and reconstructed attacks
        run: node --experimental-vm-modules scripts/check-inkwave-network-comparison.mjs --exact-source --evidence-dir .ci-scratch/network-comparison
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.ci-scratch/network-comparison/*.json') != ''
        with:
          name: inkwave-network-comparison-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          path: .ci-scratch/network-comparison/
          retention-days: 14
      - name: Verify local quality regressions
        run: node --experimental-vm-modules --test patches/local-quality/tests/*.test.mjs scripts/tests/inkwave-idle-resources-gates.test.mjs
      - name: Verify platform lifecycle smoke regressions
        run: node --test tests/platform-lifecycle/platform-smoke.test.mjs
      - name: Verify movement physics smoke regressions
        run: node --test patches/movement-physics/tests/*.test.mjs
      - name: Verify practice range measurement, rules and battle isolation
        run: node --experimental-vm-modules --test patches/practice-range/tests/*.test.mjs
      - name: Verify loading/cache regressions
        run: |
          node --experimental-vm-modules --test patches/loading-cache/tests/adapter.test.mjs patches/loading-cache/tests/worker.test.mjs
          python3 patches/loading-cache/tests/harness.test.py
      - uses: actions/upload-artifact@v4
        if: failure() && hashFiles('.ci-scratch/inkwave-patches/patch-tests.log') != ''
        with:
          name: inkwave-patch-failure-diagnostics-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          path: .ci-scratch/inkwave-patches/
          retention-days: 14
      - name: Prepare persistent runtime verifier fixtures
        run: |
          runtime_fixtures=/mnt/workspace/.dev-state/agent-work/scratch/inkwave-runtime-performance-ui-evidence-tests
          test "$(realpath -m "$runtime_fixtures")" = "$runtime_fixtures"
          sudo mkdir -p "$runtime_fixtures"
          sudo chown "$(id -u):$(id -g)" "$runtime_fixtures"
          test -w "$runtime_fixtures"
          browser_tmp=/mnt/workspace/.dev-state/agent-work/cache/iwrui
          test "$(realpath -m "$browser_tmp")" = "$browser_tmp"
          sudo mkdir -p "$browser_tmp"
          sudo chown "$(id -u):$(id -g)" "$browser_tmp"
      - name: Verify motion verifier regressions
        run: node --test scripts/tests/inkwave-motion-gates.test.mjs scripts/tests/inkwave-integration-workflow.test.mjs scripts/tests/inkwave-runtime-evidence.test.mjs
      - name: Verify pinned primary numerical sources
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request
          reference=json.loads(pathlib.Path('patches/splatoon3/reference/curated-numbers.json').read_text())
          for source in reference['sources']:
            target=pathlib.Path('.reference-data')/source['id']
            target.parent.mkdir(parents=True,exist_ok=True)
            with urllib.request.urlopen(source['url'],timeout=30) as response: target.write_bytes(response.read())
          weapons=json.loads(pathlib.Path('patches/splatoon3/reference/weapons-fidelity-reference.json').read_text())
          for source in weapons['sources']:
            if not source.get('expectedFileSha256'): continue
            target=pathlib.Path('.reference-data/weapons')/source['url'].rsplit('/',1)[-1]
            target.parent.mkdir(parents=True,exist_ok=True)
            with urllib.request.urlopen(source['url'],timeout=30) as response: target.write_bytes(response.read())
          PY
          node scripts/verify-inkwave-reference.mjs .reference-data
          node scripts/check-weapons-reference.mjs .reference-data/weapons
      - name: Verify completed weapon source mirror
        run: node scripts/verify-completion-sources.mjs .reference-data/weapons
      - name: Verify pinned Sub/Special numerical sources
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request
          reference=json.loads(pathlib.Path('patches/splatoon3/reference/sub-special-fidelity-reference.json').read_text())
          root=pathlib.Path('.reference-data/sub-special')
          root.mkdir(parents=True,exist_ok=True)
          for source in reference['sources']:
            target=root/source['url'].rsplit('/',1)[-1]
            with urllib.request.urlopen(source['url'],timeout=30) as response:
              target.write_bytes(response.read())
          PY
          node scripts/check-inkwave-sub-special-reference.mjs .reference-data/sub-special
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find inkwave-public/src inkwave-public/vendor patches/local-quality patches/loading-cache patches/practice-range -type f \( -name '*.js' -o -name '*.mjs' \) -print0 |
            while IFS= read -r -d '' f; do node --check "$f"; done
      - name: Check local module and stylesheet references
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          root=pathlib.Path('inkwave-public')
          missing=[]
          for p in root.rglob('*'):
            if not p.is_file() or p.suffix not in {'.js','.mjs','.html','.css'}: continue
            try: s=p.read_text(encoding='utf-8')
            except: continue
            refs=set()
            if p.suffix in {'.js','.mjs'}:
              refs.update(re.findall(r'''(?:from\s*|import\s*\()\s*["']([^"']+)["']''',s))
              refs.update(re.findall(r'''import\s*["']([^"']+)["']''',s))
            if p.suffix in {'.html','.css'}:
              refs.update(re.findall(r'''(?:src|href)=["']([^"']+)["']''',s))
              refs.update(re.findall(r'''@import\s+(?:url\()?["']?([^"'\)\s]+)''',s))
            for ref in refs:
              if ref.startswith(('http:','https:','data:','blob:','#')) or ref in {'three'} or ref.startswith('three/addons/'): continue
              if not ref.startswith(('./','../','/')) and p.suffix in {'.js','.mjs'}: continue
              q=(root/ref.lstrip('/')) if ref.startswith('/') else (p.parent/ref)
              q=pathlib.Path(str(q).split('?',1)[0].split('#',1)[0])
              if not q.exists(): missing.append((str(p),ref,str(q)))
          if missing:
            for x in missing: print('MISSING',*x)
            sys.exit(1)
          print('references OK')
          PY
      - name: Build patched site at the checkout commit
        run: |
          node --test scripts/tests/inkwave-worker-compaction.test.mjs
          node scripts/build-inkwave.mjs inkwave-public _site
          node scripts/check-inkwave-startup-budget.mjs _site
          INKWAVE_BUILT_SITE=_site node --test scripts/tests/inkwave-build-packaging.test.mjs
          git rev-parse HEAD > _site-source-sha.txt
      - name: Verify built weapons fidelity measurements and packet parity
        run: node --experimental-vm-modules scripts/check-inkwave-weapons-fidelity.mjs --site _site
      - uses: actions/upload-artifact@v4
        with:
          name: inkwave-patched-site-${{ env.SOURCE_SHA }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            _site/
            _site-source-sha.txt
          retention-days: 14
  browser:
    if: inputs.diagnostic_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - suite: active
            browsers: chromium
          - suite: catalog
            browsers: chromium
          - suite: ui
            browsers: chromium webkit
          - suite: responsive
            browsers: chromium webkit
          - suite: network
            browsers: chromium
          - suite: range
            browsers: chromium webkit
          - suite: startup
            browsers: chromium
    env:
      TMPDIR: ${{ github.workspace }}/.ci-scratch
      TMP: ${{ github.workspace }}/.ci-scratch
      TEMP: ${{ github.workspace }}/.ci-scratch
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browser-cache
      BROWSER_SUITE: ${{ matrix.suite }}
      CI_STORAGE: /mnt/workspace/inkwave-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build patched site for this browser shard
        run: |
          mkdir -p .built-site
          npm install --no-save --no-package-lock --silent esbuild@0.28.2 playwright@1.62.1 ws@8
          node scripts/build-inkwave.mjs inkwave-public .built-site/_site
          git rev-parse HEAD > .built-site/_site-source-sha.txt
      - name: Prepare workspace storage and browser
        run: |
          mkdir -p .ci-scratch
          test "$(realpath -m "$CI_STORAGE")" = "$CI_STORAGE"
          sudo mkdir -p "$CI_STORAGE"
          sudo chown "$(id -u):$(id -g)" "$CI_STORAGE"
          browser_tmp=/mnt/workspace/.dev-state/agent-work/cache/iwrui
          test "$(realpath -m "$browser_tmp")" = "$browser_tmp"
          sudo mkdir -p "$browser_tmp"
          sudo chown "$(id -u):$(id -g)" "$browser_tmp"
          test "$(realpath "$CI_STORAGE")" = "$CI_STORAGE"
          mkdir -p "$CI_STORAGE/evidence" "$CI_STORAGE/cache"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat .built-site/_site-source-sha.txt)" = "$SOURCE_SHA"
          npx playwright install --with-deps ${{ matrix.browsers }}
      - name: Verify PR1171 rendered reticle and GPU paint parity
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-pr1171.mjs .built-site/_site
      - name: Verify active browser behavior and loaded artifact bytes
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-browser.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/game" --profile-dir "$CI_STORAGE/cache/game" --exact-source
      - name: Verify exact ancillary paint hashes and canonical GPU masks
        if: matrix.suite == 'network'
        run: node scripts/check-inkwave-paint-mask.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/paint-mask" --profile-dir "$CI_STORAGE/cache/paint-mask" --exact-source
      - name: Verify two-player network trajectories and rendered FX
        if: matrix.suite == 'network'
        run: node scripts/check-inkwave-network-browser.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/network" --profile-dir "$CI_STORAGE/cache/network" --exact-source
      - name: Verify two-player replication with 100 ms ordered delivery delay
        if: matrix.suite == 'network'
        run: node scripts/check-inkwave-network-browser.mjs --delay-frames 6 --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/network-delay" --profile-dir "$CI_STORAGE/cache/network-delay" --exact-source
      - name: Verify rendered walking contacts and transitions
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-motion.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/motion" --profile-dir "$CI_STORAGE/cache/motion"
      - name: Verify rendered sub, Flow and weapon detail transitions
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-motion-detail.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/motion-detail" --profile-dir "$CI_STORAGE/cache/motion-detail"
      - name: Verify Flow geometry through actual GTAO and GPU disposal
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-flow-render.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/flow" --profile-dir "$CI_STORAGE/cache/flow" --exact-source
      - name: Verify wall geometry through actual GTAO and GPU disposal
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-wall-render.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/wall" --profile-dir "$CI_STORAGE/cache/wall" --exact-source
      - name: Verify depth-only shadows and effective reflection budgets on WebGL
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-resource-render.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/resources" --profile-dir "$CI_STORAGE/cache/resources" --exact-source
      - name: Verify idle music and paused/render-target resources
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-idle-resources.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/idle-resources" --profile-dir "$CI_STORAGE/cache/idle-resources" --exact-source
      - name: Profile runtime at immutable baseline
        if: matrix.suite == 'active' && env.RUNTIME_PERFORMANCE == 'true'
        run: |
          npm install --no-save --no-package-lock --silent esbuild@0.28.2 playwright@1.62.1
          baseline_sha=5e28dbd16f7829aebd88052ff5f7fdf71f39fdad
          baseline_checkout=/mnt/workspace/.dev-state/agent-work/checkouts/inkwave-runtime-performance-ui-ci-${{ github.run_id }}-${{ github.run_attempt }}/baseline
          test "$(realpath -m "$baseline_checkout")" = "$baseline_checkout"
          sudo mkdir -p "$(dirname "$baseline_checkout")"
          sudo chown "$(id -u):$(id -g)" "$(dirname "$baseline_checkout")"
          test "$(realpath "$(dirname "$baseline_checkout")")" = "$(dirname "$baseline_checkout")"
          git fetch origin "$baseline_sha"
          git worktree add --detach "$baseline_checkout" "$baseline_sha"
          ESBUILD_MODULE="$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js" node "$baseline_checkout/scripts/build-inkwave.mjs" "$baseline_checkout/inkwave-public" "$CI_STORAGE/cache/runtime-baseline-site"
          node scripts/check-inkwave-runtime-performance.mjs --site "$CI_STORAGE/cache/runtime-baseline-site" --evidence-dir "$CI_STORAGE/evidence/runtime-before" --playwright "$GITHUB_WORKSPACE/node_modules/playwright/index.mjs" --source-sha "$baseline_sha" --fixed-only --quality high
      - name: Preserve completed baseline runtime evidence
        if: matrix.suite == 'active' && env.RUNTIME_PERFORMANCE == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: inkwave-runtime-baseline-diagnostics-${{ env.SOURCE_SHA }}
          include-hidden-files: true
          if-no-files-found: warn
          path: ${{ env.CI_STORAGE }}/evidence/runtime-before/
          retention-days: 14
      - name: Profile candidate runtime and compare repeated evidence
        if: matrix.suite == 'active' && env.RUNTIME_PERFORMANCE == 'true'
        run: |
          node scripts/check-inkwave-runtime-performance.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/runtime-after" --playwright "$GITHUB_WORKSPACE/node_modules/playwright/index.mjs" --source-sha "$SOURCE_SHA" --fixed-only --quality high
          node scripts/compare-inkwave-runtime-performance.mjs --before "$CI_STORAGE/evidence/runtime-before/runtime-result.json" --after "$CI_STORAGE/evidence/runtime-after/runtime-result.json" --out "$CI_STORAGE/evidence/runtime-comparison.json"
      - name: Verify the complete installed motion catalog
        if: matrix.suite == 'catalog'
        run: node scripts/check-inkwave-motion-catalog.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/catalog" --profile-dir "$CI_STORAGE/cache/catalog"
      - name: Verify PR1172 volley and vortex in Chromium and WebKit
        if: matrix.suite == 'ui'
        run: node scripts/check-inkwave-volley-vortex.mjs .built-site/_site --webkit
      - name: Verify room startup and gyro health in Chromium and WebKit
        if: matrix.suite == 'ui'
        run: node scripts/check-inkwave-room-gyro.mjs .built-site/_site --webkit
      - name: Verify touch layout in Chromium and WebKit
        if: matrix.suite == 'ui'
        run: node scripts/check-inkwave-touch-layout.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/layout" --profile-dir "$CI_STORAGE/cache/layout"
      - name: Verify built input and lifecycle modules in Chromium and WebKit
        if: matrix.suite == 'ui'
        run: node scripts/check-inkwave-reliability.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/reliability" --profile-dir "$CI_STORAGE/cache/reliability"
      - name: Verify repeated battle → results → menu lifecycle and the untimed Practice Range
        if: matrix.suite == 'ui'
        run: node scripts/check-inkwave-rematch-lifecycle.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/rematch" --profile-dir "$CI_STORAGE/cache/rematch" --cycles "$REMATCH_CYCLES"
      - name: Reject forged touch and reliability source identities
        if: matrix.suite == 'ui'
        run: |
          node scripts/check-inkwave-touch-layout-identity.mjs --site .built-site/_site --source inkwave-public --checkout-dir "$CI_STORAGE/identity-touch" --evidence-dir "$CI_STORAGE/evidence/identity-touch"
          node scripts/check-inkwave-touch-layout-identity.mjs --network --site .built-site/_site --source inkwave-public --checkout-dir "$CI_STORAGE/identity-network" --evidence-dir "$CI_STORAGE/evidence/identity-network"
          node scripts/check-inkwave-touch-layout-identity.mjs --reliability --site .built-site/_site --source inkwave-public --checkout-dir "$CI_STORAGE/identity-reliability" --evidence-dir "$CI_STORAGE/evidence/identity-reliability"
      - name: Verify the practice range in Chromium and WebKit (desktop + phone + tablet)
        if: matrix.suite == 'range'
        run: node scripts/check-inkwave-range.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/range" --profile-dir "$CI_STORAGE/cache/range"
      - name: Verify responsive menus in Chromium and WebKit
        if: matrix.suite == 'responsive'
        run: node scripts/check-inkwave-responsive.mjs --source .built-site/_site --section all --evidence-dir "$CI_STORAGE/evidence/responsive" --profile-dir "$CI_STORAGE/cache/responsive"
      - name: Measure cold, warm, PWA restart and offline startup in Chromium
        if: matrix.suite == 'startup'
        run: node scripts/check-inkwave-startup-browser.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/startup" --profile-dir "$CI_STORAGE/cache/startup" --source-sha "$SOURCE_SHA" --runs 3
      - name: Bind passing browser evidence to the tested commit
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['CI_STORAGE'])/'evidence'
          suite=os.environ['BROWSER_SUITE']
          checks={
            'active':['game/browser-result.json','motion/motion-result.json','motion-detail/motion-detail-result.json','flow/flow-render-result.json','wall/wall-render-result.json','resources/resource-render-result.json','idle-resources/idle-resources-result.json'],
            'catalog':['catalog/motion-catalog-result.json'],
            'network':['paint-mask/paint-mask-result.json','network/network-browser-result.json','network-delay/network-browser-result.json'],
            'ui':['identity-network/network-identity-result.json','layout/touch-layout-result.json','reliability/reliability-browser-result.json','rematch/rematch-lifecycle-result.json','identity-touch/touch-layout-identity-result.json','identity-reliability/reliability-identity-result.json'],
            'responsive':['responsive/responsive-result.json'],
            'range':['range/range-result.json'],
            'startup':['startup/startup-browser-result.json'],
          }[suite]
          runtime_performance=os.environ['RUNTIME_PERFORMANCE']=='true'
          if suite=='active' and runtime_performance:
            checks.extend(['runtime-before/runtime-result.json','runtime-after/runtime-result.json','runtime-comparison.json'])
          reports={name:json.loads((root/name).read_text()) for name in checks}
          build=json.loads(pathlib.Path('.built-site/_site/inkwave-build.json').read_text())
          assert pathlib.Path('.built-site/_site-source-sha.txt').read_text().strip()==os.environ['SOURCE_SHA']
          for name,report in reports.items():
            if name=='motion/motion-result.json': assert not report['errors'] and report['fixture']['scenarios']==10
            else: assert report['status']=='passed', name
            if 'contentHash' in report and name!='runtime-before/runtime-result.json': assert report['contentHash']==build['contentHash'], name
          if suite=='network':
            for name in checks: assert reports[name]['sourceSha']==os.environ['SOURCE_SHA']
          if suite=='active':
            assert reports['game/browser-result.json']['sourceSha']==os.environ['SOURCE_SHA']
            if runtime_performance:
              assert reports['runtime-after/runtime-result.json']['sourceSha']==os.environ['SOURCE_SHA']
              assert reports['runtime-before/runtime-result.json']['sourceSha']=='5e28dbd16f7829aebd88052ff5f7fdf71f39fdad'
          receipt={'status':'passed','sourceSha':os.environ['SOURCE_SHA'],'contentHash':build['contentHash'],'suite':suite,'runtimePerformance':runtime_performance,'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'event':os.environ['GITHUB_EVENT_NAME'],'checks':checks}
          pending=root/'ci-result.json.pending'; pending.write_text(json.dumps(receipt,indent=2)+'\n'); pending.replace(root/'ci-result.json')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.suite == 'active'
        with:
          name: inkwave-game-failure-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          path: ${{ env.CI_STORAGE }}/evidence/game/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.suite == 'active'
        with:
          name: inkwave-idle-resource-failure-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          path: ${{ env.CI_STORAGE }}/evidence/idle-resources/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: inkwave-browser-failure-${{ matrix.suite }}-${{ env.SOURCE_SHA }}
          include-hidden-files: true
          if-no-files-found: warn
          path: ${{ env.CI_STORAGE }}/evidence/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: inkwave-browser-${{ matrix.suite }}-${{ env.SOURCE_SHA }}
          include-hidden-files: true
          if-no-files-found: error
          path: ${{ env.CI_STORAGE }}/evidence/
          retention-days: 14

  render-diagnostic:
    if: inputs.diagnostic_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare persistent diagnostic storage and exact source
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          diagnostic_storage=/mnt/workspace/.dev-state/agent-work/evidence/inkwave-runtime-diagnostic-${{ github.run_id }}
          test "$(realpath -m "$diagnostic_storage")" = "$diagnostic_storage"
          sudo mkdir -p "$diagnostic_storage"
          sudo chown "$(id -u):$(id -g)" "$diagnostic_storage"
          browser_tmp=/mnt/workspace/.dev-state/agent-work/cache/iwrui
          test "$(realpath -m "$browser_tmp")" = "$browser_tmp"
          sudo mkdir -p "$browser_tmp"
          sudo chown "$(id -u):$(id -g)" "$browser_tmp"
          echo "DIAGNOSTIC_STORAGE=$diagnostic_storage" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.ci-scratch" "$GITHUB_WORKSPACE/.playwright"
          echo "TMPDIR=$GITHUB_WORKSPACE/.ci-scratch" >> "$GITHUB_ENV"
          echo "TMP=$GITHUB_WORKSPACE/.ci-scratch" >> "$GITHUB_ENV"
          echo "TEMP=$GITHUB_WORKSPACE/.ci-scratch" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$GITHUB_WORKSPACE/.playwright" >> "$GITHUB_ENV"
      - name: Build and diagnose (not an acceptance benchmark)
        run: |
          npm install --no-save --no-package-lock --silent esbuild@0.28.2 playwright@1.62.1
          npx playwright install --with-deps chromium
          ESBUILD_MODULE="$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js" node scripts/build-inkwave.mjs inkwave-public "$DIAGNOSTIC_STORAGE/site"
          node scripts/check-inkwave-runtime-performance.mjs --site "$DIAGNOSTIC_STORAGE/site" --evidence-dir "$DIAGNOSTIC_STORAGE/probe" --playwright "$GITHUB_WORKSPACE/node_modules/playwright/index.mjs" --source-sha "$SOURCE_SHA" --fixed-only --parity-only --quality high --verify-render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inkwave-render-diagnostic-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          path: ${{ env.DIAGNOSTIC_STORAGE }}/probe/
          retention-days: 14

  seven_claims:
    if: inputs.diagnostic_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify immutable checkout identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build and browser dependencies
        run: |
          npm install --no-save --no-package-lock --silent esbuild@0.28.2 playwright@1.62.1
          npx playwright install --with-deps chromium webkit
      - name: Verify seven claimed gameplay and handoff regressions
        run: |
          node --experimental-vm-modules --test patches/splatoon3/tests/seven-charge-swim-falloff.test.mjs patches/network-replication/tests/protection-adoption.test.mjs patches/splatoon3/tests/charger-launch-speed.test.mjs patches/splatoon3/tests/issue-620-charger-min-charge-paint.test.mjs patches/splatoon3/tests/issue-430-humanoid-hurtbox.test.mjs patches/splatoon3/tests/issue-525-form-collision-radius.test.mjs patches/splatoon3/tests/charger-fresh-start.test.mjs patches/splatoon3/tests/charger-store-359.test.mjs patches/splatoon3/tests/issue-1038-charger-low-ink.test.mjs patches/splatoon3/tests/issue-959-slosher-free-state.test.mjs patches/splatoon3/tests/issue-1098-stored-muzzle.test.mjs patches/splatoon3/tests/issue-982-charger-rumble.test.mjs patches/splatoon3/tests/charger-damage-curve.test.mjs
          node --experimental-vm-modules --test --test-name-pattern='splatling retained horizontal' patches/splatoon3/tests/weapon-edgecases.test.mjs
          node --experimental-vm-modules --test --test-name-pattern='1007|1052|airborne Charger charge|407|420' patches/splatoon3/tests/charger-postshot-flight.test.mjs patches/splatoon3/tests/integration.test.mjs patches/splatoon3/tests/weapon-paint-inertia.test.mjs
      - name: Verify emitted gameplay and mural resource lifetime in both browsers
        run: |
          node scripts/build-inkwave.mjs inkwave-public .ci-scratch/seven-site
          node scripts/check-inkwave-seven-claims.mjs .ci-scratch/seven-site --webkit | tee .ci-scratch/seven-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inkwave-seven-claims-${{ env.SOURCE_SHA }}
          path: .ci-scratch/seven-browser.json
          if-no-files-found: warn
          retention-days: 14
  resource_paint_continuation:
    if: inputs.diagnostic_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify immutable checkout identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the seven claimed resource, paint and continuation fixes
        run: |
          node --experimental-vm-modules --test patches/splatoon3/tests/trizooka-enemy-ink.test.mjs patches/splatoon3/tests/slam-damage-state.test.mjs patches/splatoon3/tests/surge-wall-launch-armor.test.mjs patches/splatoon3/tests/partial-surge-armor-current.test.mjs patches/splatoon3/tests/surge-auto-continuation.test.mjs patches/splatoon3/tests/charger-wall-drop.test.mjs patches/splatoon3/tests/disconnected-main-projectiles.test.mjs patches/network-replication/tests/wipeout-owner-history.test.mjs patches/splatoon3/tests/online-continuation.test.mjs patches/local-quality/tests/result-continuation.test.mjs patches/local-quality/tests/continuation-gear-flow.test.mjs patches/splatoon3/tests/roll-surge-batch.test.mjs
      - name: Verify existing Surge tests at the native wall-launch boundary
        run: |
          node --experimental-vm-modules --test --test-name-pattern='extracted 45-frame|surge charge, partial|wall charge takes|surge armor retains|partial Surge armor' patches/splatoon3/tests/movement-resources.test.mjs patches/splatoon3/tests/movement-motion.test.mjs patches/splatoon3/tests/armor-charger-batch.test.mjs patches/splatoon3/tests/roller-freefall.test.mjs
      - name: Verify native wall geometry and private armor scheduling
        run: node --experimental-vm-modules --test patches/splatoon3/tests/wall-motion.test.mjs
      - name: Install build and browser dependencies
        run: |
          npm install --no-save --no-package-lock --silent esbuild@0.28.2 playwright@1.62.1
          npx playwright install --with-deps chromium webkit
      - name: Build and verify emitted runtime and two-peer continuation
        env:
          INKWAVE_BUILT_SITE: .ci-scratch/batch4-site
          INKWAVE_BASELINE_SITE: .ci-scratch/batch4-site
          INKWAVE_CONTINUATION_BUILT_SITE: .ci-scratch/batch4-site
        run: |
          node scripts/build-inkwave.mjs inkwave-public .ci-scratch/batch4-site
          node --experimental-vm-modules --test patches/splatoon3/tests/trizooka-enemy-ink.test.mjs patches/splatoon3/tests/slam-damage-state.test.mjs patches/splatoon3/tests/surge-wall-launch-armor.test.mjs patches/splatoon3/tests/charger-wall-drop.test.mjs patches/splatoon3/tests/disconnected-main-projectiles.test.mjs patches/splatoon3/tests/online-continuation.test.mjs patches/network-replication/tests/wipeout-owner-history.test.mjs patches/local-quality/tests/result-continuation.test.mjs
          node scripts/check-inkwave-batch4.mjs .ci-scratch/batch4-site --webkit | tee .ci-scratch/batch4-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inkwave-resource-paint-continuation-${{ env.SOURCE_SHA }}
          path: .ci-scratch/batch4-browser.json
          if-no-files-found: warn
          retention-days: 14
