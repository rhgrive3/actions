          node scripts/check-inkwave-batch4.mjs .ci-scratch/batch4-site --webkit | tee .ci-scratch/batch4-browser.json
      # Same immutable production build; source verified; overlaps active browser.
      - name: Verify published idle GPU, WebAudio and lifecycle on the source-bound site
        run: |
          mkdir -p .ci-scratch/idle-resources .ci-scratch/idle-profile
          node scripts/check-inkwave-idle-resources.mjs --site .ci-scratch/batch4-site --evidence-dir .ci-scratch/idle-resources --profile-dir .ci-scratch/idle-profile --exact-source
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('.ci-scratch/idle-resources/idle-resources-result.json','utf8'));
          const build=JSON.parse(fs.readFileSync('.ci-scratch/batch4-site/inkwave-build.json','utf8'));
          assert.equal(report.status,'passed');
          assert.equal(report.sourceSha,process.env.SOURCE_SHA);
          assert.equal(report.contentHash,build.contentHash);
          NODE
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.ci-scratch/idle-resources/idle-resources-result.json') != ''
        with:
          name: inkwave-idle-resource-${{ env.SOURCE_SHA }}
          path: .ci-scratch/idle-resources/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inkwave-resource-paint-continuation-${{ env.SOURCE_SHA }}
          path: .ci-scratch/batch4-browser.json
          if-no-files-found: warn
          retention-days: 14

