          name: inkwave-launch-packets-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: _site-launch-packets.json
          if-no-files-found: error
          retention-days: 14
  # The test-file set is partitioned across isolated, independent machines.
  patch_tests:
    # Default GitHub full-suite behavior unless explicitly offloaded.
    needs: build_site
    if: ${{ inputs.diagnostic_only != true && needs.build_site.outputs.contracts_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(vars.INKWAVE_CIRCLECI_OFFLOAD == 'enabled' && github.event_name == 'pull_request' && github.head_ref != 'inkwave/runtime-performance-ui' && github.head_ref != 'inkwave/final-nine-way-integration') }}
    runs-on: ${{ (matrix.shard == 2 || matrix.shard == 8) && 'ubuntu-22.04' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    env:
      INKWAVE_TEST_SHARD_COUNT: '9'
      INKWAVE_TEST_ISOLATE_RAINMAKER: '1'
      INKWAVE_TEST_SHARD_INDEX: ${{ matrix.shard }}
      # Full-Character VM/geometry tests can retain large heaps. Keep the
      # original eight-way assignment minus Rainmaker actor; shard 8 owns that file.
      # Both shard 2 and the isolated actor lane run serially on Ubuntu 22.04;
      # other shards permit up to two test processes per VM.
      INKWAVE_TEST_CONCURRENCY: ${{ (matrix.shard == 2 || matrix.shard == 8) && '1' || '2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /inkwave-public/
            /patches/
            /scripts/
            /server/
            /tests/
            /tools/
            !/tools/inkwave-modeler/
            /reports/
            /docs/
      - name: Verify immutable checkout identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache verified npm tarballs
        uses: actions/cache@v4
        with:
          path: ~/.npm/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-node22-npm-esbuild0282-playwright1621-ws8-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install pinned patch test dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare persistent worker regression fixtures
        run: |
          test "$(realpath -m "$INKWAVE_TEST_SCRATCH")" = "$INKWAVE_TEST_SCRATCH"
          sudo mkdir -p "$INKWAVE_TEST_SCRATCH"
          sudo chown "$(id -u):$(id -g)" "$INKWAVE_TEST_SCRATCH"
          test "$(realpath "$INKWAVE_TEST_SCRATCH")" = "$INKWAVE_TEST_SCRATCH"
          test -w "$INKWAVE_TEST_SCRATCH"
      - name: Verify gameplay patch contracts and regressions (shard ${{ matrix.shard }})
        run: node --experimental-vm-modules scripts/check-inkwave-patches.mjs
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.ci-scratch/inkwave-patches/shard-manifest.json') != ''
        with:
          name: inkwave-patch-evidence-shard-${{ matrix.shard }}-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          path: .ci-scratch/inkwave-patches/
          retention-days: 14

  # Required /validate passes only when core and all nine regression shards pass.
  circleci_offload_gate:
    # Refuse stale/partial/unrelated CircleCI results. Native perf branches stay on GitHub.
    if: ${{ inputs.diagnostic_only != true && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (vars.INKWAVE_CIRCLECI_OFFLOAD == 'enabled' && github.event_name == 'pull_request' && github.head_ref != 'inkwave/runtime-performance-ui' && github.head_ref != 'inkwave/final-nine-way-integration') }}
    needs: validate_core
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /inkwave-public/
            /patches/
            /scripts/
            /server/
            /tests/
            /tools/
            !/tools/inkwave-modeler/
            /reports/
            /docs/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require exact-SHA CircleCI final DAG or full workflow acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --test scripts/tests/inkwave-circleci-offload-gate.test.mjs
          node scripts/ci/check-circleci-offload.mjs

  validate:
    if: ${{ always() && inputs.diagnostic_only != true && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [admission_preflight, build_site, validate_core, patch_tests, circleci_offload_gate, browser, seven_claims, resource_paint_continuation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every source and patch regression to pass
        env:
          PREFLIGHT_RESULT: ${{ needs.admission_preflight.result }}
          BUILD_RESULT: ${{ needs.build_site.result }}
          CONTRACTS_ONLY: ${{ needs.build_site.outputs.contracts_only }}
          CORE_RESULT: ${{ needs.validate_core.result }}
          PATCH_RESULT: ${{ needs.patch_tests.result }}
          CIRCLECI_RESULT: ${{ needs.circleci_offload_gate.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SEVEN_RESULT: ${{ needs.seven_claims.result }}
          RESOURCE_RESULT: ${{ needs.resource_paint_continuation.result }}
          OFFLOAD_ACTIVE: ${{ vars.INKWAVE_CIRCLECI_OFFLOAD == 'enabled' && github.event_name == 'pull_request' && github.head_ref != 'inkwave/runtime-performance-ui' && github.head_ref != 'inkwave/final-nine-way-integration' }}
        run: |
          printf 'build=%s scope=%s core=%s patch=%s circleci=%s browser=%s seven=%s resource=%s offload=%s\n' "$BUILD_RESULT" "$CONTRACTS_ONLY" "$CORE_RESULT" "$PATCH_RESULT" "$CIRCLECI_RESULT" "$BROWSER_RESULT" "$SEVEN_RESULT" "$RESOURCE_RESULT" "$OFFLOAD_ACTIVE"
          test "$PREFLIGHT_RESULT" = success
          test "$BUILD_RESULT" = success
          if [ "$CONTRACTS_ONLY" = true ]; then
            # Scope was proven by an exact commit/base tree diff in build_site;
            # CI contracts were executed in that same mandatory job.
            test "$CORE_RESULT" = skipped
            test "$PATCH_RESULT" = skipped
            test "$CIRCLECI_RESULT" = skipped
            test "$BROWSER_RESULT" = skipped
            test "$SEVEN_RESULT" = skipped
            test "$RESOURCE_RESULT" = skipped
            exit 0
          fi
          test "$CONTRACTS_ONLY" = false
          test "$CORE_RESULT" = success
          test "$SEVEN_RESULT" = success
          test "$RESOURCE_RESULT" = success
          if [ "$OFFLOAD_ACTIVE" = true ]; then
            test "$PATCH_RESULT" = skipped
            test "$CIRCLECI_RESULT" = success
            test "$BROWSER_RESULT" = skipped
          else
            test "$PATCH_RESULT" = success
            test "$CIRCLECI_RESULT" = skipped
            test "$BROWSER_RESULT" = success
          fi

  browser:
    needs: build_site
    # No offload until CircleCI is connected and enabled.
    if: ${{ inputs.diagnostic_only != true && needs.build_site.outputs.contracts_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(vars.INKWAVE_CIRCLECI_OFFLOAD == 'enabled' && github.event_name == 'pull_request' && github.head_ref != 'inkwave/runtime-performance-ui' && github.head_ref != 'inkwave/final-nine-way-integration') }}
    # Active compositor and catalog GL captures use the supported Chromium sandbox.
    runs-on: ${{ (matrix.suite == 'active' || matrix.suite == 'catalog') && 'ubuntu-22.04' || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - suite: active
            browsers: chromium webkit
          - suite: catalog
            browsers: chromium
          - suite: ui
            browsers: chromium webkit
          - suite: responsive
            browsers: chromium webkit
          - suite: network
            browsers: chromium webkit
          - suite: range
            browsers: chromium webkit
          - suite: startup
            browsers: chromium webkit
    env:
      TMPDIR: ${{ github.workspace }}/.ci-scratch
      TMP: ${{ github.workspace }}/.ci-scratch
      TEMP: ${{ github.workspace }}/.ci-scratch
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browser-cache
      BROWSER_SUITE: ${{ matrix.suite }}
      CI_STORAGE: /mnt/workspace/inkwave-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /inkwave-public/
            /patches/
            /scripts/
            /server/
            /tests/
            /tools/
            !/tools/inkwave-modeler/
            /reports/
            /docs/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache verified npm tarballs
        uses: actions/cache@v4
        with:
          path: ~/.npm/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-node22-npm-esbuild0282-playwright1621-ws8-${{ hashFiles('package.json', 'package-lock.json') }}
      - uses: actions/download-artifact@v4
        with:
          name: inkwave-patched-site-${{ env.SOURCE_SHA }}
          path: .built-site
      - name: Verify immutable site for this browser shard
        id: verified-site
        run: |
          mkdir -p .built-site .ci-scratch
          npm ci --no-audit --no-fund
          tar -xf .built-site/immutable-site.tar -C .built-site
          test "$(cat .built-site/_site-source-sha.txt)" = "$SOURCE_SHA"
          EXPECTED_CONTENT_HASH='${{ needs.build_site.outputs.content_hash }}' node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(JSON.parse(fs.readFileSync('.built-site/_site/inkwave-build.json')).contentHash,process.env.EXPECTED_CONTENT_HASH);"
          node scripts/check-inkwave-startup-budget.mjs .built-site/_site
          . /etc/os-release
          test -n "$ID"
          test -n "$VERSION_ID"
          printf 'release=%s-%s\n' "$ID" "$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: Cache pinned browser executables
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.verified-site.outputs.release }}-playwright-1.62.1-${{ matrix.browsers }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - name: Prepare workspace storage and browser
        id: browser-prepare
        run: |
          mkdir -p .ci-scratch
          test "$(realpath -m "$CI_STORAGE")" = "$CI_STORAGE"
          sudo mkdir -p "$CI_STORAGE"
          sudo chown "$(id -u):$(id -g)" "$CI_STORAGE"
          browser_tmp=/mnt/workspace/.dev-state/agent-work/cache/iwrui
          test "$(realpath -m "$browser_tmp")" = "$browser_tmp"
          sudo mkdir -p "$browser_tmp"
          sudo chown "$(id -u):$(id -g)" "$browser_tmp"
          test "$(realpath "$CI_STORAGE")" = "$CI_STORAGE"
          mkdir -p "$CI_STORAGE/evidence" "$CI_STORAGE/cache"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat .built-site/_site-source-sha.txt)" = "$SOURCE_SHA"
          sudo python3 scripts/prepare-inkwave-ci-apt.py
          npx playwright install --with-deps ${{ matrix.browsers }}
      - name: Verify emitted renderer and Input resource lifetimes
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-issue-batch-browser.mjs .built-site/_site "$CI_STORAGE/evidence/issue-batch/lifecycle.json"
      - name: Verify PR1171 rendered reticle and GPU paint parity
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-pr1171.mjs .built-site/_site "$CI_STORAGE/evidence/roller-ownership"
      - name: Verify emitted Blaster aim and local self visibility
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-aim-visibility.mjs .built-site/_site "$CI_STORAGE/evidence/aim-visibility"
      - name: Verify emitted menu focus lifecycle
        if: matrix.suite == 'ui'
        run: node scripts/check-inkwave-menu-focus.mjs --source .built-site/_site --evidence-dir "$CI_STORAGE/evidence/menu-focus"
      - name: Verify startup snapshot clock recovery in Chromium and WebKit
        if: matrix.suite == 'network'
        run: node scripts/check-inkwave-startup-clock.mjs .built-site/_site "$CI_STORAGE/evidence/startup-clock"
      - name: Verify native touch gesture continuity in Chromium
        if: matrix.suite == 'ui'
        run: node scripts/check-inkwave-tap-gestures-browser.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/tap-gestures"
      - name: Verify minimap observation symmetry and strict failure controls
        if: matrix.suite == 'active'
        run: node --test scripts/lib/minimap-canvas-observation.test.mjs scripts/lib/inkwave-canonical-kit-input.test.mjs
      - name: Verify native minimap storage and Canvas parity
        if: matrix.suite == 'active'
        run: node --experimental-vm-modules --test scripts/tests/inkwave-minimap-world-canvas.test.mjs
      - name: Verify active browser behavior and loaded artifact bytes
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-browser.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/game" --profile-dir "$CI_STORAGE/cache/game" --exact-source
      - name: Verify both teams wait and launch together at match start
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-opening-spawn.mjs .built-site/_site "$CI_STORAGE/evidence/opening-spawn"
      - name: Verify queued native Showcase weapon selection across render rates
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-showcase-weapon-queue.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/showcase-weapon"
      - name: Verify emitted BVH query equivalence and work reduction in Chromium
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-bvh-browser.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/bvh-queries"
      - name: Verify native normal browser pixels bound to production sources
        if: matrix.suite == 'active'
        run: |
          node scripts/check-inkwave-native-normal-browser.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/native-normal"
          node scripts/check-inkwave-native-normal-browser.mjs --site .built-site/_site --browser webkit --evidence-dir "$CI_STORAGE/evidence/native-normal-webkit"
      - name: Compare emitted motion caches with the frozen baseline in Chromium and WebKit
        if: matrix.suite == 'active'
        run: |
          node scripts/benchmark-inkwave-motion-caches.mjs --site .built-site/_site --browser chromium --out "$CI_STORAGE/evidence/motion-cache-chromium.json"
          node scripts/benchmark-inkwave-motion-caches.mjs --site .built-site/_site --browser webkit --out "$CI_STORAGE/evidence/motion-cache-webkit.json"
      - name: Verify mobile post depth allocation and exact pixels in Chromium and WebKit
        if: matrix.suite == 'active'
        run: |
          node scripts/check-inkwave-post-depth-browser.mjs --site .built-site/_site --browser chromium --out "$CI_STORAGE/evidence/post-depth-chromium.json"
          node scripts/check-inkwave-post-depth-browser.mjs --site .built-site/_site --browser webkit --out "$CI_STORAGE/evidence/post-depth-webkit.json"
      - name: Verify active mobile HDR precision and retained post passes
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-offscreen-hair-reentry.mjs --site .built-site/_site --source-sha "$SOURCE_SHA" --composer-lifecycle --out "$CI_STORAGE/evidence/composer-precision"
      - name: Verify exact first-draw hair recovery and gameplay muzzle
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-offscreen-hair-reentry.mjs --site .built-site/_site --source-sha "$SOURCE_SHA" --out "$CI_STORAGE/evidence/offscreen-hair"
      - name: Verify grate orientation and painted level normals in Chromium and WebKit
        if: matrix.suite == 'active'
        run: |
          node scripts/check-inkwave-grate-normal.mjs --site .built-site/_site --source-root "$GITHUB_WORKSPACE" --source-sha "$SOURCE_SHA" --browser chromium --evidence-dir "$CI_STORAGE/evidence/grate-normal"
          node scripts/check-inkwave-grate-normal.mjs --site .built-site/_site --source-root "$GITHUB_WORKSPACE" --source-sha "$SOURCE_SHA" --browser webkit --evidence-dir "$CI_STORAGE/evidence/grate-normal-webkit"
      - name: Verify browser movement speed across directions and native firing/rolling transitions
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-movement-speed.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/movement-speed" --profile-dir "$CI_STORAGE/cache/movement-speed"
      - name: Capture current native Charger paint events for source and emitted redraw
        if: matrix.suite == 'network'
        run: node --max-old-space-size=192 --experimental-vm-modules scripts/capture-charger-paint-events.mjs --site .built-site/_site --out "$CI_STORAGE/evidence/charger-current-native-events.json"
      - name: Verify exact ancillary paint hashes and canonical GPU masks
        if: matrix.suite == 'network'
        run: node scripts/check-inkwave-paint-mask.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/paint-mask" --profile-dir "$CI_STORAGE/cache/paint-mask" --main-ink-captures "$CI_STORAGE/evidence/charger-current-native-events.json" --exact-source
      - name: Verify exact paint masks, ordered scan and local order lifetime in WebKit
        if: matrix.suite == 'network'
        run: node scripts/check-inkwave-paint-mask.mjs --engine webkit --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/paint-mask-webkit" --profile-dir "$CI_STORAGE/cache/paint-mask-webkit" --main-ink-captures "$CI_STORAGE/evidence/charger-current-native-events.json" --exact-source
      - name: Verify two-player network trajectories and rendered FX
        if: matrix.suite == 'network'
        run: node scripts/check-inkwave-network-browser.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/network" --profile-dir "$CI_STORAGE/cache/network" --exact-source
      - name: Verify two-player replication with 100 ms ordered delivery delay
        if: matrix.suite == 'network'
        run: node scripts/check-inkwave-network-browser.mjs --delay-frames 6 --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/network-delay" --profile-dir "$CI_STORAGE/cache/network-delay" --exact-source
      - name: Verify neutral combat QA placement contracts
        if: matrix.suite == 'network'
        run: node --experimental-vm-modules --test scripts/tests/inkwave-combat-ceiling-placement.test.mjs scripts/tests/inkwave-combat-ceiling-motion-epoch.test.mjs scripts/tests/inkwave-owner-clock-diagnostic.test.mjs
      - name: Verify fixed-origin owner clock regressions
        if: matrix.suite == 'network'
        run: node --experimental-vm-modules --test patches/network-replication/tests/owner-clock-origin.test.mjs patches/network-replication/tests/owner-clock-platform.test.mjs patches/network-replication/tests/owner-clock-opening-adoption.test.mjs patches/network-replication/tests/issue-1767-startup-clock.test.mjs patches/network-replication/tests/issue-1767-session-clock.test.mjs
      - name: Verify real Actor hit ceiling before proof and hit ID consumption
        if: matrix.suite == 'network'
        run: node scripts/check-inkwave-combat-ceiling-browser.mjs --site .built-site/_site --source-sha "$SOURCE_SHA" --evidence-dir "$CI_STORAGE/evidence/combat-ceiling"
      - name: Verify existing special models, grips, shaders and GPU retirement
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-special-presentation.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/special-presentation"
      - name: Verify rendered walking contacts and transitions
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-motion.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/motion" --profile-dir "$CI_STORAGE/cache/motion"
      - name: Verify rendered sub, Flow and weapon detail transitions
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-motion-detail.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/motion-detail" --profile-dir "$CI_STORAGE/cache/motion-detail"
      - name: Verify seven weapon models and source-loaded attack grip ownership
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-weapon-models.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/weapon-models"
      - name: Verify existing Ballpoint gallery in the current exact-head build
        if: matrix.suite == 'active'
        run: |
          out="$CI_STORAGE/evidence/ballpoint"
          test ! -e "$out"
          node scripts/render-inkwave-weapon-shared-gallery.mjs --site .built-site/_site --out "$out" --ids s3-spinner-downpour --size 500
          node scripts/check-inkwave-ballpoint-evidence.mjs --site .built-site/_site --out "$out" --source-sha "$SOURCE_SHA"
      - name: Verify Flow response lifetime and late-error receipts
        if: matrix.suite == 'active'
        run: node --test scripts/tests/inkwave-flow-route-lifetime.test.mjs scripts/tests/inkwave-flow-source-readiness.test.mjs
      - name: Verify Flow geometry through actual GTAO and GPU disposal
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-flow-render.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/flow" --profile-dir "$CI_STORAGE/cache/flow" --exact-source
      - name: Verify wall geometry through actual GTAO and GPU disposal
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-wall-render.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/wall" --profile-dir "$CI_STORAGE/cache/wall" --exact-source
      - name: Verify depth-only shadows and effective reflection budgets on WebGL
        if: matrix.suite == 'active'
        run: node scripts/check-inkwave-resource-render.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/resources" --profile-dir "$CI_STORAGE/cache/resources" --exact-source
      - name: Profile runtime at immutable baseline
        if: matrix.suite == 'active' && env.RUNTIME_PERFORMANCE == 'true'
        run: |
          npm install --no-save --no-package-lock --silent esbuild@0.28.2 playwright@1.62.1
          baseline_sha=5e28dbd16f7829aebd88052ff5f7fdf71f39fdad
          baseline_checkout=/mnt/workspace/.dev-state/agent-work/checkouts/inkwave-runtime-performance-ui-ci-${{ github.run_id }}-${{ github.run_attempt }}/baseline
          test "$(realpath -m "$baseline_checkout")" = "$baseline_checkout"
          sudo mkdir -p "$(dirname "$baseline_checkout")"
          sudo chown "$(id -u):$(id -g)" "$(dirname "$baseline_checkout")"
          test "$(realpath "$(dirname "$baseline_checkout")")" = "$(dirname "$baseline_checkout")"
          git fetch origin "$baseline_sha"
          git worktree add --detach "$baseline_checkout" "$baseline_sha"
          ESBUILD_MODULE="$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js" node "$baseline_checkout/scripts/build-inkwave.mjs" "$baseline_checkout/inkwave-public" "$CI_STORAGE/cache/runtime-baseline-site"
          node scripts/check-inkwave-runtime-performance.mjs --site "$CI_STORAGE/cache/runtime-baseline-site" --evidence-dir "$CI_STORAGE/evidence/runtime-before" --playwright "$GITHUB_WORKSPACE/node_modules/playwright/index.mjs" --source-sha "$baseline_sha" --fixed-only --quality high
      - name: Preserve completed baseline runtime evidence
        if: matrix.suite == 'active' && env.RUNTIME_PERFORMANCE == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: inkwave-runtime-baseline-diagnostics-${{ env.SOURCE_SHA }}
          include-hidden-files: true
          if-no-files-found: warn
          path: ${{ env.CI_STORAGE }}/evidence/runtime-before/
          retention-days: 14
      - name: Profile candidate runtime and compare repeated evidence
        if: matrix.suite == 'active' && env.RUNTIME_PERFORMANCE == 'true'
        run: |
          node scripts/check-inkwave-runtime-performance.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/runtime-after" --playwright "$GITHUB_WORKSPACE/node_modules/playwright/index.mjs" --source-sha "$SOURCE_SHA" --fixed-only --quality high
          node scripts/compare-inkwave-runtime-performance.mjs --before "$CI_STORAGE/evidence/runtime-before/runtime-result.json" --after "$CI_STORAGE/evidence/runtime-after/runtime-result.json" --out "$CI_STORAGE/evidence/runtime-comparison.json"
      - name: Verify catalog audio graph coordinator contracts
        if: matrix.suite == 'catalog'
        run: node --test scripts/tests/inkwave-catalog-audio-graph.test.mjs
      - name: Verify built Brella aperture and visible detached flight
        if: matrix.suite == 'catalog'
        run: node scripts/check-inkwave-brella-controls.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/brellas"
      - name: Verify the complete installed motion catalog
        if: matrix.suite == 'catalog'
        run: node scripts/check-inkwave-motion-catalog.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/catalog" --profile-dir "$CI_STORAGE/cache/catalog"
      - name: Observe native Hissen main draws at first-birth-relative phases
        if: matrix.suite == 'catalog'
        run: |
          node --test scripts/tests/inkwave-hissen-capture-observer.test.mjs
          node scripts/check-inkwave-trislosher-native-matched.mjs .built-site/_site "$CI_STORAGE/evidence/hissen-main" --measure-main
      - name: Capture all current-head Wiper charged and tap native views
        if: ${{ !cancelled() && matrix.suite == 'catalog' && steps.verified-site.outcome == 'success' && steps.browser-prepare.outcome == 'success' }}
        run: |
          node --experimental-vm-modules --test scripts/tests/inkwave-wiper-native-acceptance.test.mjs
          timeout 30m node scripts/check-inkwave-wiper-native-acceptance.mjs .built-site/_site "$CI_STORAGE/evidence/wiper-native" --source-sha "$SOURCE_SHA"
          node scripts/check-inkwave-wiper-native-receipt.mjs .built-site/_site "$CI_STORAGE/evidence/wiper-native" "$SOURCE_SHA"
      - name: Verify PR1172 volley and vortex in Chromium and WebKit
        if: matrix.suite == 'ui'
        run: |
          node --test scripts/lib/inkwave-volley-failure-evidence.test.mjs
          node scripts/check-inkwave-volley-vortex.mjs .built-site/_site --webkit
      - name: Verify remote combat trust boundaries in Chromium and WebKit
        if: matrix.suite == 'ui'
        run: node scripts/check-inkwave-combat-trust.mjs .built-site/_site --webkit
      - name: Verify room startup and gyro health in Chromium and WebKit
        if: matrix.suite == 'ui'
        run: node scripts/check-inkwave-room-gyro.mjs .built-site/_site --webkit
      - name: Verify touch layout in Chromium and WebKit
        if: matrix.suite == 'ui'
        run: node scripts/check-inkwave-touch-layout.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/layout" --profile-dir "$CI_STORAGE/cache/layout"
      - name: Verify built input and lifecycle modules in Chromium and WebKit
        if: matrix.suite == 'ui'
        run: node scripts/check-inkwave-reliability.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/reliability" --profile-dir "$CI_STORAGE/cache/reliability"
      - name: Verify native lifecycle start, gesture and atomic snapshot guards
        if: matrix.suite == 'ui'
        run: node --experimental-vm-modules --test scripts/tests/inkwave-rematch-start-boundary.test.mjs scripts/tests/inkwave-rematch-diagnostics.test.mjs
      - name: Verify repeated battle → results → menu lifecycle and the untimed Practice Range
        if: matrix.suite == 'ui'
        run: node scripts/check-inkwave-rematch-lifecycle.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/rematch" --profile-dir "$CI_STORAGE/cache/rematch" --cycles "$REMATCH_CYCLES"
      - name: Reject forged touch and reliability source identities
        if: matrix.suite == 'ui'
        run: |
          node --test scripts/tests/inkwave-identity-helper-loading.test.mjs scripts/lib/minimap-canvas-three-binding.test.mjs
          node scripts/check-inkwave-touch-layout-identity.mjs --site .built-site/_site --source inkwave-public --checkout-dir "$CI_STORAGE/identity-touch" --evidence-dir "$CI_STORAGE/evidence/identity-touch"
          node scripts/check-inkwave-touch-layout-identity.mjs --network --site .built-site/_site --source inkwave-public --checkout-dir "$CI_STORAGE/identity-network" --evidence-dir "$CI_STORAGE/evidence/identity-network"
          node scripts/check-inkwave-touch-layout-identity.mjs --reliability --site .built-site/_site --source inkwave-public --checkout-dir "$CI_STORAGE/identity-reliability" --evidence-dir "$CI_STORAGE/evidence/identity-reliability"
      - name: Verify the practice range in Chromium and WebKit (desktop + phone + tablet)
        if: matrix.suite == 'range'
        run: node scripts/check-inkwave-range.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/range" --profile-dir "$CI_STORAGE/cache/range"
      - name: Verify responsive menus in Chromium and WebKit
        if: matrix.suite == 'responsive'
        run: node scripts/check-inkwave-responsive-isolated.mjs --source .built-site/_site --section all --evidence-dir "$CI_STORAGE/evidence/responsive" --profile-dir "$CI_STORAGE/cache/responsive" --workers 2
      - name: Verify mobile launch and result actions stay visible
        if: matrix.suite == 'responsive'
        run: |
          set -euo pipefail
          # Chromium and WebKit have disjoint profiles/evidence. Keep both WebKit
          # variants in order while overlapping independent Chromium checks.
          node scripts/check-inkwave-mobile-menus.mjs --source .built-site/_site --engine chromium --evidence-dir "$CI_STORAGE/evidence/mobile-menus/chromium" --profile-dir "$CI_STORAGE/cache/mobile-menus/chromium" &
          chromium_pid=$!
          (
            set -euo pipefail
            node scripts/check-inkwave-mobile-menus.mjs --source .built-site/_site --engine webkit --evidence-dir "$CI_STORAGE/evidence/mobile-menus/webkit" --profile-dir "$CI_STORAGE/cache/mobile-menus/webkit"
            node scripts/check-inkwave-mobile-menus.mjs --source .built-site/_site --engine webkit --resizable-viewport --cases phone,landscape --evidence-dir "$CI_STORAGE/evidence/mobile-menus/webkit-resize" --profile-dir "$CI_STORAGE/cache/mobile-menus/webkit-resize"
          ) &
          webkit_pid=$!
          result=0
          wait "$chromium_pid" || result=1
          wait "$webkit_pid" || result=1
          exit "$result"
      - name: Measure cold, warm, PWA restart and offline startup in Chromium
        if: matrix.suite == 'startup'
        run: node scripts/check-inkwave-startup-browser.mjs --site .built-site/_site --evidence-dir "$CI_STORAGE/evidence/startup" --profile-dir "$CI_STORAGE/cache/startup" --source-sha "$SOURCE_SHA" --runs 3
      - name: Verify failed module recovery across deployments in Chromium and WebKit
        if: matrix.suite == 'startup'
        run: node --test scripts/tests/inkwave-update-recovery-browser.test.mjs
      - name: Bind passing browser evidence to the tested commit
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['CI_STORAGE'])/'evidence'
          suite=os.environ['BROWSER_SUITE']
          checks={
            'active':['game/browser-result.json','motion/motion-result.json','motion-detail/motion-detail-result.json','weapon-models/weapon-models-result.json','ballpoint/ballpoint-result.json','flow/flow-render-result.json','wall/wall-render-result.json','resources/resource-render-result.json','native-normal/native-normal-browser.json','showcase-weapon/showcase-weapon-queue.json'],
            'catalog':['catalog/motion-catalog-result.json','brellas/brella-controls-result.json','hissen-main/native-browser.json','wiper-native/wiper-native-result.json'],
            'network':['paint-mask/paint-mask-result.json','network/network-browser-result.json','network-delay/network-browser-result.json','combat-ceiling/combat-ceiling-browser-result.json','startup-clock/startup-clock-result.json'],
            'ui':['menu-focus/menu-focus-result.json','identity-network/network-identity-result.json','layout/touch-layout-result.json','reliability/reliability-browser-result.json','rematch/rematch-lifecycle-result.json','identity-touch/touch-layout-identity-result.json','identity-reliability/reliability-identity-result.json'],
            'responsive':['responsive/responsive-result.json','mobile-menus/chromium/result.json','mobile-menus/webkit/result.json','mobile-menus/webkit-resize/result.json'],
            'range':['range/range-result.json'],
            'startup':['startup/startup-browser-result.json'],
          }[suite]
          if suite=='active': checks.extend(['motion-cache-chromium.json','motion-cache-webkit.json','native-normal-webkit/native-normal-browser.json'])
          if suite=='active': checks.append('roller-ownership/roller-ownership-result.json')
          if suite=='active': checks.append('aim-visibility/receipt.json')
          if suite=='active': checks.extend(['post-depth-chromium.json','post-depth-webkit.json'])
          if suite=='active': checks.extend(['grate-normal/grate-normal-result.json','grate-normal-webkit/grate-normal-result.json'])
          runtime_performance=os.environ['RUNTIME_PERFORMANCE']=='true'
          if suite=='active' and runtime_performance:
            checks.extend(['runtime-before/runtime-result.json','runtime-after/runtime-result.json','runtime-comparison.json'])
          reports={name:json.loads((root/name).read_text()) for name in checks}
          build=json.loads(pathlib.Path('.built-site/_site/inkwave-build.json').read_text())
          assert pathlib.Path('.built-site/_site-source-sha.txt').read_text().strip()==os.environ['SOURCE_SHA']
          for name,report in reports.items():
            if name=='motion/motion-result.json': assert not report['errors'] and report['fixture']['scenarios']==10
            else: assert report['status']=='passed', name
            if 'contentHash' in report and name!='runtime-before/runtime-result.json': assert report['contentHash']==build['contentHash'], name
          if suite=='responsive':
            all_cases=['small-phone','phone','android','standard','landscape','browser-bars','notched','tablet','desktop']
            for lane,engine,model,names in [('chromium','chromium','mobile-emulation',all_cases),('webkit','webkit','mobile-emulation',all_cases),('webkit-resize','webkit','resizable-touch',['phone','landscape'])]:
              name='mobile-menus/'+lane+'/result.json'; report=reports[name]
              assert report['contentHash']==build['contentHash'] and report['inputHash']==build['inputHash'] and report['revision']==build['build']['revision'], name
              assert report['engine']==engine and report['viewportModel']==model and report['audit'] is False and report['errors']==[], name
              cases=report['cases']; actual=[row['name'] for row in cases]
              assert len(actual)==len(names) and set(actual)==set(names), name
              assert all(row['checks'] and all(check['ok'] is True for check in row['checks']) for row in cases), name
          if suite=='ui': assert reports['menu-focus/menu-focus-result.json']['sourceSha']==os.environ['SOURCE_SHA']
          if suite=='catalog': assert reports['hissen-main/native-browser.json']['sourceIdentity']['checkoutSha']==os.environ['SOURCE_SHA']
          if suite=='catalog': assert reports['wiper-native/wiper-native-result.json']['sourceSha']==reports['wiper-native/wiper-native-result.json']['sourceIdentity']['checkoutSha']==os.environ['SOURCE_SHA']
          if suite=='network':
            for name in checks: assert reports[name]['sourceSha']==os.environ['SOURCE_SHA']
          if suite=='active':
            assert reports['game/browser-result.json']['sourceSha']==os.environ['SOURCE_SHA']
            assert reports['aim-visibility/receipt.json']['sourceSha']==os.environ['SOURCE_SHA']
            assert reports['aim-visibility/receipt.json']['contentHash']==build['contentHash']
            assert reports['weapon-models/weapon-models-result.json']['sourceSha']==os.environ['SOURCE_SHA']
            assert reports['ballpoint/ballpoint-result.json']['sourceSha']==os.environ['SOURCE_SHA']
            for name in ['grate-normal/grate-normal-result.json','grate-normal-webkit/grate-normal-result.json']:
              assert reports[name]['sourceSha']==os.environ['SOURCE_SHA'], name
            if runtime_performance:
              assert reports['runtime-after/runtime-result.json']['sourceSha']==os.environ['SOURCE_SHA']
              assert reports['runtime-before/runtime-result.json']['sourceSha']=='5e28dbd16f7829aebd88052ff5f7fdf71f39fdad'
          receipt={'status':'passed','sourceSha':os.environ['SOURCE_SHA'],'contentHash':build['contentHash'],'suite':suite,'runtimePerformance':runtime_performance,'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'event':os.environ['GITHUB_EVENT_NAME'],'checks':checks}
          pending=root/'ci-result.json.pending'; pending.write_text(json.dumps(receipt,indent=2)+'\n'); pending.replace(root/'ci-result.json')
          print(json.dumps(receipt))
          PY
      - name: Package bounded browser failure evidence
        if: always() && (failure() || cancelled())
        id: browser_failure_evidence
        run: node scripts/ci/package-inkwave-evidence.mjs --browser-failure "$CI_STORAGE/evidence" "$RUNNER_TEMP/inkwave-browser-failure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${BROWSER_SUITE}" .built-site/_site/inkwave-build.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.browser_failure_evidence.outputs.eligible == 'true'
        with:
          name: inkwave-browser-failure-${{ matrix.suite }}-${{ env.SOURCE_SHA }}
          include-hidden-files: true
          if-no-files-found: warn
          path: ${{ steps.browser_failure_evidence.outputs.path }}
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: inkwave-browser-${{ matrix.suite }}-${{ env.SOURCE_SHA }}
          include-hidden-files: true
          if-no-files-found: error
          path: ${{ env.CI_STORAGE }}/evidence/
          retention-days: 14

  render-diagnostic:
    if: inputs.diagnostic_only == true && inputs.network_opening_diagnostic != true && inputs.wall_render_diagnostic != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /inkwave-public/
            /patches/
            /scripts/
            /server/
            /tests/
            /tools/
            !/tools/inkwave-modeler/
            /reports/
            /docs/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache verified npm tarballs
        uses: actions/cache@v4
        with:
          path: ~/.npm/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-node22-npm-esbuild0282-playwright1621-ws8-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Prepare persistent diagnostic storage and exact source
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          diagnostic_storage=/mnt/workspace/.dev-state/agent-work/evidence/inkwave-runtime-diagnostic-${{ github.run_id }}
          test "$(realpath -m "$diagnostic_storage")" = "$diagnostic_storage"
          sudo mkdir -p "$diagnostic_storage"
          sudo chown "$(id -u):$(id -g)" "$diagnostic_storage"
          browser_tmp=/mnt/workspace/.dev-state/agent-work/cache/iwrui
          test "$(realpath -m "$browser_tmp")" = "$browser_tmp"
          sudo mkdir -p "$browser_tmp"
          sudo chown "$(id -u):$(id -g)" "$browser_tmp"
          echo "DIAGNOSTIC_STORAGE=$diagnostic_storage" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.ci-scratch" "$GITHUB_WORKSPACE/.playwright"
          echo "TMPDIR=$GITHUB_WORKSPACE/.ci-scratch" >> "$GITHUB_ENV"
          echo "TMP=$GITHUB_WORKSPACE/.ci-scratch" >> "$GITHUB_ENV"
          echo "TEMP=$GITHUB_WORKSPACE/.ci-scratch" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$GITHUB_WORKSPACE/.playwright" >> "$GITHUB_ENV"
      - name: Build and diagnose (not an acceptance benchmark)
        run: |
          npm install --no-save --no-package-lock --silent esbuild@0.28.2 playwright@1.62.1
          sudo python3 scripts/prepare-inkwave-ci-apt.py
          npx playwright install --with-deps chromium
          ESBUILD_MODULE="$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js" node scripts/build-inkwave.mjs inkwave-public "$DIAGNOSTIC_STORAGE/site"
          node scripts/check-inkwave-runtime-performance.mjs --site "$DIAGNOSTIC_STORAGE/site" --evidence-dir "$DIAGNOSTIC_STORAGE/probe" --playwright "$GITHUB_WORKSPACE/node_modules/playwright/index.mjs" --source-sha "$SOURCE_SHA" --fixed-only --parity-only --quality high --verify-render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inkwave-render-diagnostic-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          path: ${{ env.DIAGNOSTIC_STORAGE }}/probe/
          retention-days: 14


