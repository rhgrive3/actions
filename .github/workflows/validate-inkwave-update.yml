name: Validate INKWAVE update
on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-weapons-reference.mjs'
      - 'scripts/verify-completion-sources.mjs'
      - 'package.json'
      - 'package-lock.json'
      - "scripts/ci/**"
      - 'tests/ink-flight/model.test.mjs'
      - 'tests/platform-lifecycle/platform-smoke.test.mjs'
      - 'scripts/lib/minimap-canvas-observation.test.mjs'
      - 'scripts/lib/minimap-canvas-three-binding.test.mjs'
      - 'scripts/fetch-inkwave-pinned-references.py'
      - 'scripts/tests/test_fetch_inkwave_pinned_references.py'
      - 'scripts/prepare-inkwave-ci-apt.py'
      - .github/workflows/validate-inkwave-update.yml
      - .github/workflows/pages-inkwave.yml
      - "scripts/lib/**"
      - "server/src/**"
      - "inkwave-public/**"
      - "patches/splatoon3/**"
      - "patches/touch-layout/**"
      - "patches/reliability/**"
      - "patches/local-quality/**"
      - "patches/movement-physics/**"
      - "patches/network-replication/**"
      - "patches/loading-cache/**"
      - "patches/practice-range/**"
      - "patches/native-stages/**"
      - "scripts/*inkwave*.mjs"
      - 'scripts/inkwave-menu-focus-pins.json'
      - "scripts/run-logged-test-process.mjs"
      - "scripts/tests/inkwave-*.mjs"
      - "scripts/tests/run-inkwave-turf-finish-*.test.mjs"
      - "scripts/lib/inkwave-*.mjs"
      - "scripts/tests/fixtures/inkwave-paint-source-epochs.mjs"
      - "scripts/fixtures/inkwave-paint-catalogue-epochs.json.gz"
      - "scripts/tests/fixtures/inkwave-paint-e1f-sources.mjs"
      - "scripts/fixtures/inkwave-paint-e1f-catalogue.json.gz"
      - "scripts/fixtures/inkwave-murals-ba5a2d57.js.txt"
      - "tests/issue-queue/**"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    paths:
      - 'scripts/check-weapons-reference.mjs'
      - 'scripts/verify-completion-sources.mjs'
      - 'package.json'
      - 'package-lock.json'
      - "scripts/ci/**"
      - 'tests/ink-flight/model.test.mjs'
      - 'tests/platform-lifecycle/platform-smoke.test.mjs'
      - 'scripts/lib/minimap-canvas-observation.test.mjs'
      - 'scripts/lib/minimap-canvas-three-binding.test.mjs'
      - 'scripts/fetch-inkwave-pinned-references.py'
      - 'scripts/tests/test_fetch_inkwave_pinned_references.py'
      - 'scripts/prepare-inkwave-ci-apt.py'
      - .github/workflows/validate-inkwave-update.yml
      - .github/workflows/pages-inkwave.yml
      - "scripts/lib/**"
      - "server/src/**"
      - "inkwave-public/**"
      - "patches/splatoon3/**"
      - "patches/touch-layout/**"
      - "patches/reliability/**"
      - "patches/local-quality/**"
      - "patches/movement-physics/**"
      - "patches/network-replication/**"
      - "patches/loading-cache/**"
      - "patches/practice-range/**"
      - "patches/native-stages/**"
      - "scripts/*inkwave*.mjs"
      - 'scripts/inkwave-menu-focus-pins.json'
      - "scripts/run-logged-test-process.mjs"
      - "scripts/tests/inkwave-*.mjs"
      - "scripts/tests/run-inkwave-turf-finish-*.test.mjs"
      - "scripts/lib/inkwave-*.mjs"
      - "scripts/tests/fixtures/inkwave-paint-source-epochs.mjs"
      - "scripts/fixtures/inkwave-paint-catalogue-epochs.json.gz"
      - "scripts/tests/fixtures/inkwave-paint-e1f-sources.mjs"
      - "scripts/fixtures/inkwave-paint-e1f-catalogue.json.gz"
      - "scripts/fixtures/inkwave-murals-ba5a2d57.js.txt"
      - "tests/issue-queue/**"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full immutable commit SHA to verify
        required: true
        type: string
      focused_tests:
        description: Optional JSON list of INKWAVE test files; supplements the unchanged full gate
        type: string
        default: ''
      focused_baselines:
        description: Optional JSON list of immutable baseline SHAs required by focused tests
        type: string
        default: '[]'
      runtime_performance:
        description: Run the pinned runtime workstream baseline and candidate comparison
        type: boolean
        default: false
      diagnostic_only:
        description: Run isolated render repeatability diagnosis (never full acceptance)
        type: boolean
        default: false
      network_opening_diagnostic:
        description: With diagnostic_only, run native network opening diagnosis only; never full acceptance
        type: boolean
        default: false
      wall_render_diagnostic:
        description: With diagnostic_only and without network opening, run only native wall verification; never full acceptance
        type: boolean
        default: false
      deep_lifecycle:
        description: Run the full 10-cycle rematch lifecycle instead of the fast 3-cycle gate
        type: boolean
        default: false
concurrency:
  group: validate-inkwave-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}${{ inputs.diagnostic_only == true && inputs.network_opening_diagnostic == true && '-network-opening-diagnostic' || inputs.diagnostic_only == true && inputs.wall_render_diagnostic == true && '-wall-render-diagnostic' || '' }}
  cancel-in-progress: ${{ !(inputs.diagnostic_only == true && (inputs.network_opening_diagnostic == true || inputs.wall_render_diagnostic == true)) }}
permissions:
  contents: read
  checks: read
  statuses: read
env:
  SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
  FOCUSED_EVIDENCE_DIR: /mnt/workspace/.dev-state/agent-work/evidence/inkwave-focused-${{ github.run_id }}-${{ github.run_attempt }}
  INKWAVE_TEST_SCRATCH: /mnt/workspace/.dev-state/agent-work/scratch/inkwave-worker-${{ github.run_id }}-${{ github.run_attempt }}
  RUNTIME_PERFORMANCE: ${{ inputs.runtime_performance == true || (github.event_name == 'pull_request' && (github.head_ref == 'inkwave/runtime-performance-ui' || github.head_ref == 'inkwave/final-nine-way-integration')) }}
  REMATCH_CYCLES: ${{ inputs.deep_lifecycle == true && '10' || '3' }}
jobs:
  admission_preflight:
    if: inputs.diagnostic_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /patches/
            /inkwave-public/src/
            /inkwave-public/index.html
            /inkwave-public/sw.js
            /.github/workflows/
            /package-lock.json
      - name: Verify immutable source checkout before other jobs
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject invalid or duplicated YAML workflow definitions
        run: ruby scripts/ci/check-workflow-yaml.rb .github/workflows
      - name: Reject production composition anchor drift before heavy lanes
        run: node scripts/ci/check-composition-preflight.mjs
      - name: Verify source combat receipt and Boss admission fixtures
        run: node --test scripts/tests/inkwave-combat-provenance.test.mjs scripts/tests/inkwave-boss-positive-proof.test.mjs
      - name: Verify emitted coverage contracts before heavy lanes
        run: node --test scripts/tests/inkwave-wall-diagnostic-workflow.test.mjs

  build_site:
    needs: admission_preflight
    if: inputs.diagnostic_only != true && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      content_hash: ${{ steps.identity.outputs.content_hash }}
      contracts_only: ${{ steps.scope.outputs.contracts_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /inkwave-public/
            /patches/
            /scripts/
            /server/
            /tests/
            /tools/
            !/tools/inkwave-modeler/
            /reports/
            !/reports/*
            /reports/ink-volume/
            !/reports/ink-volume/*
            /reports/ink-volume/source/
            /docs/
            # The global metadata AST guard reads every tracked JavaScript file.
            *.js
            *.mjs
            *.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Classify immutable tree difference, not commit-message or historical SHA
        id: scope
        env:
          CONTRACT_SCOPE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node scripts/ci/inkwave-full-scope.mjs
      - name: CI-only source contract acceptance (no browser or unnecessary rebuild)
        if: steps.scope.outputs.contracts_only == 'true'
        run: |
          node scripts/check-inkwave-patches.mjs --quick
          node scripts/ci/run-inkwave-test-suite.mjs runner-contracts
          node scripts/ci/run-inkwave-test-suite.mjs verifier
          node --test scripts/tests/inkwave-network-diagnostic-workflow.test.mjs scripts/tests/inkwave-wall-diagnostic-workflow.test.mjs scripts/tests/inkwave-staged-ci-policy.test.mjs scripts/tests/inkwave-full-scope.test.mjs scripts/tests/inkwave-workflow-inputs.test.mjs scripts/tests/inkwave-ci-sparse-checkout.test.mjs
      - name: Build immutable production site once
        if: steps.scope.outputs.contracts_only != 'true'
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm install --no-save --no-package-lock --silent esbuild@0.28.2
          node scripts/build-inkwave.mjs inkwave-public _site
          node scripts/check-inkwave-startup-budget.mjs _site
          git rev-parse HEAD > _site-source-sha.txt
          tar -cf immutable-site.tar _site _site-source-sha.txt
      - name: Bind shared artifact identity
        if: steps.scope.outputs.contracts_only != 'true'
        id: identity
        run: node --input-type=module -e "import fs from 'node:fs'; const b=JSON.parse(fs.readFileSync('_site/inkwave-build.json')); fs.appendFileSync(process.env.GITHUB_OUTPUT,'content_hash='+b.contentHash+'\n');"
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.contracts_only != 'true'
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
          name: inkwave-patched-site-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          compression-level: 0
          path: immutable-site.tar

  validate_core:
    needs: build_site
    if: inputs.diagnostic_only != true && needs.build_site.outputs.contracts_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    # CPU source regressions live in the eight patch shards; keep browser-backed source and emitted checks here.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /.circleci/config.yml
            /inkwave-public/
            /patches/
            /scripts/
            /server/
            /tests/
            /tools/
            !/tools/inkwave-modeler/
            /reports/
            /docs/
            # Include audit code while keeping excluded authoring binaries absent.
            *.js
            *.mjs
            *.cjs
      - name: Verify immutable checkout identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache verified npm tarballs
        uses: actions/cache@v4
        with:
          path: ~/.npm/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-node22-npm-esbuild0282-playwright1621-ws8-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Prove CircleCI offload command parity and fail-closed SHA gate
        run: node --test scripts/tests/inkwave-circleci-browser-lane.test.mjs scripts/tests/inkwave-circleci-offload-gate.test.mjs
      - name: Verify scoped network diagnostic workflow contracts
        run: node --test scripts/tests/inkwave-network-diagnostic-workflow.test.mjs scripts/tests/inkwave-opening-peer-diagnostic.test.mjs scripts/tests/inkwave-owner-clock-diagnostic.test.mjs scripts/tests/inkwave-wall-diagnostic-workflow.test.mjs scripts/tests/inkwave-projectile-menu-start.test.mjs scripts/tests/inkwave-sandbox-runner-route.test.mjs
      - name: Install pinned source regression and build tool
        run: |
          npm ci --no-audit --no-fund
          # Hosted Azure apt mirror fetched fonts at 45 kB/s (7m43s, run 40487962033).
          # Rewrite only the stalled mirror before Playwright's unchanged dependency installation.
          sudo python3 scripts/prepare-inkwave-ci-apt.py
          npx --no-install playwright install --with-deps chromium
      - name: Prepare persistent worker regression fixtures
        run: |
          test "$(realpath -m "$INKWAVE_TEST_SCRATCH")" = "$INKWAVE_TEST_SCRATCH"
          sudo mkdir -p "$INKWAVE_TEST_SCRATCH"
          sudo chown "$(id -u):$(id -g)" "$INKWAVE_TEST_SCRATCH"
          test "$(realpath "$INKWAVE_TEST_SCRATCH")" = "$INKWAVE_TEST_SCRATCH"
          test -w "$INKWAVE_TEST_SCRATCH"
      - name: Prepare persistent focused test evidence
        if: inputs.focused_tests != ''
        run: |
          test "$(realpath -m "$FOCUSED_EVIDENCE_DIR")" = "$FOCUSED_EVIDENCE_DIR"
          sudo mkdir -p "$FOCUSED_EVIDENCE_DIR"
          sudo chown "$(id -u):$(id -g)" "$FOCUSED_EVIDENCE_DIR"
          test "$(realpath "$FOCUSED_EVIDENCE_DIR")" = "$FOCUSED_EVIDENCE_DIR"
          test -w "$FOCUSED_EVIDENCE_DIR"
      - name: Run requested focused source regressions
        if: inputs.focused_tests != ''
        id: focused_native
        env:
          FOCUSED_TESTS: ${{ inputs.focused_tests }}
          FOCUSED_BASELINES: ${{ inputs.focused_baselines }}
        run: node scripts/run-inkwave-focused-tests.mjs
      - uses: actions/upload-artifact@v4
        if: inputs.focused_tests != '' && steps.focused_native.outcome == 'success'
        with:
          name: inkwave-focused-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          path: ${{ env.FOCUSED_EVIDENCE_DIR }}/
          retention-days: 14
      - name: Verify gameplay patch compatibility and numeric contract
        run: node --experimental-vm-modules scripts/check-inkwave-patches.mjs --quick
      - name: Verify source-guided ink flight model
        run: node --test tests/ink-flight/model.test.mjs
      - name: Verify nine queued critical INKWAVE fixes
        run: node --test tests/issue-queue/critical-queue.test.mjs
      - name: Verify immutable audio cancellation accounting
        run: node --test scripts/tests/inkwave-browser-request-failure.test.mjs scripts/tests/inkwave-browser-active-failures.test.mjs scripts/tests/inkwave-motion-detail-failure-summary.test.mjs scripts/tests/inkwave-detail-source-readiness.test.mjs scripts/tests/inkwave-submerged-presentation-contract.test.mjs
      - name: Verify cancelled native texture ownership
        run: node --max-old-space-size=128 --experimental-vm-modules --test patches/native-stages/tests/native-texture-cancellation.test.mjs patches/native-stages/tests/native-normal-readback.test.mjs patches/native-stages/tests/native-texture-index.test.mjs
      - name: Verify cancelled native world preparation and async stage fencing
        run: node --max-old-space-size=128 --experimental-vm-modules --test patches/native-stages/tests/native-world-cancellation.test.mjs scripts/tests/inkwave-native-legacy-stage-raf-1723.test.mjs
      - name: Verify native BVH query lifetime and collision parity
        run: node --experimental-vm-modules --test patches/native-stages/tests/bvh-query-lifetime.test.mjs patches/native-stages/tests/boolean-ground-parity.test.mjs patches/native-stages/tests/vertical-slab-parity.test.mjs patches/native-stages/tests/bvh-browser-baseline.test.mjs
      - name: Verify source OBJ pattern cache semantics
        run: node --test patches/native-stages/tests/source-obj-semantics-regex-cache.test.mjs
      - name: Verify remote combat provenance and equipped hit ceilings
        run: |
          node patches/network-replication/tools/combat-hit-ceilings.mjs
          node --test scripts/tests/inkwave-combat-provenance.test.mjs scripts/tests/inkwave-open-pr-source-pairs.test.mjs scripts/tests/inkwave-boss-positive-proof.test.mjs
      - name: Compare authoritative and reconstructed attacks
        run: node --experimental-vm-modules scripts/check-inkwave-network-comparison.mjs --exact-source --evidence-dir .ci-scratch/network-comparison
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.ci-scratch/network-comparison/*.json') != ''
        with:
          name: inkwave-network-comparison-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          path: .ci-scratch/network-comparison/
          retention-days: 14
      - name: Verify browser-backed source regressions
        env:
          INKWAVE_REQUIRE_BROWSER_TESTS: '1'
        run: node scripts/ci/run-inkwave-test-suite.mjs source-browser
      - name: Verify migrated direct game source ownership
        run: node --test scripts/tests/inkwave-direct-source-ownership.test.mjs
      - name: Verify platform lifecycle smoke regressions
        run: node --test tests/platform-lifecycle/platform-smoke.test.mjs
      - name: Verify movement physics smoke regressions
        run: node --test patches/movement-physics/tests/*.test.mjs
      - name: Verify practice range measurement, rules and battle isolation
        run: node --experimental-vm-modules --test patches/practice-range/tests/*.test.mjs
      - name: Verify loading/cache regressions
        run: |
          node --experimental-vm-modules --test patches/loading-cache/tests/adapter.test.mjs patches/loading-cache/tests/worker.test.mjs patches/loading-cache/tests/recovery.test.mjs
          python3 patches/loading-cache/tests/harness.test.py
      - name: Prepare persistent runtime verifier fixtures
        run: |
          runtime_fixtures=/mnt/workspace/.dev-state/agent-work/scratch/inkwave-runtime-performance-ui-evidence-tests
          test "$(realpath -m "$runtime_fixtures")" = "$runtime_fixtures"
          sudo mkdir -p "$runtime_fixtures"
          sudo chown "$(id -u):$(id -g)" "$runtime_fixtures"
          test -w "$runtime_fixtures"
          browser_tmp=/mnt/workspace/.dev-state/agent-work/cache/iwrui
          test "$(realpath -m "$browser_tmp")" = "$browser_tmp"
          sudo mkdir -p "$browser_tmp"
          sudo chown "$(id -u):$(id -g)" "$browser_tmp"
      - name: Verify pointer-lock successful-pair source regressions
        run: env -u TEST_FROM -u TEST_TO -u TEST_EMITTED -u INKWAVE_TEST_ROOT -u INKWAVE_TEST_ADAPTER -u INKWAVE_UPSTREAM_SOURCE -u INKWAVE_BUILT_SITE -u INKWAVE_POINTER_LOCK_SITE -u INKWAVE_ESBUILD_MODULE node scripts/tests/lock-option-recovery.test.mjs
      - name: Verify motion verifier regressions
        run: node scripts/ci/run-inkwave-test-suite.mjs verifier
      - name: Verify aggregate QA acceptance guards
        run: node scripts/ci/run-inkwave-test-suite.mjs acceptance
      - name: Verify pinned-fetch deduplication and dedicated QA routing
        run: |
          python3 -m unittest discover -s scripts/tests -p test_fetch_inkwave_pinned_references.py -v
      - name: Verify pinned primary numerical sources
        run: |
          python3 scripts/fetch-inkwave-pinned-references.py
          INKWAVE_WEIGHT_PARAMS=.reference-data/data/parameter/1130/misc/params.json node --experimental-vm-modules --test patches/splatoon3/tests/weapon-weight-gear.test.mjs
          INKWAVE_OBJECT_DAMAGE_REFERENCE=.reference-data/object-damage.json node --experimental-vm-modules --test patches/splatoon3/tests/object-shredder-1130.test.mjs patches/splatoon3/tests/native-sprinkler-damage.test.mjs
          node scripts/verify-inkwave-reference.mjs .reference-data
          node scripts/check-weapons-reference.mjs .reference-data/weapons
      - name: Verify completed weapon source mirror
        run: node scripts/verify-completion-sources.mjs .reference-data/weapons
      - name: Compare every catalog record with its pinned numerical source
        run: |
          INKWAVE_MAIN_WEAPON_REFERENCE=.reference-data/catalog node --test patches/splatoon3/tests/main-weapon-catalog-data.test.mjs
          node scripts/generate-inkwave-catalog-wall-drop.mjs .reference-data/catalog/data/parameter/1130/weapon
          git diff --exit-code -- patches/splatoon3/runtime/catalog-wall-drop-data.mjs
          INKWAVE_MAIN_WEAPON_REFERENCE=.reference-data/catalog node --test --test-name-pattern='pinned alternate rows match raw' patches/splatoon3/tests/alternate-weapon-kits.test.mjs
          node scripts/generate-inkwave-weight-reference.mjs .reference-data/catalog/data/parameter/1130/weapon
          git diff --exit-code -- patches/splatoon3/reference/weapon-weight-1130.json patches/splatoon3/runtime/weapon-weight-data.mjs
          node scripts/generate-inkwave-canonical-kits.mjs .reference-data/catalog/data/mush/1130/WeaponInfoMain.json
          git diff --exit-code -- patches/splatoon3/reference/canonical-kits-1130.json patches/splatoon3/runtime/canonical-kits-data.mjs
      - name: Verify pinned Sub/Special numerical sources
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request
          reference=json.loads(pathlib.Path('patches/splatoon3/reference/sub-special-fidelity-reference.json').read_text())
          root=pathlib.Path('.reference-data/sub-special')
          root.mkdir(parents=True,exist_ok=True)
          for source in reference['sources']:
            target=root/source['url'].rsplit('/',1)[-1]
            with urllib.request.urlopen(source['url'],timeout=30) as response:
              target.write_bytes(response.read())
          PY
          node scripts/check-inkwave-sub-special-reference.mjs .reference-data/sub-special
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --experimental-vm-modules scripts/inkwave-syntax-batch.mjs inkwave-public/src inkwave-public/vendor patches/local-quality patches/loading-cache patches/practice-range
      - name: Check local module and stylesheet references
        run: |
          node --test scripts/tests/inkwave-local-references.test.mjs
          node scripts/check-inkwave-local-references.mjs .
      - name: Verify projectile UI admission and boolean gate contracts
        run: node --test scripts/tests/inkwave-projectile-atomic-intro.test.mjs scripts/tests/inkwave-projectile-capture-ui.test.mjs scripts/tests/inkwave-projectile-ci-intro.test.mjs scripts/tests/inkwave-projectile-boolean-gate.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: inkwave-patched-site-${{ env.SOURCE_SHA }}
      - name: Verify patched site at the checkout commit
        run: |
          node --test scripts/tests/inkwave-worker-compaction.test.mjs scripts/tests/inkwave-reviewed-audio-orphan.test.mjs
          tar -xf immutable-site.tar
          test "$(cat _site-source-sha.txt)" = "$SOURCE_SHA"
          EXPECTED_CONTENT_HASH='${{ needs.build_site.outputs.content_hash }}' node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(JSON.parse(fs.readFileSync('_site/inkwave-build.json')).contentHash,process.env.EXPECTED_CONTENT_HASH);"
          node scripts/check-inkwave-startup-budget.mjs _site
          INKWAVE_BUILT_SITE=_site node --test scripts/tests/inkwave-build-packaging.test.mjs scripts/tests/inkwave-three-composition.test.mjs scripts/tests/inkwave-selected-prop-pack-contracts.test.mjs
          git rev-parse HEAD > _site-source-sha.txt
      - name: Verify all Turf finish cases on emitted site
        run: node scripts/run-inkwave-turf-finish-isolated.mjs . emitted .ci-scratch/turf-finish _site
      - name: Retain bounded Turf finish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkwave-turf-finish-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: .ci-scratch/turf-finish/
          if-no-files-found: error
          retention-days: 14
      - name: Verify emitted Charger grip reach and protected trajectory
        run: INKWAVE_BUILT_SITE=_site node --experimental-vm-modules --test patches/splatoon3/tests/charger-native-grip-reach.test.mjs patches/splatoon3/tests/charger-protected-trajectory.test.mjs
      - name: Verify emitted opposing-spawn body exclusion and allied exits
