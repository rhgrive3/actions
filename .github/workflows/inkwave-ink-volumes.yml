name: INKWAVE alpha volume geometry and game rendering
on:
  pull_request:
    paths:
      - 'inkwave-public/src/fx/fx.js'
      - 'inkwave-public/src/main.js'
      - 'inkwave-public/src/game/weapons.js'
      - 'scripts/build-inkwave.mjs'
      - 'scripts/inkwave-source-composition.mjs'
      - 'scripts/prepare-inkwave-ci-apt.py'
      - 'patches/local-quality/ink-volume/**'
      - 'patches/local-quality/ink-volume-adapter.mjs'
      - 'patches/local-quality/adapter.mjs'
      - 'patches/local-quality/tests/ink-volume.test.mjs'
      - 'patches/local-quality/tests/ink-volume-recipes.test.mjs'
      - 'patches/local-quality/tests/ink-volume-defaults.test.mjs'
      - 'scripts/*inkwave-volume*.mjs'
      - 'scripts/lib/inkwave-audio-readiness-diagnostics.mjs'
      - 'scripts/tests/inkwave-audio-readiness-diagnostics.test.mjs'
      - 'scripts/*inkwave-projectile*.mjs'
      - 'reports/ink-volume/**'
      - '.github/workflows/inkwave-ink-volumes.yml'
      - 'scripts/lib/inkwave-splatling-render-evidence.mjs'
      - 'patches/splatoon3/runtime/splatling-cosmetics.mjs'
  workflow_dispatch:
    inputs:
      video_lifecycle_pilot:
        description: Run only the bounded single-lane recording lifecycle pilot
        type: boolean
        default: false
      game_sha:
        description: Immutable game source; only the approved26a4 head is admitted
        type: string
        default: 26a4db4123d23162a3dbf8a12150b1b5bc6ccf64
permissions:
  contents: read
concurrency:
  group: ink-volume-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  volume:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.video_lifecycle_pilot }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Alpha acceptance validates the literal PR head, not GitHub's synthetic merge.
      # Manual runs remain pinned to the immutable SHA selected by their dispatch ref.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tools/inkwave-modeler/blender/
            !/tools/inkwave-modeler/docs/
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact alpha source checkout
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'Alpha source checkout: expected=%s actual=%s\n' "$EXPECTED_CHECKOUT_SHA" "$actual_sha"
          test "$actual_sha" = "$EXPECTED_CHECKOUT_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1 meshoptimizer@1.3.0
      - run: |
          sudo python3 scripts/prepare-inkwave-ci-apt.py
          npx playwright install --with-deps chromium webkit
      - name: Audio readiness diagnostic receipt tests
        run: node --test scripts/tests/inkwave-audio-readiness-diagnostics.test.mjs
      - name: Geometry, pixels, animation, reuse and native gameplay invariants
        run: node --experimental-vm-modules --test patches/local-quality/tests/ink-volume*.test.mjs
      - name: Bake and validate authored structural fixtures
        run: |
          node scripts/create-inkwave-volume-fixture.mjs .ci-scratch/fixture
          node scripts/verify-inkwave-volume-pack.mjs .ci-scratch/fixture .ci-scratch/fixture/authored-test-0.vtf .ci-scratch/fixture/authored-test-1.vtf
          node scripts/create-inkwave-projectile-fixture.mjs .ci-scratch/rods
          node scripts/verify-inkwave-volume-pack.mjs .ci-scratch/rods .ci-scratch/rods/authored-line.vtf .ci-scratch/rods/authored-dot.vtf
      - name: Original source pixels and all shipped closed meshes
        run: |
          node scripts/verify-inkwave-volume-pack.mjs patches/local-quality/ink-volume/assets/roller reports/ink-volume/source/rollerink1.vtf reports/ink-volume/source/rollerink2.vtf
          node scripts/verify-inkwave-volume-pack.mjs patches/local-quality/ink-volume/assets/shooter reports/ink-volume/source/line.vtf reports/ink-volume/source/dot.vtf
      - name: Render the emitted game and compare every fixture frame
        run: |
          node scripts/build-inkwave.mjs inkwave-public .ci-scratch/site
          node scripts/check-inkwave-volumes.mjs .ci-scratch/site .ci-scratch/fixture .ci-scratch/evidence
          node scripts/check-inkwave-volumes.mjs .ci-scratch/site patches/local-quality/ink-volume/assets/roller .ci-scratch/original-evidence --shape-only
      - name: WebKit touch viewport shader and all-frame comparison
        run: node scripts/check-inkwave-volumes.mjs .ci-scratch/site patches/local-quality/ink-volume/assets/roller .ci-scratch/evidence-webkit --webkit --touch --shape-only
      - name: Native vertical Roller, Shooter, Slosher and catalogue presentation
        run: node scripts/check-inkwave-projectile-volumes.mjs .ci-scratch/site patches/local-quality/ink-volume/assets/roller patches/local-quality/ink-volume/assets/shooter .ci-scratch/projectile-evidence --default --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
          name: ink-volume-render-evidence
          path: |
            .ci-scratch/evidence
            .ci-scratch/original-evidence
            .ci-scratch/evidence-webkit
            .ci-scratch/projectile-evidence

  video-lifecycle-pilot:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.video_lifecycle_pilot }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VIDEO_LIFECYCLE_PILOT: ${{ inputs.video_lifecycle_pilot }}
      PILOT_GAME_SHA: ${{ inputs.game_sha }}
    steps:
      - name: Admit fixed source and CI resources
        timeout-minutes: 1
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$VIDEO_LIFECYCLE_PILOT" = true
          test "$PILOT_GAME_SHA" = 26a4db4123d23162a3dbf8a12150b1b5bc6ccf64
          python3 - <<'PYCI'
          import os, shutil
          assert shutil.disk_usage(os.environ['GITHUB_WORKSPACE']).free >= 4*1024**3
          mem=dict(line.split(':',1) for line in open('/proc/meminfo'))
          assert int(mem['MemAvailable'].split()[0])*1024 >= 2*1024**3
          PYCI
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: qa
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tools/inkwave-modeler/blender/
            !/tools/inkwave-modeler/docs/
      - uses: actions/checkout@v4
        with:
          ref: 26a4db4123d23162a3dbf8a12150b1b5bc6ccf64
          path: game
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tools/inkwave-modeler/blender/
            !/tools/inkwave-modeler/docs/
      - name: Verify independent immutable checkouts
        run: |
          test "$(git -C qa rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C game rev-parse HEAD)" = 26a4db4123d23162a3dbf8a12150b1b5bc6ccf64
          test "$(git -C game rev-parse HEAD^{tree})" = 40cd5c2b6fe399b52b7b82c37ee546fc40f9abaf
          test -z "$(git -C qa status --porcelain --untracked-files=no)"
          test -z "$(git -C game status --porcelain --untracked-files=no)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing pinned CI dependencies
        timeout-minutes: 2
        run: npm install --prefix "$GITHUB_WORKSPACE" --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1 meshoptimizer@1.3.0
      - name: Install existing Chromium runner
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium
      - name: Verify tools and resource/admission guards
        timeout-minutes: 2
        run: |
          command -v python3
          command -v ffmpeg
          command -v ffprobe
          node --max-old-space-size=128 --test qa/scripts/tests/continuous-browser-video.test.mjs
      - name: Build only the fixed game checkout
        timeout-minutes: 3
        working-directory: game
        env:
          GITHUB_SHA: 26a4db4123d23162a3dbf8a12150b1b5bc6ccf64
        run: |
          timeout --signal=KILL 180s node --max-old-space-size=512 scripts/build-inkwave.mjs inkwave-public ../pilot-site
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Record and decode one native lifecycle lane
        timeout-minutes: 11
        run: node --max-old-space-size=128 qa/scripts/run-native-range-video-pilot.mjs
      - name: Bound evidence upload even on failure
        id: evidence-size
        if: always()
        run: |
          python3 - <<'PYCI'
          import os, pathlib
          root=pathlib.Path('pilot-evidence')
          total=sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          assert total <= 64*1024**2, 'evidence exceeds64MiB; upload blocked'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('safe=true\n')
          PYCI
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.evidence-size.outputs.safe == 'true' }}
        with:
          name: native-video-lifecycle-26a4-${{ github.run_id }}-${{ github.run_attempt }}
          path: pilot-evidence
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
