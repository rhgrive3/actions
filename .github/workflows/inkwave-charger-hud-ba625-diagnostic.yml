name: INKWAVE native Charger HUD diagnostic (exact ba625)
on:
  push:
    branches: [diagnostic/charger-hud-ba625-20261028]
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.event_name == 'push' && github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/diagnostic/charger-hud-ba625-20261028'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact diagnostic harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify diagnostic parent, exact tree, allowlisted paths and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.workflow_sha }}" = "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD^)" = ba625a7f00f8cc00fe8fb4cf956114e2834642fe
          test "$(git rev-parse HEAD^^{tree})" = 55983a081cb27cd87208945ae046e315e7d17f22
          expected=$(printf '%s\n' '.circleci/config.yml' '.github/workflows/bootstrap-hex-worker-repos.yml' '.github/workflows/hex-fast-tail-known.yml' '.github/workflows/inkwave-charger-hud-ba625-diagnostic.yml' 'scripts/check-inkwave-lock-outcome-native.mjs' 'scripts/check-inkwave-lock-outcome-observer.mjs' 'scripts/check-inkwave-lock-resume-probe.mjs' 'scripts/check-inkwave-charge-observation-probe.mjs' 'scripts/check-inkwave-charger-selection-probe.mjs' 'scripts/check-inkwave-charger-flow.mjs' 'scripts/tests/inkwave-lock-outcome-native.test.mjs' 'scripts/tests/inkwave-lock-outcome-observer.test.mjs' 'scripts/tests/inkwave-lock-resume-probe.test.mjs' 'scripts/tests/inkwave-charge-observation-probe.test.mjs' 'scripts/tests/inkwave-charger-selection-probe.test.mjs' 'scripts/tests/inkwave-charger-flow.test.mjs' | sort)
          actual=$(git diff --no-renames --name-only HEAD^ HEAD | sort)
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:.circleci/config.yml)" = 2f99693131236272b88fdb4e32d4ff645dd01017
          test "$(git rev-parse HEAD:.github/workflows/bootstrap-hex-worker-repos.yml)" = 64db8697910d4e346d5094932696aee49ce666cb
          test "$(git rev-parse HEAD:.github/workflows/hex-fast-tail-known.yml)" = 63ed58cc4f8b2fc7b48a65fd26860773daa65d71
          test "$(git rev-parse HEAD:scripts/check-inkwave-lock-outcome-native.mjs)" = a22da9b1f833bcf8807592f26b213529a8f40055
          test "$(git rev-parse HEAD:scripts/check-inkwave-lock-outcome-observer.mjs)" = fe2473487261e479d4f8b93e4193908aa643a350
          test "$(git rev-parse HEAD:scripts/check-inkwave-lock-resume-probe.mjs)" = 396fa6698b86bb7266e458ef6ddc74d13a16a915
          test "$(git rev-parse HEAD:scripts/check-inkwave-charge-observation-probe.mjs)" = 4084a80fe87f3ed7b80b058f24ca4fba58359de2
          test "$(git rev-parse HEAD:scripts/check-inkwave-charger-selection-probe.mjs)" = a5ccd695248b8932beab6c565a783cd109cd25a3
          test "$(git rev-parse HEAD:scripts/check-inkwave-charger-flow.mjs)" = 528f268a968e110b81295527c40431c0f3794236
          test "$(git rev-parse HEAD:scripts/tests/inkwave-lock-outcome-native.test.mjs)" = b61ed34bca9aed5a4917a3993ae1df23c8466aa9
          test "$(git rev-parse HEAD:scripts/tests/inkwave-lock-outcome-observer.test.mjs)" = 0e0bbfd7a8433ca8e1f316e6cbca04883ddb2f89
          test "$(git rev-parse HEAD:scripts/tests/inkwave-lock-resume-probe.test.mjs)" = d52af41dfeeebfb003ec95cc96056b7148655207
          test "$(git rev-parse HEAD:scripts/tests/inkwave-charge-observation-probe.test.mjs)" = d53efe9f2554b3c9266a3bdfec7cbb6847407078
          test "$(git rev-parse HEAD:scripts/tests/inkwave-charger-selection-probe.test.mjs)" = 723fc9b5054048f857f1dca1ed5fcfeb9b83a9f6
          test "$(git rev-parse HEAD:scripts/tests/inkwave-charger-flow.test.mjs)" = 93007725d29ee0ef5c8466ebb28f66afd818097d
      - name: Checkout exact source under test
        uses: actions/checkout@v4
        with:
          ref: ba625a7f00f8cc00fe8fb4cf956114e2834642fe
          path: game-source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify clean exact source
        run: |
          set -euo pipefail
          test "$(git -C game-source rev-parse HEAD)" = ba625a7f00f8cc00fe8fb4cf956114e2834642fe
          test "$(git -C game-source rev-parse HEAD^{tree})" = 55983a081cb27cd87208945ae046e315e7d17f22
          test -z "$(git -C game-source status --porcelain)"
      - name: Install pinned tools and secure Chromium
        run: |
          npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1 ws@8
          npx playwright install --with-deps chromium
      - name: Run observer and safety contracts
        run: node --test scripts/tests/inkwave-lock-outcome-observer.test.mjs scripts/tests/inkwave-lock-outcome-native.test.mjs scripts/tests/inkwave-lock-resume-probe.test.mjs scripts/tests/inkwave-charge-observation-probe.test.mjs scripts/tests/inkwave-charger-selection-probe.test.mjs scripts/tests/inkwave-charger-flow.test.mjs
      - name: Build exact source once
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/node_modules" game-source/node_modules
          (cd game-source && node scripts/build-inkwave.mjs inkwave-public _site)
      - name: Native Range, one supported Pause Resume, normal and scoped HUD observations
        shell: bash
        run: |
          set +e
          mkdir -p evidence
          timeout --signal=TERM --kill-after=10s 1140s node scripts/check-inkwave-lock-outcome-native.mjs --root "$GITHUB_WORKSPACE/game-source" --site "$GITHUB_WORKSPACE/game-source/_site" --out "$GITHUB_WORKSPACE/evidence/outcome"
          code=$?
          printf 'exit=%s\n' "$code" > evidence/exit-code.txt
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            CODE="$code" node --input-type=module - <<'MARK'
          import fs from 'node:fs';
          const dir='evidence/outcome',file=dir+'/lock-outcome-result.json';fs.mkdirSync(dir,{recursive:true});
          const r=fs.existsSync(file)?JSON.parse(fs.readFileSync(file)):{schema:1};
          r.status='failed';r.externalTimeout=process.env.CODE==='124';r.externalKill=process.env.CODE==='137';r.error ||= 'External timeout or kill; cleanup outcome unknown';
          fs.writeFileSync(file,JSON.stringify(r,null,2)+'\n');
          MARK
          fi
          exit "$code"
      - name: Preserve diagnostic receipt and internal screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charger-hud-ba625-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
