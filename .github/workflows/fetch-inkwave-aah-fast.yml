name: Fetch INKWAVE update fast
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-inkwave-aah-fast.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch updated deployment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inkwave-aah-fast
          mkdir -p inkwave-aah-fast
          cd inkwave-aah-fast
          python3 - <<'PY'
          import os,re,json,urllib.parse,urllib.request
          from pathlib import Path
          BASE='https://inkwave-aah.pages.dev/'
          HOST=urllib.parse.urlparse(BASE).netloc
          q=[BASE]; seen=set(); manifest=[]
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=10) as r:
              return r.read(),r.headers.get('content-type',''),r.geturl()
          while q:
            url=q.pop(0)
            if url in seen: continue
            seen.add(url)
            try: data,ctype,final=get(url)
            except Exception as e:
              manifest.append({'url':url,'error':repr(e)}); continue
            u=urllib.parse.urlparse(final); path=u.path or '/index.html'
            if path.endswith('/'): path+='index.html'
            rel=Path(path.lstrip('/')); rel.parent.mkdir(parents=True,exist_ok=True); rel.write_bytes(data)
            manifest.append({'url':url,'final_url':final,'path':str(rel),'bytes':len(data),'content_type':ctype})
            if len(data)>8_000_000: continue
            if not (('text' in ctype) or ('javascript' in ctype) or str(rel).endswith(('.html','.js','.mjs','.css','.json'))): continue
            text=data.decode('utf-8','replace')
            refs=set()
            for pat in [
              r'''(?:src|href)=["']([^"']+)["']''',
              r'''url\((?:["']?)([^)"']+)(?:["']?)\)''',
              r'''(?:from\s*|import\s*\()\s*["']([^"']+)["']''',
              r'''import\s*["']([^"']+)["']''',
              r'''["']((?:\./|\.\./|/)[^"']+\.(?:js|mjs|css|json|svg|png|jpg|jpeg|webp|glb|gltf|bin|wasm|wav|mp3|ogg|woff2?|ttf))["']'''
            ]:
              refs.update(re.findall(pat,text,flags=re.I))
            for ref in refs:
              ref=ref.strip()
              if not ref or ref.startswith(('data:','blob:','javascript:','#','mailto:','tel:')): continue
              if ref=='three': ref='/vendor/three/build/three.module.js'
              elif ref.startswith('three/addons/'): ref='/vendor/three/jsm/'+ref[len('three/addons/'):]
              elif not ref.startswith(('./','../','/','http://','https://')): continue
              absu=urllib.parse.urljoin(final,ref)
              pu=urllib.parse.urlparse(absu)
              if pu.scheme in ('http','https') and pu.netloc==HOST and absu not in seen: q.append(absu)
          Path('FETCH_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False))
          print('OK',sum('path' in x for x in manifest),'ERR',sum('error' in x for x in manifest))
          PY
      - name: Commit snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inkwave-aah-fast
          git commit -m "Snapshot updated INKWAVE deployment (fast)" || exit 0
          git push
