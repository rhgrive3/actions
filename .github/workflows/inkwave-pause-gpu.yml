name: INKWAVE pause GPU work
on:
  pull_request:
    paths:
      - 'patches/local-quality/idle-resources.mjs'
      - 'patches/local-quality/tests/idle-resources.test.mjs'
      - 'patches/local-quality/tests/idle-attract-budget.test.mjs'
      - 'patches/local-quality/tests/idle-fixture.mjs'
      - "patches/local-quality/idle-adapter.mjs"
      - "patches/local-quality/tests/pause-gpu.test.mjs"
      - "patches/reliability/tests/hud-fixture.mjs"
      - "scripts/check-inkwave-pause-gpu.mjs"
      - "scripts/lib/inkwave-pause-baseline-contract.mjs"
      - "scripts/tests/inkwave-pause-baseline-contract.test.mjs"
      - ".github/workflows/inkwave-pause-gpu.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pause-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) source_sha="$PR_HEAD_SHA" ;;
            workflow_dispatch|push) source_sha="$EVENT_SHA" ;;
            *) echo "Unsupported checkout event" >&2; exit 1 ;;
          esac
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source SHA" >&2; exit 1; }
          [[ "$EXPECTED_SHA" == "$source_sha" ]] || { echo "Checkout input does not match event head" >&2; exit 1; }
          actual_sha="$(git rev-parse --verify HEAD)"
          [[ "$actual_sha" == "$source_sha" ]] || { echo "Checkout HEAD does not match requested source SHA" >&2; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.28.2 playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Verify pause ownership and composition
        run: node --experimental-vm-modules --test patches/local-quality/tests/pause-gpu.test.mjs patches/local-quality/tests/idle-resources.test.mjs patches/local-quality/tests/idle-attract-budget.test.mjs scripts/tests/inkwave-pause-baseline-contract.test.mjs
      - name: Build candidate
        run: node scripts/build-inkwave.mjs inkwave-public _site
      - uses: actions/checkout@v4
        with:
          ref: 00b8994711809ba6d0469723c858ddef6805e2ae
          path: baseline
      - name: Build unchanged baseline
        run: |
          test "$(git -C baseline rev-parse HEAD)" = "00b8994711809ba6d0469723c858ddef6805e2ae"
          node baseline/scripts/build-inkwave.mjs baseline/inkwave-public _baseline
      - name: Verify baseline sensitivity in real browser
        env:
          PAUSE_BASELINE_SHA: 00b8994711809ba6d0469723c858ddef6805e2ae
        run: node scripts/check-inkwave-pause-gpu.mjs --site _baseline --evidence-dir .browser-evidence/pause-baseline --baseline
      - name: Verify candidate in real browser
        run: node scripts/check-inkwave-pause-gpu.mjs --site _site --evidence-dir .browser-evidence/pause-candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inkwave-pause-gpu
          path: .browser-evidence
          include-hidden-files: true
