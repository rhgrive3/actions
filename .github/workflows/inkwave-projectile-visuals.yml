name: INKWAVE projectile visuals

on:
  pull_request:
    paths:
      - 'patches/splatoon3/projectile-visual-adapter.mjs'
      - 'patches/splatoon3/runtime/projectile-visual*.mjs'
      - 'patches/splatoon3/reference/projectile-*.json'
      - 'patches/splatoon3/tests/projectile-visuals.test.mjs'
      - 'scripts/check-inkwave-projectile-visuals.mjs'
      - 'scripts/inkwave-source-composition.mjs'
      - '.github/workflows/inkwave-projectile-visuals.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectile-visuals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out the unchanged integration baseline
        uses: actions/checkout@v4
        with:
          ref: 3a864f81ecf8ea3219f8209d0dbd803ca9e8b866
          path: .ci-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned build and browser tools
        run: npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1 ws@8
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Native visual, source-value and gameplay regressions
        run: node --experimental-vm-modules --test patches/splatoon3/tests/projectile-visuals.test.mjs patches/splatoon3/tests/slosher-draw-size-1014.test.mjs patches/splatoon3/tests/roller-draw-radius.test.mjs tests/ink-flight/model.test.mjs
      - name: Build complete production composition
        run: node scripts/build-inkwave.mjs inkwave-public .built-site/projectiles
      - name: Build unchanged baseline for the same browser harness
        run: node .ci-baseline/scripts/build-inkwave.mjs .ci-baseline/inkwave-public .built-site/baseline
      - name: Verify emitted packaging
        id: package-check
        run: INKWAVE_BUILT_SITE=.built-site/projectiles node --test scripts/tests/inkwave-build-packaging.test.mjs
      - name: Render unchanged native game and measure baseline
        run: node scripts/check-inkwave-projectile-visuals.mjs --site .built-site/baseline --evidence-dir .ci-scratch/projectile-visuals/before --mode baseline
      - name: Render candidate native game and measure desktop/mobile emulation
        if: ${{ !cancelled() && steps.package-check.outcome == 'success' }}
        run: node scripts/check-inkwave-projectile-visuals.mjs --site .built-site/projectiles --evidence-dir .ci-scratch/projectile-visuals/after --mode candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projectile-visuals-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-scratch/projectile-visuals/
          if-no-files-found: warn
          retention-days: 14
