name: INKWAVE projectile visuals

on:
  pull_request:
    paths:
      - 'patches/splatoon3/projectile-visual-adapter.mjs'
      - 'patches/splatoon3/runtime/projectile-visual*.mjs'
      - 'patches/splatoon3/reference/projectile-*.json'
      - 'patches/splatoon3/tests/projectile-visuals.test.mjs'
      - 'scripts/check-inkwave-projectile-visuals.mjs'
      - 'scripts/lib/inkwave-projectile-ci-roster.mjs'
      - 'scripts/tests/inkwave-projectile-ci-roster.test.mjs'
      - 'scripts/lib/inkwave-roller-birth-baseline.mjs'
      - 'scripts/lib/inkwave-main-ink-baseline.mjs'
      - 'scripts/fixtures/inkwave-main-ink-pr1525-baseline.json'
      - 'scripts/prepare-inkwave-projectile-baseline.mjs'
      - 'scripts/tests/inkwave-roller-birth-baseline.test.mjs'
      - 'scripts/tests/inkwave-main-ink-baseline.test.mjs'
      - 'scripts/lib/inkwave-projectile-ci-intro.mjs'
      - 'scripts/tests/inkwave-projectile-ci-intro.test.mjs'
      - 'scripts/tests/inkwave-projectile-character-reset.test.mjs'
      - 'scripts/tests/inkwave-projectile-pool-reset.test.mjs'
      - 'scripts/compare-inkwave-projectile-captures.py'
      - 'scripts/tests/inkwave-projectile-captures-synthetic.py'
      - 'scripts/tests/inkwave-projectile-captures.test.py'
      - 'scripts/inkwave-source-composition.mjs'
      - '.github/workflows/inkwave-projectile-visuals.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectile-visuals-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture ${{ matrix.side }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        side: [before, after]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out immutable PR-base main for reference
        if: ${{ matrix.side == 'before' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: .ci-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned build and browser tools
        run: npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1 ws@8
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Native visual, source-value and gameplay regressions
        if: ${{ matrix.side == 'after' }}
        run: |
          node --experimental-vm-modules --test patches/splatoon3/tests/projectile-visuals.test.mjs patches/splatoon3/tests/slosher-draw-size-1014.test.mjs patches/splatoon3/tests/roller-draw-radius.test.mjs tests/ink-flight/model.test.mjs scripts/tests/inkwave-projectile-pool-reset.test.mjs
          python3 scripts/tests/inkwave-projectile-captures.test.py
          node --experimental-vm-modules --test scripts/tests/inkwave-projectile-ci-intro.test.mjs scripts/tests/inkwave-projectile-ci-roster.test.mjs scripts/tests/inkwave-projectile-character-reset.test.mjs
          node --test scripts/tests/inkwave-roller-birth-baseline.test.mjs scripts/tests/inkwave-main-ink-baseline.test.mjs
      - name: Replay reviewed Roller births, pool reset and pinned paint in the main reference
        if: ${{ matrix.side == 'before' }}
        run: node scripts/prepare-inkwave-projectile-baseline.mjs --baseline .ci-baseline --candidate . --receipt .ci-scratch/projectile-visuals/before/baseline-birth-adjustment.json
      - name: Build main reference with reviewed births, pool reset and paint
        if: ${{ matrix.side == 'before' }}
        run: node .ci-baseline/scripts/build-inkwave.mjs .ci-baseline/inkwave-public .built-site/baseline
      - name: Build complete candidate production composition
        if: ${{ matrix.side == 'after' }}
        run: node scripts/build-inkwave.mjs inkwave-public .built-site/projectiles
      - name: Verify candidate packaging
        if: ${{ matrix.side == 'after' }}
        run: INKWAVE_BUILT_SITE=.built-site/projectiles node --test scripts/tests/inkwave-build-packaging.test.mjs
      - name: Capture native main reference
        if: ${{ matrix.side == 'before' }}
        run: node scripts/check-inkwave-projectile-visuals.mjs --site .built-site/baseline --evidence-dir .ci-scratch/projectile-visuals/before --mode baseline
      - name: Capture candidate native game including desktop and mobile workloads
        if: ${{ matrix.side == 'after' }}
        run: node scripts/check-inkwave-projectile-visuals.mjs --site .built-site/projectiles --evidence-dir .ci-scratch/projectile-visuals/after --mode candidate
      - name: Preserve independent capture and original image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projectile-capture-${{ matrix.side }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-scratch/projectile-visuals/${{ matrix.side }}/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  compare:
    name: Compare all 48 original native captures
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Retrieve immutable main reference capture
        uses: actions/download-artifact@v4
        with:
          name: projectile-capture-before-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-scratch/projectile-visuals/before
      - name: Retrieve full candidate capture
        uses: actions/download-artifact@v4
        with:
          name: projectile-capture-after-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-scratch/projectile-visuals/after
      - name: Verify exact paired native physical states, firing workloads and image hashes
        run: python3 scripts/compare-inkwave-projectile-captures.py --before .ci-scratch/projectile-visuals/before --after .ci-scratch/projectile-visuals/after --output .ci-scratch/projectile-visuals/paired-verification.json --require-complete
      - name: Exercise camera, RNG, contact, retirement and paint comparison gates
        if: ${{ !cancelled() }}
        run: python3 scripts/tests/inkwave-projectile-captures-synthetic.py --before .ci-scratch/projectile-visuals/before/projectile-visuals-result.json --after .ci-scratch/projectile-visuals/after/projectile-visuals-result.json --out .ci-scratch/projectile-visuals/comparator-synthetic-gates.json
      - name: Preserve comparison receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projectile-comparison-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .ci-scratch/projectile-visuals/paired-verification.json
            .ci-scratch/projectile-visuals/comparator-synthetic-gates.json
          if-no-files-found: warn
          retention-days: 14
