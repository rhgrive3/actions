    paths:
      - 'patches/splatoon3/projectile-visual-adapter.mjs'
      - 'patches/splatoon3/runtime/projectile-visual*.mjs'
      - 'patches/splatoon3/reference/projectile-*.json'
      - 'patches/splatoon3/tests/projectile-visuals.test.mjs'
      - 'scripts/lib/inkwave-reference-audio.mjs'
      - 'scripts/prepare-inkwave-reference-audio.mjs'
      - 'scripts/fixtures/inkwave-reference-audio.json'
      - 'scripts/tests/inkwave-reference-audio.test.mjs'
      - 'scripts/check-inkwave-projectile-visuals.mjs'
      - 'scripts/lib/inkwave-streamed-music-diagnostics.mjs'
      - 'scripts/tests/inkwave-streamed-music-diagnostics.test.mjs'
