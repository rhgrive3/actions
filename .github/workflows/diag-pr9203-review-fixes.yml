name: Diagnose PR 9203 review fixes

on:
  push:
    branches:
      - diag/migration-9203

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: integration/arch-defects-progress-20260918
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies quietly
        shell: bash
        run: npm ci --no-audit --no-fund >/tmp/npm-ci.log 2>&1

      - name: Focused review-fix validation
        shell: bash
        run: |
          set -euo pipefail
          : > review-fix-diag.txt
          run_one() {
            label="$1"; shift
            out="/tmp/$label.log"
            if timeout 180s "$@" >"$out" 2>&1; then
              printf '%s PASS\n' "$label" >> review-fix-diag.txt
            else
              code=$?
              printf '%s FAIL exit=%s\n' "$label" "$code" >> review-fix-diag.txt
              tail -n 60 "$out" >> review-fix-diag.txt
              exit "$code"
            fi
          }

          run_one query-dto node --test             tests/phase7/analysis-query/analysis-query-decompiler-dto.test.mjs             tests/phase7/analysis-query/analysis-query-decompiler-projection.test.mjs
          run_one query-huge node --test tests/arch-invariants/query-huge-producer.test.mjs

          for f in             reports/investigations/function-discovery/scripts/baseline-extract.mjs             reports/investigations/function-discovery/scripts/classify.mjs             reports/investigations/function-discovery/scripts/cluster-roots.mjs             reports/investigations/function-discovery/scripts/elf-probe.mjs             reports/investigations/function-discovery/scripts/exec-region-and-plt-evidence.mjs             reports/investigations/function-discovery/scripts/first-divergence-probe.mjs; do
            run_one "node-check-$(basename "$f")" node --check "$f"
          done

          run_one py-compile python3 -m py_compile             reports/investigations/direct-recompilability/harness/probe-single-function.py             reports/investigations/direct-recompilability/harness/root-causes.py             reports/investigations/direct-recompilability/harness/run-baseline.py

          cat >/tmp/probe-full.json <<'JSON'
          {
            "schema": "synthetic/full/v1",
            "blobs": [
              {"caseId":"case/a","index":0,"pass":true,"firstError":null},
              {"caseId":"case/a","index":1,"pass":false,"firstError":{"line":1,"col":1,"message":"expected expression"},"sourceLine":"bad"},
              {"caseId":"case/a","index":2,"skipped":"global-deadline"},
              {"caseId":"case/a","index":3,"pass":null,"timedOut":true,"firstError":null}
            ]
          }
          JSON
          mkdir -p /tmp/probe-bench
          run_one probe-recompact python3             reports/investigations/direct-recompilability/harness/probe-single-function.py             --bench-dir /tmp/probe-bench --out /tmp/probe-compact.json             --from-full /tmp/probe-full.json
          python3 - <<'PY' >> review-fix-diag.txt
          import json
          r=json.load(open('/tmp/probe-compact.json'))
          assert r['schema'].endswith('/v2')
          assert r['blobCandidates']==4
          assert r['blobAttempted']==3
          assert r['blobCompleted']==2
          assert r['blobPass']==1
          assert r['blobFail']==1
          assert r['blobSkipped']==1
          assert r['blobTimedOut']==1
          print('probe-accounting PASS')
          PY

          python3 - <<'PY' >> review-fix-diag.txt
          import importlib.util
          p='reports/investigations/direct-recompilability/harness/run-baseline.py'
          spec=importlib.util.spec_from_file_location('rb',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          src,lm=m.reconstruct({'functions':[{'name':'a','pseudocode':'a\n'},{'name':'b','pseudocode':'b'}]})
          assert src=='a\n\nb\n', repr(src)
          assert [x['startLine'] for x in lm]==[1,3], lm
          src,lm=m.reconstruct({'functions':[{'name':'a','pseudocode':'a'},{'name':'b','pseudocode':'b\n'}]})
          assert src=='a\nb\n\n', repr(src)
          assert [x['startLine'] for x in lm]==[1,2], lm
          print('line-map PASS')
          PY

      - name: Upload concise result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr9203-review-fix-diag
          path: review-fix-diag.txt
          if-no-files-found: error
          retention-days: 2
