name: INKWAVE main-weapon numerical regressions
on:
  push:
    branches: [main]
    paths:
      - 'inkwave-public/src/core/**'
      - 'inkwave-public/src/game/**'
      - 'inkwave-public/src/net/**'
      - 'inkwave-public/src/world/paint.js'
      - 'inkwave-public/src/config.js'
      - 'inkwave-public/src/main.js'
      - 'patches/reliability/**'
      - 'patches/network-replication/**'
      - 'scripts/inkwave-source-composition.mjs'
      - 'scripts/build-inkwave.mjs'
      - 'tests/issue-queue/**'
      - 'patches/splatoon3/runtime/**'
      - 'patches/splatoon3/weapon-catalog-adapter.mjs'
      - 'patches/splatoon3/tests/main-weapon-catalog*.test.mjs'
      - 'patches/splatoon3/tests/catalog-*.test.mjs'
      - 'patches/splatoon3/tests/bloblobber-flat-45-audit.test.mjs'
      - 'patches/splatoon3/tests/splatana-lobe-hit-order.test.mjs'
      - 'patches/splatoon3/tests/source-fixture.mjs'
      - 'patches/splatoon3/tests/roller-holding-pivot.test.mjs'
      - 'scripts/check-inkwave-saber-origins-browser.mjs'
      - 'scripts/check-inkwave-added-family-paint-browser.mjs'
      - 'scripts/check-inkwave-new-families-browser.mjs'
      - 'scripts/check-inkwave-roller-scale-range.mjs'
      - 'scripts/lib/inkwave-roller-uuid-comparison.mjs'
      - 'scripts/lib/inkwave-roller-blob-provenance.mjs'
      - 'scripts/tests/inkwave-roller-blob-provenance.test.mjs'
      - 'scripts/tests/inkwave-roller-uuid-comparison.test.mjs'
      - 'patches/splatoon3/uuid-random-adapter.mjs'
      - 'scripts/lib/inkwave-range-menu-entry.mjs'
      - 'patches/local-quality/roller-motion.mjs'
      - '.github/workflows/inkwave-main-weapons.yml'
  pull_request:
    paths:
      - 'inkwave-public/src/core/**'
      - 'inkwave-public/src/game/**'
      - 'inkwave-public/src/net/**'
      - 'inkwave-public/src/world/paint.js'
      - 'inkwave-public/src/config.js'
      - 'inkwave-public/src/main.js'
      - 'patches/reliability/**'
      - 'patches/network-replication/**'
      - 'scripts/inkwave-source-composition.mjs'
      - 'scripts/build-inkwave.mjs'
      - 'tests/issue-queue/**'
      - 'patches/splatoon3/runtime/**'
      - 'patches/splatoon3/weapon-catalog-adapter.mjs'
      - 'patches/splatoon3/tests/main-weapon-catalog*.test.mjs'
      - 'patches/splatoon3/tests/catalog-*.test.mjs'
      - 'patches/splatoon3/tests/bloblobber-flat-45-audit.test.mjs'
      - 'patches/splatoon3/tests/splatana-lobe-hit-order.test.mjs'
      - 'patches/splatoon3/tests/source-fixture.mjs'
      - 'patches/splatoon3/tests/roller-holding-pivot.test.mjs'
      - 'scripts/check-inkwave-saber-origins-browser.mjs'
      - 'scripts/check-inkwave-added-family-paint-browser.mjs'
      - 'scripts/check-inkwave-new-families-browser.mjs'
      - 'scripts/check-inkwave-roller-scale-range.mjs'
      - 'scripts/lib/inkwave-roller-uuid-comparison.mjs'
      - 'scripts/lib/inkwave-roller-blob-provenance.mjs'
      - 'scripts/tests/inkwave-roller-blob-provenance.test.mjs'
      - 'scripts/tests/inkwave-roller-uuid-comparison.test.mjs'
      - 'patches/splatoon3/uuid-random-adapter.mjs'
      - 'scripts/lib/inkwave-range-menu-entry.mjs'
      - 'patches/local-quality/roller-motion.mjs'
      - '.github/workflows/inkwave-main-weapons.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inkwave-main-weapons-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  numerical-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify actual main-weapon input, resources, cadence and Roller fan
        run: |
          git rev-parse HEAD
          node --experimental-vm-modules --test patches/splatoon3/tests/main-weapon-catalog.test.mjs patches/splatoon3/tests/issue-771-roller-speed-swerve.test.mjs patches/splatoon3/tests/catalog-projectile-vfx-range.test.mjs patches/splatoon3/tests/bloblobber-flat-45-audit.test.mjs
      - name: Verify backward shot-release facing and source Hold gait
        run: node --experimental-vm-modules --test patches/splatoon3/tests/reverse-shot-release.test.mjs patches/splatoon3/tests/source-posture.test.mjs
      - name: Verify Roller swing and Curling bomb production paths
        run: node --experimental-vm-modules --test patches/splatoon3/tests/roller-flick-movement.test.mjs patches/splatoon3/tests/roller.test.mjs patches/splatoon3/tests/roller-holding-pivot.test.mjs patches/splatoon3/tests/bomb-kit-fidelity.test.mjs patches/splatoon3/tests/air-attack-acceleration.test.mjs patches/splatoon3/tests/catalog-rolling-form-reset.test.mjs
      - name: Verify Dynamo native contact at 30/60/120 Hz
        run: node --experimental-vm-modules --test patches/splatoon3/tests/dynamo-handle-center.test.mjs
      - name: Verify sourced Splatana origins and Slosher flight contact/cover
        run: node --experimental-vm-modules --test patches/splatoon3/tests/catalog-saber-origin.test.mjs patches/splatoon3/tests/catalog-slosher-flight-contact.test.mjs patches/splatoon3/tests/catalog-machine-occlusion.test.mjs patches/splatoon3/tests/catalog-splash-contact-distance.test.mjs patches/splatoon3/tests/splatana-lobe-hit-order.test.mjs
      - name: Verify Stringer, Splatana, Brella and added Dualies floor paint
        run: node --experimental-vm-modules --test patches/splatoon3/tests/catalog-added-family-paint.test.mjs patches/splatoon3/tests/catalog-paint-timing-boundaries.test.mjs
      - name: Verify 11.3.0 attack volumes, motion phases and remote state
        run: node --experimental-vm-modules --test --test-concurrency=2 patches/splatoon3/tests/catalog-dualies-phases-1130.test.mjs patches/splatoon3/tests/catalog-dualies-motion-1130.test.mjs patches/splatoon3/tests/catalog-brella-1130.test.mjs patches/splatoon3/tests/brella-physics.test.mjs patches/splatoon3/tests/catalog-hard-cancel.test.mjs patches/splatoon3/tests/catalog-saber-melee.test.mjs patches/splatoon3/tests/catalog-saber-step.test.mjs patches/splatoon3/tests/catalog-saber-motion.test.mjs patches/splatoon3/tests/catalog-saber-visual-wire.test.mjs patches/splatoon3/tests/stringer-source-1130.test.mjs patches/splatoon3/tests/stringer-tilt-motion.test.mjs patches/network-replication/tests/catalog-dualies-1130.test.mjs patches/network-replication/tests/brella-presentation.test.mjs
  browser-origins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Build production gameplay composition
        run: node scripts/build-inkwave.mjs inkwave-public work/site
      - name: Verify emitted Roller holding and physical grip
        run: INKWAVE_BUILT_SITE=work/site node --experimental-vm-modules --test patches/splatoon3/tests/roller-holding-pivot.test.mjs
      - name: Verify emitted source offsets, detached release clipping and lateral cover
        run: INKWAVE_BUILT_SITE=work/site node --experimental-vm-modules --test patches/splatoon3/tests/catalog-saber-origin.test.mjs patches/splatoon3/tests/catalog-slosher-flight-contact.test.mjs patches/splatoon3/tests/catalog-machine-occlusion.test.mjs patches/splatoon3/tests/splatana-lobe-hit-order.test.mjs
      - name: Verify emitted added-family floor paint and falling splashes
        run: INKWAVE_BUILT_SITE=work/site node --experimental-vm-modules --test patches/splatoon3/tests/catalog-added-family-paint.test.mjs patches/splatoon3/tests/catalog-paint-timing-boundaries.test.mjs
      - name: Verify emitted 11.3.0 attack volumes and charge stages
        run: INKWAVE_BUILT_SITE=work/site node --experimental-vm-modules --test --test-concurrency=2 patches/splatoon3/tests/catalog-dualies-phases-1130.test.mjs patches/splatoon3/tests/catalog-dualies-motion-1130.test.mjs patches/splatoon3/tests/catalog-brella-1130.test.mjs patches/splatoon3/tests/brella-physics.test.mjs patches/splatoon3/tests/catalog-hard-cancel.test.mjs patches/splatoon3/tests/catalog-saber-melee.test.mjs patches/splatoon3/tests/catalog-saber-step.test.mjs patches/splatoon3/tests/catalog-saber-motion.test.mjs patches/splatoon3/tests/catalog-saber-visual-wire.test.mjs patches/splatoon3/tests/stringer-source-1130.test.mjs patches/splatoon3/tests/stringer-tilt-motion.test.mjs patches/network-replication/tests/brella-presentation.test.mjs
      - name: Verify actual Character origins, optical aim and fire event positions
        run: node scripts/check-inkwave-saber-origins-browser.mjs work/site work/weapon-stage-gaps/browser-origins.json
      - name: Verify actual Character and floor physics at 30, 60 and 120 Hz
        run: node scripts/check-inkwave-added-family-paint-browser.mjs work/site work/weapon-stage-gaps/added-family-paint.json
      - name: Verify all sixteen new-family mains and twenty-five alternate kits
        run: node scripts/check-inkwave-new-families-browser.mjs work/site work/weapon-stage-gaps/new-families.json
      - name: Verify sustained sixteen-main throughput and retirement
        run: node scripts/check-inkwave-new-families-browser.mjs work/site work/weapon-stage-gaps/new-families-stress.json --stress-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inkwave-main-weapon-origins
          path: work/weapon-stage-gaps/
          if-no-files-found: ignore
  roller-grip-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRIP_SEED: '1715'
      GRIP_RNG_TRACE: '1'
      BASELINE_SHA: 83f27e5d59db944458a85122a95d1154e3543393
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select Roller and shared pose changes
        id: changes
        shell: bash
        run: |
          mkdir -p work/roller-grip-evidence
          run=true
          # Avoid two production builds for unrelated weapon/audio/network work.
          # Missing diff history is conservative: run, never silently skip evidence.
          if [[ "$EVENT_NAME" != workflow_dispatch && "$DIFF_BASE" =~ ^[0-9a-f]{40}$ && "$DIFF_BASE" != 0000000000000000000000000000000000000000 ]]; then
            if git fetch --no-tags --depth=1 origin "$DIFF_BASE" && git diff --name-only "$DIFF_BASE" HEAD > work/roller-grip-evidence/changed-paths.txt; then
              run=false
              while IFS= read -r file; do
                case "$file" in
                  .github/workflows/inkwave-main-weapons.yml|scripts/check-inkwave-roller-scale-range.mjs|scripts/lib/inkwave-roller-uuid-comparison.mjs|scripts/lib/inkwave-roller-blob-provenance.mjs|scripts/tests/inkwave-roller-blob-provenance.test.mjs|scripts/tests/inkwave-roller-uuid-comparison.test.mjs|patches/splatoon3/uuid-random-adapter.mjs|scripts/lib/inkwave-range-menu-entry.mjs|scripts/build-inkwave.mjs|scripts/inkwave-source-composition.mjs) run=true ;;
                  inkwave-public/src/core/*|inkwave-public/src/game/*|inkwave-public/src/world/paint.js|inkwave-public/src/config.js|inkwave-public/src/main.js) run=true ;;
                  patches/local-quality/roller-motion.mjs|patches/network-replication/roller-*|patches/splatoon3/weapon-catalog-adapter.mjs) run=true ;;
                  patches/splatoon3/runtime/roller*|patches/splatoon3/runtime/*motion*|patches/splatoon3/runtime/source-*|patches/splatoon3/runtime/weapon*|patches/splatoon3/runtime/main-*|patches/splatoon3/runtime/movement*|patches/splatoon3/runtime/body-*|patches/splatoon3/runtime/controller-*|patches/splatoon3/runtime/render.mjs|patches/splatoon3/runtime/install.mjs) run=true ;;
                esac
              done < work/roller-grip-evidence/changed-paths.txt
            fi
          fi
          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"
          printf 'Roller grip comparison selected: %s\n' "$run"
      - uses: actions/checkout@v4
        if: steps.changes.outputs.run == 'true'
        with:
          ref: 83f27e5d59db944458a85122a95d1154e3543393
          path: work/roller-grip-baseline
      - name: Record exact source and capture identities
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C work/roller-grip-baseline rev-parse HEAD)" = "$BASELINE_SHA"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const sha256 = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          fs.writeFileSync('work/roller-grip-evidence/checkouts.json', JSON.stringify({
            baseline: process.env.BASELINE_SHA, candidate: process.env.CANDIDATE_SHA,
            captureScript: sha256('scripts/check-inkwave-roller-scale-range.mjs'),
            entryHelper: sha256('scripts/lib/inkwave-range-menu-entry.mjs'),
            comparisonHelper: sha256('scripts/lib/inkwave-roller-uuid-comparison.mjs'),
            blobProvenanceHelper: sha256('scripts/lib/inkwave-roller-blob-provenance.mjs'),
            workflow: sha256('.github/workflows/inkwave-main-weapons.yml'),
          }, null, 2) + '\n');
          NODE
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 22
      - name: Install the existing production build and browser tools
        if: steps.changes.outputs.run == 'true'
        run: |
          npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
          npx playwright install --with-deps chromium
          browser_path=$(node -p "require('playwright').chromium.executablePath()")
          printf 'CHROMIUM_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
          echo "ESBUILD_MODULE=$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js" >> "$GITHUB_ENV"
      - name: Build the pinned baseline without runtime overlays
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          (cd work/roller-grip-baseline && node scripts/build-inkwave.mjs inkwave-public ../roller-grip-site-baseline) 2>&1 | tee work/roller-grip-evidence/before-build.log
          cp work/roller-grip-site-baseline/inkwave-build.json work/roller-grip-evidence/before-build.json
      - name: Build the exact candidate without runtime overlays
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          node scripts/build-inkwave.mjs inkwave-public work/roller-grip-site-candidate 2>&1 | tee work/roller-grip-evidence/after-build.log
          cp work/roller-grip-site-candidate/inkwave-build.json work/roller-grip-evidence/after-build.json
      - name: Compile the explicitly declared historical UUID-only comparison
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          # Raw83 source/build/manifests are never changed. This creates a separate
          # QA-only response overlay using the existing production source adapter.
          INKWAVE_ROLLER_BASELINE_SOURCE=work/roller-grip-baseline INKWAVE_ROLLER_BASELINE_SITE=work/roller-grip-site-baseline INKWAVE_ROLLER_WORKER_SITE=work/roller-grip-site-baseline node --test scripts/tests/inkwave-roller-uuid-comparison.test.mjs scripts/tests/inkwave-roller-blob-provenance.test.mjs
          node scripts/lib/inkwave-roller-uuid-comparison.mjs work/roller-grip-baseline work/roller-grip-site-baseline work/roller-grip-evidence/uuid-isolation > work/roller-grip-evidence/uuid-isolation-build.json
      - name: Capture baseline at the shipped 180-tick rolling state
        id: baseline_capture
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-inkwave-roller-scale-range.mjs work/roller-grip-site-baseline work/roller-grip-evidence/before --expected-drum-width 2.5712 --grip-seed "$GRIP_SEED" 2>&1 | tee work/roller-grip-evidence/before.log
          test -s work/roller-grip-evidence/before/grip-cameras.json
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(JSON.parse(fs.readFileSync('work/roller-grip-evidence/before/result.json')).passed, true);"
      # One extra capture, not a third build: prove seeded A/A repeatability first.
      - name: Repeat baseline for synthetic RNG and GPU A/A control
        id: aa_control
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-inkwave-roller-scale-range.mjs work/roller-grip-site-baseline work/roller-grip-evidence/before-control --expected-drum-width 2.5712 --grip-seed "$GRIP_SEED" --grip-camera-reference work/roller-grip-evidence/before/grip-cameras.json 2>&1 | tee work/roller-grip-evidence/before-control.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read = side => JSON.parse(fs.readFileSync(`work/roller-grip-evidence/${side}/result.json`, 'utf8'));
          const first = read('before'), repeat = read('before-control');
          for (const result of [first, repeat]) {
            assert.equal(result.passed, true);
            assert.equal(result.measurement.recipeRandom.mode, 'seeded-synchronous-180-tick');
            assert.equal(result.measurement.recipeRandom.seed, Number(process.env.GRIP_SEED));
            assert.equal(result.measurement.recipeRandom.restored, true);
          }
          assert.deepEqual(first.measurement.initialState.character, repeat.measurement.initialState.character, 'A/A initial Character state differs');
          assert.equal(first.build, repeat.build, 'A/A must use the exact same built baseline');
          for (const key of ['gpuFootprint', 'recipeRandom', 'cameraPlan', 'gripViews', 'start', 'end'])
            assert.deepEqual(first.measurement[key], repeat.measurement[key], `Unchanged baseline A/A differs: ${key}`);
          console.log('Synthetic RNG baseline A/A control passed; candidate comparison may proceed.');
          NODE
      - name: Capture declared UUID-isolated baseline without changing raw evidence
        id: isolated_control
        if: steps.changes.outputs.run == 'true' && steps.aa_control.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          for side in before-isolated before-isolated-control; do
            node scripts/check-inkwave-roller-scale-range.mjs work/roller-grip-site-baseline work/roller-grip-evidence/$side --expected-drum-width 2.5712 --grip-seed "$GRIP_SEED" --grip-camera-reference work/roller-grip-evidence/before/grip-cameras.json --historical-uuid-isolation work/roller-grip-evidence/uuid-isolation 2>&1 | tee work/roller-grip-evidence/$side.log
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const read = side => JSON.parse(fs.readFileSync(`work/roller-grip-evidence/${side}/result.json`));
          const first = read('before-isolated'), repeat = read('before-isolated-control');
          for (const r of [first, repeat]) { assert.equal(r.passed, true); assert.equal(r.comparisonIsolation.kind, 'historical-three-uuid-isolation-only'); }
          for (const key of ['gpuFootprint', 'recipeRandom', 'recipeRandomTrace', 'contactStamps', 'cameraPlan', 'gripViews', 'start', 'end'])
            assert.deepEqual(first.measurement[key], repeat.measurement[key], `Controlled baseline A/A differs: ${key}`);
          assert.deepEqual(first.runtimeIdentity, repeat.runtimeIdentity);
          NODE
      # Failed A/A still yields diagnostic candidate pixels, never a passing pair.
      # The failed control step remains failed; cancellation is never bypassed.
      - name: Capture candidate with the baseline cameras unchanged
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' && steps.baseline_capture.outcome == 'success' }}
        env:
          GRIP_DIAGNOSTIC_ONLY: ${{ steps.aa_control.outcome == 'success' && steps.isolated_control.outcome == 'success' && '0' || '1' }}
        shell: bash
        run: |
          set -o pipefail
          test -s work/roller-grip-evidence/before/grip-cameras.json
          node scripts/check-inkwave-roller-scale-range.mjs work/roller-grip-site-candidate work/roller-grip-evidence/after --grip-seed "$GRIP_SEED" --grip-camera-reference work/roller-grip-evidence/before/grip-cameras.json 2>&1 | tee work/roller-grip-evidence/after.log
      - name: Repeat candidate for resized-model GPU A/A control
        if: steps.changes.outputs.run == 'true' && steps.aa_control.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-inkwave-roller-scale-range.mjs work/roller-grip-site-candidate work/roller-grip-evidence/after-control --grip-seed "$GRIP_SEED" --grip-camera-reference work/roller-grip-evidence/before/grip-cameras.json 2>&1 | tee work/roller-grip-evidence/after-control.log
      - name: Verify complete and comparable grip evidence
        if: steps.changes.outputs.run == 'true' && steps.aa_control.outcome == 'success'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { hashBytes, loadUuidComparison, verifyLoadedModules } from './scripts/lib/inkwave-roller-uuid-comparison.mjs';
          const root = 'work/roller-grip-evidence';
          const read = file => JSON.parse(fs.readFileSync(`${root}/${file}`, 'utf8'));
          const sha = value => assert.match(value, /^[0-9a-f]{64}$/);
          const ids = read('checkouts.json');
          assert.equal(ids.baseline, process.env.BASELINE_SHA);
          assert.equal(ids.candidate, process.env.CANDIDATE_SHA);
          for (const [key, file] of [['captureScript','scripts/check-inkwave-roller-scale-range.mjs'], ['entryHelper','scripts/lib/inkwave-range-menu-entry.mjs'], ['comparisonHelper','scripts/lib/inkwave-roller-uuid-comparison.mjs'], ['blobProvenanceHelper','scripts/lib/inkwave-roller-blob-provenance.mjs'], ['workflow','.github/workflows/inkwave-main-weapons.yml']]) { sha(ids[key]); assert.equal(ids[key], hashBytes(fs.readFileSync(file))); }
          const isolation = loadUuidComparison(`${root}/uuid-isolation`, 'work/roller-grip-site-baseline').declaration;
          assert.equal(isolation.sourceManifestSha256, hashBytes(fs.readFileSync(`${root}/before-build.json`)), 'Historical manifest receipt changed');
          const names = ['rear', 'side', 'front-oblique', 'right-side', 'right-rear'];
          const allSides = ['before', 'before-control', 'before-isolated', 'before-isolated-control', 'after', 'after-control'].map((side, index) => {
            const result = read(`${side}/result.json`), build = read(`${index < 4 ? 'before' : 'after'}-build.json`);
            const cameras = read(`${side}/grip-cameras.json`), m = result.measurement;
            const steady = read(`${side}/steady-result.json`);
            assert.equal(steady.passed, true); assert.equal(steady.build, result.build);
            assert.deepEqual(steady.measurement, m, 'Release capture changed steady measurement');
            assert.equal(result.passed, true, `${side} capture failed`);
            const expectedWidth = index < 4 ? 2.5712 : 2.5712 * (1.36 / 1.72259927);
            assert.equal(result.expectedDrumWidth, expectedWidth);
            assert.ok(Math.abs(m.drumWidth - expectedWidth) < 1e-4, `${side} model width differs`);
            assert.equal(result.diagnosticOnly, false, 'Diagnostic capture cannot pass paired acceptance');
            assert.deepEqual(result.errors, []);
            sha(build.contentHash); sha(build.inputHash);
