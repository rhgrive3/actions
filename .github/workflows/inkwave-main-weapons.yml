name: INKWAVE main-weapon numerical regressions
on:
  pull_request:
    paths:
      - 'patches/splatoon3/runtime/**'
      - 'patches/splatoon3/tests/main-weapon-catalog*.test.mjs'
      - 'patches/splatoon3/tests/source-fixture.mjs'
      - 'scripts/measure-inkwave-floor-actions.mjs'
      - 'scripts/measure-inkwave-single-shot.mjs'
      - '.github/workflows/inkwave-main-weapons.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inkwave-main-weapons-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  numerical-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify actual main-weapon input, resources, cadence and Roller fan
        run: |
          git rev-parse HEAD
          node --experimental-vm-modules --test patches/splatoon3/tests/main-weapon-catalog.test.mjs patches/splatoon3/tests/issue-771-roller-speed-swerve.test.mjs
      - name: Audit 65 source-composed main-weapon floor paint
        env:
          INKWAVE_PAINT_AUDIT_OUT: paint-action-audit.json
        run: node --experimental-vm-modules scripts/measure-inkwave-floor-actions.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inkwave-65-weapon-floor-coverage
          path: paint-action-audit.json
          retention-days: 14
          if-no-files-found: warn
      - name: Measure direct and detached single-shot paint for seven legacy main families
        env:
          INKWAVE_SINGLE_SHOT_OUT: single-shot-paint-audit.json
        run: node --experimental-vm-modules scripts/measure-inkwave-single-shot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inkwave-legacy-single-shot-floor
          path: single-shot-paint-audit.json
          retention-days: 14
          if-no-files-found: warn
