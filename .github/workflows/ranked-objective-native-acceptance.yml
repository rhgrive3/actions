name: Review ranked objective native models
on:
  push:
    branches: [review/ranked-objective-native-20261016]
permissions:
  contents: read
jobs:
  acceptance:
    if: github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/review/ranked-objective-native-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: diagnostic
      - uses: actions/checkout@v4
        with:
          ref: 6c212c39978c51bc21e90ae0e9e7628b74627298
          persist-credentials: false
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pinned tools once
        working-directory: diagnostic
        run: |
          npm install --no-save --no-package-lock --silent esbuild@0.28.2 playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Exact source and diagnostic preflight
        run: |
          mkdir -p evidence
          node diagnostic/preflight.mjs
          node --test diagnostic/rainmaker-capture-contract.test.mjs diagnostic/rainmaker-cleanup.test.mjs diagnostic/clam-capture-contract.test.mjs diagnostic/carrier-contract.test.mjs diagnostic/build-binding.test.mjs diagnostic/preflight.test.mjs diagnostic/wiring.test.mjs diagnostic/compact-receipt.test.mjs diagnostic/capture-gpu-lifecycle.test.mjs diagnostic/capture-resources.test.mjs diagnostic/test-count.test.mjs
      - name: Objective source contracts and actual Actor
        working-directory: candidate
        run: |
          timeout --signal=TERM --kill-after=10s 300s node --max-old-space-size=512 --experimental-vm-modules --test --test-concurrency=1 --test-reporter=tap patches/splatoon3/tests/ranked-power-clam-model.test.mjs patches/splatoon3/tests/ranked-small-clam-model.test.mjs patches/splatoon3/tests/ranked-clam-model-lifecycle.test.mjs patches/splatoon3/tests/rainmaker-model.test.mjs patches/splatoon3/tests/rainmaker-model-actor.test.mjs patches/splatoon3/tests/ranked-world.test.mjs ../diagnostic/module-parity.test.mjs > ../evidence/source.tap
          node ../diagnostic/test-count.mjs ../evidence/source.tap 33
      - name: One production build
        id: build
        run: |
          export ESBUILD_MODULE="$PWD/diagnostic/node_modules/esbuild/lib/main.js"
          (cd candidate && node scripts/build-inkwave.mjs inkwave-public ../candidate-site)
          cp candidate-site/inkwave-build.json evidence/candidate-build.json
      - name: Actual emitted Actor acceptance
        id: emitted
        if: ${{ always() && steps.build.outcome == 'success' }}
        working-directory: candidate
        run: |
          INKWAVE_BUILT_SITE="$PWD/../candidate-site" timeout --signal=TERM --kill-after=10s 300s node --max-old-space-size=512 --experimental-vm-modules --test --test-concurrency=1 --test-reporter=tap patches/splatoon3/tests/rainmaker-model-actor.test.mjs ../diagnostic/module-parity.test.mjs > ../evidence/emitted.tap
          node ../diagnostic/test-count.mjs ../evidence/emitted.tap 6
      - name: Three objectives native-day images
        if: ${{ always() && steps.build.outcome == 'success' && steps.emitted.outcome == 'success' }}
        run: timeout --signal=TERM --kill-after=10s 600s node diagnostic/capture-objectives-integration.mjs --plan diagnostic/acceptance-plan.json --source candidate --site candidate-site --out evidence/images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranked-objective-native-models
          path: evidence
          if-no-files-found: error
