name: INKWAVE additional distinct frontend states
on:
  pull_request:
    paths:
      - 'tools/frontend-extra-states/**'
      - '.github/workflows/inkwave-frontend-extra-states.yml'
permissions:
  contents: read
concurrency:
  group: frontend-extra-states-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  capture:
    if: ${{ github.repository == 'rhgrive3/actions' && github.head_ref == 'qa/frontend-extra-states-20261030' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: phone-portrait, batch: editor }
          - { device: phone-portrait, batch: variants }
          - { device: phone-landscape, batch: editor }
          - { device: phone-landscape, batch: variants }
          - { device: phone-landscape, batch: battle }
          - { device: ipad-mini-portrait, batch: editor }
          - { device: ipad-mini-portrait, batch: variants }
          - { device: ipad-mini-landscape, batch: editor }
          - { device: ipad-mini-landscape, batch: variants }
          - { device: ipad-mini-landscape, batch: battle }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: qa
          persist-credentials: false
          sparse-checkout: tools/frontend-extra-states
      - uses: actions/checkout@v4
        with:
          ref: 379533f541d86346a068e397f879cb6c13590ffd
          path: product
          persist-credentials: false
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact inputs and build original production
        working-directory: product
        env:
          QA_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = 379533f541d86346a068e397f879cb6c13590ffd
          test "$(git -C ../qa rev-parse HEAD)" = "$QA_SHA"
          npm ci --no-audit --no-fund
          node scripts/build-inkwave.mjs inkwave-public _site
          npx --no-install playwright install --with-deps chromium
      - name: Capture only editor and offline-only missing states with bounded original JPEG logs
        env:
          QA_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          node qa/tools/frontend-extra-states/run.mjs "$GITHUB_WORKSPACE/product" "$GITHUB_WORKSPACE/product/_site" "$GITHUB_WORKSPACE/evidence/${{ matrix.device }}-${{ matrix.batch }}" '${{ matrix.device }}' '${{ matrix.batch }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-extra-states-${{ matrix.device }}-${{ matrix.batch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/${{ matrix.device }}-${{ matrix.batch }}/
          if-no-files-found: error
          retention-days: 14
