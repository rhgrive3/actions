name: INKWAVE Pages snapshot publish
on:
  push:
    branches: [deploy/inkwave-pages-main-fecc40a9-20261029]
    paths: ['.github/workflows/inkwave-pages-snapshot-20261029.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-inkwave-snapshot-20261029
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'rhgrive3/actions'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: inkwave-pages-snapshot-20261029
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 6
          filter: blob:none
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify main snapshot and build
        shell: bash
        run: |
          set -euo pipefail
          source_sha=eedfc857cfc0b3369d868ef336920c83033685ed
          git merge-base --is-ancestor "$source_sha" HEAD
          test "$(git diff --name-only "$source_sha" HEAD)" = ".github/workflows/inkwave-pages-snapshot-20261029.yml"
          test "$(git ls-remote https://github.com/rhgrive3/actions.git refs/heads/main | cut -f1)" = "$source_sha"
          npm ci --no-audit --no-fund
          node --test scripts/tests/inkwave-pages-source-identity.test.mjs scripts/tests/inkwave-ranked-pages-sequencing.test.mjs
          node scripts/check-inkwave-patches.mjs --quick
          node scripts/build-inkwave.mjs inkwave-public _site
          node scripts/check-inkwave-startup-budget.mjs _site
          printf '%s\n' "$source_sha" > _site/inkwave-deployed-sha.txt
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public version
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            published="$(curl -fsSL --max-time 8 "https://rhgrive3.github.io/actions/inkwave-deployed-sha.txt?nocache=$GITHUB_RUN_ID-$attempt" || true)"
            if [ "$published" = "eedfc857cfc0b3369d868ef336920c83033685ed" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Pages marker did not match published source" >&2
          exit 1
