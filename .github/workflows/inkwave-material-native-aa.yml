name: INKWAVE common-source material A/A preflight
on:
  pull_request:
    branches: ['main']
    paths:
      - 'tools/material-native-aa/**'
      - '.github/workflows/inkwave-material-native-aa.yml'
permissions:
  contents: read
jobs:
  bounded-native-aa:
    if: github.head_ref == 'diagnostic/ink-material-native-aa-20261022' || github.head_ref == 'diagnostic/ink-material-native-aa-phase-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c0938a3f84768474df91713f7b372f9d7f8fe96a
          path: work/material-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.28.2 playwright@1.51.1
      - name: Verify immutable source, unchanged canonical QA, and small gate tests
        env:
          QA_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$QA_HEAD"
          test "$(git -C work/material-source rev-parse HEAD)" = 'c0938a3f84768474df91713f7b372f9d7f8fe96a'
          test "$(git -C work/material-source rev-parse 'HEAD^{tree}')" = '97b9938391f156dc332f6a56ac6fe3d21d9f9dc7'
          test "$(sha256sum scripts/check-inkwave-material-native-paired.mjs | cut -d' ' -f1)" = '723b9df56eeb2ec0b37572d1466e7cca2754a36032d5b79a35330aeb9cc8c603'
          test "$(sha256sum scripts/check-inkwave-material-native-frame.mjs | cut -d' ' -f1)" = '74abb8bbebbff8ef1641ee693d4819e4646fabf87af6b69dfd31b194b699d752'
          INKWAVE_MATERIAL_COMMON_SOURCE="$PWD/work/material-source" node --experimental-vm-modules --test scripts/tests/material-native-common/*.test.mjs tools/material-native-aa/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Build the immutable common runtime once, without the whole-game test suite
        run: |
          export ESBUILD_MODULE="$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js"
          (cd work/material-source && node scripts/build-inkwave.mjs inkwave-public ../material-site)
      - name: Verify actual emitted Three UUID isolation before any browser
        run: |
          export ESBUILD_MODULE="$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js"
          export INKWAVE_BUILT_SITE="$GITHUB_WORKSPACE/work/material-site"
          (cd work/material-source && node --test scripts/tests/inkwave-three-composition.test.mjs)
      - name: Prove current production B bytes and bind controlled inverse A only
        run: node scripts/prepare-inkwave-material-common.mjs work/material-source work/material-site work/material-overlay
      - name: Capture independent A1/A2 only with all strict entry, history and pixel gates
        run: node tools/material-native-aa/run.mjs work/material-site work/material-source work/material-overlay/inkShading.js work/material-aa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ink-material-common-aa-preflight
          path: |
            work/material-aa/
            work/material-overlay/receipt.json
            work/material-site/inkwave-build.json
          if-no-files-found: error
