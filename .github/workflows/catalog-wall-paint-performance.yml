name: Catalog wall paint performance (diagnostic only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/catalog-wall-paint-performance.yml
      - scripts/measure-catalog-wall-workload.mjs
      - scripts/fixtures/catalog-wall-workload.mjs
      - scripts/tests/catalog-wall-performance-contract.test.mjs
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Immutable main/cache baseline commit
        required: true
        type: string
        default: 31703a906b4f19fd5f46dea08d06615113008492
      candidate_sha:
        description: Immutable cache candidate commit
        required: true
        type: string
      wall_baseline_sha:
        description: Immutable wall-drop baseline commit
        required: true
        type: string
        default: 45c73a490234cd0c593441046535c37bf2bf3355
      wall_candidate_sha:
        description: Immutable wall-drop plus cache candidate
        required: true
        type: string
        default: 834ed1e27f37491b2cfbadf69e873e395aa65fc6
permissions:
  contents: read
jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'ci/wall-paint-performance-probe' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASELINE_SHA: ${{ inputs.baseline_sha || '31703a906b4f19fd5f46dea08d06615113008492' }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha || 'e929eb71d4321a14e2bd599ffb4407a9da01e68b' }}
      WALL_BASELINE_SHA: ${{ inputs.wall_baseline_sha || '45c73a490234cd0c593441046535c37bf2bf3355' }}
      WALL_CANDIDATE_SHA: ${{ inputs.wall_candidate_sha || '834ed1e27f37491b2cfbadf69e873e395aa65fc6' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable inputs
        run: |
          node --input-type=module - <<'JS'
          for (const key of ['BASELINE_SHA','CANDIDATE_SHA','WALL_BASELINE_SHA','WALL_CANDIDATE_SHA']) if (!/^[a-f0-9]{40}$/.test(process.env[key]||'')) throw Error('Full SHA required: '+key);
          if (process.env.WALL_BASELINE_SHA===process.env.WALL_CANDIDATE_SHA) throw Error('Wall revisions must differ');
          if (process.env.BASELINE_SHA===process.env.CANDIDATE_SHA) throw Error('Baseline and candidate must differ');
          JS
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_sha || '31703a906b4f19fd5f46dea08d06615113008492' }}
          path: .wall-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || 'e929eb71d4321a14e2bd599ffb4407a9da01e68b' }}
          path: .wall-candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.wall_baseline_sha || '45c73a490234cd0c593441046535c37bf2bf3355' }}
          path: .wall-extra-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.wall_candidate_sha || '834ed1e27f37491b2cfbadf69e873e395aa65fc6' }}
          path: .wall-extra-candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned official build and browser tools
        run: |
          npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Build both immutable production artifacts
        run: |
          test "$(git -C .wall-baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C .wall-candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          export ESBUILD_MODULE="$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js"
          node .wall-baseline/scripts/build-inkwave.mjs .wall-baseline/inkwave-public .wall-before-site
          node .wall-candidate/scripts/build-inkwave.mjs .wall-candidate/inkwave-public .wall-after-site
          test "$(git -C .wall-extra-baseline rev-parse HEAD)" = "$WALL_BASELINE_SHA"
          test "$(git -C .wall-extra-candidate rev-parse HEAD)" = "$WALL_CANDIDATE_SHA"
          node .wall-extra-baseline/scripts/build-inkwave.mjs .wall-extra-baseline/inkwave-public .wall-extra-before-site
          node .wall-extra-candidate/scripts/build-inkwave.mjs .wall-extra-candidate/inkwave-public .wall-extra-after-site
          mkdir -p .wall-performance-evidence/main-cache .wall-performance-evidence/wall-cache
          cp .wall-before-site/inkwave-build.json .wall-performance-evidence/main-cache/baseline-manifest.json
          cp .wall-after-site/inkwave-build.json .wall-performance-evidence/main-cache/candidate-manifest.json
          cp .wall-extra-before-site/inkwave-build.json .wall-performance-evidence/wall-cache/baseline-manifest.json
          cp .wall-extra-after-site/inkwave-build.json .wall-performance-evidence/wall-cache/candidate-manifest.json
          git rev-parse HEAD > .wall-performance-evidence/probe-sha.txt
      - name: Repeated native wall-paint A/B and B/A measurements
        run: |
          node scripts/measure-catalog-wall-workload.mjs \
            --baseline-sha "$BASELINE_SHA" --candidate-sha "$CANDIDATE_SHA" \
            --baseline-root .wall-baseline --candidate-root .wall-candidate \
            --baseline-site .wall-before-site --candidate-site .wall-after-site \
            --playwright "$GITHUB_WORKSPACE/node_modules/playwright/index.mjs" \
            --require-equivalent-work --evidence-dir .wall-performance-evidence/main-cache
      - name: Repeated wall-drop plus cache A/B measurements
        run: |
          node scripts/measure-catalog-wall-workload.mjs \
            --baseline-sha "$WALL_BASELINE_SHA" --candidate-sha "$WALL_CANDIDATE_SHA" \
            --baseline-root .wall-extra-baseline --candidate-root .wall-extra-candidate \
            --baseline-site .wall-extra-before-site --candidate-site .wall-extra-after-site \
            --playwright "$GITHUB_WORKSPACE/node_modules/playwright/index.mjs" \
            --require-equivalent-work --evidence-dir .wall-performance-evidence/wall-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-wall-paint-performance-${{ inputs.candidate_sha || 'e929eb71d4321a14e2bd599ffb4407a9da01e68b' }}
          path: .wall-performance-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
