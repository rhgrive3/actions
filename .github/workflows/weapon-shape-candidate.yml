name: Render reviewed weapon batch candidate
on:
  push:
    branches: [review/weapon-batch-candidate-20261014]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact model source
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          npm install --no-save --no-package-lock --silent esbuild@0.28.2 playwright@1.62.1
          node scripts/build-inkwave.mjs inkwave-public _site
      # Runtime/presentation regressions are independent of screenshot review.
      # Source: 4 Hornz + 4 catalog tests. Emitted: Hornz helper-injection tests
      # explicitly skip (3), real production Hornz (1) and catalog (4) must pass.
      - name: Gate source firing and ink-surface motion (8 pass, 0 skip)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p variant-test-results
          env -u INKWAVE_BUILT_SITE node --experimental-vm-modules --test --test-reporter=tap patches/splatoon3/tests/hornz-ink-surface-motion.test.mjs patches/splatoon3/tests/catalog-slosher-presentation.test.mjs | tee variant-test-results/source.tap
          grep -qx '# tests 8' variant-test-results/source.tap
          grep -qx '# pass 8' variant-test-results/source.tap
          grep -qx '# fail 0' variant-test-results/source.tap
          grep -qx '# skipped 0' variant-test-results/source.tap
      - name: Gate emitted firing and ink-surface motion (5 pass, 3 source-only skips)
        shell: bash
        env:
          INKWAVE_BUILT_SITE: _site
        run: |
          set -euo pipefail
          node --experimental-vm-modules --test --test-reporter=tap patches/splatoon3/tests/hornz-ink-surface-motion.test.mjs patches/splatoon3/tests/catalog-slosher-presentation.test.mjs | tee variant-test-results/emitted.tap
          grep -qx '# tests 8' variant-test-results/emitted.tap
          grep -qx '# pass 5' variant-test-results/emitted.tap
          grep -qx '# fail 0' variant-test-results/emitted.tap
          grep -qx '# skipped 3' variant-test-results/emitted.tap
      - name: Gate selected Squiffer v4 source and emitted registry invariants
        shell: bash
        run: |
          set -euo pipefail
          env -u INKWAVE_BUILT_SITE node --experimental-vm-modules --test --test-reporter=tap patches/splatoon3/tests/weapon-variant-new-squiffer-v4.test.mjs | tee variant-test-results/squiffer-v4-source.tap
          INKWAVE_BUILT_SITE=_site node --experimental-vm-modules --test --test-reporter=tap patches/splatoon3/tests/weapon-variant-new-squiffer-v4.test.mjs | tee variant-test-results/squiffer-v4-emitted.tap
          for file in variant-test-results/squiffer-v4-source.tap variant-test-results/squiffer-v4-emitted.tap; do
            grep -qx '# tests 8' "$file"
            grep -qx '# pass 8' "$file"
            grep -qx '# fail 0' "$file"
            grep -qx '# skipped 0' "$file"
          done
      - name: Gate Bulbz source and emitted registry geometry
        shell: bash
        run: |
          set -euo pipefail
          env -u INKWAVE_BUILT_SITE node --experimental-vm-modules --test --test-reporter=tap patches/splatoon3/tests/weapon-variant-bulbz.test.mjs | tee variant-test-results/bulbz-source.tap
          INKWAVE_BUILT_SITE=_site node --experimental-vm-modules --test --test-reporter=tap patches/splatoon3/tests/weapon-variant-bulbz.test.mjs | tee variant-test-results/bulbz-emitted.tap
          for file in variant-test-results/bulbz-source.tap variant-test-results/bulbz-emitted.tap; do
            grep -qx '# tests 6' "$file"
            grep -qx '# pass 6' "$file"
            grep -qx '# fail 0' "$file"
            grep -qx '# skipped 0' "$file"
          done
      - name: Gate NOC-T source and emitted registry invariants
        shell: bash
        run: |
          set -euo pipefail
          env -u INKWAVE_BUILT_SITE node --experimental-vm-modules --test --test-reporter=tap patches/splatoon3/tests/weapon-variant-dapple-noct.test.mjs | tee variant-test-results/noct-source.tap
          INKWAVE_BUILT_SITE=_site node --experimental-vm-modules --test --test-reporter=tap patches/splatoon3/tests/weapon-variant-dapple-noct.test.mjs | tee variant-test-results/noct-emitted.tap
          for file in variant-test-results/noct-source.tap variant-test-results/noct-emitted.tap; do
            grep -qx '# tests 9' "$file"
            grep -qx '# pass 9' "$file"
            grep -qx '# fail 0' "$file"
            grep -qx '# skipped 0' "$file"
          done
      - name: Gate Hornz stripe source and emitted containment (1 pass each, 0 skip)
        shell: bash
        run: |
          set -euo pipefail
          env -u INKWAVE_BUILT_SITE node --experimental-vm-modules --test --test-reporter=tap patches/splatoon3/tests/hornz-stripe-containment.test.mjs | tee variant-test-results/stripe-source.tap
          INKWAVE_BUILT_SITE=_site node --experimental-vm-modules --test --test-reporter=tap patches/splatoon3/tests/hornz-stripe-containment.test.mjs | tee variant-test-results/stripe-emitted.tap
          for file in variant-test-results/stripe-source.tap variant-test-results/stripe-emitted.tap; do
            grep -qx '# tests 1' "$file"
            grep -qx '# pass 1' "$file"
            grep -qx '# fail 0' "$file"
            grep -qx '# skipped 0' "$file"
          done
      - name: Gate Tentatek family source and emitted registry invariants (9 pass each, 0 skip)
        shell: bash
        run: |
          set -euo pipefail
          env -u INKWAVE_BUILT_SITE node --experimental-vm-modules --test --test-reporter=tap patches/splatoon3/tests/shooter-blaster-variants.test.mjs | tee variant-test-results/tentatek-source.tap
          INKWAVE_BUILT_SITE=_site node --experimental-vm-modules --test --test-reporter=tap patches/splatoon3/tests/shooter-blaster-variants.test.mjs | tee variant-test-results/tentatek-emitted.tap
          for file in variant-test-results/tentatek-source.tap variant-test-results/tentatek-emitted.tap; do
            grep -qx '# tests 9' "$file"
            grep -qx '# pass 9' "$file"
            grep -qx '# fail 0' "$file"
            grep -qx '# skipped 0' "$file"
          done
      - name: Install capture browser after runtime gates pass
        run: npx playwright install --with-deps chromium
      - name: Capture actual emitted weapon meshes
        run: node scripts/capture-weapon-batch-candidate.mjs --site _site --out variant-gallery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weapon-shape-candidate-${{ github.sha }}
          path: variant-gallery
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weapon-shape-test-results-${{ github.sha }}
          path: variant-test-results
          if-no-files-found: warn
          retention-days: 7
