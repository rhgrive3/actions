name: Nautilus finish and inner-coil reference diagnosis
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/nautilus-finish-environment.yml
      - reports/weapon-model-rebuild-20261012/diagnostics/nautilus-finish-environment.mjs
      - reports/weapon-model-rebuild-20261012/diagnostics/nautilus-inner-coil-candidate.mjs
      - reports/weapon-model-rebuild-20261012/diagnostics/nautilus-neck-cap-environment.mjs
      - reports/weapon-model-rebuild-20261012/diagnostics/nautilus-neck-cap-candidate.mjs
      - reports/weapon-model-rebuild-20261012/diagnostics/nautilus-inner-coil-cap-baseline.mjs
      - reports/weapon-model-rebuild-20261012/diagnostics/nautilus-neck-cap-refined-candidate.mjs
      - reports/weapon-model-rebuild-20261012/diagnostics/nautilus-neck-cap-orange-baseline.mjs
      - reports/weapon-model-rebuild-20261012/diagnostics/nautilus-neck-cap-refined-environment.mjs
permissions:
  contents: read
jobs:
  finish-environment:
    if: github.head_ref == 'test/nautilus-finish-environment'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f2a87e9e56387ada0487205c195eeee4e73baa6f
          path: .finish-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Build the fixed model head
        run: |
          test "$(git -C .finish-source rev-parse HEAD)" = f2a87e9e56387ada0487205c195eeee4e73baa6f
          export ESBUILD_MODULE="$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js"
          node .finish-source/scripts/build-inkwave.mjs .finish-source/inkwave-public .finish-site
      - name: Compare47 silver dial size with fixed718b placement
        run: node reports/weapon-model-rebuild-20261012/diagnostics/nautilus-neck-cap-refined-environment.mjs --site .finish-site --source .finish-source --out .finish-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nautilus-inner-coil-and-finish-${{ github.run_attempt }}
          path: .finish-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
