name: Native source offline CacheStorage acceptance
on:
  push:
    branches: [review/native-combined-cache-20261015]
permissions:
  contents: read
concurrency:
  group: native-offline-cache-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cache:
    if: github.repository == 'rhgrive3/actions' && github.ref == 'refs/heads/review/native-combined-cache-20261015'
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CACHE_ENGINE: ${{ matrix.engine }}
      CACHE_SOURCE_SHA256: 8561727ceee23794958ca74e6861b5215de7651ac22594d688f6a1f6ee978bfc
      WORKER_SOURCE_SHA256: 935773e09665146ec564d3fe280884c713f86e10582053df7d9cb8d65267a679
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Verify frozen files and source head
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('scripts/native-offline-cache');m=json.loads((p/'publication.json').read_text())
          actual={x.name for x in p.iterdir() if x.is_file() and x.name!='publication.json'}
          assert actual|{'native-offline-cache.yml'}==set(m['files'])
          for name,pin in m['files'].items():
              f=pathlib.Path('.github/workflows/native-offline-cache.yml') if name=='native-offline-cache.yml' else p/name
              b=f.read_bytes();assert len(b)==pin['bytes'] and hashlib.sha256(b).hexdigest()==pin['sha256'],name
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==m['candidateHead']
          for name,source in [('source-cache-candidate.mjs','source-cache.mjs'),('source-worker-candidate.mjs','source-worker.mjs')]:
              b=subprocess.check_output(['git','show',m['candidateHead']+':patches/native-stages/runtime/'+source])
              assert b==(p/name).read_bytes()
          PY
      - name: Install pinned browser
        working-directory: scripts/native-offline-cache
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run three bounded CacheStorage cases
        run: |
          export PACKAGE="$GITHUB_WORKSPACE/scripts/native-offline-cache"
          export IDB_EVIDENCE="$GITHUB_WORKSPACE/evidence"
          python "$PACKAGE/supervise.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-offline-cache-${{ matrix.engine }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            evidence/*.json
            evidence/*.log
