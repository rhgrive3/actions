name: Export INKWAVE special source fixture
on:
  push:
    branches: [research/specials-test-snapshot-20261014]
    paths: ['.github/workflows/export-specials-fixture.yml']
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            inkwave-public
            patches
            scripts
            reports/ink-volume/source
      - name: Reproducible source fixture without dependencies
        run: |
          set -euo pipefail
          tar czf /tmp/inkwave-special-fixture.tar.gz inkwave-public patches scripts reports/ink-volume/source
          sha256sum /tmp/inkwave-special-fixture.tar.gz
          ls -lh /tmp/inkwave-special-fixture.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: inkwave-special-source-snapshot
          path: /tmp/inkwave-special-fixture.tar.gz
          retention-days: 7
          if-no-files-found: error
