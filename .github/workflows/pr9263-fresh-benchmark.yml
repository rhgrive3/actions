name: PR 9263 fresh decompile benchmark

on:
  push:
    paths:
      - ".github/workflows/pr9263-fresh-benchmark.yml"

permissions:
  contents: write

concurrency:
  group: pr9263-fresh-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout benchmark orchestrator
        uses: actions/checkout@v4

      - name: Checkout exact PR 9263 HEAD
        uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: f25a404830c57d71ba689034a357362ce65837db
          path: target
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "f25a404830c57d71ba689034a357362ce65837db"
          test "$(node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('target/benchmarks/public/codefuse-arm64/manifest.json','utf8')); process.stdout.write(String(m.cases.length));")" = "160"
          node --version
          nproc
          free -h

      - name: Run 8-way fresh benchmark
        continue-on-error: true
        env:
          TARGET_DIR: ${{ github.workspace }}/target
          OUTPUT_FILE: ${{ github.workspace }}/final/result.json
          CASE_DIR: ${{ github.workspace }}/case-results
          TARGET_SHA: f25a404830c57d71ba689034a357362ce65837db
          WORKERS: "8"
          CASE_TIMEOUT_MS: "120000"
          SOFT_DEADLINE_MS: "690000"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pr9263-benchmark-local.mjs

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr9263-fresh-benchmark-final
          path: |
            final/result.json
            case-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish benchmark summary to actions repo
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f final/result.json
          mkdir -p results
          cp final/result.json results/pr9263-fresh-benchmark.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/pr9263-fresh-benchmark.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "bench: record PR 9263 fresh benchmark"
          git push origin HEAD:main
