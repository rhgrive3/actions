name: Queue audit pinned source snapshot
on:
  push:
    branches: [audit/queue-source-snapshot-20261022]
    paths: [.github/workflows/queue-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dded21250da1f5dc4a5bfc171b13672fe2279d72
          persist-credentials: false
          lfs: false
      - name: Export immutable tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = dded21250da1f5dc4a5bfc171b13672fe2279d72
          mkdir -p /tmp/inkwave-queue-source
          git archive --format=tar HEAD | gzip -1 > /tmp/inkwave-queue-source/source.tar.gz
          git ls-tree -rz --full-tree HEAD > /tmp/inkwave-queue-source/git-tree.z
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/inkwave-queue-source/COMMIT
          sha256sum /tmp/inkwave-queue-source/source.tar.gz > /tmp/inkwave-queue-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: queue-source-dded2125
          path: /tmp/inkwave-queue-source/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
