name: INKWAVE Upstream Import

on:
  push:
    branches:
      - update/inkwave-upstream-20260928

permissions:
  contents: write

jobs:
  import:
    if: contains(github.event.head_commit.message, 'trigger INKWAVE upstream import')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import attached/upstream INKWAVE runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/inkwave-upstream
          git clone --depth 1 https://github.com/jaydendavisnc/inkwave.git /tmp/inkwave-upstream
          cd /tmp/inkwave-upstream
          python3 tools/build-dist.py

          cd "$GITHUB_WORKSPACE"
          rsync -a /tmp/inkwave-upstream/dist/ inkwave-public/

          # This workflow is only a transport helper; don't keep it in the resulting tree.
          rm -f .github/workflows/inkwave-upstream-merge.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inkwave-public .github/workflows/inkwave-upstream-merge.yml
          git diff --cached --check
          git commit -m "Update INKWAVE to attached upstream snapshot"
          git push origin HEAD:update/inkwave-upstream-20260928
