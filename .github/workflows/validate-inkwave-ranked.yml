name: Validate INKWAVE ranked modes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-inkwave.mjs'
      - 'scripts/inkwave-source-composition.mjs'
      - 'patches/splatoon3/runtime/ranked/**'
      - 'patches/splatoon3/ranked*.mjs'
      - 'patches/splatoon3/tests/ranked*.mjs'
      - 'scripts/check-inkwave-ranked-browser.mjs'
      - 'scripts/ci/package-inkwave-success-evidence.mjs'
      - 'scripts/tests/inkwave-success-evidence.test.mjs'
      - 'scripts/lib/ranked-boot-diagnostics.mjs'
      - 'scripts/lib/ranked-live-audio.mjs'
      - 'scripts/lib/inkwave-local-relay-fixture.mjs'
      - 'server/src/**'
      - 'scripts/lib/ranked-rainmaker-charge.mjs'
      - 'scripts/lib/ranked-roller-audio.mjs'
      - 'scripts/tests/ranked-boot-diagnostics.test.mjs'
      - 'scripts/tests/ranked-roller-audio.test.mjs'
      - '.github/workflows/validate-inkwave-ranked.yml'
      - '.github/workflows/pages-inkwave.yml'
      - 'scripts/tests/inkwave-ranked-pages-sequencing.test.mjs'
  pull_request:
    paths:
      - 'scripts/build-inkwave.mjs'
      - 'patches/splatoon3/runtime/ranked/**'
      - 'patches/splatoon3/ranked*.mjs'
      - 'patches/splatoon3/tests/ranked*.mjs'
      - 'scripts/check-inkwave-ranked-browser.mjs'
      - 'scripts/ci/package-inkwave-success-evidence.mjs'
      - 'scripts/tests/inkwave-success-evidence.test.mjs'
      - 'scripts/lib/ranked-boot-diagnostics.mjs'
      - 'scripts/lib/ranked-live-audio.mjs'
      - 'scripts/lib/inkwave-local-relay-fixture.mjs'
      - 'server/src/**'
      - 'scripts/lib/ranked-rainmaker-charge.mjs'
      - 'scripts/lib/ranked-roller-audio.mjs'
      - 'scripts/tests/ranked-boot-diagnostics.test.mjs'
      - 'scripts/tests/ranked-roller-audio.test.mjs'
      - 'scripts/inkwave-source-composition.mjs'
      - '.github/workflows/validate-inkwave-ranked.yml'
      - '.github/workflows/pages-inkwave.yml'
      - 'scripts/tests/inkwave-ranked-pages-sequencing.test.mjs'
  workflow_dispatch:
    inputs:
      full_success_evidence:
        description: Retain full traces after a successful diagnostic run
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  ranked:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            /*
            !/tools/inkwave-modeler/
            !/reports/*
            /reports/ink-volume/
            !/reports/ink-volume/*
            /reports/ink-volume/source/
            *.js
            *.mjs
            *.cjs
          sparse-checkout-cone-mode: false
      - name: Verify immutable checkout identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_source_sha="$(git rev-parse HEAD)"
          printf 'Expected source: %s\nActual checkout: %s\n' "$EXPECTED_SOURCE_SHA" "$actual_source_sha"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA"
          printf 'Source tree: %s\n' "$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1 ws@8
      - run: npx playwright install --with-deps --no-shell chromium
      - name: Pages sequencing regression
        run: node --test scripts/tests/inkwave-ranked-pages-sequencing.test.mjs
      - name: Ranked boot failure diagnostics regression
        run: node --test scripts/tests/ranked-boot-diagnostics.test.mjs scripts/tests/ranked-roller-audio.test.mjs
      - name: Ranked rule and native integration regressions
        env:
          INKWAVE_RANKED_REFERENCE: ${{ github.workspace }}/patches/splatoon3/runtime/ranked
        run: node --experimental-vm-modules --test patches/splatoon3/tests/ranked-*.test.mjs
      - name: Build production composition
        run: node scripts/build-inkwave.mjs inkwave-public _site-ranked
      - name: Verify emitted Clam death and void boundaries
        env:
          INKWAVE_BUILT_SITE: _site-ranked
        run: node --experimental-vm-modules --test patches/splatoon3/tests/ranked-clam-void-drop.test.mjs patches/splatoon3/tests/ranked-authoritative-position.test.mjs patches/splatoon3/tests/ranked-input-epoch.test.mjs
      - name: Four offline modes and two-browser online rooms
        id: ranked_browser
        env:
          RANKED_RELAY_DELAY_MS: 200
        run: node scripts/check-inkwave-ranked-browser.mjs _site-ranked reports/ranked-browser
      - name: Package verified ranked success evidence
        if: success()
        id: ranked_success_evidence
        env:
          INKWAVE_BROWSER_STEP_OUTCOME: ${{ steps.ranked_browser.outcome }}
          INKWAVE_FULL_SUCCESS_EVIDENCE: ${{ inputs.full_success_evidence == true && '1' || '0' }}
        run: node scripts/ci/package-inkwave-success-evidence.mjs ranked reports/ranked-browser reports/ranked-success-evidence _site-ranked/inkwave-build.json "$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: ${{ steps.ranked_success_evidence.outcome == 'success' && inputs.full_success_evidence != true && 14 || (github.event_name == 'pull_request' && 14 || 90) }}
          name: inkwave-ranked-browser
          if-no-files-found: error
          path: ${{ steps.ranked_success_evidence.outputs.path || 'reports/ranked-browser' }}
