name: PR9271 focused
on:
  pull_request:
    paths:
      - '.github/pr9271-focused-trigger'
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: 7d5805e5fda1034013ff7e76eb422ace3d19c15b
          path: hex-ida
      - name: Structured control projection focused test
        shell: bash
        run: |
          set -o pipefail
          cd hex-ida
          timeout 120s node --test tests/phase8/structuring/structured-control-projection.test.mjs > ../focused.txt 2>&1 || {
            code=$?
            tail -120 ../focused.txt > ../failure.txt
            cat ../failure.txt >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          }
      - name: Upload focused failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr9271-focused-failure
          path: failure.txt
