name: INKWAVE bounded landscape menu acceptance
on:
  pull_request:
    paths:
      - 'patches/local-quality/landscape-*-adapter.mjs'
      - 'patches/local-quality/tests/landscape-*.test.mjs'
      - 'scripts/inkwave-source-composition.mjs'
      - 'scripts/check-inkwave-landscape-fixes.mjs'
      - 'scripts/lib/assert-landscape-weapon-header.mjs'
      - 'scripts/tests/inkwave-landscape-fixes-fixture.test.mjs'
      - 'scripts/tests/landscape-*.test.mjs'
      - 'tests/landscape-online.test.mjs'
      - '.github/workflows/inkwave-landscape-fixes-browser.yml'
permissions:
  contents: read
concurrency:
  group: landscape-fixes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bounded-landscape:
    # Historical baseline defects are specific to this one targeted fix PR.
    if: github.head_ref == 'fix/landscape-ui-targeted-20261030'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tools/inkwave-modeler/blender/
            !/tools/inkwave-modeler/docs/
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tools/inkwave-modeler/blender/
            !/tools/inkwave-modeler/docs/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the existing pinned browser/build toolchain
        working-directory: candidate
        run: npm install --no-save --no-package-lock --silent esbuild@0.28.2 playwright@1.62.1
      - name: Prepare the existing supported Chromium runtime and production CJK local faces
        working-directory: candidate
        run: |
          sudo python3 scripts/prepare-inkwave-ci-apt.py
          npx playwright install --with-deps --only-shell chromium
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -f
      - name: Unit-check the fixture and build both exact production outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate/.ci-scratch/landscape-fixes
          test "$(git -C baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          ln -s "$GITHUB_WORKSPACE/candidate/node_modules" baseline/node_modules
          (cd candidate && node --test \
            patches/local-quality/tests/landscape-settings.test.mjs \
            patches/local-quality/tests/landscape-weapons.test.mjs \
            patches/local-quality/tests/landscape-weapon-header.test.mjs \
            patches/local-quality/tests/landscape-weapon-drawer.test.mjs \
            scripts/tests/landscape-home-adapter.test.mjs \
            tests/landscape-online.test.mjs \
            scripts/tests/landscape-composition.test.mjs \
            scripts/tests/inkwave-landscape-fixes-fixture.test.mjs)
          (cd baseline && node scripts/build-inkwave.mjs inkwave-public .ci-landscape-site) > candidate/.ci-scratch/landscape-fixes/baseline-build.log 2>&1
          (cd candidate && node scripts/build-inkwave.mjs inkwave-public .ci-landscape-site) > candidate/.ci-scratch/landscape-fixes/candidate-build.log 2>&1
      - name: Verify bounded baseline defects and candidate layout/interactions, without images
        shell: bash
        run: |
          set -euo pipefail
          BASE_REV=$(node -p "JSON.parse(require('fs').readFileSync('baseline/.ci-landscape-site/inkwave-build.json')).build.revision")
          HEAD_REV=$(node -p "JSON.parse(require('fs').readFileSync('candidate/.ci-landscape-site/inkwave-build.json')).build.revision")
          node candidate/scripts/check-inkwave-landscape-fixes.mjs \
            --baseline "baseline/.ci-landscape-site/_versions/$BASE_REV" \
            --candidate "candidate/.ci-landscape-site/_versions/$HEAD_REV" \
            --baseline-sha "$BASELINE_SHA" --candidate-sha "$CANDIDATE_SHA" \
            --out candidate/.ci-scratch/landscape-fixes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscape-fixes-metrics-${{ github.event.pull_request.head.sha }}
          path: candidate/.ci-scratch/landscape-fixes/
          if-no-files-found: error
          retention-days: 14
