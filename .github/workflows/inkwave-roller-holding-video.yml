name: INKWAVE Roller holding comparison video
on:
  push:
    branches: ['qa/roller-holding-video-20261021']
    paths:
      - '.github/workflows/inkwave-roller-holding-video.yml'
      - 'scripts/check-inkwave-roller-holding-video.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roller-holding-video-${{ github.ref }}
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BEFORE_SHA: 225f1d3042f2bdf9e8cec7e634afa4b8efa4a800
      AFTER_SHA: 8bebf5cf288149d8ff9a16fa181a89ddf063b8a4
      QA_SHA: ${{ github.sha }}
      GRIP_SEED: '1715'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: 225f1d3042f2bdf9e8cec7e634afa4b8efa4a800
          path: work/before-source
      - uses: actions/checkout@v4
        with:
          ref: 8bebf5cf288149d8ff9a16fa181a89ddf063b8a4
          path: work/after-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify literal sources and install existing official tools
        run: |
          test "$(git rev-parse HEAD)" = "$QA_SHA"
          test "$(git -C work/before-source rev-parse HEAD)" = "$BEFORE_SHA"
          test "$(git -C work/after-source rev-parse HEAD)" = "$AFTER_SHA"
          npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          command -v ffmpeg
          command -v ffprobe
          echo "CHROMIUM_PATH=$(node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_ENV"
          echo "ESBUILD_MODULE=$GITHUB_WORKSPACE/node_modules/esbuild/lib/main.js" >> "$GITHUB_ENV"
          mkdir -p work/roller-video
          node --check scripts/check-inkwave-roller-holding-video.mjs
      - name: Build the two unmodified historical sources
        shell: bash
        run: |
          set -o pipefail
          (cd work/before-source && node scripts/build-inkwave.mjs inkwave-public ../before-site) 2>&1 | tee work/roller-video/before-build.log
          (cd work/after-source && node scripts/build-inkwave.mjs inkwave-public ../after-site) 2>&1 | tee work/roller-video/after-build.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {verifyRuntimeBuild} from './scripts/lib/inkwave-runtime-evidence.mjs';
          const hash=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const identities={schema:1,qa:process.env.QA_SHA,createdAt:new Date().toISOString(),
            script:hash('scripts/check-inkwave-roller-holding-video.mjs'),
            entryHelper:hash('scripts/lib/inkwave-range-menu-entry.mjs'),
            workflow:hash('.github/workflows/inkwave-roller-holding-video.yml'),builds:{}};
          for(const side of ['before','after']){
            const sourceSha=process.env[side.toUpperCase()+'_SHA'];
            const manifest=verifyRuntimeBuild(path.resolve('work/'+side+'-site'),path.resolve('work/'+side+'-source'),sourceSha);
            identities.builds[side]={sourceSha,inputHash:manifest.inputHash,contentHash:manifest.contentHash,
              manifestSha256:hash('work/'+side+'-site/inkwave-build.json')};
            fs.copyFileSync('work/'+side+'-site/inkwave-build.json','work/roller-video/'+side+'-build.json');
          }
          fs.writeFileSync('work/roller-video/identities.json',JSON.stringify(identities,null,2)+'\n');
          NODE
      - name: Capture actual before frames after the preserved 180-tick acceptance
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-inkwave-roller-holding-video.mjs work/before-site work/roller-video/before --grip-seed "$GRIP_SEED" 2>&1 | tee work/roller-video/before.log
      - name: Capture actual after frames using the exact before camera plan
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-inkwave-roller-holding-video.mjs work/after-site work/roller-video/after --grip-seed "$GRIP_SEED" --grip-camera-reference work/roller-video/before/grip-cameras.json 2>&1 | tee work/roller-video/after.log
      - name: Verify frame timing, shared inputs, cameras, source and served bytes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import crypto from 'node:crypto';
          const root='work/roller-video',hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const read=p=>JSON.parse(fs.readFileSync(path.join(root,p),'utf8'));
          const identities=read('identities.json');
          assert.equal(identities.qa,process.env.QA_SHA);
          const oldWorkflow=fs.readFileSync('.github/workflows/inkwave-roller-holding-video.yml');
          assert.equal(identities.workflow,hash(oldWorkflow));
          assert.equal(identities.script,hash(fs.readFileSync('scripts/check-inkwave-roller-holding-video.mjs')));
          assert.equal(identities.entryHelper,hash(fs.readFileSync('scripts/lib/inkwave-range-menu-entry.mjs')));
          const receipts=[];
          const reports=['before','after'].map(side=>{
            const r=read(side+'/result.json'),manifest=read(side+'-build.json'),v=r.video;
            assert.equal(identities.builds[side].sourceSha,process.env[side.toUpperCase()+'_SHA']);
            assert.equal(identities.builds[side].manifestSha256,hash(fs.readFileSync(path.join(root,side+'-build.json'))));
            assert.equal(manifest.inputHash,hash(JSON.stringify(manifest.files)));
            assert.equal(identities.builds[side].inputHash,manifest.inputHash);
            assert.equal(identities.builds[side].contentHash,manifest.contentHash);
            receipts.push({side,resultSha256:hash(fs.readFileSync(path.join(root,side,'result.json'))),
              manifestSha256:identities.builds[side].manifestSha256});
            console.log(JSON.stringify({side,renderSize:r.measurement.renderSize,firstImage:v.frames[0]?.images[0]?.path}));
            assert.equal(r.passed,true);assert.equal(r.diagnosticOnly,false);assert.equal(r.errors.length,0);
            assert.equal(r.build,manifest.contentHash);assert.equal(r.measurement.debugFixedTicks,180);
            assert.equal(v.frameCount,90);assert.equal(v.frames.length,90);assert.equal(v.framesPerSecond,30);
            assert.equal(v.nativeTicksPerSecond,60);assert.equal(v.interpolation,false);
            assert.deepEqual(v.views,['right-rear','side']);assert.equal(v.initial.seed,1715);
            assert.equal(r.measurement.initialState.boundary.boot.boundary,'first-native-game-publication');
            assert.deepEqual(r.measurement.initialState.boundary.boot.clocks,r.measurement.initialState.boundary.entryClocks);
            assert.equal(r.measurement.initialState.gameTime,r.measurement.initialState.boundary.boot.clocks.game);
            assert.equal(r.measurement.renderSize.width,960);assert.equal(r.measurement.renderSize.height,630);
            const modules=Object.entries(r.servedModules);
            assert(modules.length>100,'real native module graph must be served');
            for(const [rel,actual]of modules){
              const matches=Object.keys(manifest.artifacts).filter(k=>rel===k||rel.endsWith('/'+k)).sort((a,b)=>b.length-a.length);
              assert(matches.length>0,'unbound served module '+rel);
              assert.equal(actual.sha256,manifest.artifacts[matches[0]],'served module '+rel);
            }
            for(let i=0;i<90;i++){
              const f=v.frames[i];assert.equal(f.index,i);assert.equal(f.tick,2*(i+1));assert.equal(f.fire,i<60);
              assert(f.rngRestored);assert(Math.abs(f.state.time-v.initial.state.time-f.tick/60)<1e-8);
              assert.deepEqual(f.renderSize,r.measurement.renderSize);assert.equal(f.images.length,2);
              assert(f.lighting.lights.length>0);
              if(i<60)assert.equal(f.state.rolling,true);
              for(const img of f.images){
                assert(v.views.includes(img.name));assert.equal(img.path,'video/'+img.name+'/frame-'+String(i).padStart(3,'0')+'.png');
                const bytes=fs.readFileSync(path.join(root,side,img.path));
                assert.equal(bytes.subarray(0,8).toString('hex'),'89504e470d0a1a0a');
                assert.equal(hash(bytes),img.sha256);
                assert.equal(bytes.readUInt32BE(16),f.renderSize.width);assert.equal(bytes.readUInt32BE(20),f.renderSize.height);
              }
            }
            assert.equal(v.frames[89].state.rolling,false,'native release must occur');
            for(const view of v.views)assert.deepEqual(fs.readdirSync(path.join(root,side,'video',view)).sort(),
              Array.from({length:90},(_,i)=>'frame-'+String(i).padStart(3,'0')+'.png'));
            for(const view of v.views)assert(new Set(v.frames.map(f=>f.images.find(x=>x.name===view).sha256)).size>1,'no repeated still movie');
            return r;
          });
          assert.deepEqual(reports[0].measurement.renderSize,reports[1].measurement.renderSize);
          assert.deepEqual(reports[0].measurement.cameraPlan,reports[1].measurement.cameraPlan);
          assert.deepEqual(reports[0].measurement.initialState.boundary.boot.clocks,reports[1].measurement.initialState.boundary.boot.clocks,'publication clocks');
          assert.deepEqual(reports[0].measurement.initialState.sceneClocks,reports[1].measurement.initialState.sceneClocks,'post-warmup scene clocks');
          for(const key of ['name','seed','time','phase','breathPhase','breathNumber','breathAmplitude','breathRate'])
            assert.deepEqual(reports[0].measurement.initialState.character[key],reports[1].measurement.initialState.character[key],'initial Character '+key);
          for(const key of ['time','phase','characterTime','breathPhase','sceneClocks','pos','yaw','rolling'])
            assert.deepEqual(reports[0].video.initial.state[key],reports[1].video.initial.state[key],'initial movie '+key);
          for(let i=0;i<90;i++){
            const a=reports[0].video.frames[i],b=reports[1].video.frames[i];
            assert.equal(a.fire,b.fire);assert.equal(a.tick,b.tick);assert.equal(a.rngDraws,b.rngDraws);
            assert.deepEqual(a.state.pos,b.state.pos);assert.equal(a.state.yaw,b.state.yaw);
            assert.equal(a.state.rolling,b.state.rolling);assert.equal(a.state.time,b.state.time);assert.equal(a.state.phase,b.state.phase);
            assert.equal(a.state.characterTime,b.state.characterTime);assert.equal(a.state.breathPhase,b.state.breathPhase);assert.deepEqual(a.state.sceneClocks,b.state.sceneClocks,'per-frame scene clocks');
            assert.deepEqual(a.lighting,b.lighting);
            for(const name of ['right-rear','side']){
              const x=a.images.find(v=>v.name===name),y=b.images.find(v=>v.name===name);
              for(const key of ['position','quaternion','projection'])assert.deepEqual(x[key],y[key]);
            }
          }
          fs.writeFileSync(path.join(root,'frame-acceptance.json'),JSON.stringify({passed:true,before:process.env.BEFORE_SHA,after:process.env.AFTER_SHA,
            frameCount:90,fps:30,nativeHz:60,ticks:[2,180],heldTicks:120,releaseTicks:60,interpolation:false,
            camera:'shared fixed offset following native actor root',servedHashesVerified:true,receipts,
            qa:process.env.QA_SHA,clockBoundary:'first-native-game-publication; no clock reset',
            cssViewport:{width:1280,height:840},nativePng:{width:960,height:630},resize:false},null,2)+'\n');
          NODE
      - name: Encode two labeled side-by-side movies without frame interpolation
        shell: bash
        run: |
          set -euo pipefail
          for view in right-rear side; do
            ffmpeg -hide_banner -loglevel warning -y -framerate 30 -start_number 0 -i "work/roller-video/before/video/$view/frame-%03d.png" -framerate 30 -start_number 0 -i "work/roller-video/after/video/$view/frame-%03d.png" -filter_complex "[0:v]pad=960:690:0:60:black,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='BEFORE 225f1d3  |  2026-10-21 | native 960x630':x=20:y=15:fontsize=22:fontcolor=white[b];[1:v]pad=960:690:0:60:black,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='AFTER 8bebf5c  |  2026-10-21 | native 960x630':x=20:y=15:fontsize=22:fontcolor=white[a];[b][a]hstack=inputs=2[v]" -map '[v]' -frames:v 90 -fps_mode passthrough -an -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart "work/roller-video/roller-holding-$view.mp4"
            ffprobe -v error -count_frames -show_entries stream=codec_name,width,height,r_frame_rate,avg_frame_rate,nb_read_frames:format=duration,size -of json "work/roller-video/roller-holding-$view.mp4" > "work/roller-video/ffprobe-$view.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import crypto from 'node:crypto';
          const root='work/roller-video',movies=[];
          for(const view of ['right-rear','side']){
            const p=JSON.parse(fs.readFileSync(root+'/ffprobe-'+view+'.json')),s=p.streams[0];
            assert.equal(p.streams.length,1);assert.equal(s.codec_name,'h264');assert.equal(s.width,1920);assert.equal(s.height,690);
            assert.equal(s.nb_read_frames,'90');assert.equal(s.r_frame_rate,'30/1');assert.equal(s.avg_frame_rate,'30/1');
            assert(Math.abs(Number(p.format.duration)-3)<.001);
            const name='roller-holding-'+view+'.mp4',bytes=fs.readFileSync(root+'/'+name);
            movies.push({view,name,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),probe:p});
          }
          fs.writeFileSync(root+'/video-result.json',JSON.stringify({passed:true,before:process.env.BEFORE_SHA,after:process.env.AFTER_SHA,
            qa:process.env.QA_SHA,encodedAt:new Date().toISOString(),captureDate:'2026-10-21',nativeFrames:true,interpolation:false,resize:false,
            cssViewport:{width:1280,height:840},nativePng:{width:960,height:630},clockBoundary:'first-native-game-publication; no clock reset',movies},null,2)+'\n');
          console.log(JSON.stringify({passed:true,movies}));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roller-holding-video-${{ github.sha }}
          path: work/roller-video/
          if-no-files-found: error
          retention-days: 14
