name: Export hex-ida fix source

on:
  push:
    paths:
      - ".github/workflows/export-hex-ida-main-source.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact hex-ida main
        uses: actions/checkout@v4
        with:
          repository: rhgrive3/hex-ida
          ref: ec02ff8f640e71e38d82a9295bfd197c4744313c
          path: hex-ida
          fetch-depth: 1
      - name: Verify HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C hex-ida rev-parse HEAD)" = "ec02ff8f640e71e38d82a9295bfd197c4744313c"
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: hex-ida-main-ec02ff8f
          path: hex-ida
          include-hidden-files: true
          retention-days: 1
