# INKWAVE: independent, full-fidelity patch regression executor.
# This supplements existing GitHub Actions; it does not waive any required checks.
version: 2.1

jobs:
  patch-regressions:
    docker:
      - image: cimg/node:22.23.3
    resource_class: large
    working_directory: ~/project
    parallelism: 8
    environment:
      INKWAVE_TEST_SHARD_COUNT: "8"
      INKWAVE_TEST_CONCURRENCY: "2"
    steps:
      - checkout
      - run:
          name: Verify checkout identity
          command: |
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            node --version
      - run:
          name: Install pinned test dependencies
          command: |
            set -euo pipefail
            npm install --no-save --no-package-lock --silent esbuild@0.28.2
      - run:
          name: Execute complete patch regression shard
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            export SOURCE_SHA="$CIRCLE_SHA1"
            export INKWAVE_TEST_SHARD_INDEX="$CIRCLE_NODE_INDEX"
            export INKWAVE_TEST_LOG_DIR="$PWD/.ci-scratch/inkwave-patches"
            export INKWAVE_TEST_SCRATCH="$PWD/.ci-scratch/inkwave-worker"
            mkdir -p "$INKWAVE_TEST_LOG_DIR" "$INKWAVE_TEST_SCRATCH"
            node --experimental-vm-modules scripts/check-inkwave-patches.mjs
      - run:
          name: Compress regression evidence
          when: always
          command: |
            mkdir -p .ci-artifacts
            if [ -d .ci-scratch/inkwave-patches ]; then
              tar -czf ".ci-artifacts/patch-shard-${CIRCLE_NODE_INDEX}.tar.gz" -C .ci-scratch inkwave-patches
            fi
      - store_artifacts:
          path: .ci-artifacts
          destination: patch-regressions

workflows:
  ink-wave-patch-regression:
    jobs:
      - patch-regressions
