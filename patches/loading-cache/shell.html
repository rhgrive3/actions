<style>
/* Static boot shell: same markup classes as the native loading screen (patches/local-quality/loading-screen-adapter.mjs, styles/ui.css). */
#inkwave-startup-shell{--u:min(1vw,1.7778vh);--k:#15121c;--a:#ff8a14;--a-rgb:255,138,20;--b:#2f5bff;--b-rgb:47,91,255;--fs-xs:max(11px,calc(var(--u)*.8));--fs-s:max(12px,calc(var(--u)*.95));position:fixed;inset:0;z-index:51;overflow:hidden;margin:0;color:#fff;font:500 16px/1.5 Rubik,system-ui,-apple-system,sans-serif;background:#05050b}
@media (pointer:coarse){#inkwave-startup-shell{--u:clamp(6px,1.5vmin,12px)}}
#inkwave-startup-shell[hidden],#inkwave-startup-retry[hidden],#inkwave-cache-status[hidden]{display:none}
.iw-load-shell *{box-sizing:border-box}
/* Layout also holds when styles/ui.css itself is unavailable (offline startup failure). */
.iw-load-shell .iw-zl__center{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:max(260px,calc(var(--u)*46));max-width:calc(100vw - 48px)}
.iw-load-shell .iw-zl__mark{margin:0;line-height:0}
.iw-load-shell svg{display:block;width:100%;height:auto;overflow:visible}
.iw-load-shell .iw-zl__label{white-space:normal;letter-spacing:.12em;color:rgba(255,255,255,.72)}
.iw-load-shell .iw-zl__fill{right:62%;animation:iw-zl-scan 1.5s cubic-bezier(.6,0,.4,1) infinite}
@keyframes iw-zl-scan{from{transform:translateX(-100%)}to{transform:translateX(265%)}}
#inkwave-startup-retry{display:inline-grid;place-items:center;min-height:44px;margin-top:calc(var(--u)*2.4);padding:0 1.6em;border:1.5px solid var(--a);color:#fff;font:700 var(--fs-s)/1 Rubik,system-ui,sans-serif;letter-spacing:.2em;text-decoration:none;background:rgba(var(--a-rgb),.14)}
#inkwave-cache-status{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:45;max-width:90vw;box-sizing:border-box;padding:6px 12px;border-radius:8px;background:#101018ed;color:#fff;font:14px/1.5 system-ui;pointer-events:none}
@media (prefers-reduced-motion:reduce){.iw-load-shell .iw-zl__fill{animation:none;transform:translateX(80%)}}
</style>
<link rel="preload" href="patches/local-quality/assets/loading/arena.webp" as="image" type="image/webp" fetchpriority="high">

<script>
try { performance.mark('inkwave:shell-script'); } catch {}
if (navigator.onLine === false) document.getElementById('inkwave-startup-status').textContent = 'オフラインです。保存済みデータを確認しています。';
// An empty href resolves against the revision base; use the actual document URL for explicit manual retry.
document.getElementById('inkwave-startup-retry').href = location.href;
</script>
