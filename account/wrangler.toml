# ZEVANT web: the game (static assets built into ../dist by `npm run build:prod`) + the account API (/api/*).
# Setup and deploy steps: account/README.md
name = "zevant-web"
main = "worker/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "../dist"
binding = "ASSETS"
# Optional bot gate must intercept all static game files, not only index.html.
# When BOT_GATE_ENABLED=false the Worker simply passes assets through.
run_worker_first = true
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "zevant-accounts"
# Replace with the id printed by `npx wrangler d1 create zevant-accounts`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# "false" stops new sign-ups (existing players can still sign in).
REGISTRATION_OPEN = "true"
# Enable only after configuring the Turnstile site/secret and BOT_GATE_HMAC_KEY.
BOT_GATE_ENABLED = "false"
# Restrict game assets to Safari, Chrome and compatible installed WebApps.
# This is an easily spoofed browser-family filter, not strong authentication.
BROWSER_ALLOWLIST_ENABLED = "true"
# Extra page origins allowed to call the API with cookies (comma separated). Same-origin needs nothing.
ALLOWED_ORIGINS = ""
# Lax for same-origin hosting. Use "None" only when the game is served from another site (needs HTTPS).
COOKIE_SAMESITE = "Lax"
# Optional Cloudflare Turnstile on sign-up: set the public key here and the secret with
#   npx wrangler secret put TURNSTILE_SECRET_KEY
TURNSTILE_SITE_KEY = ""

[triggers]
# Daily cleanup of expired sessions and idle sign-in throttles.
crons = ["17 3 * * *"]

[observability]
enabled = true
